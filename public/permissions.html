<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestura Permissions</title>
    <link rel="stylesheet" href="icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: #1D1D1F;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #8E8E93;
            font-size: 1.1rem;
        }

        .permission-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem;
            margin-bottom: 1rem;
            background: #F2F2F7;
            border-radius: 12px;
            border-left: 4px solid #E5E5EA;
            transition: all 0.3s ease;
        }

        .permission-item.granted {
            border-left-color: #34C759;
            background: #F0FDF4;
        }

        .permission-item.denied {
            border-left-color: #FF3B30;
            background: #FEF2F2;
        }

        .permission-item.pending {
            border-left-color: #FF9500;
            background: #FFFBEB;
        }

        .permission-info {
            flex: 1;
        }

        .permission-title {
            font-weight: 600;
            color: #1D1D1F;
            margin-bottom: 0.25rem;
        }

        .permission-description {
            color: #8E8E93;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .permission-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .status-icon.granted {
            background: #34C759;
            color: white;
        }

        .status-icon.denied {
            background: #FF3B30;
            color: white;
        }

        .status-icon.pending {
            background: #FF9500;
            color: white;
        }

        .request-button {
            padding: 0.5rem 1rem;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }

        .request-button:hover {
            background: #0056CC;
        }

        .request-button:disabled {
            background: #C7C7CC;
            cursor: not-allowed;
        }

        .actions {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .action-button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .primary {
            background: #007AFF;
            color: white;
        }

        .primary:hover {
            background: #0056CC;
        }

        .secondary {
            background: #F2F2F7;
            color: #1D1D1F;
        }

        .secondary:hover {
            background: #E5E5EA;
        }

        .warning {
            background: #FEF2F2;
            border: 1px solid #FECACA;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 2rem;
        }

        .warning-title {
            color: #DC2626;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .warning-text {
            color: #7F1D1D;
            font-size: 0.9rem;
            line-height: 1.4;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1><span class="icon-lock-open"></span> System Permissions</h1>
            <p>Gestura needs these permissions to function properly</p>
        </div>

        <div class="warning" id="warningBanner" style="display: none;">
            <div class="warning-title"><span class="icon-warning"></span> Missing Required Permissions</div>
            <div class="warning-text">
                Some features may not work correctly until all required permissions are granted.
            </div>
        </div>

        <div id="permissionsList">
            <!-- Permissions will be populated by JavaScript -->
        </div>

        <div class="actions">
            <button class="action-button secondary" onclick="window.close()">Close</button>
            <button class="action-button primary" id="refreshButton">Refresh Status</button>
        </div>
    </div>

    <script type="module">
        console.log('🔍 Permissions.html script starting...');

        try {
            console.log('📦 Importing Tauri API...');
            const { invoke } = await import('@tauri-apps/api/core');
            console.log('✅ Tauri API imported successfully');
        } catch (error) {
            console.error('❌ Failed to import Tauri API:', error);
        }

        const permissionsList = document.getElementById('permissionsList');
        const warningBanner = document.getElementById('warningBanner');
        const refreshButton = document.getElementById('refreshButton');

        const permissions = [
            {
                id: 'microphone',
                title: 'Microphone Access',
                description: 'Required for voice commands and speech recognition',
                required: true
            },
            {
                id: 'accessibility',
                title: 'Accessibility Permissions',
                description: 'Needed for global hotkeys and system automation',
                required: true
            },
            {
                id: 'bluetooth',
                title: 'Bluetooth Access',
                description: 'Required to connect to Haptic Harmony Ring devices',
                required: true
            },
            {
                id: 'notifications',
                title: 'Notifications',
                description: 'For system alerts and status updates',
                required: false
            },
            {
                id: 'network',
                title: 'Network Access',
                description: 'For cloud AI services and remote integrations',
                required: false
            }
        ];

        function createPermissionItem(permission, status) {
            const item = document.createElement('div');
            item.className = `permission-item ${status}`;

            const statusIcon = status === 'granted' ? '<span class="icon-check"></span>' :
                status === 'denied' ? '<span class="icon-x"></span>' : '?';

            const statusText = status === 'granted' ? 'Granted' :
                status === 'denied' ? 'Denied' : 'Pending';

            item.innerHTML = `
                <div class="permission-info">
                    <div class="permission-title">${permission.title}</div>
                    <div class="permission-description">${permission.description}</div>
                </div>
                <div class="permission-status">
                    <div class="status-icon ${status}">${statusIcon}</div>
                    <span>${statusText}</span>
                    ${status !== 'granted' ? `<button class="request-button" onclick="requestPermission('${permission.id}')">Request</button>` : ''}
                </div>
            `;

            return item;
        }

        async function loadPermissions() {
            console.log('🔄 Loading permissions...');
            permissionsList.innerHTML = '';
            let hasWarnings = false;

            for (const permission of permissions) {
                try {
                    const status = await invoke('check_permission', { permission: permission.id });
                    const item = createPermissionItem(permission, status);
                    permissionsList.appendChild(item);

                    if (permission.required && status !== 'granted') {
                        hasWarnings = true;
                    }
                } catch (error) {
                    console.error(`Failed to check permission ${permission.id}:`, error);
                    const item = createPermissionItem(permission, 'pending');
                    permissionsList.appendChild(item);

                    if (permission.required) {
                        hasWarnings = true;
                    }
                }
            }

            warningBanner.style.display = hasWarnings ? 'block' : 'none';
        }

        window.requestPermission = async function (permissionId) {
            try {
                await invoke('request_permission', { permission: permissionId });
                // Refresh the status after requesting
                setTimeout(loadPermissions, 1000);
            } catch (error) {
                console.error(`Failed to request permission ${permissionId}:`, error);
                alert(`Failed to request permission: ${error}`);
            }
        };

        refreshButton.addEventListener('click', loadPermissions);

        // Load permissions on page load
        console.log('🚀 Initializing permissions page...');
        document.addEventListener('DOMContentLoaded', () => {
            console.log('📄 DOM loaded, starting permission load...');
            loadPermissions();
        });

        // Also try immediate load in case DOM is already ready
        if (document.readyState === 'loading') {
            console.log('⏳ DOM still loading, waiting...');
        } else {
            console.log('✅ DOM ready, loading permissions immediately...');
            loadPermissions();
        }
    </script>
</body>

</html>
