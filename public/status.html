<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestura System Status</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: #1D1D1F;
            margin-bottom: 0.5rem;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .status-card {
            background: #F2F2F7;
            border-radius: 12px;
            padding: 1.5rem;
            border-left: 4px solid #E5E5EA;
        }

        .status-card.healthy {
            border-left-color: #34C759;
        }

        .status-card.warning {
            border-left-color: #FF9500;
        }

        .status-card.error {
            border-left-color: #FF3B30;
        }

        .status-title {
            font-weight: 600;
            color: #1D1D1F;
            margin-bottom: 0.5rem;
        }

        .status-value {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 0.25rem;
        }

        .status-value.healthy {
            color: #34C759;
        }

        .status-value.warning {
            color: #FF9500;
        }

        .status-value.error {
            color: #FF3B30;
        }

        .status-description {
            color: #8E8E93;
            font-size: 0.9rem;
        }

        .refresh-button {
            display: block;
            margin: 0 auto;
            padding: 0.75rem 1.5rem;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .refresh-button:hover {
            background: #0056CC;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 System Status</h1>
            <p>Real-time monitoring of Gestura components</p>
        </div>

        <div class="status-grid" id="statusGrid">
            <!-- Status cards will be populated by JavaScript -->
        </div>

        <button class="refresh-button" onclick="loadStatus()">Refresh Status</button>
    </div>

    <script type="module">
        import { invoke } from '@tauri-apps/api/core';

        const statusGrid = document.getElementById('statusGrid');

        const statusItems = [
            { id: 'voice', title: 'Voice Engine', description: 'Speech recognition status' },
            { id: 'nats', title: 'NATS Connection', description: 'Message bus connectivity' },
            { id: 'agents', title: 'Active Agents', description: 'Running agent instances' },
            { id: 'bluetooth', title: 'Bluetooth', description: 'Device connectivity' },
            { id: 'permissions', title: 'Permissions', description: 'System access status' },
            { id: 'memory', title: 'Memory Usage', description: 'Application memory consumption' }
        ];

        function createStatusCard(item, status) {
            const card = document.createElement('div');
            card.className = `status-card ${status.level}`;
            
            card.innerHTML = `
                <div class="status-title">${item.title}</div>
                <div class="status-value ${status.level}">${status.value}</div>
                <div class="status-description">${status.description || item.description}</div>
            `;
            
            return card;
        }

        async function loadStatus() {
            statusGrid.innerHTML = '';

            for (const item of statusItems) {
                try {
                    // Mock status for now - replace with actual system checks
                    const status = {
                        value: item.id === 'agents' ? '1 Active' : 
                               item.id === 'memory' ? '45 MB' :
                               item.id === 'nats' ? 'Disconnected' : 'Healthy',
                        level: item.id === 'nats' ? 'warning' : 'healthy',
                        description: item.id === 'nats' ? 'Using memory bus fallback' : item.description
                    };

                    const card = createStatusCard(item, status);
                    statusGrid.appendChild(card);
                } catch (error) {
                    console.error(`Failed to get status for ${item.id}:`, error);
                    const card = createStatusCard(item, {
                        value: 'Error',
                        level: 'error',
                        description: 'Failed to retrieve status'
                    });
                    statusGrid.appendChild(card);
                }
            }
        }

        // Load status on page load
        loadStatus();

        // Auto-refresh every 30 seconds
        setInterval(loadStatus, 30000);
    </script>
</body>
</html>
