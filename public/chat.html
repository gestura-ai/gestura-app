<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestura Chat</title>
    <link rel="stylesheet" href="icons.css">
    <style>
        :root {
            /* Light mode colors - macOS inspired */
            --bg-primary: #f5f5f7;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e8e8ed;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --border-color: #d2d2d7;
            --accent-color: #0071e3;
            --accent-hover: #0077ed;
            --user-bubble: #0071e3;
            --agent-bubble: #e8e8ed;
            --system-bubble: #f5a623;
            --shadow: rgba(0, 0, 0, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #1d1d1f;
                --bg-secondary: #2c2c2e;
                --bg-tertiary: #3a3a3c;
                --text-primary: #f5f5f7;
                --text-secondary: #98989d;
                --border-color: #48484a;
                --accent-color: #0a84ff;
                --accent-hover: #409cff;
                --user-bubble: #0a84ff;
                --agent-bubble: #3a3a3c;
                --system-bubble: #ff9f0a;
                --shadow: rgba(0, 0, 0, 0.3);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: var(--bg-secondary);
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1rem;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            background: var(--bg-secondary);
            border-radius: 12px;
            margin-bottom: 1rem;
            border: 1px solid var(--border-color);
        }

        .message {
            margin-bottom: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 18px;
            max-width: 80%;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .message.user {
            background: var(--user-bubble);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .message.agent {
            background: var(--agent-bubble);
            color: var(--text-primary);
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }

        .message.system {
            background: var(--system-bubble);
            color: white;
            margin: 0 auto;
            text-align: center;
            font-size: 0.9em;
            border-radius: 8px;
        }

        .input-container {
            display: flex;
            gap: 0.75rem;
            background: var(--bg-secondary);
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            align-items: center;
        }

        .message-input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .message-input:focus {
            border-color: var(--accent-color);
        }

        .message-input::placeholder {
            color: var(--text-secondary);
        }

        .send-button {
            padding: 0.75rem 1.25rem;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .send-button:hover {
            background: var(--accent-hover);
        }

        .send-button:disabled {
            background: var(--text-secondary);
            cursor: not-allowed;
        }

        .voice-btn {
            padding: 0.75rem;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            width: 44px;
            height: 44px;
        }

        .voice-btn.inactive {
            background: #34c759;
            color: white;
        }

        .voice-btn.active {
            background: #ff3b30;
            color: white;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .typing-indicator {
            display: none;
            padding: 0.5rem 1rem;
            color: var(--text-secondary);
            font-style: italic;
            font-size: 0.9rem;
        }

        .typing-indicator.show {
            display: block;
        }

        .voice-status {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: center;
            padding-top: 0.5rem;
        }
    </style>
</head>

<body>
    <div class="chat-header">
        <h2><span class="icon-message"></span> Gestura Chat</h2>
        <div class="status" id="status">Ready</div>
    </div>

    <div class="chat-container">
        <div class="messages" id="messages">
            <div class="message system">
                Welcome to Gestura! How can I help you today?
            </div>
        </div>

        <div class="typing-indicator" id="typing">
            Agent is typing...
        </div>

        <div class="input-container">
            <button class="voice-btn inactive" id="voiceBtn" title="Voice input">
                <span id="voiceIcon" class="icon-microphone"></span>
            </button>
            <input type="text" class="message-input" id="messageInput" placeholder="Type your message..."
                maxlength="1000">
            <button class="send-button" id="sendButton">Send</button>
        </div>
        <div class="voice-status" id="voiceStatus"></div>
    </div>

    <script>
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const typingIndicator = document.getElementById('typing');
        const statusElement = document.getElementById('status');

        // Check if Tauri API is available
        function isTauriAvailable() {
            return typeof window.__TAURI__ !== 'undefined' && window.__TAURI__.core;
        }

        // Wait for Tauri API to be ready
        async function waitForTauri(maxWait = 5000) {
            const startTime = Date.now();
            while (!isTauriAvailable() && (Date.now() - startTime) < maxWait) {
                await new Promise(resolve => setTimeout(resolve, 100));
            }
            return isTauriAvailable();
        }

        // Safe invoke wrapper that checks Tauri availability
        async function invoke(command, args = {}) {
            if (!isTauriAvailable()) {
                throw new Error('Tauri API not available. Please run in the desktop app.');
            }
            return window.__TAURI__.core.invoke(command, args);
        }

        let isProcessing = false;

        function addMessage(content, type = 'user') {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = content;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showTyping() {
            typingIndicator.classList.add('show');
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function hideTyping() {
            typingIndicator.classList.remove('show');
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || isProcessing) return;

            isProcessing = true;
            sendButton.disabled = true;
            messageInput.disabled = true;

            // Add user message
            addMessage(message, 'user');
            messageInput.value = '';

            // Show typing indicator
            showTyping();

            try {
                // Process message through the configured LLM provider
                const response = await invoke('process_chat_message', { message: message });

                hideTyping();
                addMessage(response, 'agent');
            } catch (error) {
                hideTyping();
                addMessage(`Error: ${error}`, 'system');
                console.error('Failed to send message:', error);
            } finally {
                isProcessing = false;
                sendButton.disabled = false;
                messageInput.disabled = false;
                messageInput.focus();
            }
        }

        // Event listeners
        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Focus input on load
        messageInput.focus();

        // Listen for speech-to-text messages from the backend
        async function setupEventListeners() {
            if (!isTauriAvailable()) {
                console.warn('Tauri API not available - event listeners not set up');
                return;
            }

            try {
                // Listen for voice session start events
                await window.__TAURI__.event.listen('voice-session-started', (event) => {
                    const data = event.payload;
                    console.log('Voice session started:', data);
                    statusElement.innerHTML = '<span class="icon-microphone"></span> Processing voice input...';
                    showTyping();
                });

                // Listen for chat messages from speech processing via global Tauri
                await window.__TAURI__.event.listen('chat-message', (event) => {
                    const data = event.payload;
                    console.log('Received chat message:', data);

                    if (data.type === 'user') {
                        // Voice input received - hide typing indicator
                        hideTyping();
                        addMessage(data.message, 'user');
                        // Show typing indicator for AI response
                        showTyping();
                        statusElement.textContent = 'Agent is thinking...';
                    } else if (data.type === 'assistant') {
                        hideTyping();
                        addMessage(data.message, 'agent');
                        statusElement.textContent = 'Voice command completed';
                        // Reset status after a moment
                        setTimeout(() => checkAgentStatus(), 3000);
                    }
                });

                // Listen for listening state changes from tray/backend
                await window.__TAURI__.event.listen('listening-state-changed', (event) => {
                    const data = event.payload;
                    console.log('Listening state changed:', data);

                    if (data.is_listening) {
                        setVoiceActive();
                    } else {
                        setVoiceInactive();
                    }
                });

                console.log('Event listeners set up successfully');
            } catch (error) {
                console.error('Failed to set up event listeners:', error);
            }
        }

        // Check agent status and LLM configuration
        async function checkAgentStatus() {
            try {
                const config = await invoke('get_config');
                const llmProvider = config.llm?.primary || 'echo';
                statusElement.textContent = `Connected via ${llmProvider.toUpperCase()} - Ready for input`;
            } catch (error) {
                statusElement.textContent = 'Ready for voice and text input';
                console.error('Failed to get config:', error);
            }
        }

        // Voice control elements
        const voiceBtn = document.getElementById('voiceBtn');
        const voiceIcon = document.getElementById('voiceIcon');
        const voiceStatus = document.getElementById('voiceStatus');

        let isListening = false;
        let voiceStatusInterval = null;

        // Voice control functions
        // NOTE: State is ONLY changed via 'listening-state-changed' events from the backend
        // This ensures tray menu and chat button are always in sync
        async function toggleVoiceListening() {
            // Prevent double-clicks while processing
            if (voiceBtn.disabled) return;
            voiceBtn.disabled = true;

            try {
                if (isListening) {
                    console.log('Stopping voice listening...');
                    await invoke('stop_voice_listening');
                    // Don't call setVoiceInactive() here - wait for backend event
                } else {
                    console.log('Starting voice listening...');
                    await invoke('start_voice_listening');
                    // Don't call setVoiceActive() here - wait for backend event
                }
            } catch (error) {
                console.error('Failed to toggle voice listening:', error);
                const message = typeof error === 'string' ? error : String(error);
                voiceStatus.textContent = `Error: ${message}`;
                addMessage(`Voice error: ${message}`, 'system');
                // On error, sync state from backend
                await checkInitialVoiceState();
            } finally {
                // Re-enable button after a short delay to prevent rapid clicks
                setTimeout(() => { voiceBtn.disabled = false; }, 300);
            }
        }

        function setVoiceActive() {
            console.log('setVoiceActive() called');
            isListening = true;
            voiceBtn.className = 'voice-btn active';
            voiceIcon.className = 'icon-recording';
            voiceStatus.textContent = 'Listening...';
            voiceBtn.title = 'Stop listening';
        }

        function setVoiceInactive() {
            console.log('setVoiceInactive() called');
            isListening = false;
            voiceBtn.className = 'voice-btn inactive';
            voiceIcon.className = 'icon-microphone';
            voiceStatus.textContent = '';
            voiceBtn.title = 'Voice input';
        }

        voiceBtn.addEventListener('click', toggleVoiceListening);

        // Check and sync voice state with backend
        async function checkInitialVoiceState() {
            try {
                const [listening, _] = await invoke('get_listening_state');
                console.log('Initial voice state from backend:', listening);
                if (listening) {
                    setVoiceActive();
                } else {
                    setVoiceInactive();
                }
            } catch (error) {
                console.error('Failed to check initial voice state:', error);
            }
        }

        // Initialize the app with Tauri readiness check
        async function initializeApp() {
            const tauriReady = await waitForTauri();
            if (!tauriReady) {
                console.warn('Tauri API not available - running in standalone browser mode');
                statusElement.textContent = 'Desktop app not connected';
                addMessage('Chat requires the Gestura desktop app to function. Please launch the app.', 'system');
                return;
            }

            setupEventListeners();
            checkAgentStatus();
            checkInitialVoiceState();
        }

        // Start initialization
        initializeApp();
    </script>
</body>

</html>
