<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gestura Ring — VR Hand Example</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; font-family: system-ui, sans-serif; background: #0b0d12; color: #e8ecf1; overflow: hidden; }
      #hud {
        position: fixed; top: 12px; left: 12px; padding: 12px 16px;
        background: rgba(20, 24, 33, 0.8); border: 1px solid #2a3140; border-radius: 10px;
        max-width: 320px; line-height: 1.5; font-size: 13px; backdrop-filter: blur(6px);
      }
      #hud h1 { margin: 0 0 6px; font-size: 15px; }
      #gesture { color: #7cd; font-weight: 600; min-height: 1.2em; }
      #source { color: #9aa4b2; font-size: 12px; }
      kbd { background: #222a38; border: 1px solid #3a4456; border-radius: 4px; padding: 0 5px; font-size: 11px; }
    </style>
  </head>
  <body>
    <div id="hud">
      <h1>🖐 Gestura Ring — VR Hand</h1>
      <div id="source">Connecting…</div>
      <div>Last gesture: <span id="gesture">—</span></div>
      <p style="margin:8px 0 0;color:#9aa4b2">
        Tilt/rotate the ring to move the hand (C3 IMU). <br />
        <kbd>tap</kbd> pulse · <kbd>double-tap</kbd> spin · <kbd>swipe</kbd> next object.
        <br /><span style="color:#5f6b7c">Offline demo: keys <kbd>T</kbd> <kbd>D</kbd> <kbd>←</kbd> <kbd>→</kbd> simulate.</span>
      </p>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
