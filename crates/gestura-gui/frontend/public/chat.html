<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Avoid stale assets in Tauri/WebView during rapid iteration -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Gestura Chat</title>
    <link rel="stylesheet" href="icons.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

        :root {
            /* Premium Light Palette */
            --bg-base: #fbfbfd;
            --bg-glass: rgba(255, 255, 255, 0.7);
            --bg-glass-strong: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(0, 0, 0, 0.05);
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent-primary: #0071e3;
            --accent-glow: rgba(0, 113, 227, 0.3);
            --user-bubble: #0071e3;
            --user-text: #ffffff;
            --agent-bubble: rgba(0, 0, 0, 0.04);
            --agent-text: #1d1d1f;
            --success: #34c759;
            --error: #ff3b30;
            --tool-bg: rgba(52, 199, 89, 0.1);
            --tool-border: rgba(52, 199, 89, 0.3);
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.08);
            --blur: blur(20px);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                /* Premium Dark Palette */
                --bg-base: #000000;
                --bg-glass: rgba(28, 28, 30, 0.6);
                --bg-glass-strong: rgba(44, 44, 46, 0.8);
                --glass-border: rgba(255, 255, 255, 0.1);
                --text-primary: #f5f5f7;
                --text-secondary: #86868b;
                --accent-primary: #2997ff;
                --accent-glow: rgba(41, 151, 255, 0.3);
                --user-bubble: #2997ff;
                --user-text: #ffffff;
                --agent-bubble: rgba(255, 255, 255, 0.08);
                --agent-text: #f5f5f7;
                --success: #30d158;
                --error: #ff453a;
                --tool-bg: rgba(48, 209, 88, 0.15);
                --tool-border: rgba(48, 209, 88, 0.3);
                --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.3);
                --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.5);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            height: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            /* Prefer dynamic viewport units inside WebViews (prevents overlap on resize) */
            min-height: 100vh;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            letter-spacing: -0.01em;
        }

        /* Glassmorphism Header */
        .header {
            min-height: 60px;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            /* macOS WebView safe-area/titlebar inset friendly */
            padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px 16px;
            flex-wrap: wrap;
            gap: 10px;
            background: var(--bg-glass);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-bottom: 1px solid var(--glass-border);
            /* Keep header in normal flow so it never overlaps content */
            z-index: 10;
            position: relative;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 15px;
            opacity: 0.9;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
            justify-content: flex-end;
        }

        /* Provider selector with icon */
        .provider-selector-wrapper {
            display: flex;
            align-items: center;
            gap: 0;
            background: var(--bg-glass-strong);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            overflow: hidden;
        }

        .provider-icon {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            background: var(--bg-glass);
            border-right: 1px solid var(--glass-border);
            flex-shrink: 0;
        }

        .provider-icon svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            opacity: 0.9;
        }

        .model-selector {
            appearance: none;
            -webkit-appearance: none;
            background: transparent;
            border: none;
            color: var(--text-primary);
            padding: 6px 8px;
            font-size: 12px;
            font-weight: 500;
            outline: none;
            cursor: pointer;
            min-width: 90px;
            max-width: 140px;
        }

        .model-selector-standalone {
            appearance: none;
            -webkit-appearance: none;
            background: var(--bg-glass-strong);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            border-radius: 12px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 500;
            outline: none;
            cursor: pointer;
            min-width: 100px;
            max-width: 160px;
        }

        .model-selector-standalone:focus {
            border-color: var(--accent-glow);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        @media (max-width: 480px) {
            .header {
                padding: 10px 12px;
            }

            .header-title {
                font-size: 13px;
            }

            .model-selector {
                min-width: 70px;
                max-width: 100px;
                font-size: 11px;
            }

            .model-selector-standalone {
                min-width: 80px;
                max-width: 120px;
                font-size: 11px;
            }

            .provider-icon {
                width: 24px;
                height: 24px;
            }

            .provider-icon svg {
                width: 14px;
                height: 14px;
            }
        }

        .provider-selector-wrapper:focus-within {
            border-color: var(--accent-glow);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .status-badge {
            font-size: 11px;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 20px;
            background: var(--bg-glass-strong);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .status-badge.active {
            color: var(--success);
            border-color: rgba(52, 199, 89, 0.3);
            box-shadow: 0 0 10px rgba(52, 199, 89, 0.2);
        }

        .status-badge.busy {
            color: var(--accent-primary);
            border-color: rgba(10, 132, 255, 0.35);
            box-shadow: 0 0 10px rgba(10, 132, 255, 0.18);
        }

        .status-badge.error {
            color: var(--error);
            border-color: rgba(255, 69, 58, 0.35);
            box-shadow: 0 0 10px rgba(255, 69, 58, 0.18);
        }

        /* Session Settings Button */
        .btn-settings {
            background: var(--bg-glass-strong);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 6px 8px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
        }

        .btn-settings:hover {
            background: var(--bg-glass);
            color: var(--text-primary);
            border-color: var(--accent-primary);
        }

        .btn-settings.active {
            color: var(--accent-primary);
            border-color: var(--accent-primary);
        }

        /* Session Settings Panel */
        .session-panel {
            position: fixed;
            top: 0;
            right: -320px;
            width: 320px;
            height: 100%;
            background: var(--bg-glass-strong);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-left: 1px solid var(--glass-border);
            z-index: 100;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-md);
        }

        .session-panel.open {
            right: 0;
        }

        .session-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            border-bottom: 1px solid var(--glass-border);
        }

        .session-panel-header h3 {
            font-size: 14px;
            font-weight: 600;
            margin: 0;
        }

        .session-panel-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
        }

        .session-panel-close:hover {
            background: var(--bg-glass);
            color: var(--text-primary);
        }

        .session-panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .session-field {
            margin-bottom: 16px;
        }

        .session-field label {
            display: block;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .session-field input[type="text"],
        .session-field select {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg-glass);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
        }

        .session-field input[type="text"]:focus,
        .session-field select:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        .session-field-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .session-field-row input {
            flex: 1;
        }

        .session-field-row button {
            padding: 8px 12px;
            background: var(--bg-glass);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 12px;
        }

        .session-field-row button:hover {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        .session-info {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .session-divider {
            height: 1px;
            background: var(--glass-border);
            margin: 16px 0;
        }

        .session-panel-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 99;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .session-panel-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        .session-tools-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .tool-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-primary);
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 6px;
            transition: background 0.2s ease;
        }

        .tool-checkbox:hover {
            background: var(--bg-glass);
        }

        .tool-checkbox input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent-primary);
        }

        /* Chat Area */
        .chat-container {
            flex: 1;
            /* Critical in flex layouts so header/input never overlap messages */
            min-height: 0;
            /* Header & input are in-flow; normal padding is enough */
            padding: 20px 20px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background-color: var(--text-secondary);
            border-radius: 3px;
            opacity: 0.3;
        }

        /* Message Bubbles */
        .message {
            margin-bottom: 24px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-content {
            padding: 16px 24px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.6;
            position: relative;
            box-shadow: var(--shadow-sm);
        }

        /* User Message */
        .message.user {
            display: flex;
            justify-content: flex-end;
        }

        .message.user .message-content {
            background: var(--user-bubble);
            color: var(--user-text);
            border-bottom-right-radius: 4px;
            background-image: linear-gradient(135deg, var(--user-bubble), var(--accent-primary));
        }

        /* Agent Message */
        .message.agent .message-content {
            background: var(--agent-bubble);
            color: var(--agent-text);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--glass-border);
        }

        /* Tool Call Card */
        .tool-call {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 16px;
            margin: 10px 0;
            background: var(--tool-bg);
            border: 1px solid var(--tool-border);
            border-radius: 12px;
            font-size: 13px;
            color: var(--text-primary);
            max-width: 100%;
            animation: pulse-border 2s infinite;
        }

        .tool-call.done {
            animation: none;
            opacity: 0.9;
        }

        .tool-call.success {
            animation: none;
            border-color: var(--success);
            background: rgba(52, 199, 89, 0.08);
        }

        .tool-call.error {
            animation: none;
            border-color: var(--error);
            background: rgba(255, 59, 48, 0.08);
        }

        .tool-call.error .tool-icon {
            fill: var(--error);
        }

        .tool-call-body {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
            flex: 1;
        }

        .tool-args {
            margin: 0;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.04);
            font-size: 12px;
            line-height: 1.4;
            overflow-x: auto;
            max-width: 100%;
            white-space: pre;
        }

        .tool-result {
            margin-top: 8px;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.4;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .tool-result.success {
            background: rgba(52, 199, 89, 0.1);
            border: 1px solid rgba(52, 199, 89, 0.3);
            color: var(--text-primary);
        }

        .tool-result.error {
            background: rgba(255, 59, 48, 0.1);
            border: 1px solid rgba(255, 59, 48, 0.3);
            color: var(--error);
        }

        .tool-duration {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Retry Tool Button */
        .retry-tool-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            padding: 6px 12px;
            border: 1px solid rgba(255, 159, 10, 0.5);
            background: rgba(255, 159, 10, 0.15);
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            color: #ff9f0a;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .retry-tool-btn:hover {
            background: rgba(255, 159, 10, 0.25);
            border-color: #ff9f0a;
        }

        .retry-tool-btn:focus {
            outline: 2px solid #ff9f0a;
            outline-offset: 2px;
        }

        .retry-tool-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        /* Retry Notice */
        .retry-notice {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            margin: 8px 0;
            border-radius: 8px;
            background: rgba(255, 159, 10, 0.1);
            border: 1px solid rgba(255, 159, 10, 0.3);
            font-size: 12px;
            color: var(--text-primary);
            animation: pulse-retry 1.5s ease-in-out infinite;
        }

        .retry-icon {
            font-size: 14px;
            animation: spin 1s linear infinite;
        }

        .retry-text {
            font-weight: 500;
            color: #ff9f0a;
        }

        .retry-error {
            color: var(--text-secondary);
            font-size: 11px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 200px;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse-retry {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        @keyframes pulse-border {
            0% {
                box-shadow: 0 0 0 0 rgba(52, 199, 89, 0.2);
            }

            70% {
                box-shadow: 0 0 0 6px rgba(52, 199, 89, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(52, 199, 89, 0);
            }
        }

        /* Reconnection Notice Styles */
        .reconnect-notice {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            margin: 8px 0;
            border-radius: 8px;
            background: rgba(10, 132, 255, 0.1);
            border: 1px solid rgba(10, 132, 255, 0.3);
            font-size: 12px;
            color: var(--text-primary);
            animation: pulse-reconnect 1.5s ease-in-out infinite;
        }

        .reconnect-notice.success {
            background: rgba(52, 199, 89, 0.1);
            border-color: rgba(52, 199, 89, 0.3);
            animation: none;
        }

        .reconnect-icon {
            font-size: 14px;
        }

        .reconnect-notice:not(.success) .reconnect-icon {
            animation: spin 1s linear infinite;
        }

        .reconnect-text {
            font-weight: 500;
            color: var(--accent-primary);
        }

        .reconnect-notice.success .reconnect-text {
            color: var(--success);
        }

        @keyframes pulse-reconnect {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        /* Stream Health Indicator */
        .stream-health-indicator {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 500;
        }

        .stream-health-indicator.healthy {
            background: rgba(52, 199, 89, 0.15);
            color: var(--success);
        }

        .stream-health-indicator.stalled {
            background: rgba(255, 159, 10, 0.15);
            color: #ff9f0a;
        }

        .stream-health-indicator.error {
            background: rgba(255, 59, 48, 0.15);
            color: var(--error);
        }

        /* Compaction Notice */
        .compaction-notice {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 8px 12px;
            margin: 8px 0;
            border-radius: 8px;
            background: rgba(10, 132, 255, 0.1);
            border: 1px solid rgba(10, 132, 255, 0.3);
            font-size: 12px;
            color: var(--text-primary);
        }

        .compaction-icon {
            font-size: 14px;
        }

        .compaction-text {
            font-weight: 500;
            color: #0a84ff;
        }

        .compaction-summary {
            color: var(--text-secondary);
            font-size: 11px;
            font-style: italic;
        }

        .tool-icon {
            width: 16px;
            height: 16px;
            fill: var(--success);
        }

        /* Thinking Block */
        .thinking-block {
            margin-bottom: 12px;
            background: var(--bg-glass-strong);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
        }

        .thinking-header {
            padding: 10px 16px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }

        .thinking-header:hover {
            background: rgba(0, 0, 0, 0.03);
        }

        .thinking-header::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-secondary);
            display: inline-block;
        }

        .thinking-header.animating::before {
            animation: pulse-dot 1s infinite alternate;
            background: var(--accent-primary);
        }

        @keyframes pulse-dot {
            from {
                transform: scale(0.8);
                opacity: 0.6;
            }

            to {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .thinking-content {
            padding: 12px 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
            background: rgba(0, 0, 0, 0.02);
            border-top: 1px solid var(--glass-border);
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }

        .thinking-block.collapsed .thinking-content {
            display: none;
        }

        /* Message Queue Indicator */
        .queue-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px 12px;
            font-size: 13px;
            color: var(--accent-primary);
            background: var(--bg-glass);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-radius: 12px;
            margin-bottom: 8px;
            animation: queue-pulse 2s ease-in-out infinite;
            border: 1px solid var(--glass-border);
        }

        @keyframes queue-pulse {

            0%,
            100% {
                opacity: 0.7;
            }

            50% {
                opacity: 1;
            }
        }

        /* Input Area with Glassmorphism */
        .input-area {
            /* Keep input in flow so it can't cover other UI */
            position: relative;
            width: 100%;
            padding: 12px 16px 16px 16px;
            background: var(--bg-glass);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-top: 1px solid var(--glass-border);
            display: flex;
            justify-content: center;
            flex: 0 0 auto;
            z-index: 10;
        }

        .input-container {
            background: var(--bg-glass-strong);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            padding: 10px;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
            max-width: 800px;
        }

        .input-container:focus-within {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
            border-color: var(--accent-glow);
        }

        .message-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 16px;
            font-size: 16px;
            color: var(--text-primary);
            outline: none;
            font-family: inherit;
        }

        .message-input::placeholder {
            color: var(--text-secondary);
            font-weight: 300;
        }

        .btn-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-icon:hover {
            background: rgba(0, 0, 0, 0.05);
            color: var(--text-primary);
            transform: scale(1.05);
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-primary:hover {
            background: var(--accent-primary);
            transform: scale(1.05);
            box-shadow: 0 6px 16px var(--accent-glow);
            color: white;
        }

        .btn-primary:active {
            transform: scale(0.95);
        }

        .btn-cancel {
            background: var(--error);
            color: white;
        }

        .btn-cancel:hover {
            background: var(--error);
            transform: scale(1.05);
            color: white;
        }

        /* Voice Button Pulse */
        .voice-active {
            color: white;
            background: var(--error);
            box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7);
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7);
            }

            70% {
                transform: scale(1);
                box-shadow: 0 0 0 10px rgba(255, 59, 48, 0);
            }

            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(255, 59, 48, 0);
            }
        }

        /* Markdown Styling */
        .markdown-body pre {
            background: rgba(0, 0, 0, 0.03);
            /* Slight contrast */
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
            border: 1px solid var(--glass-border);
            margin: 12px 0;
        }

        .markdown-body code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9em;
            padding: 0.2em 0.4em;
            border-radius: 4px;
            background: rgba(127, 127, 127, 0.1);
        }

        .markdown-body pre code {
            background: none;
            padding: 0;
            color: var(--text-primary);
        }

        .markdown-body p {
            margin-bottom: 1em;
        }

        .markdown-body p:last-child {
            margin-bottom: 0;
        }

        /* Copy Button Styling */
        .message.agent {
            position: relative;
        }

        .message.agent .message-content {
            position: relative;
        }

        .copy-response-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border: none;
            background: var(--bg-glass-strong);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s, background 0.2s, transform 0.1s;
            z-index: 10;
            border: 1px solid var(--glass-border);
        }

        .message.agent:hover .copy-response-btn,
        .message.agent:focus .copy-response-btn,
        .copy-response-btn:focus {
            opacity: 1;
        }

        /* Focus styling for keyboard navigation */
        .message.agent:focus {
            outline: 2px solid var(--accent-primary);
            outline-offset: 2px;
            border-radius: 12px;
        }

        .message.agent:focus .message-content {
            box-shadow: 0 0 0 2px var(--accent-primary);
        }

        .copy-response-btn:hover {
            background: var(--accent-primary);
        }

        .copy-response-btn:active {
            transform: scale(0.95);
        }

        .copy-response-btn svg {
            width: 14px;
            height: 14px;
            fill: var(--text-secondary);
        }

        .copy-response-btn:hover svg {
            fill: white;
        }

        .copy-response-btn.copied {
            background: var(--success);
        }

        .copy-response-btn.copied svg {
            fill: white;
        }

        /* Code Block with Copy Button */
        .code-block-wrapper {
            position: relative;
        }

        .code-block-wrapper pre {
            margin: 0;
        }

        .copy-code-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 24px;
            height: 24px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s, background 0.2s;
        }

        .code-block-wrapper:hover .copy-code-btn {
            opacity: 1;
        }

        .copy-code-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .copy-code-btn svg {
            width: 12px;
            height: 12px;
            fill: var(--text-secondary);
        }

        .copy-code-btn.copied {
            background: var(--success);
        }

        .copy-code-btn.copied svg {
            fill: white;
        }

        /* New Typing Indicator */
        .typing-dots {
            display: none;
            gap: 4px;
            padding: 12px 16px;
            background: var(--bg-glass);
            border-radius: 20px;
            /* Align with agent bubbles */
            align-self: flex-start;
            margin-left: 20px;
            margin-bottom: 16px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .typing-dots.show {
            display: inline-flex;
            opacity: 1;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            opacity: 0.4;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <div class="header">
        <div class="header-title">
            <span class="icon-message"></span>
            Gestura
        </div>
        <div class="header-controls">
            <div class="provider-selector-wrapper">
                <div class="provider-icon" id="providerIcon" title="Provider">
                    <!-- Anthropic icon (default) -->
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M17.304 3.541l-5.296 16.918h3.208l5.296-16.918h-3.208zm-7.4 0l-5.296 16.918h3.208l1.319-4.214h5.632l.855 4.214h3.208l-5.296-16.918h-3.63zm.855 9.918l1.855-5.918 1.855 5.918h-3.71z" />
                    </svg>
                </div>
                <select class="model-selector" id="providerSelect" title="Select provider">
                    <option value="anthropic">Anthropic</option>
                    <option value="openai">OpenAI</option>
                    <option value="grok">Grok</option>
                    <option value="ollama">Ollama</option>
                    <option value="echo">Echo</option>
                </select>
            </div>
            <select class="model-selector-standalone" id="modelSelect" title="Select model" disabled>
                <option value="">Model</option>
            </select>
            <button class="btn-settings" id="sessionSettingsBtn" title="Session Settings">
                <span class="icon-settings"></span>
            </button>
            <div class="status-badge" id="status">Ready</div>
        </div>
    </div>

    <!-- Session Settings Panel Overlay -->
    <div class="session-panel-overlay" id="sessionPanelOverlay"></div>

    <!-- Session Settings Panel -->
    <div class="session-panel" id="sessionPanel">
        <div class="session-panel-header">
            <h3>Session Settings</h3>
            <button class="session-panel-close" id="sessionPanelClose">
                <span class="icon-close"></span>
            </button>
        </div>
        <div class="session-panel-content">
            <div class="session-field">
                <label>Working Directory</label>
                <div class="session-field-row">
                    <input type="text" id="sessionWorkDir" placeholder="Select folder..." readonly>
                    <button id="pickWorkDirBtn" title="Browse">📁</button>
                </div>
                <div class="session-info" id="workDirInfo">Commands will run in this directory</div>
            </div>

            <div class="session-divider"></div>

            <div class="session-field">
                <label>Permission Level</label>
                <select id="sessionPermission">
                    <option value="sandbox">Sandbox (Read-only)</option>
                    <option value="restricted" selected>Restricted (Ask before write)</option>
                    <option value="full">Full Access (Careful!)</option>
                </select>
                <div class="session-info">Controls what actions the agent can perform</div>
            </div>

            <div class="session-divider"></div>

            <div class="session-field">
                <label>Available Tools</label>
                <div class="session-tools-list" id="sessionToolsList">
                    <label class="tool-checkbox">
                        <input type="checkbox" value="file_read" checked> File Read
                    </label>
                    <label class="tool-checkbox">
                        <input type="checkbox" value="file_write" checked> File Write
                    </label>
                    <label class="tool-checkbox">
                        <input type="checkbox" value="shell" checked> Shell Commands
                    </label>
                    <label class="tool-checkbox">
                        <input type="checkbox" value="web_search"> Web Search
                    </label>
                    <label class="tool-checkbox">
                        <input type="checkbox" value="code_analysis" checked> Code Analysis
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- Chat Stream -->
    <div class="chat-container" id="messages">
        <!-- Welcome Message -->
        <div class="message agent">
            <div class="message-content markdown-body">
                Hello! I'm Gestura. How can I assist you naturally today?
            </div>
        </div>
    </div>

    <!-- Typing Indicator -->
    <div class="typing-dots" id="typing">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
        <div class="input-container">
            <button class="btn-icon" id="voiceBtn" title="Voice Input">
                <span class="icon-microphone"></span>
            </button>
            <input type="text" class="message-input" id="messageInput" placeholder="Type a message..."
                autocomplete="off">
            <button class="btn-icon btn-primary" id="sendButton" title="Send message">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path>
                </svg>
            </button>
            <button class="btn-icon btn-cancel" id="cancelButton" title="Cancel" style="display: none;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6L6 18M6 6l12 12"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- Script -->
    <script>
        // Core Elements
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const cancelButton = document.getElementById('cancelButton');
        const voiceBtn = document.getElementById('voiceBtn');
        const typingIndicator = document.getElementById('typing');
        const statusElement = document.getElementById('status');
        const providerSelect = document.getElementById('providerSelect');
        const modelSelect = document.getElementById('modelSelect');

        // Cached config (used for model dropdown)
        let cachedConfig = null;

        // State
        let isProcessing = false;
        let isListening = false;
        let currentRequestNonce = 0;
        let lastStreamEventAt = Date.now();
        let streamWatchdogInterval = null;
        let streamingMessageElement = null;
        let streamingContent = '';
        let currentThinkingDiv = null;
        let currentToolCard = null;
        let currentToolArgsEl = null;
        let messageQueue = []; // Queue for messages sent during processing
        const defaultPlaceholder = 'Type a message...';
        const processingPlaceholder = 'Type to queue another message...';
        const sessionId = new URLSearchParams(window.location.search).get('session_id');

        function setStatus(text, kind = 'ready') {
            if (!statusElement) return;
            statusElement.textContent = text;
            statusElement.classList.remove('active');
            statusElement.classList.remove('busy');
            statusElement.classList.remove('error');
            if (kind === 'listening') statusElement.classList.add('active');
            if (kind === 'busy') statusElement.classList.add('busy');
            if (kind === 'error') statusElement.classList.add('error');
        }

        function finalizeStreamForCurrentRequest(options = {}) {
            const { statusText = null, statusKind = 'ready', allowQueueAdvance = true } = options;
            if (streamWatchdogInterval) {
                clearInterval(streamWatchdogInterval);
                streamWatchdogInterval = null;
            }
            hideTyping();
            isProcessing = false;
            currentRequestNonce = 0;
            if (streamingMessageElement) {
                streamingMessageElement.classList.remove('streaming');
                // Add copy button and enhance code blocks for completed streaming message
                addCopyButtonToMessage(streamingMessageElement);
                const contentDiv = streamingMessageElement.querySelector('.message-content');
                if (contentDiv) enhanceCodeBlocks(contentDiv);
            }
            const thinkingHeaders = document.querySelectorAll('.thinking-header.animating');
            thinkingHeaders.forEach(h => h.classList.remove('animating'));
            if (!isListening) setStatus(statusText || 'Ready', statusKind);

            if (messageQueue.length > 0) {
                // Keep the UI in "processing" mode while we drain the queue.
                setProcessingUI(true);
                if (allowQueueAdvance) setTimeout(() => processNextInQueue(), 100);
            } else {
                setProcessingUI(false);
            }
        }

        function touchStreamActivity() {
            lastStreamEventAt = Date.now();
        }

        function startStreamWatchdog(nonce) {
            if (streamWatchdogInterval) clearInterval(streamWatchdogInterval);
            // Frontend-side safety: if backend never emits any stream events (or invoke never returns),
            // don't leave the UI stuck forever.
            const maxIdleMs = 90_000;
            streamWatchdogInterval = setInterval(() => {
                if (!isProcessing || currentRequestNonce !== nonce) return;
                if (Date.now() - lastStreamEventAt > maxIdleMs) {
                    addMessage(`Error: Timed out waiting for agent response (no events for ${Math.round(maxIdleMs / 1000)}s).`, 'agent');
                    finalizeStreamForCurrentRequest({ statusText: 'Error', statusKind: 'error' });
                }
            }, 1000);
        }

        // --- Markdown Parsing (Simplified for reliability) ---
        function parseMarkdown(text) {
            // Escape HTML
            const escapeHtml = (str) => str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            let html = escapeHtml(text);

            // Code blocks
            html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code class="language-$1">$2</code></pre>');

            // Inline code
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

            // Bold
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

            // Italic
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');

            // Paragraphs (double newline)
            html = html.replace(/\n\n/g, '<p></p>');

            // Line breaks
            html = html.replace(/\n/g, '<br>');

            return html;
        }

        // --- Message Handling ---

        function addMessage(content, type, isHtml = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content markdown-body';

            if (isHtml) {
                contentDiv.innerHTML = content;
            } else {
                contentDiv.textContent = content;
            }

            msgDiv.appendChild(contentDiv);
            messagesContainer.appendChild(msgDiv);

            // Add copy button for agent messages
            if (type === 'agent') {
                addCopyButtonToMessage(msgDiv);
                enhanceCodeBlocks(contentDiv);
            }

            scrollToBottom();
            return msgDiv;
        }

        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showTyping() {
            typingIndicator.classList.add('show');
            scrollToBottom();
        }

        function hideTyping() {
            typingIndicator.classList.remove('show');
        }

        // --- Copy Functionality ---

        // SVG icons for copy buttons
        const copyIcon = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>`;
        const checkIcon = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>`;
        const retryIcon = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>`;

        // Screen reader announcement element (ARIA live region)
        let srAnnouncer = document.getElementById('sr-announcer');
        if (!srAnnouncer) {
            srAnnouncer = document.createElement('div');
            srAnnouncer.id = 'sr-announcer';
            srAnnouncer.setAttribute('role', 'status');
            srAnnouncer.setAttribute('aria-live', 'polite');
            srAnnouncer.setAttribute('aria-atomic', 'true');
            srAnnouncer.style.cssText = 'position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden;';
            document.body.appendChild(srAnnouncer);
        }

        function announceToScreenReader(message) {
            srAnnouncer.textContent = '';
            // Small delay to ensure announcement is triggered
            setTimeout(() => { srAnnouncer.textContent = message; }, 50);
        }

        async function copyToClipboard(text, button) {
            try {
                await navigator.clipboard.writeText(text);
                button.innerHTML = checkIcon;
                button.classList.add('copied');
                announceToScreenReader('Copied to clipboard');
                setTimeout(() => {
                    button.innerHTML = copyIcon;
                    button.classList.remove('copied');
                }, 2000);
            } catch (err) {
                console.error('Failed to copy:', err);
                announceToScreenReader('Failed to copy to clipboard');
            }
        }

        function createCopyButton(className) {
            const btn = document.createElement('button');
            btn.className = className;
            btn.innerHTML = copyIcon;
            btn.title = 'Copy to clipboard';
            btn.setAttribute('aria-label', 'Copy to clipboard');
            return btn;
        }

        function addCopyButtonToMessage(msgDiv) {
            const contentDiv = msgDiv.querySelector('.message-content');
            if (!contentDiv) return;

            // Make message focusable for keyboard navigation
            msgDiv.setAttribute('tabindex', '0');
            msgDiv.setAttribute('role', 'article');
            msgDiv.setAttribute('aria-label', 'Assistant response');

            const copyBtn = createCopyButton('copy-response-btn');
            copyBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                // Get text content excluding copy buttons
                const clone = contentDiv.cloneNode(true);
                clone.querySelectorAll('.copy-response-btn, .copy-code-btn, .retry-tool-btn').forEach(btn => btn.remove());
                copyToClipboard(clone.textContent.trim(), copyBtn);
            });
            contentDiv.appendChild(copyBtn);

            // Add keyboard shortcut for copy (Ctrl/Cmd+C when focused)
            msgDiv.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'c' && !window.getSelection().toString()) {
                    // Only copy if no text is selected (let native selection copy work)
                    e.preventDefault();
                    const clone = contentDiv.cloneNode(true);
                    clone.querySelectorAll('.copy-response-btn, .copy-code-btn, .retry-tool-btn').forEach(btn => btn.remove());
                    copyToClipboard(clone.textContent.trim(), copyBtn);
                }
            });
        }

        function enhanceCodeBlocks(container) {
            const codeBlocks = container.querySelectorAll('pre:not(.code-block-enhanced)');
            codeBlocks.forEach(pre => {
                pre.classList.add('code-block-enhanced');

                // Wrap in a container for positioning
                const wrapper = document.createElement('div');
                wrapper.className = 'code-block-wrapper';
                pre.parentNode.insertBefore(wrapper, pre);
                wrapper.appendChild(pre);

                const copyBtn = createCopyButton('copy-code-btn');
                copyBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const code = pre.querySelector('code');
                    const text = code ? code.textContent : pre.textContent;
                    copyToClipboard(text.trim(), copyBtn);
                });
                wrapper.appendChild(copyBtn);
            });
        }

        // --- Streaming Logic ---

        function ensureStreamingMessage() {
            if (!streamingMessageElement) {
                hideTyping();
                streamingMessageElement = addMessage('', 'agent', true);
                streamingMessageElement.classList.add('streaming');
            }
            return streamingMessageElement;
        }

        // Queue a message for later processing
        function queueMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            messageQueue.push(text);
            addMessage(`⏳ ${text}`, 'user'); // Show queued message with indicator
            messageInput.value = '';
            updateQueueIndicator();
        }

        // Update the queue indicator UI
        function updateQueueIndicator() {
            let indicator = document.getElementById('queueIndicator');
            if (messageQueue.length > 0) {
                if (!indicator) {
                    indicator = document.createElement('div');
                    indicator.id = 'queueIndicator';
                    indicator.className = 'queue-indicator';
                    const inputArea = document.querySelector('.input-area');
                    inputArea.insertBefore(indicator, inputArea.firstChild);
                }
                indicator.innerHTML = `📨 ${messageQueue.length} message${messageQueue.length > 1 ? 's' : ''} queued`;
                indicator.style.display = 'flex';
            } else if (indicator) {
                indicator.style.display = 'none';
            }
        }

        // Process the next message in the queue
        async function processNextInQueue() {
            if (messageQueue.length === 0 || isProcessing) return;

            const nextMessage = messageQueue.shift();
            updateQueueIndicator();

            // Update the queued message to remove ⏳ indicator
            const messages = messagesContainer.querySelectorAll('.message.user .message-content');
            for (const msg of messages) {
                if (msg.textContent === `⏳ ${nextMessage}`) {
                    msg.textContent = nextMessage;
                    break;
                }
            }

            await processMessage(nextMessage);
        }

        // Update UI for processing state
        function setProcessingUI(processing) {
            if (processing) {
                messageInput.placeholder = processingPlaceholder;
                cancelButton.style.display = 'flex';
                sendButton.title = 'Queue message';
            } else {
                messageInput.placeholder = defaultPlaceholder;
                cancelButton.style.display = 'none';
                sendButton.title = 'Send message';
            }
        }

        // Core message processing function
        async function processMessage(text) {
            const nonce = ++currentRequestNonce;
            touchStreamActivity();
            startStreamWatchdog(nonce);
            showTyping();
            isProcessing = true;
            setProcessingUI(true);
            if (!isListening) setStatus('Responding...', 'busy');

            // Reset Stream State
            streamingMessageElement = null;
            streamingContent = '';
            currentThinkingDiv = null;
            currentToolCard = null;
            currentToolArgsEl = null;

            try {
                // Invoke Backend
                const payload = { message: text };
                if (sessionId) payload.session_id = sessionId;
                const p = window.__TAURI__.core.invoke('process_chat_message_streaming', payload);
                // Don't await: streaming completion is signaled via events, and awaiting can deadlock UI state.
                p.catch((err) => {
                    console.error('Send failed:', err);
                    addMessage(`Error: ${err}`, 'agent');
                    if (currentRequestNonce === nonce) {
                        finalizeStreamForCurrentRequest({ statusText: 'Error', statusKind: 'error' });
                    }
                });
            } catch (err) {
                console.error("Send failed:", err);
                addMessage(`Error: ${err}`, 'agent');
                if (currentRequestNonce === nonce) {
                    finalizeStreamForCurrentRequest({ statusText: 'Error', statusKind: 'error' });
                }
            }
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            // If already processing, queue the message instead
            if (isProcessing) {
                queueMessage();
                return;
            }

            // UI Updates
            addMessage(text, 'user');
            messageInput.value = '';

            await processMessage(text);
        }

        // --- Event Listeners (Tauri) ---

        async function setupEvents() {
            if (!window.__TAURI__) return;
            const event = window.__TAURI__.event;

            // 1. Thinking Stream
            await event.listen('chat-stream-thinking', (e) => {
                touchStreamActivity();
                ensureStreamingMessage();
                const contentDiv = streamingMessageElement.querySelector('.message-content');

                // Create Thinking Block if needed
                if (!currentThinkingDiv) {
                    currentThinkingDiv = document.createElement('div');
                    currentThinkingDiv.className = 'thinking-block';
                    currentThinkingDiv.innerHTML = `
                        <div class="thinking-header animating" onclick="this.parentElement.classList.toggle('collapsed')">
                            Thinking Process...
                        </div>
                        <div class="thinking-content"></div>
                    `;
                    // Prepend to content
                    contentDiv.insertAdjacentElement('afterbegin', currentThinkingDiv);
                }

                const textDiv = currentThinkingDiv.querySelector('.thinking-content');
                textDiv.textContent += e.payload;
                textDiv.scrollTop = textDiv.scrollHeight;
            });

            // 2. Text Stream
            await event.listen('chat-stream-chunk', (e) => {
                touchStreamActivity();
                ensureStreamingMessage();

                // Stop thinking animation if it was running
                if (currentThinkingDiv) {
                    const header = currentThinkingDiv.querySelector('.thinking-header');
                    if (header) {
                        header.classList.remove('animating');
                        header.textContent = "Thought Process";
                        // Collapse by default when text starts
                        if (!currentThinkingDiv.classList.contains('collapsed')) {
                            currentThinkingDiv.classList.add('collapsed');
                        }
                    }
                    currentThinkingDiv = null; // Reset ensures we don't keep appending to thought
                }

                streamingContent += e.payload;

                // Update content (preserving thinking block if it exists)
                const contentDiv = streamingMessageElement.querySelector('.message-content');

                // We need to keep the thinking block element, updates only text content AFTER it
                // Simple approach: re-render full markdown. 
                // BUT we must not destroy the thinking block.

                // Let's create a text container if not exists
                let textContainer = contentDiv.querySelector('.text-content');
                if (!textContainer) {
                    textContainer = document.createElement('div');
                    textContainer.className = 'text-content';
                    contentDiv.appendChild(textContainer);
                }

                textContainer.innerHTML = parseMarkdown(streamingContent);
                scrollToBottom();
            });

            // 3. Tool Call Events (aligned with backend)
            await event.listen('chat-stream-tool-start', (e) => {
                touchStreamActivity();
                ensureStreamingMessage();

                // Stop thinking animation
                if (currentThinkingDiv) {
                    const header = currentThinkingDiv.querySelector('.thinking-header');
                    if (header) header.classList.remove('animating');
                }

                const payload = e.payload || {};
                const toolName = (typeof payload === 'string') ? payload : (payload.name || 'tool');
                const contentDiv = streamingMessageElement.querySelector('.message-content');

                currentToolCard = document.createElement('div');
                currentToolCard.className = 'tool-call';
                currentToolCard.innerHTML = `
	                    <svg class="tool-icon" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.7-3.7a1 1 0 0 0 0-1.4 1 1 0 0 0-1.4 0L17 7.3l-1.6-1.6a1 1 0 0 0-1.4 0zM20 21h-4c-1 0-2-1-2-2v-4c0-1 1-2 2-2h4c1 0 2 1 2 2v4c0 1-1 2-2 2zM12 21H8c-1 0-2-1-2-2V9c0-1 1-2 2-2h4c1 0 2 1 2 2v10c0 1-1 2-2 2z"/></svg>
	                    <div class="tool-call-body">
	                        <div>Using tool: <strong></strong></div>
	                        <pre class="tool-args" style="display:none"></pre>
	                    </div>
	                `;
                currentToolCard.querySelector('strong').textContent = toolName;
                currentToolArgsEl = currentToolCard.querySelector('.tool-args');

                contentDiv.appendChild(currentToolCard);
                scrollToBottom();
            });

            await event.listen('chat-stream-tool-args', (e) => {
                touchStreamActivity();
                if (!currentToolArgsEl) return;
                const argsText = (typeof e.payload === 'string') ? e.payload : JSON.stringify(e.payload, null, 2);
                currentToolArgsEl.style.display = 'block';
                currentToolArgsEl.textContent += argsText;
                scrollToBottom();
            });

            await event.listen('chat-stream-tool-end', () => {
                touchStreamActivity();
                // Don't clear currentToolCard yet - wait for tool-result to update it
                // Just mark it as "executing" state
                if (currentToolCard) {
                    currentToolCard.classList.add('executing');
                }
            });

            // 3b. Tool Result Event - shows success/error status and output
            await event.listen('chat-stream-tool-result', (e) => {
                touchStreamActivity();
                const payload = e?.payload || {};
                const { name, success, output, duration_ms } = payload;

                // Find the tool card to update (currentToolCard or last one in the message)
                let targetCard = currentToolCard;
                if (!targetCard && streamingMessageElement) {
                    const cards = streamingMessageElement.querySelectorAll('.tool-call');
                    if (cards.length > 0) {
                        targetCard = cards[cards.length - 1];
                    }
                }

                if (targetCard) {
                    // Remove executing state and add success/error
                    targetCard.classList.remove('executing', 'done');
                    targetCard.classList.add(success ? 'success' : 'error');

                    // Add result display
                    const body = targetCard.querySelector('.tool-call-body');
                    if (body) {
                        // Remove any existing result
                        const existingResult = body.querySelector('.tool-result');
                        if (existingResult) existingResult.remove();

                        // Add result section
                        const resultDiv = document.createElement('div');
                        resultDiv.className = `tool-result ${success ? 'success' : 'error'}`;

                        // Truncate long output for display
                        const maxLen = 500;
                        let displayOutput = output || (success ? '(completed)' : '(no details)');
                        if (displayOutput.length > maxLen) {
                            displayOutput = displayOutput.substring(0, maxLen) + '... (truncated)';
                        }
                        resultDiv.textContent = displayOutput;
                        body.appendChild(resultDiv);

                        // Add duration
                        if (duration_ms !== undefined) {
                            const durationDiv = document.createElement('div');
                            durationDiv.className = 'tool-duration';
                            durationDiv.textContent = `Completed in ${duration_ms}ms`;
                            body.appendChild(durationDiv);
                        }

                        // Add retry button for failed tool operations
                        if (!success && name) {
                            const retryBtn = document.createElement('button');
                            retryBtn.className = 'retry-tool-btn';
                            retryBtn.innerHTML = retryIcon + ' Retry';
                            retryBtn.title = 'Retry this tool operation';
                            retryBtn.setAttribute('aria-label', `Retry ${name} tool operation`);
                            retryBtn.addEventListener('click', async (e) => {
                                e.stopPropagation();
                                // Get the tool args from the card
                                const argsEl = targetCard.querySelector('.tool-args');
                                const argsText = argsEl ? argsEl.textContent : '';
                                // Send a retry message to the chat
                                const retryMessage = `Please retry the ${name} tool operation${argsText ? ' with the same arguments' : ''}`;
                                messageInput.value = retryMessage;
                                sendMessage();
                                announceToScreenReader(`Retrying ${name} tool operation`);
                            });
                            body.appendChild(retryBtn);
                        }
                    }
                }

                // Clear the current tool card reference
                currentToolCard = null;
                currentToolArgsEl = null;
                scrollToBottom();
            });

            // 3c. Retry Attempt Event - shows retry notification
            await event.listen('chat-stream-retry', (e) => {
                touchStreamActivity();
                const payload = e?.payload || {};
                const { attempt, max_attempts, delay_ms, error_message } = payload;

                // Create a retry notification element
                const retryNotice = document.createElement('div');
                retryNotice.className = 'retry-notice';
                retryNotice.innerHTML = `
                    <span class="retry-icon">⟳</span>
                    <span class="retry-text">Retry ${attempt}/${max_attempts} in ${delay_ms}ms</span>
                    <span class="retry-error">${error_message || 'Connection issue'}</span>
                `;

                // Add to current streaming message or create new one
                if (currentStreamingEl) {
                    currentStreamingEl.appendChild(retryNotice);
                } else {
                    addMessage(`⟳ Retry ${attempt}/${max_attempts}: ${error_message}`, 'agent');
                }

                setStatus(`Retrying (${attempt}/${max_attempts})...`, 'processing');
                scrollToBottom();
            });

            // 3d. Context Compaction Event - shows compaction notification
            await event.listen('chat-context-compacted', (e) => {
                touchStreamActivity();
                const payload = e?.payload || {};
                const { messages_before, messages_after, tokens_saved, summary } = payload;

                // Create a compaction notification element
                const compactNotice = document.createElement('div');
                compactNotice.className = 'compaction-notice';
                compactNotice.innerHTML = `
                    <span class="compaction-icon">📦</span>
                    <span class="compaction-text">Context compacted: ${messages_before} → ${messages_after} messages (${tokens_saved} tokens saved)</span>
                    ${summary ? `<span class="compaction-summary">${summary}</span>` : ''}
                `;

                // Add to current streaming message or create new one
                if (currentStreamingEl) {
                    currentStreamingEl.appendChild(compactNotice);
                } else {
                    addMessage(`📦 Context compacted: ${messages_before} → ${messages_after} messages`, 'agent');
                }

                setStatus('Context compacted', 'processing');
                scrollToBottom();
            });

            // 4. Stream Done
            await event.listen('chat-stream-done', () => {
                touchStreamActivity();
                finalizeStreamForCurrentRequest({ statusText: 'Ready', statusKind: 'ready' });
            });

            // 4b. Stream Cancelled / Error
            await event.listen('chat-stream-cancelled', () => {
                touchStreamActivity();
                addMessage('Cancelled.', 'agent');
                finalizeStreamForCurrentRequest({ statusText: 'Cancelled', statusKind: 'ready' });
            });

            await event.listen('chat-stream-error', (e) => {
                touchStreamActivity();
                const payload = e?.payload;
                const errText = (typeof payload === 'string')
                    ? payload
                    : (payload?.message || JSON.stringify(payload));
                addMessage(`Error: ${errText}`, 'agent');
                finalizeStreamForCurrentRequest({ statusText: 'Error', statusKind: 'error' });
            });

            // 4c. Stream Health Events
            await event.listen('stream-health-status', (e) => {
                touchStreamActivity();
                const payload = e?.payload || {};
                const { status, message } = payload;

                // Update status indicator based on health
                switch (status) {
                    case 'Stalled':
                        setStatus('Stream stalled...', 'busy');
                        break;
                    case 'TimedOut':
                        setStatus('Stream timed out', 'error');
                        break;
                    case 'Recovered':
                        setStatus('Stream recovered', 'busy');
                        break;
                    case 'Failed':
                        setStatus('Stream failed', 'error');
                        break;
                }
            });

            await event.listen('stream-health-warning', (e) => {
                touchStreamActivity();
                const payload = e?.payload || {};
                const { idle_seconds, threshold_seconds } = payload;

                // Show warning in status
                setStatus(`Slow response (${idle_seconds}s)...`, 'busy');
            });

            // 4d. Stream Reconnection Events
            await event.listen('stream-reconnect-attempt', (e) => {
                touchStreamActivity();
                const payload = e?.payload || {};
                const { attempt, max_attempts, delay_ms } = payload;

                setStatus(`Reconnecting (${attempt}/${max_attempts})...`, 'busy');

                // Add reconnection notice to current message
                if (streamingMessageElement) {
                    const contentDiv = streamingMessageElement.querySelector('.message-content');
                    if (contentDiv) {
                        const notice = document.createElement('div');
                        notice.className = 'reconnect-notice';
                        notice.innerHTML = `
                            <span class="reconnect-icon">🔄</span>
                            <span class="reconnect-text">Reconnecting (${attempt}/${max_attempts})...</span>
                        `;
                        contentDiv.appendChild(notice);
                        scrollToBottom();
                    }
                }
            });

            await event.listen('stream-reconnect-success', (e) => {
                touchStreamActivity();
                setStatus('Reconnected', 'busy');

                // Update reconnection notice to show success
                if (streamingMessageElement) {
                    const notices = streamingMessageElement.querySelectorAll('.reconnect-notice');
                    if (notices.length > 0) {
                        const lastNotice = notices[notices.length - 1];
                        lastNotice.classList.add('success');
                        lastNotice.innerHTML = `
                            <span class="reconnect-icon">✓</span>
                            <span class="reconnect-text">Reconnected successfully</span>
                        `;
                    }
                }
            });

            await event.listen('stream-reconnect-failed', (e) => {
                touchStreamActivity();
                const payload = e?.payload || {};
                const { error } = payload;

                setStatus('Reconnection failed', 'error');
                addMessage(`Connection lost: ${error || 'Unable to reconnect'}`, 'agent');
                finalizeStreamForCurrentRequest({ statusText: 'Connection lost', statusKind: 'error' });
            });

            // 5. Voice Events
            await event.listen('listening-state-changed', (e) => {
                const listening = !!(e && e.payload && e.payload.is_listening);
                if (listening) {
                    isListening = true;
                    voiceBtn.classList.add('voice-active');
                    setStatus('Listening...', 'listening');
                } else {
                    isListening = false;
                    voiceBtn.classList.remove('voice-active');
                    if (!isProcessing) setStatus('Ready', 'ready');
                }
            });
        }

        async function refreshConfig() {
            if (!window.__TAURI__) return null;
            try {
                cachedConfig = await window.__TAURI__.core.invoke('get_config');
                return cachedConfig;
            } catch (e) {
                console.error('Failed to load config', e);
                return null;
            }
        }

        function setModelSelectOptions(names, selectedName) {
            modelSelect.innerHTML = '';
            for (const name of names) {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                modelSelect.appendChild(opt);
            }
            if (selectedName && names.includes(selectedName)) {
                modelSelect.value = selectedName;
            } else if (names.length > 0) {
                modelSelect.value = names[0];
            }
        }

        async function populateModelSelectForProvider(provider) {
            if (!modelSelect) return;

            const cfg = cachedConfig;
            const providerCfg = cfg?.llm?.[provider];
            const currentModel = providerCfg?.model;

            // Show loading state
            modelSelect.disabled = true;
            modelSelect.title = `Loading ${provider} models...`;
            modelSelect.innerHTML = '<option value="">Loading models…</option>';

            try {
                let models = [];

                if (provider === 'ollama') {
                    // Ollama: fetch from local endpoint
                    const endpoint =
                        providerCfg?.base_url ||
                        providerCfg?.endpoint ||
                        'http://localhost:11434';
                    const result = await window.__TAURI__.core.invoke('list_ollama_models', { endpoint });
                    models = Array.isArray(result)
                        ? result.map((m) => m?.name).filter((n) => typeof n === 'string' && n.length > 0)
                        : [];
                } else if (provider === 'openai') {
                    // OpenAI: fetch from API
                    const apiKey = providerCfg?.api_key || '';
                    if (apiKey) {
                        const result = await window.__TAURI__.core.invoke('list_openai_models', { apiKey });
                        models = Array.isArray(result)
                            ? result.map((m) => m?.id).filter((n) => typeof n === 'string' && n.length > 0)
                            : [];
                    }
                } else if (provider === 'anthropic') {
                    // Anthropic: fetch from API
                    const apiKey = providerCfg?.api_key || '';
                    if (apiKey) {
                        const result = await window.__TAURI__.core.invoke('list_anthropic_models', { apiKey });
                        models = Array.isArray(result)
                            ? result.map((m) => m?.id).filter((n) => typeof n === 'string' && n.length > 0)
                            : [];
                    }
                } else if (provider === 'grok') {
                    // Grok: fetch from xAI API
                    const apiKey = providerCfg?.api_key || '';
                    const result = await window.__TAURI__.core.invoke('list_grok_models', { apiKey });
                    models = Array.isArray(result)
                        ? result.map((m) => m?.id).filter((n) => typeof n === 'string' && n.length > 0)
                        : [];
                }

                if (models.length === 0) {
                    // No models found - show current model if configured, or placeholder
                    if (typeof currentModel === 'string' && currentModel.length > 0) {
                        modelSelect.innerHTML = `<option value="${currentModel}">${currentModel}</option>`;
                        modelSelect.title = `${provider} model (API key may be missing)`;
                    } else {
                        modelSelect.innerHTML = '<option value="">No models found</option>';
                        modelSelect.title = 'Configure API key in settings';
                    }
                    return;
                }

                // Populate with fetched models
                setModelSelectOptions(models, typeof currentModel === 'string' ? currentModel : null);
                modelSelect.disabled = false;
                modelSelect.title = `Select ${provider} model`;
            } catch (e) {
                console.error(`Failed to list ${provider} models`, e);
                // Fallback: show current model if configured
                if (typeof currentModel === 'string' && currentModel.length > 0) {
                    modelSelect.innerHTML = `<option value="${currentModel}">${currentModel}</option>`;
                    modelSelect.title = `${provider} model (failed to fetch list)`;
                } else {
                    modelSelect.innerHTML = '<option value="">Failed to load models</option>';
                    modelSelect.title = 'Error loading models';
                }
            }
