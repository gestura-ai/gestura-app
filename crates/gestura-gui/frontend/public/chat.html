<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Avoid stale assets in Tauri/WebView during rapid iteration -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Gestura Chat</title>
    <link rel="stylesheet" href="icons.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

        :root {
            /* Premium Light Palette */
            --bg-base: #fbfbfd;
            --bg-glass: rgba(255, 255, 255, 0.7);
            --bg-glass-strong: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(0, 0, 0, 0.05);
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent-primary: #0071e3;
            --accent-glow: rgba(0, 113, 227, 0.3);
            --user-bubble: #0071e3;
            --user-text: #ffffff;
            --agent-bubble: rgba(0, 0, 0, 0.04);
            --agent-text: #1d1d1f;
            --success: #34c759;
            --error: #ff3b30;
            --tool-bg: rgba(52, 199, 89, 0.1);
            --tool-border: rgba(52, 199, 89, 0.3);
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.08);
            --blur: blur(20px);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                /* Premium Dark Palette */
                --bg-base: #000000;
                --bg-glass: rgba(28, 28, 30, 0.6);
                --bg-glass-strong: rgba(44, 44, 46, 0.8);
                --glass-border: rgba(255, 255, 255, 0.1);
                --text-primary: #f5f5f7;
                --text-secondary: #86868b;
                --accent-primary: #2997ff;
                --accent-glow: rgba(41, 151, 255, 0.3);
                --user-bubble: #2997ff;
                --user-text: #ffffff;
                --agent-bubble: rgba(255, 255, 255, 0.08);
                --agent-text: #f5f5f7;
                --success: #30d158;
                --error: #ff453a;
                --tool-bg: rgba(48, 209, 88, 0.15);
                --tool-border: rgba(48, 209, 88, 0.3);
                --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.3);
                --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.5);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            height: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            /* Prefer dynamic viewport units inside WebViews (prevents overlap on resize) */
            min-height: 100vh;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            letter-spacing: -0.01em;
        }

        /* Glassmorphism Header */
        .header {
            min-height: 60px;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            /* macOS WebView safe-area/titlebar inset friendly */
            padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px 16px;
            flex-wrap: wrap;
            gap: 10px;
            background: var(--bg-glass);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-bottom: 1px solid var(--glass-border);
            /* Keep header in normal flow so it never overlaps content */
            z-index: 10;
            position: relative;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 15px;
            opacity: 0.9;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .model-selector {
            appearance: none;
            -webkit-appearance: none;
            background: var(--bg-glass-strong);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            border-radius: 12px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 500;
            outline: none;
            cursor: pointer;
            max-width: 240px;
            flex: 1 1 160px;
        }

        @media (max-width: 560px) {
            .header {
                padding: 10px 12px;
            }

            .header-controls {
                width: 100%;
                justify-content: space-between;
            }

            .model-selector {
                flex: 1 1 140px;
                max-width: 100%;
            }
        }

        .model-selector:focus {
            border-color: var(--accent-glow);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .status-badge {
            font-size: 11px;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 20px;
            background: var(--bg-glass-strong);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .status-badge.active {
            color: var(--success);
            border-color: rgba(52, 199, 89, 0.3);
            box-shadow: 0 0 10px rgba(52, 199, 89, 0.2);
        }

        .status-badge.busy {
            color: var(--accent-primary);
            border-color: rgba(10, 132, 255, 0.35);
            box-shadow: 0 0 10px rgba(10, 132, 255, 0.18);
        }

        .status-badge.error {
            color: var(--error);
            border-color: rgba(255, 69, 58, 0.35);
            box-shadow: 0 0 10px rgba(255, 69, 58, 0.18);
        }

        /* Chat Area */
        .chat-container {
            flex: 1;
            /* Critical in flex layouts so header/input never overlap messages */
            min-height: 0;
            /* Header & input are in-flow; normal padding is enough */
            padding: 20px 20px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background-color: var(--text-secondary);
            border-radius: 3px;
            opacity: 0.3;
        }

        /* Message Bubbles */
        .message {
            margin-bottom: 24px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-content {
            padding: 16px 24px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.6;
            position: relative;
            box-shadow: var(--shadow-sm);
        }

        /* User Message */
        .message.user {
            display: flex;
            justify-content: flex-end;
        }

        .message.user .message-content {
            background: var(--user-bubble);
            color: var(--user-text);
            border-bottom-right-radius: 4px;
            background-image: linear-gradient(135deg, var(--user-bubble), var(--accent-primary));
        }

        /* Agent Message */
        .message.agent .message-content {
            background: var(--agent-bubble);
            color: var(--agent-text);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--glass-border);
        }

        /* Tool Call Card */
        .tool-call {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 16px;
            margin: 10px 0;
            background: var(--tool-bg);
            border: 1px solid var(--tool-border);
            border-radius: 12px;
            font-size: 13px;
            color: var(--text-primary);
            max-width: 100%;
            animation: pulse-border 2s infinite;
        }

        .tool-call.done {
            animation: none;
            opacity: 0.9;
        }

        .tool-call-body {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .tool-args {
            margin: 0;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.04);
            font-size: 12px;
            line-height: 1.4;
            overflow-x: auto;
            max-width: 100%;
            white-space: pre;
        }

        @keyframes pulse-border {
            0% {
                box-shadow: 0 0 0 0 rgba(52, 199, 89, 0.2);
            }

            70% {
                box-shadow: 0 0 0 6px rgba(52, 199, 89, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(52, 199, 89, 0);
            }
        }

        .tool-icon {
            width: 16px;
            height: 16px;
            fill: var(--success);
        }

        /* Thinking Block */
        .thinking-block {
            margin-bottom: 12px;
            background: var(--bg-glass-strong);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
        }

        .thinking-header {
            padding: 10px 16px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }

        .thinking-header:hover {
            background: rgba(0, 0, 0, 0.03);
        }

        .thinking-header::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-secondary);
            display: inline-block;
        }

        .thinking-header.animating::before {
            animation: pulse-dot 1s infinite alternate;
            background: var(--accent-primary);
        }

        @keyframes pulse-dot {
            from {
                transform: scale(0.8);
                opacity: 0.6;
            }

            to {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .thinking-content {
            padding: 12px 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
            background: rgba(0, 0, 0, 0.02);
            border-top: 1px solid var(--glass-border);
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }

        .thinking-block.collapsed .thinking-content {
            display: none;
        }

        /* Message Queue Indicator */
        .queue-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px 12px;
            font-size: 13px;
            color: var(--accent-primary);
            background: var(--bg-glass);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-radius: 12px;
            margin-bottom: 8px;
            animation: queue-pulse 2s ease-in-out infinite;
            border: 1px solid var(--glass-border);
        }

        @keyframes queue-pulse {

            0%,
            100% {
                opacity: 0.7;
            }

            50% {
                opacity: 1;
            }
        }

        /* Input Area with Glassmorphism */
        .input-area {
            /* Keep input in flow so it can't cover other UI */
            position: relative;
            width: 100%;
            padding: 12px 16px 16px 16px;
            background: var(--bg-glass);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-top: 1px solid var(--glass-border);
            display: flex;
            justify-content: center;
            flex: 0 0 auto;
            z-index: 10;
        }

        .input-container {
            background: var(--bg-glass-strong);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            padding: 10px;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
            max-width: 800px;
        }

        .input-container:focus-within {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
            border-color: var(--accent-glow);
        }

        .message-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 16px;
            font-size: 16px;
            color: var(--text-primary);
            outline: none;
            font-family: inherit;
        }

        .message-input::placeholder {
            color: var(--text-secondary);
            font-weight: 300;
        }

        .btn-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-icon:hover {
            background: rgba(0, 0, 0, 0.05);
            color: var(--text-primary);
            transform: scale(1.05);
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-primary:hover {
            background: var(--accent-primary);
            transform: scale(1.05);
            box-shadow: 0 6px 16px var(--accent-glow);
            color: white;
        }

        .btn-primary:active {
            transform: scale(0.95);
        }

        .btn-cancel {
            background: var(--error);
            color: white;
        }

        .btn-cancel:hover {
            background: var(--error);
            transform: scale(1.05);
            color: white;
        }

        /* Voice Button Pulse */
        .voice-active {
            color: white;
            background: var(--error);
            box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7);
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7);
            }

            70% {
                transform: scale(1);
                box-shadow: 0 0 0 10px rgba(255, 59, 48, 0);
            }

            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(255, 59, 48, 0);
            }
        }

        /* Markdown Styling */
        .markdown-body pre {
            background: rgba(0, 0, 0, 0.03);
            /* Slight contrast */
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
            border: 1px solid var(--glass-border);
            margin: 12px 0;
        }

        .markdown-body code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9em;
            padding: 0.2em 0.4em;
            border-radius: 4px;
            background: rgba(127, 127, 127, 0.1);
        }

        .markdown-body pre code {
            background: none;
            padding: 0;
            color: var(--text-primary);
        }

        .markdown-body p {
            margin-bottom: 1em;
        }

        .markdown-body p:last-child {
            margin-bottom: 0;
        }

        /* New Typing Indicator */
        .typing-dots {
            display: none;
            gap: 4px;
            padding: 12px 16px;
            background: var(--bg-glass);
            border-radius: 20px;
            /* Align with agent bubbles */
            align-self: flex-start;
            margin-left: 20px;
            margin-bottom: 16px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .typing-dots.show {
            display: inline-flex;
            opacity: 1;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            opacity: 0.4;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <div class="header">
        <div class="header-title">
            <span class="icon-message"></span>
            Gestura
        </div>
        <div class="header-controls">
            <select class="model-selector" id="providerSelect" title="Select provider">
                <option value="anthropic">Anthropic</option>
                <option value="openai">OpenAI</option>
                <option value="grok">Grok</option>
                <option value="ollama">Ollama</option>
                <option value="echo">Echo</option>
            </select>
            <select class="model-selector" id="modelSelect" title="Select model" disabled>
                <option value="">Model</option>
            </select>
            <div class="status-badge" id="status">Ready</div>
        </div>
    </div>

    <!-- Chat Stream -->
    <div class="chat-container" id="messages">
        <!-- Welcome Message -->
        <div class="message agent">
            <div class="message-content markdown-body">
                Hello! I'm Gestura. How can I assist you naturally today?
            </div>
        </div>
    </div>

    <!-- Typing Indicator -->
    <div class="typing-dots" id="typing">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
        <div class="input-container">
            <button class="btn-icon" id="voiceBtn" title="Voice Input">
                <span class="icon-microphone"></span>
            </button>
            <input type="text" class="message-input" id="messageInput" placeholder="Type a message..."
                autocomplete="off">
            <button class="btn-icon btn-primary" id="sendButton" title="Send message">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path>
                </svg>
            </button>
            <button class="btn-icon btn-cancel" id="cancelButton" title="Cancel" style="display: none;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6L6 18M6 6l12 12"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- Script -->
    <script>
        // Core Elements
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const cancelButton = document.getElementById('cancelButton');
        const voiceBtn = document.getElementById('voiceBtn');
        const typingIndicator = document.getElementById('typing');
        const statusElement = document.getElementById('status');
        const providerSelect = document.getElementById('providerSelect');
        const modelSelect = document.getElementById('modelSelect');

        // Cached config (used for model dropdown)
        let cachedConfig = null;

        // State
        let isProcessing = false;
        let isListening = false;
        let currentRequestNonce = 0;
        let lastStreamEventAt = Date.now();
        let streamWatchdogInterval = null;
        let streamingMessageElement = null;
        let streamingContent = '';
        let currentThinkingDiv = null;
        let currentToolCard = null;
        let currentToolArgsEl = null;
        let messageQueue = []; // Queue for messages sent during processing
        const defaultPlaceholder = 'Type a message...';
        const processingPlaceholder = 'Type to queue another message...';
        const sessionId = new URLSearchParams(window.location.search).get('session_id');

        function setStatus(text, kind = 'ready') {
            if (!statusElement) return;
            statusElement.textContent = text;
            statusElement.classList.remove('active');
            statusElement.classList.remove('busy');
            statusElement.classList.remove('error');
            if (kind === 'listening') statusElement.classList.add('active');
            if (kind === 'busy') statusElement.classList.add('busy');
            if (kind === 'error') statusElement.classList.add('error');
        }

        function finalizeStreamForCurrentRequest(options = {}) {
            const { statusText = null, statusKind = 'ready', allowQueueAdvance = true } = options;
            if (streamWatchdogInterval) {
                clearInterval(streamWatchdogInterval);
                streamWatchdogInterval = null;
            }
            hideTyping();
            isProcessing = false;
            currentRequestNonce = 0;
            if (streamingMessageElement) streamingMessageElement.classList.remove('streaming');
            const thinkingHeaders = document.querySelectorAll('.thinking-header.animating');
            thinkingHeaders.forEach(h => h.classList.remove('animating'));
            if (!isListening) setStatus(statusText || 'Ready', statusKind);

            if (messageQueue.length > 0) {
                // Keep the UI in "processing" mode while we drain the queue.
                setProcessingUI(true);
                if (allowQueueAdvance) setTimeout(() => processNextInQueue(), 100);
            } else {
                setProcessingUI(false);
            }
        }

        function touchStreamActivity() {
            lastStreamEventAt = Date.now();
        }

        function startStreamWatchdog(nonce) {
            if (streamWatchdogInterval) clearInterval(streamWatchdogInterval);
            // Frontend-side safety: if backend never emits any stream events (or invoke never returns),
            // don't leave the UI stuck forever.
            const maxIdleMs = 90_000;
            streamWatchdogInterval = setInterval(() => {
                if (!isProcessing || currentRequestNonce !== nonce) return;
                if (Date.now() - lastStreamEventAt > maxIdleMs) {
                    addMessage(`Error: Timed out waiting for agent response (no events for ${Math.round(maxIdleMs / 1000)}s).`, 'agent');
                    finalizeStreamForCurrentRequest({ statusText: 'Error', statusKind: 'error' });
                }
            }, 1000);
        }

        // --- Markdown Parsing (Simplified for reliability) ---
        function parseMarkdown(text) {
            // Escape HTML
            const escapeHtml = (str) => str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            let html = escapeHtml(text);

            // Code blocks
            html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code class="language-$1">$2</code></pre>');

            // Inline code
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

            // Bold
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

            // Italic
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');

            // Paragraphs (double newline)
            html = html.replace(/\n\n/g, '<p></p>');

            // Line breaks
            html = html.replace(/\n/g, '<br>');

            return html;
        }

        // --- Message Handling ---

        function addMessage(content, type, isHtml = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content markdown-body';

            if (isHtml) {
                contentDiv.innerHTML = content;
            } else {
                contentDiv.textContent = content;
            }

            msgDiv.appendChild(contentDiv);
            messagesContainer.appendChild(msgDiv);
            scrollToBottom();
            return msgDiv;
        }

        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showTyping() {
            typingIndicator.classList.add('show');
            scrollToBottom();
        }

        function hideTyping() {
            typingIndicator.classList.remove('show');
        }

        // --- Streaming Logic ---

        function ensureStreamingMessage() {
            if (!streamingMessageElement) {
                hideTyping();
                streamingMessageElement = addMessage('', 'agent', true);
                streamingMessageElement.classList.add('streaming');
            }
            return streamingMessageElement;
        }

        // Queue a message for later processing
        function queueMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            messageQueue.push(text);
            addMessage(`⏳ ${text}`, 'user'); // Show queued message with indicator
            messageInput.value = '';
            updateQueueIndicator();
        }

        // Update the queue indicator UI
        function updateQueueIndicator() {
            let indicator = document.getElementById('queueIndicator');
            if (messageQueue.length > 0) {
                if (!indicator) {
                    indicator = document.createElement('div');
                    indicator.id = 'queueIndicator';
                    indicator.className = 'queue-indicator';
                    const inputArea = document.querySelector('.input-area');
                    inputArea.insertBefore(indicator, inputArea.firstChild);
                }
                indicator.innerHTML = `📨 ${messageQueue.length} message${messageQueue.length > 1 ? 's' : ''} queued`;
                indicator.style.display = 'flex';
            } else if (indicator) {
                indicator.style.display = 'none';
            }
        }

        // Process the next message in the queue
        async function processNextInQueue() {
            if (messageQueue.length === 0 || isProcessing) return;

            const nextMessage = messageQueue.shift();
            updateQueueIndicator();

            // Update the queued message to remove ⏳ indicator
            const messages = messagesContainer.querySelectorAll('.message.user .message-content');
            for (const msg of messages) {
                if (msg.textContent === `⏳ ${nextMessage}`) {
                    msg.textContent = nextMessage;
                    break;
                }
            }

            await processMessage(nextMessage);
        }

        // Update UI for processing state
        function setProcessingUI(processing) {
            if (processing) {
                messageInput.placeholder = processingPlaceholder;
                cancelButton.style.display = 'flex';
                sendButton.title = 'Queue message';
            } else {
                messageInput.placeholder = defaultPlaceholder;
                cancelButton.style.display = 'none';
                sendButton.title = 'Send message';
            }
        }

        // Core message processing function
        async function processMessage(text) {
            const nonce = ++currentRequestNonce;
            touchStreamActivity();
            startStreamWatchdog(nonce);
            showTyping();
            isProcessing = true;
            setProcessingUI(true);
            if (!isListening) setStatus('Responding...', 'busy');

            // Reset Stream State
            streamingMessageElement = null;
            streamingContent = '';
            currentThinkingDiv = null;
            currentToolCard = null;
            currentToolArgsEl = null;

            try {
                // Invoke Backend
                const payload = { message: text };
                if (sessionId) payload.session_id = sessionId;
                const p = window.__TAURI__.core.invoke('process_chat_message_streaming', payload);
                // Don't await: streaming completion is signaled via events, and awaiting can deadlock UI state.
                p.catch((err) => {
                    console.error('Send failed:', err);
                    addMessage(`Error: ${err}`, 'agent');
                    if (currentRequestNonce === nonce) {
                        finalizeStreamForCurrentRequest({ statusText: 'Error', statusKind: 'error' });
                    }
                });
            } catch (err) {
                console.error("Send failed:", err);
                addMessage(`Error: ${err}`, 'agent');
                if (currentRequestNonce === nonce) {
                    finalizeStreamForCurrentRequest({ statusText: 'Error', statusKind: 'error' });
                }
            }
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            // If already processing, queue the message instead
            if (isProcessing) {
                queueMessage();
                return;
            }

            // UI Updates
            addMessage(text, 'user');
            messageInput.value = '';

            await processMessage(text);
        }

        // --- Event Listeners (Tauri) ---

        async function setupEvents() {
            if (!window.__TAURI__) return;
            const event = window.__TAURI__.event;

            // 1. Thinking Stream
            await event.listen('chat-stream-thinking', (e) => {
                touchStreamActivity();
                ensureStreamingMessage();
                const contentDiv = streamingMessageElement.querySelector('.message-content');

                // Create Thinking Block if needed
                if (!currentThinkingDiv) {
                    currentThinkingDiv = document.createElement('div');
                    currentThinkingDiv.className = 'thinking-block';
                    currentThinkingDiv.innerHTML = `
                        <div class="thinking-header animating" onclick="this.parentElement.classList.toggle('collapsed')">
                            Thinking Process...
                        </div>
                        <div class="thinking-content"></div>
                    `;
                    // Prepend to content
                    contentDiv.insertAdjacentElement('afterbegin', currentThinkingDiv);
                }

                const textDiv = currentThinkingDiv.querySelector('.thinking-content');
                textDiv.textContent += e.payload;
                textDiv.scrollTop = textDiv.scrollHeight;
            });

            // 2. Text Stream
            await event.listen('chat-stream-chunk', (e) => {
                touchStreamActivity();
                ensureStreamingMessage();

                // Stop thinking animation if it was running
                if (currentThinkingDiv) {
                    const header = currentThinkingDiv.querySelector('.thinking-header');
                    if (header) {
                        header.classList.remove('animating');
                        header.textContent = "Thought Process";
                        // Collapse by default when text starts
                        if (!currentThinkingDiv.classList.contains('collapsed')) {
                            currentThinkingDiv.classList.add('collapsed');
                        }
                    }
                    currentThinkingDiv = null; // Reset ensures we don't keep appending to thought
                }

                streamingContent += e.payload;

                // Update content (preserving thinking block if it exists)
                const contentDiv = streamingMessageElement.querySelector('.message-content');

                // We need to keep the thinking block element, updates only text content AFTER it
                // Simple approach: re-render full markdown. 
                // BUT we must not destroy the thinking block.

                // Let's create a text container if not exists
                let textContainer = contentDiv.querySelector('.text-content');
                if (!textContainer) {
                    textContainer = document.createElement('div');
                    textContainer.className = 'text-content';
                    contentDiv.appendChild(textContainer);
                }

                textContainer.innerHTML = parseMarkdown(streamingContent);
                scrollToBottom();
            });

            // 3. Tool Call Events (aligned with backend)
            await event.listen('chat-stream-tool-start', (e) => {
                touchStreamActivity();
                ensureStreamingMessage();

                // Stop thinking animation
                if (currentThinkingDiv) {
                    const header = currentThinkingDiv.querySelector('.thinking-header');
                    if (header) header.classList.remove('animating');
                }

                const payload = e.payload || {};
                const toolName = (typeof payload === 'string') ? payload : (payload.name || 'tool');
                const contentDiv = streamingMessageElement.querySelector('.message-content');

                currentToolCard = document.createElement('div');
                currentToolCard.className = 'tool-call';
                currentToolCard.innerHTML = `
	                    <svg class="tool-icon" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.7-3.7a1 1 0 0 0 0-1.4 1 1 0 0 0-1.4 0L17 7.3l-1.6-1.6a1 1 0 0 0-1.4 0zM20 21h-4c-1 0-2-1-2-2v-4c0-1 1-2 2-2h4c1 0 2 1 2 2v4c0 1-1 2-2 2zM12 21H8c-1 0-2-1-2-2V9c0-1 1-2 2-2h4c1 0 2 1 2 2v10c0 1-1 2-2 2z"/></svg>
	                    <div class="tool-call-body">
	                        <div>Using tool: <strong></strong></div>
	                        <pre class="tool-args" style="display:none"></pre>
	                    </div>
	                `;
                currentToolCard.querySelector('strong').textContent = toolName;
                currentToolArgsEl = currentToolCard.querySelector('.tool-args');

                contentDiv.appendChild(currentToolCard);
                scrollToBottom();
            });

            await event.listen('chat-stream-tool-args', (e) => {
                touchStreamActivity();
                if (!currentToolArgsEl) return;
                const argsText = (typeof e.payload === 'string') ? e.payload : JSON.stringify(e.payload, null, 2);
                currentToolArgsEl.style.display = 'block';
                currentToolArgsEl.textContent += argsText;
                scrollToBottom();
            });

            await event.listen('chat-stream-tool-end', () => {
                touchStreamActivity();
                if (currentToolCard) {
                    currentToolCard.classList.add('done');
                }
                currentToolCard = null;
                currentToolArgsEl = null;
            });

            // 4. Stream Done
            await event.listen('chat-stream-done', () => {
                touchStreamActivity();
                finalizeStreamForCurrentRequest({ statusText: 'Ready', statusKind: 'ready' });
            });

            // 4b. Stream Cancelled / Error
            await event.listen('chat-stream-cancelled', () => {
                touchStreamActivity();
                addMessage('Cancelled.', 'agent');
                finalizeStreamForCurrentRequest({ statusText: 'Cancelled', statusKind: 'ready' });
            });

            await event.listen('chat-stream-error', (e) => {
                touchStreamActivity();
                const payload = e?.payload;
                const errText = (typeof payload === 'string')
                    ? payload
                    : (payload?.message || JSON.stringify(payload));
                addMessage(`Error: ${errText}`, 'agent');
                finalizeStreamForCurrentRequest({ statusText: 'Error', statusKind: 'error' });
            });

            // 5. Voice Events
            await event.listen('listening-state-changed', (e) => {
                const listening = !!(e && e.payload && e.payload.is_listening);
                if (listening) {
                    isListening = true;
                    voiceBtn.classList.add('voice-active');
                    setStatus('Listening...', 'listening');
                } else {
                    isListening = false;
                    voiceBtn.classList.remove('voice-active');
                    if (!isProcessing) setStatus('Ready', 'ready');
                }
            });
        }

        async function refreshConfig() {
            if (!window.__TAURI__) return null;
            try {
                cachedConfig = await window.__TAURI__.core.invoke('get_config');
                return cachedConfig;
            } catch (e) {
                console.error('Failed to load config', e);
                return null;
            }
        }

        function setModelSelectOptions(names, selectedName) {
            modelSelect.innerHTML = '';
            for (const name of names) {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                modelSelect.appendChild(opt);
            }
            if (selectedName && names.includes(selectedName)) {
                modelSelect.value = selectedName;
            } else if (names.length > 0) {
                modelSelect.value = names[0];
            }
        }

        async function populateModelSelectForProvider(provider) {
            if (!modelSelect) return;

            // Default: disable model selection unless we can populate something meaningful.
            modelSelect.disabled = true;
            modelSelect.title = 'Model selection is available for Ollama';
            modelSelect.innerHTML = '<option value="">Model</option>';

            if (provider !== 'ollama') {
                // Show configured model if present, but keep disabled to avoid writing invalid config.
                const cfg = cachedConfig;
                const providerCfg = cfg?.llm?.[provider];
                const model = providerCfg?.model;
                if (typeof model === 'string' && model.length > 0) {
                    modelSelect.innerHTML = `<option value="${model}">${model}</option>`;
                } else {
                    modelSelect.innerHTML = '<option value="">Model (not configured)</option>';
                }
                return;
            }

            // Ollama: fetch models from local endpoint.
            modelSelect.title = 'Select Ollama model';
            modelSelect.innerHTML = '<option value="">Loading models…</option>';

            const cfg = cachedConfig;
            const endpoint =
                cfg?.llm?.ollama?.base_url ||
                cfg?.llm?.ollama?.endpoint ||
                'http://localhost:11434';

            try {
                const models = await window.__TAURI__.core.invoke('list_ollama_models', { endpoint });
                const names = Array.isArray(models)
                    ? models
                        .map((m) => m?.name)
                        .filter((n) => typeof n === 'string' && n.length > 0)
                    : [];

                if (names.length === 0) {
                    modelSelect.innerHTML = '<option value="">No models found</option>';
                    return;
                }

                const selected = cfg?.llm?.ollama?.model;
                setModelSelectOptions(names, typeof selected === 'string' ? selected : null);
                modelSelect.disabled = false;
            } catch (e) {
                console.error('Failed to list Ollama models', e);
                modelSelect.innerHTML = '<option value="">Failed to load models</option>';
            }
        }

        async function initHeaderControls() {
            if (!window.__TAURI__) return;
            if (!providerSelect || !modelSelect) return;

            await refreshConfig();

            // Load the effective config for this session (session override or global fallback)
            let initialProvider = cachedConfig?.llm?.primary || 'anthropic';
            let initialModel = '';

            if (sessionId) {
                try {
                    const [provider, model] = await window.__TAURI__.core.invoke('get_effective_llm_config', { sessionId });
                    initialProvider = provider;
                    initialModel = model;
                } catch (e) {
                    console.warn('Failed to get effective LLM config, using global', e);
                }
            }

            if (typeof initialProvider === 'string' && initialProvider.length > 0) {
                providerSelect.value = initialProvider;
            }

            await populateModelSelectForProvider(providerSelect.value);

            // If we have a session-specific model, select it
            if (initialModel && modelSelect.querySelector(`option[value="${initialModel}"]`)) {
                modelSelect.value = initialModel;
            }

            providerSelect.addEventListener('change', async () => {
                const provider = providerSelect.value;
                try {
                    // Use session-scoped config change (doesn't modify global config)
                    if (sessionId) {
                        await window.__TAURI__.core.invoke('set_session_llm_provider', {
                            sessionId,
                            provider
                        });
                    } else {
                        // Fallback for sessions without ID (shouldn't happen, but be safe)
                        await window.__TAURI__.core.invoke('update_llm_provider', { provider });
                    }
                    await refreshConfig();
                    await populateModelSelectForProvider(provider);
                } catch (e) {
                    console.error('Failed to update provider', e);
                    addMessage(`Error updating provider: ${e}`, 'agent');
                }
            });

            modelSelect.addEventListener('change', async () => {
                const model = modelSelect.value;
                if (!model) return;

                try {
                    // Use session-scoped model change (doesn't modify global config)
                    if (sessionId) {
                        await window.__TAURI__.core.invoke('set_session_llm_model', {
                            sessionId,
                            model
                        });
                    } else if (providerSelect.value === 'ollama') {
                        // Legacy fallback: Only save to global config for Ollama if no session
                        const cfg = cachedConfig || (await refreshConfig());
                        if (!cfg) return;

                        const endpoint =
                            cfg?.llm?.ollama?.base_url ||
                            cfg?.llm?.ollama?.endpoint ||
                            'http://localhost:11434';

                        cfg.llm.ollama = cfg.llm.ollama || { base_url: endpoint, model: model };
                        cfg.llm.ollama.base_url = cfg.llm.ollama.base_url || endpoint;
                        cfg.llm.ollama.model = model;

                        await window.__TAURI__.core.invoke('save_config', { cfg });
                        await refreshConfig();
                    }
                } catch (e) {
                    console.error('Failed to save model', e);
                    addMessage(`Error saving model: ${e}`, 'agent');
                }
            });
        }

        // --- Interaction ---

        sendButton.addEventListener('click', sendMessage);

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Cancel button cancels in-flight streaming (if any) and clears the queue.
        cancelButton.addEventListener('click', async () => {
            messageQueue = [];
            updateQueueIndicator();

            if (!window.__TAURI__) return;
            if (!isProcessing) return;

            cancelButton.disabled = true;
            try {
                if (!isListening) setStatus('Cancelling...', 'busy');
                await window.__TAURI__.core.invoke('cancel_chat_streaming');
            } catch (e) {
                console.error('Failed to cancel streaming', e);
                addMessage(`Cancel failed: ${e}`, 'agent');
                // If backend says there's no active stream, don't leave UI stuck.
                finalizeStreamForCurrentRequest({ statusText: 'Ready', statusKind: 'ready' });
            } finally {
                cancelButton.disabled = false;
            }
        });

        voiceBtn.addEventListener('click', async () => {
            // Voice toggle logic (simplified)
            const isActive = voiceBtn.classList.contains('voice-active');
            try {
                if (isActive) {
                    await window.__TAURI__.core.invoke('stop_voice_listening');
                } else {
                    await window.__TAURI__.core.invoke('start_voice_listening');
                }
            } catch (e) {
                console.error("Voice error", e);
            }
        });

        // Initialize
        initHeaderControls();
        setupEvents();
        messageInput.focus();

    </script>
