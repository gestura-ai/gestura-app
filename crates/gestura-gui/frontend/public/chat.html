        async function initHeaderControls() {
            if (!window.__TAURI__) return;
            if (!providerSelect || !modelSelect) return;

            await refreshConfig();

            // Load the effective config for this session (session override or global fallback)
            let initialProvider = cachedConfig?.llm?.primary || 'anthropic';
            let initialModel = '';

            if (sessionId) {
                try {
                    const [provider, model] = await window.__TAURI__.core.invoke('get_effective_llm_config', { sessionId });
                    initialProvider = provider;
                    initialModel = model;
                } catch (e) {
                    console.warn('Failed to get effective LLM config, using global', e);
                }
            }

            if (typeof initialProvider === 'string' && initialProvider.length > 0) {
                providerSelect.value = initialProvider;
                updateProviderIcon(initialProvider);
            }

            await populateModelSelectForProvider(providerSelect.value);

            // If we have a session-specific model, select it
            if (initialModel && modelSelect.querySelector(`option[value="${initialModel}"]`)) {
                modelSelect.value = initialModel;
            }

            providerSelect.addEventListener('change', async () => {
                const provider = providerSelect.value;
                updateProviderIcon(provider);
                try {
                    // Use session-scoped config change (doesn't modify global config)
                    if (sessionId) {
                        await window.__TAURI__.core.invoke('set_session_llm_provider', {
                            sessionId,
                            provider
                        });
                    } else {
                        // Fallback for sessions without ID (shouldn't happen, but be safe)
                        await window.__TAURI__.core.invoke('update_llm_provider', { provider });
                    }
                    await refreshConfig();
                    await populateModelSelectForProvider(provider);
                } catch (e) {
                    console.error('Failed to update provider', e);
                    addMessage(`Error updating provider: ${e}`, 'agent');
                }
            });

            modelSelect.addEventListener('change', async () => {
                const model = modelSelect.value;
                if (!model) return;

                try {
                    // Use session-scoped model change (doesn't modify global config)
                    if (sessionId) {
                        await window.__TAURI__.core.invoke('set_session_llm_model', {
                            sessionId,
                            model
                        });
                    } else if (providerSelect.value === 'ollama') {
                        // Legacy fallback: Only save to global config for Ollama if no session
                        const cfg = cachedConfig || (await refreshConfig());
                        if (!cfg) return;

                        const endpoint =
                            cfg?.llm?.ollama?.base_url ||
                            cfg?.llm?.ollama?.endpoint ||
                            'http://localhost:11434';

                        cfg.llm.ollama = cfg.llm.ollama || { base_url: endpoint, model: model };
                        cfg.llm.ollama.base_url = cfg.llm.ollama.base_url || endpoint;
                        cfg.llm.ollama.model = model;

                        await window.__TAURI__.core.invoke('save_config', { cfg });
                        await refreshConfig();
                    }
                } catch (e) {
                    console.error('Failed to save model', e);
                    addMessage(`Error saving model: ${e}`, 'agent');
                }
            });
        }

        // --- Interaction ---

        sendButton.addEventListener('click', sendMessage);

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Cancel button cancels in-flight streaming (if any) and clears the queue.
        cancelButton.addEventListener('click', async () => {
            messageQueue = [];
            updateQueueIndicator();

            if (!window.__TAURI__) return;
            if (!isProcessing) return;

            cancelButton.disabled = true;
            try {
                if (!isListening) setStatus('Cancelling...', 'busy');
                await window.__TAURI__.core.invoke('cancel_chat_streaming');
            } catch (e) {
                console.error('Failed to cancel streaming', e);
                addMessage(`Cancel failed: ${e}`, 'agent');
                // If backend says there's no active stream, don't leave UI stuck.
                finalizeStreamForCurrentRequest({ statusText: 'Ready', statusKind: 'ready' });
            } finally {
                cancelButton.disabled = false;
            }
        });

        voiceBtn.addEventListener('click', async () => {
            // Voice toggle logic (simplified)
            const isActive = voiceBtn.classList.contains('voice-active');
            try {
                if (isActive) {
                    await window.__TAURI__.core.invoke('stop_voice_listening');
                } else {
                    await window.__TAURI__.core.invoke('start_voice_listening');
                }
            } catch (e) {
                console.error("Voice error", e);
            }
        });

        // =====================================================================
        // Session Settings Panel
        // =====================================================================
        const sessionPanel = document.getElementById('sessionPanel');
        const sessionPanelOverlay = document.getElementById('sessionPanelOverlay');
        const sessionSettingsBtn = document.getElementById('sessionSettingsBtn');
        const sessionPanelClose = document.getElementById('sessionPanelClose');
        const sessionWorkDir = document.getElementById('sessionWorkDir');
        const pickWorkDirBtn = document.getElementById('pickWorkDirBtn');
        const sessionPermission = document.getElementById('sessionPermission');
        const workDirInfo = document.getElementById('workDirInfo');

        function openSessionPanel() {
            sessionPanel.classList.add('open');
            sessionPanelOverlay.classList.add('visible');
            sessionSettingsBtn.classList.add('active');
            loadSessionSettings();
        }

        function closeSessionPanel() {
            sessionPanel.classList.remove('open');
            sessionPanelOverlay.classList.remove('visible');
            sessionSettingsBtn.classList.remove('active');
        }

        async function loadSessionSettings() {
            if (!sessionId) return;
            try {
                // Load workspace directory
                const workDir = await window.__TAURI__.core.invoke('get_session_workspace_by_id', { sessionId });
                sessionWorkDir.value = workDir || '';
                workDirInfo.textContent = workDir ? `Commands run in: ${workDir}` : 'No directory selected';

                // Load tool settings (permission level and enabled tools)
                const toolSettings = await window.__TAURI__.core.invoke('get_session_tool_settings', { sessionId });
                if (toolSettings) {
                    // Set permission level dropdown
                    if (toolSettings.permission_level) {
                        sessionPermission.value = toolSettings.permission_level;
                    }
                    // Set tool checkboxes
                    if (toolSettings.enabled_tools) {
                        document.querySelectorAll('#sessionToolsList input[type="checkbox"]').forEach(checkbox => {
                            const toolName = checkbox.value;
                            if (toolSettings.enabled_tools[toolName] !== undefined) {
                                checkbox.checked = toolSettings.enabled_tools[toolName];
                            }
                        });
                    }
                }
            } catch (e) {
                console.warn('Failed to load session settings:', e);
            }
        }

        sessionSettingsBtn?.addEventListener('click', () => {
            if (sessionPanel.classList.contains('open')) {
                closeSessionPanel();
            } else {
                openSessionPanel();
            }
        });

        sessionPanelClose?.addEventListener('click', closeSessionPanel);
        sessionPanelOverlay?.addEventListener('click', closeSessionPanel);

        // Pick working directory
        pickWorkDirBtn?.addEventListener('click', async () => {
            if (!sessionId) return;
            try {
                const result = await window.__TAURI__.core.invoke('pick_workspace_directory', { sessionId });
                if (result) {
                    sessionWorkDir.value = result;
                    workDirInfo.textContent = `Commands run in: ${result}`;
                }
            } catch (e) {
                console.error('Failed to pick directory:', e);
            }
        });

        // Permission level change
        sessionPermission?.addEventListener('change', async () => {
            if (!sessionId) return;
            try {
                await window.__TAURI__.core.invoke('set_session_permission_level', {
                    sessionId,
                    level: sessionPermission.value
                });
                console.log('Permission level updated to:', sessionPermission.value);
            } catch (e) {
                console.error('Failed to update permission level:', e);
            }
        });

        // Tool checkbox changes
        document.querySelectorAll('#sessionToolsList input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', async () => {
                if (!sessionId) return;
                try {
                    await window.__TAURI__.core.invoke('set_session_tool_enabled', {
                        sessionId,
                        toolName: checkbox.value,
                        enabled: checkbox.checked
                    });
                    console.log('Tool toggled:', checkbox.value, checkbox.checked);
                } catch (e) {
                    console.error('Failed to update tool setting:', e);
                }
            });
        });

        // Initialize
        initHeaderControls();
        setupEvents();
        messageInput.focus();

    </script>
</body>

</html>
