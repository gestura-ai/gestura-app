<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestura UI Testing Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: #1D1D1F;
            margin-bottom: 0.5rem;
        }

        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .test-card {
            background: #F2F2F7;
            border-radius: 12px;
            padding: 1.5rem;
            border-left: 4px solid #E5E5EA;
        }

        .test-card.testing {
            border-left-color: #FF9500;
        }

        .test-card.passed {
            border-left-color: #34C759;
        }

        .test-card.failed {
            border-left-color: #FF3B30;
        }

        .test-title {
            font-weight: 600;
            color: #1D1D1F;
            margin-bottom: 0.5rem;
        }

        .test-status {
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .test-status.testing {
            color: #FF9500;
        }

        .test-status.passed {
            color: #34C759;
        }

        .test-status.failed {
            color: #FF3B30;
        }

        .test-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .test-button {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .test-button.primary {
            background: #007AFF;
            color: white;
        }

        .test-button.primary:hover {
            background: #0056CC;
        }

        .test-button.secondary {
            background: #F2F2F7;
            color: #1D1D1F;
            border: 1px solid #E5E5EA;
        }

        .test-button.secondary:hover {
            background: #E5E5EA;
        }

        .test-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .control-button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-button.primary {
            background: #007AFF;
            color: white;
        }

        .control-button.primary:hover {
            background: #0056CC;
        }

        .control-button.danger {
            background: #FF3B30;
            color: white;
        }

        .control-button.danger:hover {
            background: #D70015;
        }

        .log-section {
            background: #1D1D1F;
            color: #F2F2F7;
            border-radius: 8px;
            padding: 1rem;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.9rem;
            max-height: 300px;
            overflow-y: auto;
        }

        .log-entry {
            margin-bottom: 0.5rem;
            padding: 0.25rem 0;
        }

        .log-entry.info {
            color: #34C759;
        }

        .log-entry.warning {
            color: #FF9500;
        }

        .log-entry.error {
            color: #FF3B30;
        }

        .timestamp {
            color: #8E8E93;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 Gestura UI Testing Dashboard</h1>
            <p>Automated testing and validation for Tauri UI components</p>
        </div>

        <div class="controls">
            <button class="control-button primary" onclick="runAllTests()">Run All Tests</button>
            <button class="control-button primary" onclick="validateAllWindows()">Validate All</button>
            <button class="control-button danger" onclick="closeAllTestWindows()">Close All Windows</button>
            <button class="control-button secondary" onclick="clearLogs()">Clear Logs</button>
        </div>

        <div class="test-grid" id="testGrid">
            <!-- Test cards will be populated by JavaScript -->
        </div>

        <div class="log-section">
            <h3 style="margin-bottom: 1rem;">Test Logs</h3>
            <div id="logContainer">
                <div class="log-entry info">
                    <span class="timestamp">[Ready]</span> UI Testing Dashboard initialized
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { invoke } from '@tauri-apps/api/core';

        const testGrid = document.getElementById('testGrid');
        const logContainer = document.getElementById('logContainer');

        const testCases = [
            {
                id: 'permissions',
                title: 'Permissions Window',
                description: 'Test permissions management interface',
                windowType: 'permissions'
            },
            {
                id: 'config',
                title: 'Configuration Window',
                description: 'Test configuration interface',
                windowType: 'config'
            },
            {
                id: 'chat',
                title: 'Chat Interface',
                description: 'Test agent chat interface',
                windowType: 'chat'
            },
            {
                id: 'status',
                title: 'System Status',
                description: 'Test system monitoring interface',
                windowType: 'status'
            },
            {
                id: 'about',
                title: 'About Dialog',
                description: 'Test about information dialog',
                windowType: 'about'
            }
        ];

        function addLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            logEntry.innerHTML = `<span class="timestamp">[${timestamp}]</span> ${message}`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function updateTestStatus(testId, status, message = '') {
            const card = document.querySelector(`[data-test-id="${testId}"]`);
            if (card) {
                card.className = `test-card ${status}`;
                const statusElement = card.querySelector('.test-status');
                statusElement.className = `test-status ${status}`;
                statusElement.textContent = message || status.toUpperCase();
            }
        }

        function createTestCard(testCase) {
            const card = document.createElement('div');
            card.className = 'test-card';
            card.setAttribute('data-test-id', testCase.id);
            
            card.innerHTML = `
                <div class="test-title">${testCase.title}</div>
                <div class="test-status">Ready</div>
                <div style="color: #8E8E93; font-size: 0.9rem; margin-bottom: 1rem;">${testCase.description}</div>
                <div class="test-actions">
                    <button class="test-button primary" onclick="testWindow('${testCase.windowType}', '${testCase.id}')">
                        Open Window
                    </button>
                    <button class="test-button secondary" onclick="validateWindow('${testCase.windowType}', '${testCase.id}')">
                        Validate
                    </button>
                    <button class="test-button secondary" onclick="captureScreenshot('${testCase.windowType}', '${testCase.id}')">
                        Screenshot
                    </button>
                </div>
            `;
            
            return card;
        }

        async function testWindow(windowType, testId) {
            updateTestStatus(testId, 'testing', 'Opening window...');
            addLog(`Testing ${windowType} window`, 'info');
            
            try {
                const result = await invoke('test_open_window', { windowType });
                updateTestStatus(testId, 'passed', 'Window opened successfully');
                addLog(`✅ ${result}`, 'info');
            } catch (error) {
                updateTestStatus(testId, 'failed', `Failed: ${error}`);
                addLog(`❌ Failed to open ${windowType}: ${error}`, 'error');
            }
        }

        async function validateWindow(windowType, testId) {
            updateTestStatus(testId, 'testing', 'Validating content...');
            addLog(`Validating ${windowType} window content`, 'info');
            
            try {
                const result = await invoke('validate_window_content', { windowLabel: windowType });
                updateTestStatus(testId, 'passed', 'Content validated');
                addLog(`✅ ${windowType} validation: ${JSON.stringify(result)}`, 'info');
            } catch (error) {
                updateTestStatus(testId, 'failed', `Validation failed: ${error}`);
                addLog(`❌ Validation failed for ${windowType}: ${error}`, 'error');
            }
        }

        async function captureScreenshot(windowType, testId) {
            updateTestStatus(testId, 'testing', 'Capturing screenshot...');
            addLog(`Capturing screenshot of ${windowType} window`, 'info');
            
            try {
                const result = await invoke('capture_window_screenshot', { windowLabel: windowType });
                updateTestStatus(testId, 'passed', 'Screenshot captured');
                addLog(`📸 ${result}`, 'info');
            } catch (error) {
                updateTestStatus(testId, 'failed', `Screenshot failed: ${error}`);
                addLog(`❌ Screenshot failed for ${windowType}: ${error}`, 'error');
            }
        }

        window.testWindow = testWindow;
        window.validateWindow = validateWindow;
        window.captureScreenshot = captureScreenshot;

        window.runAllTests = async function() {
            addLog('🚀 Running all UI tests...', 'info');
            
            for (const testCase of testCases) {
                await testWindow(testCase.windowType, testCase.id);
                await new Promise(resolve => setTimeout(resolve, 1000)); // Wait between tests
            }
            
            addLog('✅ All tests completed', 'info');
        };

        window.validateAllWindows = async function() {
            addLog('🔍 Validating all windows...', 'info');
            
            for (const testCase of testCases) {
                await validateWindow(testCase.windowType, testCase.id);
                await new Promise(resolve => setTimeout(resolve, 500));
            }
            
            addLog('✅ All validations completed', 'info');
        };

        window.closeAllTestWindows = async function() {
            addLog('🗑️ Closing all test windows...', 'info');
            
            try {
                const result = await invoke('close_test_windows');
                addLog(`✅ ${result}`, 'info');
                
                // Reset all test statuses
                testCases.forEach(testCase => {
                    updateTestStatus(testCase.id, '', 'Ready');
                });
            } catch (error) {
                addLog(`❌ Failed to close windows: ${error}`, 'error');
            }
        };

        window.clearLogs = function() {
            logContainer.innerHTML = '<div class="log-entry info"><span class="timestamp">[Cleared]</span> Logs cleared</div>';
        };

        // Initialize test cards
        testCases.forEach(testCase => {
            const card = createTestCard(testCase);
            testGrid.appendChild(card);
        });

        addLog('🎯 UI Testing Dashboard ready', 'info');
    </script>
</body>
</html>
