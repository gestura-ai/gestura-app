<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestura UI Testing Dashboard</title>
    <style>
        :root {
            /* Gestura brand tokens (unified with gestura.app) */
            --accent-primary: rgb(37, 99, 235);
            --accent-primary-rgb: 37, 99, 235;
            --accent-secondary: rgb(147, 51, 234);
            --accent-secondary-rgb: 147, 51, 234;
            --gradient-primary: linear-gradient(to right, rgb(37, 99, 235), rgb(147, 51, 234));
            --gradient-secondary: linear-gradient(to right, rgb(96, 165, 250), rgb(192, 132, 252));
            --brand-gradient: var(--gradient-primary);
            --focus-ring: rgba(var(--accent-primary-rgb), 0.35);
            --page-tint-alpha: 0.10;

            /* Theme tokens (light) */
            --background-color: #ffffff;
            --text-color: #000000;
            --text-secondary: #666666;
            --text-tertiary: rgba(0, 0, 0, 0.55);
            --border-color: #e0e0e0;
            --surface-2: #F2F2F7;
            --surface-3: #E5E5EA;
            --container-background: rgba(255, 255, 255, 0.95);
            --shadow-color: rgba(0, 0, 0, 0.10);
            --log-background: #111827;
            --log-text: #e5e7eb;

            /* Semantic RGB triples */
            --success-rgb: 52, 199, 89;
            --warning-rgb: 255, 149, 0;
            --danger-rgb: 255, 59, 48;
        }

        html {
            color-scheme: light dark;
        }

        /* Auto mode: respect system preference */
        @media (prefers-color-scheme: dark) {
            :root {
                --accent-primary: rgb(96, 165, 250);
                --accent-primary-rgb: 96, 165, 250;
                --accent-secondary: rgb(192, 132, 252);
                --accent-secondary-rgb: 192, 132, 252;
                --brand-gradient: var(--gradient-secondary);
                --focus-ring: rgba(var(--accent-primary-rgb), 0.55);
                --page-tint-alpha: 0.08;

                --background-color: #1e1e1e;
                --text-color: #ffffff;
                --text-secondary: #b0b0b0;
                --text-tertiary: rgba(255, 255, 255, 0.65);
                --border-color: #404040;
                --surface-2: #3a3a3a;
                --surface-3: #4a4a4a;
                --container-background: rgba(30, 30, 30, 0.92);
                --shadow-color: rgba(0, 0, 0, 0.35);
                --log-background: #0b1220;
                --log-text: #e5e7eb;
            }
        }

        /* Force light mode (overrides system preference) */
        html[data-theme="light"] {
            --accent-primary: rgb(37, 99, 235);
            --accent-primary-rgb: 37, 99, 235;
            --accent-secondary: rgb(147, 51, 234);
            --accent-secondary-rgb: 147, 51, 234;
            --brand-gradient: var(--gradient-primary);
            --focus-ring: rgba(var(--accent-primary-rgb), 0.35);
            --page-tint-alpha: 0.10;

            --background-color: #ffffff;
            --text-color: #000000;
            --text-secondary: #666666;
            --text-tertiary: rgba(0, 0, 0, 0.55);
            --border-color: #e0e0e0;
            --surface-2: #F2F2F7;
            --surface-3: #E5E5EA;
            --container-background: rgba(255, 255, 255, 0.95);
            --shadow-color: rgba(0, 0, 0, 0.10);
            --log-background: #111827;
            --log-text: #e5e7eb;
        }

        /* Force dark mode (overrides system preference) */
        html[data-theme="dark"] {
            --accent-primary: rgb(96, 165, 250);
            --accent-primary-rgb: 96, 165, 250;
            --accent-secondary: rgb(192, 132, 252);
            --accent-secondary-rgb: 192, 132, 252;
            --brand-gradient: var(--gradient-secondary);
            --focus-ring: rgba(var(--accent-primary-rgb), 0.55);
            --page-tint-alpha: 0.08;

            --background-color: #1e1e1e;
            --text-color: #ffffff;
            --text-secondary: #b0b0b0;
            --text-tertiary: rgba(255, 255, 255, 0.65);
            --border-color: #404040;
            --surface-2: #3a3a3a;
            --surface-3: #4a4a4a;
            --container-background: rgba(30, 30, 30, 0.92);
            --shadow-color: rgba(0, 0, 0, 0.35);
            --log-background: #0b1220;
            --log-text: #e5e7eb;
        }

        .text-gradient {
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
        }

        @media (forced-colors: active) {
            .text-gradient {
                background: none;
                color: ButtonText;
                -webkit-text-fill-color: ButtonText;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--background-color);
            background-image: linear-gradient(135deg,
                    rgba(var(--accent-primary-rgb), var(--page-tint-alpha)) 0%,
                    rgba(var(--accent-secondary-rgb), var(--page-tint-alpha)) 100%);
            color: var(--text-color);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--container-background);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 20px 40px var(--shadow-color);
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: var(--text-color);
            margin-bottom: 0.5rem;
        }

        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .test-card {
            background: var(--surface-2);
            border-radius: 12px;
            padding: 1.5rem;
            border-left: 4px solid var(--border-color);
        }

        .test-card.testing {
            border-left-color: rgb(var(--warning-rgb));
        }

        .test-card.passed {
            border-left-color: rgb(var(--success-rgb));
        }

        .test-card.failed {
            border-left-color: rgb(var(--danger-rgb));
        }

        .test-title {
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 0.5rem;
        }

        .test-status {
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .test-status.testing {
            color: rgb(var(--warning-rgb));
        }

        .test-status.passed {
            color: rgb(var(--success-rgb));
        }

        .test-status.failed {
            color: rgb(var(--danger-rgb));
        }

        .test-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .test-button {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .test-button.primary {
            background: var(--brand-gradient);
            color: white;
        }

        .test-button.primary:hover {
            filter: brightness(0.97);
            transform: translateY(-1px);
        }

        .test-button.primary:focus-visible {
            outline: none;
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        .test-button.secondary {
            background: var(--surface-2);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .test-button.secondary:hover {
            background: var(--surface-3);
        }

        .test-button:focus-visible {
            outline: none;
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        .test-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .control-button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-button.primary {
            background: var(--brand-gradient);
            color: white;
        }

        .control-button.primary:hover {
            filter: brightness(0.97);
            transform: translateY(-1px);
        }

        .control-button.primary:focus-visible {
            outline: none;
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        .control-button:focus-visible {
            outline: none;
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        .control-button.danger {
            background: rgb(var(--danger-rgb));
            color: white;
        }

        .control-button.danger:hover {
            filter: brightness(0.92);
        }

        .log-section {
            background: var(--log-background);
            color: var(--log-text);
            border-radius: 8px;
            padding: 1rem;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.9rem;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .log-entry {
            margin-bottom: 0.5rem;
            padding: 0.25rem 0;
        }

        .log-entry.info {
            color: rgb(var(--success-rgb));
        }

        .log-entry.warning {
            color: rgb(var(--warning-rgb));
        }

        .log-entry.error {
            color: rgb(var(--danger-rgb));
        }

        .timestamp {
            color: var(--text-tertiary);
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🧪 <span class="text-gradient">Gestura</span> UI Testing Dashboard</h1>
            <p>Automated testing and validation for Tauri UI components</p>
        </div>

        <div class="controls">
            <button class="control-button primary" onclick="runAllTests()">Run All Tests</button>
            <button class="control-button primary" onclick="validateAllWindows()">Validate All</button>
            <button class="control-button danger" onclick="closeAllTestWindows()">Close All Windows</button>
            <button class="control-button secondary" onclick="clearLogs()">Clear Logs</button>
        </div>

        <div class="test-grid" id="testGrid">
            <!-- Test cards will be populated by JavaScript -->
        </div>

        <div class="log-section">
            <h3 style="margin-bottom: 1rem;">Test Logs</h3>
            <div id="logContainer">
                <div class="log-entry info">
                    <span class="timestamp">[Ready]</span> UI Testing Dashboard initialized
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { invoke } from '@tauri-apps/api/core';

        const testGrid = document.getElementById('testGrid');
        const logContainer = document.getElementById('logContainer');

        const testCases = [
            {
                id: 'permissions',
                title: 'Permissions Window',
                description: 'Test permissions management interface',
                windowType: 'permissions'
            },
            {
                id: 'config',
                title: 'Configuration Window',
                description: 'Test configuration interface',
                windowType: 'config'
            },
            {
                id: 'chat',
                title: 'Chat Interface',
                description: 'Test agent chat interface',
                windowType: 'chat'
            },
            {
                id: 'status',
                title: 'System Status',
                description: 'Test system monitoring interface',
                windowType: 'status'
            },
            {
                id: 'about',
                title: 'About Dialog',
                description: 'Test about information dialog',
                windowType: 'about'
            }
        ];

        function addLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            logEntry.innerHTML = `<span class="timestamp">[${timestamp}]</span> ${message}`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function updateTestStatus(testId, status, message = '') {
            const card = document.querySelector(`[data-test-id="${testId}"]`);
            if (card) {
                card.className = `test-card ${status}`;
                const statusElement = card.querySelector('.test-status');
                statusElement.className = `test-status ${status}`;
                statusElement.textContent = message || status.toUpperCase();
            }
        }

        function createTestCard(testCase) {
            const card = document.createElement('div');
            card.className = 'test-card';
            card.setAttribute('data-test-id', testCase.id);

            card.innerHTML = `
                <div class="test-title">${testCase.title}</div>
                <div class="test-status">Ready</div>
	                <div style="color: var(--text-tertiary); font-size: 0.9rem; margin-bottom: 1rem;">${testCase.description}</div>
                <div class="test-actions">
                    <button class="test-button primary" onclick="testWindow('${testCase.windowType}', '${testCase.id}')">
                        Open Window
                    </button>
                    <button class="test-button secondary" onclick="validateWindow('${testCase.windowType}', '${testCase.id}')">
                        Validate
                    </button>
                    <button class="test-button secondary" onclick="captureScreenshot('${testCase.windowType}', '${testCase.id}')">
                        Screenshot
                    </button>
                </div>
            `;

            return card;
        }

        async function testWindow(windowType, testId) {
            updateTestStatus(testId, 'testing', 'Opening window...');
            addLog(`Testing ${windowType} window`, 'info');

            try {
                const result = await invoke('test_open_window', { windowType });
                updateTestStatus(testId, 'passed', 'Window opened successfully');
                addLog(`✅ ${result}`, 'info');
            } catch (error) {
                updateTestStatus(testId, 'failed', `Failed: ${error}`);
                addLog(`❌ Failed to open ${windowType}: ${error}`, 'error');
            }
        }

        async function validateWindow(windowType, testId) {
            updateTestStatus(testId, 'testing', 'Validating content...');
            addLog(`Validating ${windowType} window content`, 'info');

            try {
                const result = await invoke('validate_window_content', { windowLabel: windowType });
                updateTestStatus(testId, 'passed', 'Content validated');
                addLog(`✅ ${windowType} validation: ${JSON.stringify(result)}`, 'info');
            } catch (error) {
                updateTestStatus(testId, 'failed', `Validation failed: ${error}`);
                addLog(`❌ Validation failed for ${windowType}: ${error}`, 'error');
            }
        }

        async function captureScreenshot(windowType, testId) {
            updateTestStatus(testId, 'testing', 'Capturing screenshot...');
            addLog(`Capturing screenshot of ${windowType} window`, 'info');

            try {
                const result = await invoke('capture_window_screenshot', { windowLabel: windowType });
                updateTestStatus(testId, 'passed', 'Screenshot captured');
                addLog(`📸 ${result}`, 'info');
            } catch (error) {
                updateTestStatus(testId, 'failed', `Screenshot failed: ${error}`);
                addLog(`❌ Screenshot failed for ${windowType}: ${error}`, 'error');
            }
        }

        window.testWindow = testWindow;
        window.validateWindow = validateWindow;
        window.captureScreenshot = captureScreenshot;

        window.runAllTests = async function () {
            addLog('🚀 Running all UI tests...', 'info');

            for (const testCase of testCases) {
                await testWindow(testCase.windowType, testCase.id);
                await new Promise(resolve => setTimeout(resolve, 1000)); // Wait between tests
            }

            addLog('✅ All tests completed', 'info');
        };

        window.validateAllWindows = async function () {
            addLog('🔍 Validating all windows...', 'info');

            for (const testCase of testCases) {
                await validateWindow(testCase.windowType, testCase.id);
                await new Promise(resolve => setTimeout(resolve, 500));
            }

            addLog('✅ All validations completed', 'info');
        };

        window.closeAllTestWindows = async function () {
            addLog('🗑️ Closing all test windows...', 'info');

            try {
                const result = await invoke('close_test_windows');
                addLog(`✅ ${result}`, 'info');

                // Reset all test statuses
                testCases.forEach(testCase => {
                    updateTestStatus(testCase.id, '', 'Ready');
                });
            } catch (error) {
                addLog(`❌ Failed to close windows: ${error}`, 'error');
            }
        };

        window.clearLogs = function () {
            logContainer.innerHTML = '<div class="log-entry info"><span class="timestamp">[Cleared]</span> Logs cleared</div>';
        };

        // Initialize test cards
        testCases.forEach(testCase => {
            const card = createTestCard(testCase);
            testGrid.appendChild(card);
        });

        addLog('🎯 UI Testing Dashboard ready', 'info');
    </script>
</body>

</html>
