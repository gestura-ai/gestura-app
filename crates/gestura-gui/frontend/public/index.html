<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestura</title>
  <style>
    :root {
      /* Light theme variables */
      --bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-contrast: #ffffff;
      --border: #e2e8f0;
      --surface: #f8fafc;
    }

    /* Auto mode: respect system preference */
    @media (prefers-color-scheme: dark) {
      :root {
        /* Dark theme variables */
        --bg: #0f172a;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --accent: #60a5fa;
        --accent-contrast: #1e293b;
        --border: #334155;
        --surface: #1e293b;
      }
    }

    /* Force light mode (overrides system preference) */
    html[data-theme="light"] {
      --bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-contrast: #ffffff;
      --border: #e2e8f0;
      --surface: #f8fafc;
    }

    /* Force dark mode (overrides system preference) */
    html[data-theme="dark"] {
      --bg: #0f172a;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #60a5fa;
      --accent-contrast: #1e293b;
      --border: #334155;
      --surface: #1e293b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: 250px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 1rem;
      overflow-y: auto;
    }

    .content {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
    }

    .btn {
      background: var(--accent);
      color: var(--accent-contrast);
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.25rem;
      font-weight: 500;
      font-size: 0.875rem;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      color: var(--text);
      font-size: 0.875rem;
    }

    .status-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 0.5rem;
    }

    .status-connected { background: #10b981; }
    .status-disconnected { background: #ef4444; }
    .status-unknown { background: var(--muted); }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .panel h3 {
      margin-bottom: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    // Theme initialization
    async function initTheme() {
      if (!window.__TAURI__) return;
      try {
        const config = await window.__TAURI__.core.invoke('get_config');
        const themeMode = config?.ui?.theme_mode || 'system';
        applyTheme(themeMode);

        if (themeMode === 'system') {
          const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
          mediaQuery.addEventListener('change', () => applyTheme('system'));
        }
      } catch (e) {
        console.error('[Theme] Failed to initialize:', e);
        applyTheme('system');
      }
    }

    function applyTheme(mode) {
      const html = document.documentElement;
      if (mode === 'light') {
        html.setAttribute('data-theme', 'light');
      } else if (mode === 'dark') {
        html.setAttribute('data-theme', 'dark');
      } else {
        html.removeAttribute('data-theme');
      }
    }

    if (window.__TAURI__) {
      initTheme();
    }
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
