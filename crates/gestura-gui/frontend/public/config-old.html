<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestura Configuration</title>
    <link rel="stylesheet" href="icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Gestura brand tokens (unified with gestura.app) */
            --accent-primary: rgb(37, 99, 235);
            --accent-primary-rgb: 37, 99, 235;
            --accent-secondary: rgb(147, 51, 234);
            --accent-secondary-rgb: 147, 51, 234;
            --gradient-primary: linear-gradient(to right, rgb(37, 99, 235), rgb(147, 51, 234));
            --gradient-secondary: linear-gradient(to right, rgb(96, 165, 250), rgb(192, 132, 252));
            --brand-gradient: var(--gradient-primary);
            --focus-ring: rgba(var(--accent-primary-rgb), 0.35);

            /* Theme tokens (light) */
            --background-color: #ffffff;
            --text-color: #000000;
            --text-secondary: #666666;
            --border-color: #e0e0e0;
            --surface-color: #f8f9fa;
            --surface-2: #F2F2F7;
            --surface-3: #E5E5EA;
            --input-background: #ffffff;
            --container-background: rgba(255, 255, 255, 0.95);
            --shadow-color: rgba(0, 0, 0, 0.10);

            /* Semantic RGB triples for rgba(..., alpha) */
            --success-rgb: 52, 199, 89;
            --warning-rgb: 255, 149, 0;
            --danger-rgb: 255, 59, 48;
        }

        html {
            color-scheme: light dark;
        }

        /* Auto mode: respect system preference */
        @media (prefers-color-scheme: dark) {
            :root {
                --accent-primary: rgb(96, 165, 250);
                --accent-primary-rgb: 96, 165, 250;
                --accent-secondary: rgb(192, 132, 252);
                --accent-secondary-rgb: 192, 132, 252;
                --brand-gradient: var(--gradient-secondary);
                --focus-ring: rgba(var(--accent-primary-rgb), 0.55);

                --background-color: #1e1e1e;
                --text-color: #ffffff;
                --text-secondary: #b0b0b0;
                --border-color: #404040;
                --surface-color: #2d2d2d;
                --surface-2: #3a3a3a;
                --surface-3: #4a4a4a;
                --input-background: #3d3d3d;
                --container-background: rgba(30, 30, 30, 0.92);
                --shadow-color: rgba(0, 0, 0, 0.35);
            }
        }

        /* Force light mode (overrides system preference) */
        html[data-theme="light"] {
            --accent-primary: rgb(37, 99, 235);
            --accent-primary-rgb: 37, 99, 235;
            --accent-secondary: rgb(147, 51, 234);
            --accent-secondary-rgb: 147, 51, 234;
            --brand-gradient: var(--gradient-primary);
            --focus-ring: rgba(var(--accent-primary-rgb), 0.35);

            --background-color: #ffffff;
            --text-color: #000000;
            --text-secondary: #666666;
            --border-color: #e0e0e0;
            --surface-color: #f8f9fa;
            --surface-2: #F2F2F7;
            --surface-3: #E5E5EA;
            --input-background: #ffffff;
            --container-background: rgba(255, 255, 255, 0.95);
            --shadow-color: rgba(0, 0, 0, 0.10);
        }

        /* Force dark mode (overrides system preference) */
        html[data-theme="dark"] {
            --accent-primary: rgb(96, 165, 250);
            --accent-primary-rgb: 96, 165, 250;
            --accent-secondary: rgb(192, 132, 252);
            --accent-secondary-rgb: 192, 132, 252;
            --brand-gradient: var(--gradient-secondary);
            --focus-ring: rgba(var(--accent-primary-rgb), 0.55);

            --background-color: #1e1e1e;
            --text-color: #ffffff;
            --text-secondary: #b0b0b0;
            --border-color: #404040;
            --surface-color: #2d2d2d;
            --surface-2: #3a3a3a;
            --surface-3: #4a4a4a;
            --input-background: #3d3d3d;
            --container-background: rgba(30, 30, 30, 0.92);
            --shadow-color: rgba(0, 0, 0, 0.35);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--background-color);
            background-image: linear-gradient(135deg,
                    rgba(var(--accent-primary-rgb), 0.10) 0%,
                    rgba(var(--accent-secondary-rgb), 0.10) 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
        }

        .config-container {
            display: flex;
            width: 100%;
            max-width: 1400px;
            margin: 2rem auto;
            background: var(--container-background);
            border-radius: 16px;
            box-shadow: 0 20px 40px var(--shadow-color);
            overflow: hidden;
        }

        /* Table of Contents Navigation */
        .toc-nav {
            width: 280px;
            background: var(--surface-color);
            border-right: 1px solid var(--border-color);
            padding: 2rem 0;
        }

        .toc-header {
            padding: 0 2rem 1rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 1rem;
        }

        .toc-header h2 {
            color: var(--text-color);
            font-size: 1.2rem;
            font-weight: 600;
        }

        .toc-list {
            list-style: none;
        }

        .toc-item {
            margin-bottom: 0.5rem;
        }

        .toc-link {
            display: block;
            padding: 0.75rem 2rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .toc-link:hover {
            background: rgba(var(--accent-primary-rgb), 0.10);
            color: var(--accent-primary);
            border-left-color: var(--accent-primary);
        }

        .toc-link.active {
            background: rgba(var(--accent-primary-rgb), 0.15);
            color: var(--accent-primary);
            border-left-color: var(--accent-primary);
            font-weight: 500;
        }

        .toc-icon {
            margin-right: 0.5rem;
        }

        /* Main Content Area */
        .config-content {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
            max-height: calc(100vh - 4rem);
        }

        .content-header {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .content-header h1 {
            color: var(--text-color);
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .content-header p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* Configuration Sections */
        .config-section {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .config-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
        }

        .section-title .icon {
            margin-right: 0.75rem;
            font-size: 1.2em;
        }

        .subsection {
            background: var(--surface-color);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-color);
        }

        .subsection-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-color);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
        }

        .subsection-title .icon {
            margin-right: 0.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            font-weight: 500;
            color: var(--text-color);
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            background: var(--input-background);
            color: var(--text-color);
            transition: border-color 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 4px rgba(var(--accent-primary-rgb), 0.18);
        }

        .form-select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            background: var(--input-background);
            color: var(--text-color);
            cursor: pointer;
        }

        .form-checkbox {
            margin-right: 0.5rem;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
        }

        .button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .button.primary {
            background: var(--brand-gradient);
            color: white;
        }

        .button.primary:hover {
            filter: brightness(0.97);
            transform: translateY(-1px);
        }

        .button.primary:focus-visible {
            outline: none;
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        .button.secondary {
            background: var(--surface-2);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .button.secondary:hover {
            background: var(--surface-3);
        }

        .status {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        .status.success {
            background: rgba(var(--success-rgb), 0.14);
            border: 1px solid rgba(var(--success-rgb), 0.28);
            color: rgb(var(--success-rgb));
        }

        .status.error {
            background: rgba(var(--danger-rgb), 0.14);
            border: 1px solid rgba(var(--danger-rgb), 0.28);
            color: rgb(var(--danger-rgb));
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1><span class="icon-settings"></span> Gestura Configuration</h1>
            <p>Configure your voice and gesture control settings</p>
        </div>

        <div class="status" id="statusMessage"></div>

        <form id="configForm">
            <div class="section">
                <div class="section-title"><span class="icon-microphone"></span> Voice Settings</div>

                <div class="form-group">
                    <label class="form-label" for="voiceEngine">Voice Engine</label>
                    <select class="form-select" id="voiceEngine" name="voice_engine">
                        <option value="whisper">OpenAI Whisper</option>
                        <option value="faster-whisper">Faster Whisper</option>
                        <option value="cloud">Cloud STT</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="hotkey">Global Hotkey</label>
                    <input type="text" class="form-input" id="hotkey" name="hotkey_listen"
                        placeholder="e.g., Cmd+Shift+G">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" class="form-checkbox" id="voiceActivation" name="voice_activation">
                    <label for="voiceActivation">Enable voice activation</label>
                </div>
            </div>

            <div class="section">
                <div class="section-title"><span class="icon-link"></span> Integration Settings</div>

                <div class="form-group">
                    <label class="form-label" for="natsUrl">NATS Server URL</label>
                    <input type="text" class="form-input" id="natsUrl" name="nats_url"
                        placeholder="nats://127.0.0.1:4222">
                </div>

                <div class="form-group">
                    <label class="form-label" for="mcpPort">MCP Server Port</label>
                    <input type="number" class="form-input" id="mcpPort" name="mcp_port" placeholder="8080">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" class="form-checkbox" id="autoConnect" name="auto_connect">
                    <label for="autoConnect">Auto-connect to services</label>
                </div>
            </div>

            <div class="section">
                <div class="section-title"><span class="icon-shield"></span> Security & Privacy</div>

                <div class="checkbox-group">
                    <input type="checkbox" class="form-checkbox" id="dataCollection" name="data_collection">
                    <label for="dataCollection">Allow usage analytics</label>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" class="form-checkbox" id="cloudSync" name="cloud_sync">
                    <label for="cloudSync">Enable cloud synchronization</label>
                </div>

                <div class="form-group">
                    <label class="form-label" for="gracePeriod">Shutdown Grace Period (seconds)</label>
                    <input type="number" class="form-input" id="gracePeriod" name="grace_period_secs" min="1" max="60"
                        value="5">
                </div>
            </div>
        </form>

        <div class="actions">
            <button type="button" class="button secondary" onclick="loadConfig()">Reset</button>
            <button type="button" class="button primary" onclick="saveConfig()">Save Configuration</button>
        </div>
    </div>

    <script type="module">
        import { invoke } from '@tauri-apps/api/core';

        const statusMessage = document.getElementById('statusMessage');
        const configForm = document.getElementById('configForm');

        function showStatus(message, type = 'success') {
            statusMessage.textContent = message;
            statusMessage.className = `status ${type}`;
            statusMessage.style.display = 'block';

            setTimeout(() => {
                statusMessage.style.display = 'none';
            }, 3000);
        }

        async function loadConfig() {
            try {
                const config = await invoke('get_config');

                // Populate form fields
                document.getElementById('voiceEngine').value = config.voice?.engine || 'whisper';
                document.getElementById('hotkey').value = config.hotkey_listen || '';
                document.getElementById('natsUrl').value = config.nats_url || '';
                document.getElementById('mcpPort').value = config.mcp_port || 8080;
                document.getElementById('gracePeriod').value = config.grace_period_secs || 5;

                // Populate checkboxes
                document.getElementById('voiceActivation').checked = config.voice?.activation || false;
                document.getElementById('autoConnect').checked = config.auto_connect || false;
                document.getElementById('dataCollection').checked = config.data_collection || false;
                document.getElementById('cloudSync').checked = config.cloud_sync || false;

                showStatus('Configuration loaded successfully');
            } catch (error) {
                console.error('Failed to load config:', error);
                showStatus(`Failed to load configuration: ${error}`, 'error');
            }
        }

        window.saveConfig = async function () {
            try {
                const formData = new FormData(configForm);
                const config = {};

                // Convert form data to config object
                for (const [key, value] of formData.entries()) {
                    if (key.includes('.')) {
                        // Handle nested properties like voice.engine
                        const parts = key.split('.');
                        if (!config[parts[0]]) config[parts[0]] = {};
                        config[parts[0]][parts[1]] = value;
                    } else {
                        config[key] = value;
                    }
                }

                // Handle checkboxes (they won't be in FormData if unchecked)
                config.voice_activation = document.getElementById('voiceActivation').checked;
                config.auto_connect = document.getElementById('autoConnect').checked;
                config.data_collection = document.getElementById('dataCollection').checked;
                config.cloud_sync = document.getElementById('cloudSync').checked;

                // Convert numeric fields
                config.mcp_port = parseInt(config.mcp_port) || 8080;
                config.grace_period_secs = parseInt(config.grace_period_secs) || 5;

                await invoke('save_config', { cfg: config });
                showStatus('Configuration saved successfully');
            } catch (error) {
                console.error('Failed to save config:', error);
                showStatus(`Failed to save configuration: ${error}`, 'error');
            }
        };

        window.loadConfig = loadConfig;

        // Load config on page load
        loadConfig();
    </script>
</body>

</html>
