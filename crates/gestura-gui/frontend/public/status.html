<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestura System Status</title>
    <link rel="stylesheet" href="icons.css">
    <style>
        :root {
            /* Light theme variables */
            --bg-gradient-start: #667eea;
            --bg-gradient-end: #764ba2;
            --container-bg: rgba(255, 255, 255, 0.95);
            --text-primary: #1D1D1F;
            --text-secondary: #8E8E93;
            --surface-bg: #F2F2F7;
            --surface-border: #E5E5EA;
        }

        /* Auto mode: respect system preference */
        @media (prefers-color-scheme: dark) {
            :root {
                /* Dark theme variables */
                --bg-gradient-start: #1a1a2e;
                --bg-gradient-end: #16213e;
                --container-bg: rgba(30, 30, 30, 0.95);
                --text-primary: #f5f5f7;
                --text-secondary: #b0b0b0;
                --surface-bg: #2d2d2d;
                --surface-border: #404040;
            }
        }

        /* Force light mode (overrides system preference) */
        html[data-theme="light"] {
            --bg-gradient-start: #667eea;
            --bg-gradient-end: #764ba2;
            --container-bg: rgba(255, 255, 255, 0.95);
            --text-primary: #1D1D1F;
            --text-secondary: #8E8E93;
            --surface-bg: #F2F2F7;
            --surface-border: #E5E5EA;
        }

        /* Force dark mode (overrides system preference) */
        html[data-theme="dark"] {
            --bg-gradient-start: #1a1a2e;
            --bg-gradient-end: #16213e;
            --container-bg: rgba(30, 30, 30, 0.95);
            --text-primary: #f5f5f7;
            --text-secondary: #b0b0b0;
            --surface-bg: #2d2d2d;
            --surface-border: #404040;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: var(--container-bg);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .status-card {
            background: var(--surface-bg);
            border-radius: 12px;
            padding: 1.5rem;
            border-left: 4px solid var(--surface-border);
        }

        .status-card.healthy {
            border-left-color: #34C759;
        }

        .status-card.warning {
            border-left-color: #FF9500;
        }

        .status-card.error {
            border-left-color: #FF3B30;
        }

        .status-title {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .status-value {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 0.25rem;
        }

        .status-value.healthy {
            color: #34C759;
        }

        .status-value.warning {
            color: #FF9500;
        }

        .status-value.error {
            color: #FF3B30;
        }

        .status-description {
            color: #8E8E93;
            font-size: 0.9rem;
        }

        .refresh-button {
            display: block;
            margin: 0 auto;
            padding: 0.75rem 1.5rem;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .refresh-button:hover {
            background: #0056CC;
        }

	        /* Diagnostics panel */
	        .diag-controls {
	            display: flex;
	            gap: 0.5rem;
	            flex-wrap: wrap;
	            margin-top: 0.75rem;
	        }

	        .diag-button {
	            padding: 0.5rem 0.75rem;
	            border-radius: 10px;
	            border: 1px solid var(--surface-border);
	            background: transparent;
	            color: var(--text-primary);
	            cursor: pointer;
	        }

	        .diag-pre {
	            margin-top: 0.75rem;
	            background: rgba(0, 0, 0, 0.05);
	            border: 1px solid var(--surface-border);
	            border-radius: 12px;
	            padding: 0.75rem;
	            white-space: pre-wrap;
	            word-break: break-word;
	            max-height: 260px;
	            overflow: auto;
	            color: var(--text-primary);
	            font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
	        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1><span class="icon-chart"></span> System Status</h1>
            <p>Real-time monitoring of Gestura components</p>
        </div>

        <div class="status-grid" id="statusGrid">
            <!-- Status cards will be populated by JavaScript -->
        </div>

        <button class="refresh-button" onclick="loadStatus()">Refresh Status</button>

	        <div class="status-card" style="margin-top: 1.25rem;">
	            <div class="status-title">Chat Diagnostics</div>
	            <div class="status-description">
	                Debug cross-window chat leakage by inspecting: window list, backend emit trace, and backend receipt trace.
	            </div>
	            <div class="diag-controls">
	                <button class="diag-button" id="chatDiagFetch">Fetch</button>
		                <button class="diag-button" id="chatDiagProbe">Run probe</button>
	                <button class="diag-button" id="chatDiagClear">Clear traces</button>
	            </div>
	            <pre class="diag-pre" id="chatDiagOut">(click Fetch)</pre>
	        </div>
    </div>

    <script type="module">
        import { invoke } from '@tauri-apps/api/core';

        // =====================================================================
        // Theme Management
        // =====================================================================
        async function initTheme() {
            try {
                const config = await invoke('get_config');
                const themeMode = config?.ui?.theme_mode || 'system';
                applyTheme(themeMode);

                if (themeMode === 'system') {
                    const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                    mediaQuery.addEventListener('change', () => applyTheme('system'));
                }
            } catch (e) {
                console.error('[Theme] Failed to initialize:', e);
                applyTheme('system');
            }
        }

        function applyTheme(mode) {
            const html = document.documentElement;
            if (mode === 'light') {
                html.setAttribute('data-theme', 'light');
            } else if (mode === 'dark') {
                html.setAttribute('data-theme', 'dark');
            } else {
                html.removeAttribute('data-theme');
            }
        }

        initTheme();

        // =====================================================================
        // Status Logic
        // =====================================================================
        const statusGrid = document.getElementById('statusGrid');

        const statusItems = [
            { id: 'voice', title: 'Voice Engine', description: 'Speech recognition status' },
            { id: 'nats', title: 'NATS Connection', description: 'Message bus connectivity' },
            { id: 'agents', title: 'Active Agents', description: 'Running agent instances' },
            { id: 'bluetooth', title: 'Bluetooth', description: 'Device connectivity' },
            { id: 'permissions', title: 'Permissions', description: 'System access status' },
            { id: 'memory', title: 'Memory Usage', description: 'Application memory consumption' }
        ];

        function createStatusCard(item, status) {
            const card = document.createElement('div');
            card.className = `status-card ${status.level}`;

            card.innerHTML = `
                <div class="status-title">${item.title}</div>
                <div class="status-value ${status.level}">${status.value}</div>
                <div class="status-description">${status.description || item.description}</div>
            `;

            return card;
        }

        async function loadStatus() {
            statusGrid.innerHTML = '';

            const [health, agents, natsConnected, permissions, isRecording, rings] = await Promise.all([
                invoke('get_system_health').catch(() => null),
                invoke('list_agents').catch(() => null),
                invoke('get_nats_status').catch(() => false),
                invoke('check_system_permissions').catch(() => null),
                invoke('get_speech_status').catch(() => false),
                invoke('scan_for_rings').catch(() => [])
            ]);

            // Determine ring connection (best-effort)
            let ringConnected = false;
            if (Array.isArray(rings) && rings.length > 0) {
                const statuses = await Promise.all(
                    rings.map((deviceId) => invoke('get_ring_status', { device_id: deviceId }).catch(() => null))
                );
                ringConnected = statuses.some((s) => s && s.is_connected === true);
            }

            const agentCount = agents && typeof agents.count === 'number' ? agents.count : 0;
            const missingRequired = permissions?.summary?.missing_required ?? permissions?.missing_required_count;
            const missingRequiredCount = typeof missingRequired === 'number' ? missingRequired : 0;

            const memUsage = health && typeof health.memory_usage === 'number' ? health.memory_usage : null;
            const memLevel = memUsage === null ? 'warning' : memUsage > 95 ? 'error' : memUsage > 80 ? 'warning' : 'healthy';

            const computed = {
                voice: {
                    value: isRecording ? 'Listening' : 'Idle',
                    level: 'healthy',
                    description: isRecording ? 'Speech capture is active' : 'Speech capture is idle'
                },
                nats: {
                    value: natsConnected ? 'Connected' : 'Disconnected',
                    level: natsConnected ? 'healthy' : 'warning',
                    description: natsConnected ? 'Message bus connected' : 'Using in-memory fallback'
                },
                agents: {
                    value: `${agentCount} Active`,
                    level: agentCount > 0 ? 'healthy' : 'warning',
                    description: 'Running agent instances'
                },
                bluetooth: {
                    value: ringConnected ? 'Connected' : (Array.isArray(rings) && rings.length > 0 ? 'Detected' : 'Not Detected'),
                    level: ringConnected ? 'healthy' : 'warning',
                    description: ringConnected ? 'Ring connection is active' : 'No active ring connection'
                },
                permissions: {
                    value: missingRequiredCount === 0 ? 'OK' : 'Missing',
                    level: missingRequiredCount === 0 ? 'healthy' : 'warning',
                    description: missingRequiredCount === 0 ? 'Required permissions granted' : `${missingRequiredCount} required permission(s) missing`
                },
                memory: {
                    value: memUsage === null ? 'Unknown' : `${memUsage.toFixed(1)}%`,
                    level: memLevel,
                    description: memUsage === null ? 'Unable to read memory usage' : 'System memory usage'
                }
            };

            for (const item of statusItems) {
                const status = computed[item.id] || {
                    value: 'Unknown',
                    level: 'warning',
                    description: item.description
                };
                const card = createStatusCard(item, status);
                statusGrid.appendChild(card);
            }
        }

        // Load status on page load
        loadStatus();

	        /**
	         * Fetch chat-related diagnostics (window list + backend traces).
	         *
	         * This is best-effort and intended for debugging multi-window session isolation.
	         */
	        async function fetchChatDiagnostics() {
	            const out = document.getElementById('chatDiagOut');
	            if (!out) return;
	            try {
	                const [windows, emitTrace, receiptTrace] = await Promise.all([
	                    invoke('get_window_list').catch(() => null),
	                    invoke('get_chat_event_trace', { max: 250 }).catch(() => null),
	                    invoke('get_chat_receipt_trace', { max: 250 }).catch(() => null),
	                ]);
	
	                out.textContent = JSON.stringify(
	                    {
	                        ts: new Date().toISOString(),
	                        windows,
	                        emitTrace,
	                        receiptTrace,
	                    },
	                    null,
	                    2
	                );
	            } catch (e) {
	                out.textContent = `fetchChatDiagnostics failed: ${e}`;
	            }
	        }

	        /**
	         * Clear backend chat traces (emit trace + receipt trace).
	         */
	        async function clearChatDiagnostics() {
	            const out = document.getElementById('chatDiagOut');
	            if (!out) return;
	            try {
	                await Promise.all([
	                    invoke('clear_chat_event_trace').catch(() => null),
	                    invoke('clear_chat_receipt_trace').catch(() => null),
	                ]);
	                out.textContent = '[cleared]';
	            } catch (e) {
	                out.textContent = `clearChatDiagnostics failed: ${e}`;
	            }
	        }

		        /**
		         * Run the backend multi-window chat isolation probe.
		         *
		         * This emits a `chat-probe` event to two open chat windows and returns
		         * a correlated trace + analysis (no external LLM calls).
		         */
		        async function runChatIsolationProbe() {
		            const out = document.getElementById('chatDiagOut');
		            if (!out) return;
		            out.textContent = '[running probe...]';
		            try {
		                const report = await invoke('run_chat_isolation_probe', {}).catch((e) => {
		                    throw new Error(String(e));
		                });
		                out.textContent = JSON.stringify(
		                    {
		                        ts: new Date().toISOString(),
		                        probe: report,
		                    },
		                    null,
		                    2
		                );
		            } catch (e) {
		                out.textContent = `runChatIsolationProbe failed: ${e}`;
		            }
		        }

	        // Wire diagnostics buttons
		        document.getElementById('chatDiagFetch')?.addEventListener('click', fetchChatDiagnostics);
		        document.getElementById('chatDiagProbe')?.addEventListener('click', runChatIsolationProbe);
		        document.getElementById('chatDiagClear')?.addEventListener('click', clearChatDiagnostics);

        // Auto-refresh every 30 seconds
        setInterval(loadStatus, 30000);
    </script>
</body>

</html>
