<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestura Permissions</title>
    <link rel="stylesheet" href="icons.css">
    <style>
        :root {
            /* Gestura brand tokens (unified with gestura.app) */
            --accent-primary: rgb(37, 99, 235);
            --accent-primary-rgb: 37, 99, 235;
            --accent-secondary: rgb(147, 51, 234);
            --accent-secondary-rgb: 147, 51, 234;
            --gradient-primary: linear-gradient(to right, rgb(37, 99, 235), rgb(147, 51, 234));
            --gradient-secondary: linear-gradient(to right, rgb(96, 165, 250), rgb(192, 132, 252));
            --brand-gradient: var(--gradient-primary);

            /* Semantic tokens (RGB triples for rgba(..., alpha)) */
            --success-rgb: 52, 199, 89;
            --warning-rgb: 255, 149, 0;
            --danger-rgb: 255, 59, 48;

            /* Light theme variables */
            --bg-gradient-start: rgba(var(--accent-primary-rgb), 0.10);
            --bg-gradient-end: rgba(var(--accent-secondary-rgb), 0.10);
            --container-bg: rgba(255, 255, 255, 0.95);
            --text-primary: #1D1D1F;
            --text-secondary: #8E8E93;
            --surface-bg: #F2F2F7;
            --surface-border: #E5E5EA;
            --focus-ring: rgba(var(--accent-primary-rgb), 0.35);
        }

        /* Auto mode: respect system preference */
        @media (prefers-color-scheme: dark) {
            :root {
                /* Dark theme variables */
                --accent-primary: rgb(96, 165, 250);
                --accent-primary-rgb: 96, 165, 250;
                --accent-secondary: rgb(192, 132, 252);
                --accent-secondary-rgb: 192, 132, 252;
                --brand-gradient: var(--gradient-secondary);
                --bg-gradient-start: rgba(var(--accent-primary-rgb), 0.14);
                --bg-gradient-end: rgba(var(--accent-secondary-rgb), 0.14);
                --container-bg: rgba(15, 23, 42, 0.92);
                --text-primary: #f5f5f7;
                --text-secondary: #94a3b8;
                --surface-bg: rgba(255, 255, 255, 0.06);
                --surface-border: rgba(255, 255, 255, 0.12);
                --focus-ring: rgba(var(--accent-primary-rgb), 0.55);
            }
        }

        /* Force light mode (overrides system preference) */
        html[data-theme="light"] {
            --accent-primary: rgb(37, 99, 235);
            --accent-primary-rgb: 37, 99, 235;
            --accent-secondary: rgb(147, 51, 234);
            --accent-secondary-rgb: 147, 51, 234;
            --brand-gradient: var(--gradient-primary);
            --bg-gradient-start: rgba(var(--accent-primary-rgb), 0.10);
            --bg-gradient-end: rgba(var(--accent-secondary-rgb), 0.10);
            --container-bg: rgba(255, 255, 255, 0.95);
            --text-primary: #1D1D1F;
            --text-secondary: #8E8E93;
            --surface-bg: #F2F2F7;
            --surface-border: #E5E5EA;
            --focus-ring: rgba(var(--accent-primary-rgb), 0.35);
        }

        /* Force dark mode (overrides system preference) */
        html[data-theme="dark"] {
            --accent-primary: rgb(96, 165, 250);
            --accent-primary-rgb: 96, 165, 250;
            --accent-secondary: rgb(192, 132, 252);
            --accent-secondary-rgb: 192, 132, 252;
            --brand-gradient: var(--gradient-secondary);
            --bg-gradient-start: rgba(var(--accent-primary-rgb), 0.14);
            --bg-gradient-end: rgba(var(--accent-secondary-rgb), 0.14);
            --container-bg: rgba(15, 23, 42, 0.92);
            --text-primary: #f5f5f7;
            --text-secondary: #94a3b8;
            --surface-bg: rgba(255, 255, 255, 0.06);
            --surface-border: rgba(255, 255, 255, 0.12);
            --focus-ring: rgba(var(--accent-primary-rgb), 0.55);
        }

        .text-gradient {
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
        }

        @media (forced-colors: active) {
            .text-gradient {
                background: none;
                color: ButtonText;
                -webkit-text-fill-color: ButtonText;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--container-bg);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .permission-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem;
            margin-bottom: 1rem;
            background: var(--surface-bg);
            border-radius: 12px;
            border-left: 4px solid var(--surface-border);
            transition: all 0.3s ease;
        }

        .permission-item.granted {
            border-left-color: #34C759;
            background: rgba(var(--success-rgb), 0.12);
        }

        .permission-item.denied {
            border-left-color: #FF3B30;
            background: rgba(var(--danger-rgb), 0.10);
        }

        .permission-item.pending {
            border-left-color: #FF9500;
            background: rgba(var(--warning-rgb), 0.12);
        }

        .permission-info {
            flex: 1;
        }

        .permission-title {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .permission-description {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .permission-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .status-icon.granted {
            background: #34C759;
            color: white;
        }

        .status-icon.denied {
            background: #FF3B30;
            color: white;
        }

        .status-icon.pending {
            background: #FF9500;
            color: white;
        }

        .request-button {
            padding: 0.5rem 1rem;
            background: var(--brand-gradient);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            box-shadow: 0 10px 22px rgba(var(--accent-primary-rgb), 0.22);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .request-button:hover {
            filter: brightness(0.97);
            transform: translateY(-1px);
            box-shadow: 0 14px 30px rgba(var(--accent-primary-rgb), 0.28);
        }

        .request-button:focus-visible {
            outline: none;
            box-shadow:
                0 0 0 4px var(--focus-ring),
                0 14px 30px rgba(var(--accent-primary-rgb), 0.28);
        }

        .request-button:disabled {
            background: #C7C7CC;
            cursor: not-allowed;
        }

        .actions {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .action-button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .primary {
            background: var(--brand-gradient);
            color: white;
        }

        .primary:hover {
            filter: brightness(0.97);
            transform: translateY(-1px);
        }

        .primary:focus-visible {
            outline: none;
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        .secondary {
            background: var(--surface-bg);
            color: var(--text-primary);
            border: 1px solid var(--surface-border);
        }

        .secondary:hover {
            background: rgba(var(--accent-primary-rgb), 0.08);
            border-color: rgba(var(--accent-primary-rgb), 0.30);
        }

        .secondary:focus-visible {
            outline: none;
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        .warning {
            background: rgba(var(--danger-rgb), 0.10);
            border: 1px solid rgba(var(--danger-rgb), 0.25);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 2rem;
        }

        .warning-title {
            color: rgb(var(--danger-rgb));
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .warning-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 0.5rem;
            vertical-align: middle;
        }

        .badge.required {
            background: #DC2626;
            color: white;
        }

        .badge.optional {
            background: #6B7280;
            color: white;
        }

        .permission-instructions {
            margin-top: 0.5rem;
            color: #6B7280;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .manual-instructions {
            margin-top: 0.75rem;
            padding: 0.75rem;
            background: rgba(255, 193, 7, 0.12);
            border-left: 3px solid #F59E0B;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #4B5563;
        }

        .manual-instructions strong {
            color: #92400E;
        }

        .manual-instructions ol {
            margin: 0.5rem 0 0 1.25rem;
            padding: 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1><span class="icon-lock-open"></span> <span class="text-gradient">Gestura</span> System Permissions</h1>
            <p>Gestura needs these permissions to function properly</p>
        </div>

        <div class="warning" id="warningBanner" style="display: none;">
            <div class="warning-title"><span class="icon-warning"></span> Missing Required Permissions</div>
            <div class="warning-text">
                Some features may not work correctly until all required permissions are granted.
            </div>
        </div>

        <div id="permissionsList">
            <!-- Permissions will be populated by JavaScript -->
        </div>

        <div class="actions">
            <button class="action-button secondary" onclick="window.close()">Close</button>
            <button class="action-button primary" id="refreshButton">Refresh Status</button>
        </div>
    </div>

    <script type="module">
        // =====================================================================
        // Theme Management
        // =====================================================================
        async function initTheme() {
            try {
                const { invoke } = await import('@tauri-apps/api/core');
                const config = await invoke('get_config');
                const themeMode = config?.ui?.theme_mode || 'system';
                applyTheme(themeMode);

                if (themeMode === 'system') {
                    const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                    mediaQuery.addEventListener('change', () => applyTheme('system'));
                }
            } catch (e) {
                console.error('[Theme] Failed to initialize:', e);
                applyTheme('system');
            }
        }

        function applyTheme(mode) {
            const html = document.documentElement;
            if (mode === 'light') {
                html.setAttribute('data-theme', 'light');
            } else if (mode === 'dark') {
                html.setAttribute('data-theme', 'dark');
            } else {
                html.removeAttribute('data-theme');
            }
        }

        initTheme();

        // =====================================================================
        // Permissions Logic
        // =====================================================================
        console.log('🔍 Permissions.html script starting...');

        let invoke;
        try {
            console.log('📦 Importing Tauri API...');
            ({ invoke } = await import('@tauri-apps/api/core'));
            console.log('✅ Tauri API imported successfully');
        } catch (error) {
            console.error('❌ Failed to import Tauri API:', error);
        }

        const permissionsList = document.getElementById('permissionsList');
        const warningBanner = document.getElementById('warningBanner');
        const refreshButton = document.getElementById('refreshButton');

        // Permission metadata comes from the backend so we only display real OS-level permissions.
        let permissions = [];

        function normalizeStatusClass(status) {
            if (status === 'granted') return 'granted';
            if (status === 'denied' || status === 'restricted') return 'denied';
            return 'pending';
        }

        function formatStatusText(status) {
            switch (status) {
                case 'granted':
                    return 'Granted';
                case 'denied':
                    return 'Denied';
                case 'restricted':
                    return 'Restricted';
                case 'not_determined':
                    return 'Not yet requested';
                case 'unknown':
                    return 'Unknown';
                default:
                    return 'Pending';
            }
        }

        function createPermissionItem(permission, status) {
            const item = document.createElement('div');
            const statusClass = normalizeStatusClass(status);
            item.className = `permission-item ${statusClass}`;

            const statusIcon = status === 'granted'
                ? '<span class="icon-check"></span>'
                : (status === 'denied' || status === 'restricted')
                    ? '<span class="icon-x"></span>'
                    : '<span class="icon-warning"></span>';

            const statusText = formatStatusText(status);

            const requiredBadge = permission.required
                ? '<span class="badge required">Required</span>'
                : '<span class="badge optional">Optional</span>';

            const isAccessibility = permission.id === 'accessibility';
            const needsManualGrant = isAccessibility && status !== 'granted';

            const buttonLabel = (status === 'denied' || status === 'restricted' || needsManualGrant)
                ? 'Open Settings'
                : 'Enable';

            item.innerHTML = `
                <div class="permission-info">
                    <div class="permission-title">${permission.name} ${requiredBadge}</div>
                    <div class="permission-description">${permission.description}</div>
                    ${permission.instructions ? `<div class="permission-instructions">${permission.instructions}</div>` : ''}
                    ${needsManualGrant ? `
                        <div class="manual-instructions">
                            <strong><span class="icon-warning"></span> Manual Setup Required</strong>
                            <div style="margin-top: 0.35rem;">
                                macOS requires you to manually enable Accessibility:
                                <ol>
                                    <li>Click <strong>Open Settings</strong></li>
                                    <li>Find <strong>Gestura</strong> in the list</li>
                                    <li>Toggle it <strong>ON</strong> (enter your password if prompted)</li>
                                    <li>Return here and click <strong>Refresh Status</strong></li>
                                </ol>
                            </div>
                        </div>
                    ` : ''}
                </div>
                <div class="permission-status">
                    <div class="status-icon ${statusClass}">${statusIcon}</div>
                    <span>${statusText}</span>
                    ${status !== 'granted'
                    ? `<button class="request-button" onclick="requestPermission('${permission.id}')">${buttonLabel}</button>`
                    : ''}
                </div>
            `;

            return item;
        }

        async function loadPermissions() {
            console.log('🔄 Loading permissions...');
            permissionsList.innerHTML = '';
            let hasWarnings = false;

            if (!invoke) {
                permissionsList.innerHTML = '<div class="permission-item pending">Unable to access Tauri API.</div>';
                warningBanner.style.display = 'block';
                return;
            }

            try {
                const result = await invoke('check_system_permissions');
                permissions = (result && result.permissions) ? result.permissions : [];
            } catch (error) {
                console.error('Failed to load system permissions:', error);
                permissions = [];
            }

            for (const permission of permissions) {
                const status = permission.status || 'unknown';
                const item = createPermissionItem(permission, status);
                permissionsList.appendChild(item);

                if (permission.required && status !== 'granted') {
                    hasWarnings = true;
                }
            }

            warningBanner.style.display = hasWarnings ? 'block' : 'none';
        }

        window.requestPermission = async function (permissionId) {
            try {
                await invoke('request_permission', { permission: permissionId });
                // Refresh the status after requesting
                setTimeout(loadPermissions, 1500);
            } catch (error) {
                console.error(`Failed to request permission ${permissionId}:`, error);
                // Fallback: try to open the correct System Settings pane directly
                try {
                    await invoke('open_system_preferences', { pane: permissionId });
                } catch (e) {
                    console.error(`Failed to open System Settings for ${permissionId}:`, e);
                    alert(`Failed to request permission: ${error}`);
                }
            }
        };

        refreshButton.addEventListener('click', loadPermissions);

        // Load permissions on page load
        console.log('🚀 Initializing permissions page...');
        document.addEventListener('DOMContentLoaded', () => {
            console.log('📄 DOM loaded, starting permission load...');
            loadPermissions();
        });

        // Also try immediate load in case DOM is already ready
        if (document.readyState === 'loading') {
            console.log('⏳ DOM still loading, waiting...');
        } else {
            console.log('✅ DOM ready, loading permissions immediately...');
            loadPermissions();
        }
    </script>
</body>

</html>
