        }

        function getPrivacySettingsFromDom() {
            const rememberMode = document.getElementById('privacyAuthRememberMode')?.value === 'always' ? 'always' : 'timeout';
            const authTimeoutRaw = normalizePrivacyAuthTimeout(
                document.getElementById('privacyAuthTimeout')?.value,
                DEFAULT_PRIVACY_SETTINGS.auth_timeout,
            );
            return {
                data_collection: document.getElementById('privacyDataCollection')?.checked === true,
                crash_reports: document.getElementById('privacyCrashReports')?.checked !== false,
                voice_data_local: document.getElementById('privacyVoiceDataLocal')?.checked !== false,
                require_auth: document.getElementById('privacyRequireAuth')?.checked === true,
                auth_timeout: rememberMode === 'always' ? 0 : authTimeoutRaw,
            };
        }

        function applyPrivacySettings(settings) {
            const merged = { ...DEFAULT_PRIVACY_SETTINGS, ...(settings || {}) };
            const dataCollection = document.getElementById('privacyDataCollection');
            const crashReports = document.getElementById('privacyCrashReports');
            const voiceDataLocal = document.getElementById('privacyVoiceDataLocal');
            const requireAuth = document.getElementById('privacyRequireAuth');
            const authRememberMode = document.getElementById('privacyAuthRememberMode');
            const authTimeout = document.getElementById('privacyAuthTimeout');

            if (dataCollection) dataCollection.checked = merged.data_collection === true;
            if (crashReports) crashReports.checked = merged.crash_reports !== false;
            if (voiceDataLocal) voiceDataLocal.checked = merged.voice_data_local !== false;
            if (requireAuth) requireAuth.checked = merged.require_auth === true;
            if (authRememberMode) authRememberMode.value = merged.auth_timeout === 0 ? 'always' : 'timeout';
            if (authTimeout) {
                authTimeout.value = String(
                    merged.auth_timeout === 0
                        ? DEFAULT_PRIVACY_SETTINGS.auth_timeout
                        : normalizePrivacyAuthTimeout(merged.auth_timeout, DEFAULT_PRIVACY_SETTINGS.auth_timeout),
                );
            }

            updatePrivacyAuthTimeoutState();
        }

        function updatePrivacyAuthTimeoutState() {
            const rememberMode = document.getElementById('privacyAuthRememberMode')?.value === 'always' ? 'always' : 'timeout';
            const authTimeout = document.getElementById('privacyAuthTimeout');
            const authTimeoutSection = document.getElementById('privacyAuthTimeoutSection');
            const shouldHideTimeout = rememberMode === 'always';
            if (authTimeoutSection) authTimeoutSection.style.display = shouldHideTimeout ? 'none' : '';
            if (authTimeout) authTimeout.disabled = shouldHideTimeout;
        }

        async function loadPrivacySettings() {
            try {
                const config = await invoke('get_config');
                applyPrivacySettings(config?.privacy);
            } catch (error) {
                console.error('Failed to load privacy settings:', error);
                applyPrivacySettings(DEFAULT_PRIVACY_SETTINGS);
            }
        }

        async function savePrivacySettingsIfNeeded() {
            const currentStepId = steps[currentStep]?.id;
            if (currentStepId !== 'privacy') return;

            try {
                const config = await invoke('get_config');
                config.privacy = {
                    ...(config?.privacy || {}),
                    ...getPrivacySettingsFromDom(),
                };
                await invoke('save_config', { cfg: config });
            } catch (error) {
                console.error('Failed to save privacy settings:', error);
            }
        }

        async function loadSttConfig() {
            try {
                const config = await invoke('get_config');
                const voiceConfig = config?.voice || {};
                const provider = normalizePersistedSttProvider(voiceConfig.provider ?? voiceConfig.voice_provider);
                onboardingSttMode = inferSttSetupMode(provider);
                const providerSelect = document.getElementById('sttProvider');
                if (providerSelect) providerSelect.value = provider;

        function formatToolLabel(toolName) {
            const labels = {
                file: 'File Access',
                shell: 'Shell Commands',
                git: 'Git Operations',
                code: 'Code Analysis',
                web: 'Web Fetch',
                web_search: 'Web Search',
                task: 'Task Management',
                screenshot: 'Screenshots',
                screen_record: 'Screen Recording',
                a2a: 'Agent-to-Agent',
                permissions: 'Permissions',
                mcp: 'MCP Tools',
            };
            return labels[toolName] || toolName.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        }

        function getOrderedBuiltinTools() {
            const weight = new Map(TOOL_UI_ORDER.map((name, index) => [name, index]));
            return (onboardingBuiltinTools || [])
                .filter(tool => tool?.name && tool.name !== 'screen')
                .sort((a, b) => {
                    const aWeight = weight.has(a.name) ? weight.get(a.name) : Number.MAX_SAFE_INTEGER;
                    const bWeight = weight.has(b.name) ? weight.get(b.name) : Number.MAX_SAFE_INTEGER;
                    if (aWeight !== bWeight) return aWeight - bWeight;
                    return formatToolLabel(a.name).localeCompare(formatToolLabel(b.name));
                });
        }

        function getBuiltinToolGroups() {
            const groups = TOOL_GROUP_DEFINITIONS.map(def => ({ ...def, tools: [] }));
            const fallbackGroup = {
                id: 'other',
                label: 'Other',
                summary: 'Other built-in capabilities available to the agent.',
                tools: [],
            };

            getOrderedBuiltinTools().forEach(tool => {
                const match = groups.find(group => group.matcher(tool.name));
                if (match) match.tools.push(tool);
                else fallbackGroup.tools.push(tool);
            });

            return [...groups.filter(group => group.tools.length > 0), ...(fallbackGroup.tools.length ? [fallbackGroup] : [])];
        }

        function getToolGroupState(group) {
            const memberNames = (group?.tools || [])
                .map(tool => tool?.name)
                .filter(name => !!name && name !== 'screen');
            const enabledCount = memberNames.filter(name => onboardingDefaultEnabledTools?.[name] === true).length;
            return {
                memberNames,
                enabledCount,
                totalCount: memberNames.length,
                checked: memberNames.length > 0 && enabledCount === memberNames.length,
                partial: enabledCount > 0 && enabledCount < memberNames.length,
            };
        }

        function buildDefaultEnabledToolsPayload() {
            const payload = { ...onboardingDefaultEnabledTools };
            payload.screen = !!(payload.screen || payload.screenshot || payload.screen_record);
            return payload;
        }

        function buildAllEnabledBuiltinToolsMap(tools) {
            const enabledTools = {};
            (Array.isArray(tools) ? tools : []).forEach(tool => {
                if (!tool?.name || tool.name === 'screen') return;
                enabledTools[tool.name] = true;
            });
            enabledTools.screen = !!(enabledTools.screenshot || enabledTools.screen_record);
            return enabledTools;
        }

        function buildSuggestedEnabledToolsMap(tools) {
            const suggested = {};
            (Array.isArray(tools) ? tools : []).forEach(tool => {
                if (!tool?.name || tool.name === 'screen') return;
                suggested[tool.name] = SUGGESTED_TOOL_NAMES.has(tool.name);
            });
            suggested.screen = !!(suggested.screenshot || suggested.screen_record);
            return suggested;
        }

        function isSuggestedEnabledToolSet(enabledTools, tools) {
            const expected = buildSuggestedEnabledToolsMap(tools);
            const relevantNames = new Set([
                ...Object.keys(expected),
                ...Object.keys(enabledTools || {}),
            ]);
            return [...relevantNames].every(name => {
                if (name === 'screen') return true;
                return Boolean(enabledTools?.[name]) === Boolean(expected[name]);
            });
        }

        function renderDefaultToolsPresetList() {
            const container = document.getElementById('defaultToolsPresetList');
            if (!container) return;
            if (onboardingToolsMode !== 'suggested') {
                container.innerHTML = '';
                return;
            }
            const enabledLabels = getOrderedBuiltinTools()
                .filter(tool => onboardingDefaultEnabledTools?.[tool.name] === true)
                .map(tool => formatToolLabel(tool.name));

            if (!enabledLabels.length) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = enabledLabels
                .map(label => `<span class="selection-badge">${label}</span>`)
                .join('');
        }

        function syncDefaultToolsModeUi() {
            setRadioGroupValue('defaultToolsMode', onboardingToolsMode);

            const summary = document.getElementById('defaultToolsQuickSummary');
            const advancedPanel = document.getElementById('defaultToolsAdvancedPanel');

            if (summary) {
                if (!onboardingBuiltinTools.length) {
                    summary.textContent = 'Built-in tools will appear here once they are available in this environment.';
                } else if (onboardingToolsMode === 'advanced') {
                    const enabledCount = getOrderedBuiltinTools().filter(tool => onboardingDefaultEnabledTools?.[tool.name] === true).length;
                    summary.textContent = `${enabledCount} tool${enabledCount === 1 ? '' : 's'} currently enabled by default. Customize them below.`;
                } else {
                    summary.textContent = 'Suggested tools focus on files, web research, tasks, and screenshots for everyday workflows.';
                }
            }

            if (advancedPanel) advancedPanel.style.display = onboardingToolsMode === 'advanced' ? '' : 'none';
            renderDefaultToolsPresetList();
        }

        async function setDefaultToolsMode(mode) {
            const previousMode = onboardingToolsMode;
            onboardingToolsMode = mode === 'advanced' ? 'advanced' : 'suggested';
            if (onboardingToolsMode === 'advanced') {
                syncDefaultToolsModeUi();
                renderDefaultToolsList();
                scheduleResizeToFit();
                return;
            }

            const previous = { ...onboardingDefaultEnabledTools };
            onboardingDefaultEnabledTools = buildSuggestedEnabledToolsMap(onboardingBuiltinTools);
            syncDefaultToolsModeUi();

            try {
                await invoke('update_default_enabled_tools', {
                    default_enabled_tools: buildDefaultEnabledToolsPayload(),
                });
            } catch (error) {
                console.error('Failed to apply suggested default tools:', error);
                onboardingDefaultEnabledTools = previous;
                onboardingToolsMode = previousMode;
                syncDefaultToolsModeUi();
                renderDefaultToolsList();
            }

            scheduleResizeToFit();
        }

        function isLegacyOnboardingToolDefaultSet(enabledTools) {
            const current = enabledTools || {};
            const expected = {
                file: true,
                shell: true,
                git: true,
                code: true,
                web: true,
                web_search: true,
                task: true,
                screenshot: false,
                screen_record: false,
                a2a: false,
                permissions: false,
                mcp: false,
            };

            const keys = Object.keys(expected);
            return keys.every(key => current[key] === expected[key]);
        }

        function renderDefaultToolsList() {
            const container = document.getElementById('defaultToolsList');
            if (!container) return;
            container.innerHTML = '';

            const groups = getBuiltinToolGroups();
            if (!groups.length) {
                container.innerHTML = '<div class="selection-empty-state">No built-in tools are available.</div>';
                return;
            }

            groups.forEach(group => {
                const state = getToolGroupState(group);
                const card = document.createElement('div');
                const membersPreview = group.tools.map(tool => formatToolLabel(tool.name)).join(', ');
                const tooltip = `${group.label} — ${group.summary} Includes: ${membersPreview}`;
                card.className = `tool-toggle-item${state.enabledCount ? '' : ' is-disabled'}`;
                card.title = tooltip;

                const info = document.createElement('div');
                info.className = 'tool-toggle-main';

                const title = document.createElement('span');
                title.className = 'tool-toggle-name';
                title.textContent = group.label;

                const countBadge = document.createElement('span');
                countBadge.className = 'selection-badge';
                countBadge.textContent = `${state.enabledCount}/${state.totalCount}`;

                const infoBadge = document.createElement('span');
                infoBadge.className = 'tool-toggle-info';
                infoBadge.textContent = 'i';
                infoBadge.title = tooltip;
                infoBadge.setAttribute('aria-label', tooltip);

                info.appendChild(title);
                info.appendChild(countBadge);
                info.appendChild(infoBadge);

                const toggleLabel = document.createElement('label');
                toggleLabel.className = 'tool-toggle-switch';
                toggleLabel.title = state.checked ? 'Disable as always available' : 'Enable as always available';
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = state.checked;
                checkbox.indeterminate = state.partial;
                checkbox.addEventListener('change', () => {
                    void updateDefaultToolGroupEnabled(group.id, checkbox.checked);
                });
                toggleLabel.appendChild(checkbox);
                toggleLabel.appendChild(document.createTextNode('Always available'));

                card.appendChild(info);
                card.appendChild(toggleLabel);
                container.appendChild(card);
            });

            scheduleResizeToFit();
        }

        async function updateDefaultToolGroupEnabled(groupId, enabled) {
            const group = getBuiltinToolGroups().find(entry => entry.id === groupId);
            if (!group) return;

            const previous = { ...onboardingDefaultEnabledTools };
            onboardingToolsMode = 'advanced';
            (group.tools || []).forEach(tool => {
                if (tool?.name && tool.name !== 'screen') {
                    onboardingDefaultEnabledTools[tool.name] = enabled;
                }
            });
            onboardingDefaultEnabledTools.screen = !!(onboardingDefaultEnabledTools.screenshot || onboardingDefaultEnabledTools.screen_record);
            syncDefaultToolsModeUi();
            renderDefaultToolsList();

            try {
                await invoke('update_default_enabled_tools', {
                    default_enabled_tools: buildDefaultEnabledToolsPayload(),
                });
            } catch (error) {
                console.error('Failed to update default enabled tools:', error);
                onboardingDefaultEnabledTools = previous;
                onboardingToolsMode = isSuggestedEnabledToolSet(onboardingDefaultEnabledTools, onboardingBuiltinTools) ? 'suggested' : 'advanced';
                syncDefaultToolsModeUi();
                renderDefaultToolsList();
            }
        }

        async function loadDefaultToolsStep() {
            const [tools, config] = await Promise.all([
                invoke('list_builtin_tools'),
                invoke('get_config'),
            ]);
            onboardingBuiltinTools = Array.isArray(tools) ? tools : [];
            const persistedTools = { ...(config?.permissions?.default_enabled_tools || {}) };
            const allEnabledTools = buildAllEnabledBuiltinToolsMap(onboardingBuiltinTools);
            const suggestedTools = buildSuggestedEnabledToolsMap(onboardingBuiltinTools);
            const useSuggestedDefault = !Object.keys(persistedTools).length || isLegacyOnboardingToolDefaultSet(persistedTools);

            onboardingDefaultEnabledTools = useSuggestedDefault
                ? suggestedTools
                : { ...allEnabledTools, ...persistedTools };
            onboardingToolsMode = isSuggestedEnabledToolSet(onboardingDefaultEnabledTools, onboardingBuiltinTools) ? 'suggested' : 'advanced';

            if (useSuggestedDefault) {
                try {
                    await invoke('update_default_enabled_tools', {
                        default_enabled_tools: buildDefaultEnabledToolsPayload(),
                    });
                } catch (error) {
                    console.error('Failed to persist onboarding built-in tool defaults:', error);
                }
            }

            syncDefaultToolsModeUi();
            renderDefaultToolsList();
        }

        function generateClientId(prefix) {
            try {
                if (window.crypto && window.crypto.randomUUID) {
                    return `${prefix}_${window.crypto.randomUUID()}`;
                }
            } catch (_) {
                // ignore
            }
            return `${prefix}_${Date.now()}_${Math.random().toString(16).slice(2)}`;
        }

        function getKnowledgeOrigin(item) {
            return item?.metadata?.origin || 'user';
        }

        function deriveKnowledgeDisplayName(source) {
            const value = String(source || '').trim();
            if (!value) return 'Linked source';
            try {
                const url = new URL(value);
                return url.hostname || value;
            } catch (_) {
                const parts = value.split(/[\\/]/).filter(Boolean);
                return parts[parts.length - 1] || value;
            }
        }

        function isLinkedKnowledgeItem(item) {
            return getKnowledgeOrigin(item) !== 'builtin' || String(item?.category || '').toLowerCase() === 'source';
        }

        function inferKnowledgeMode() {
            const enabledItems = onboardingKnowledgeItems.filter(item => onboardingEnabledKnowledgeIds.has(item.id));
            if (enabledItems.some(item => !isLinkedKnowledgeItem(item))) return 'specialty';
            if (enabledItems.some(item => isLinkedKnowledgeItem(item))) return 'link-source';
            return 'skip';
        }

        function renderKnowledgeQuickSummary() {
            const summary = document.getElementById('knowledgeQuickSummary');
            if (!summary) return;

            const enabledItems = onboardingKnowledgeItems.filter(item => onboardingEnabledKnowledgeIds.has(item.id));
            const linkedCount = enabledItems.filter(item => isLinkedKnowledgeItem(item)).length;
            const specialtyCount = enabledItems.filter(item => !isLinkedKnowledgeItem(item)).length;

            if (onboardingKnowledgeMode === 'specialty') {
                summary.textContent = specialtyCount
                    ? `${specialtyCount} specialty knowledge pack${specialtyCount === 1 ? '' : 's'} enabled by default.`
                    : 'Browse specialty packs to choose what new sessions should know by default.';
                return;
            }

            if (onboardingKnowledgeMode === 'link-source') {
                summary.textContent = linkedCount
                    ? `${linkedCount} linked source${linkedCount === 1 ? '' : 's'} enabled by default.`
                    : 'Add one trusted source and Gestura can keep it available for future sessions.';
                return;
            }

            summary.textContent = 'No default knowledge will be preloaded for new sessions.';
        }

        function syncKnowledgeModeUi() {
            setRadioGroupValue('defaultKnowledgeMode', onboardingKnowledgeMode);

            const advancedPanel = document.getElementById('knowledgeAdvancedPanel');
            const skipState = document.getElementById('knowledgeSkipState');
            const linkToggleBtn = document.getElementById('toggleKnowledgeLinkFormBtn');
            const linkToggleRow = linkToggleBtn ? linkToggleBtn.closest('.knowledge-link-toggle-row') : null;
            const linkForm = document.getElementById('knowledgeLinkForm');

            if (advancedPanel) advancedPanel.style.display = onboardingKnowledgeMode === 'specialty' ? '' : 'none';
            if (skipState) skipState.style.display = onboardingKnowledgeMode === 'skip' ? '' : 'none';

            if (onboardingKnowledgeMode === 'link-source') {
                onboardingKnowledgeLinkFormExpanded = true;
                toggleKnowledgeLinkForm(true);
                if (linkToggleRow) linkToggleRow.style.display = 'none';
            } else {
                onboardingKnowledgeLinkFormExpanded = false;
                toggleKnowledgeLinkForm(false);
                if (linkToggleRow) linkToggleRow.style.display = onboardingKnowledgeMode === 'skip' ? 'none' : '';
                if (linkForm && onboardingKnowledgeMode === 'skip') linkForm.style.display = 'none';
            }

            renderKnowledgeQuickSummary();
            scheduleResizeToFit();
        }

        async function persistEnabledKnowledgeSet(previousIds, nextIds) {
            const removals = [...previousIds].filter(id => !nextIds.has(id));
            const additions = [...nextIds].filter(id => !previousIds.has(id));
            const sessionId = await ensureDefaultKnowledgeSessionId();

            await Promise.all([
                ...removals.map(knowledgeId => invoke('set_knowledge_enabled', {
                    session_id: sessionId,
                    knowledge_id: knowledgeId,
                    enabled: false,
                })),
                ...additions.map(knowledgeId => invoke('set_knowledge_enabled', {
                    session_id: sessionId,
                    knowledge_id: knowledgeId,
                    enabled: true,
                })),
            ]);
        }

        async function setKnowledgeMode(mode) {
            const previousIds = new Set(onboardingEnabledKnowledgeIds);
            onboardingKnowledgeMode = mode;

            if (mode === 'skip') {
                onboardingEnabledKnowledgeIds = new Set();
            } else if (mode === 'link-source') {
                onboardingEnabledKnowledgeIds = new Set(
                    [...onboardingEnabledKnowledgeIds].filter(id => {
                        const item = onboardingKnowledgeItems.find(entry => entry.id === id);
                        return item && isLinkedKnowledgeItem(item);
                    })
                );
            }

            syncKnowledgeModeUi();
            renderDefaultKnowledgeList();

            try {
                await persistEnabledKnowledgeSet(previousIds, onboardingEnabledKnowledgeIds);
            } catch (error) {
                console.error('Failed to update onboarding knowledge defaults:', error);
                onboardingEnabledKnowledgeIds = previousIds;
                onboardingKnowledgeMode = inferKnowledgeMode();
                syncKnowledgeModeUi();
                renderDefaultKnowledgeList();
            }
        }

        function buildKnowledgeTriggers(name, notes, source) {
            const parts = `${name || ''} ${notes || ''} ${source || ''}`
                .toLowerCase()
                .split(/[^a-z0-9._/-]+/)
                .map(part => part.trim())
                .filter(part => part.length >= 4 && !part.startsWith('http'));
            return [...new Set(parts)].slice(0, 8);
        }

        async function ensureDefaultKnowledgeSessionId() {
            if (!onboardingDefaultKnowledgeSessionId) {
                onboardingDefaultKnowledgeSessionId = await invoke('knowledge_default_session_id');
            }
            return onboardingDefaultKnowledgeSessionId;
        }

        function setKnowledgeLinkStatus(message, kind = '') {
            const statusEl = document.getElementById('knowledgeLinkStatus');
            if (!statusEl) return;
            statusEl.textContent = message || '';
            statusEl.className = `inline-status${kind ? ` is-${kind}` : ''}`;
        }

        function normalizeKnowledgeSearchQuery(value) {
            return String(value || '').trim().toLowerCase();
        }

        function getOrderedKnowledgeGroups() {
            return SPECIALTY_KNOWLEDGE_GROUP_DEFINITIONS
                .map(definition => {
                    const items = [...new Map(
                        (onboardingKnowledgeItems || [])
                            .filter(item => definition.matcher(item))
                            .sort((a, b) => (a.name || a.id || '').localeCompare(b.name || b.id || ''))
                            .map(item => [item.id, item])
                    ).values()];

                    return {
                        ...definition,
                        items,
                        enabledCount: items.filter(item => onboardingEnabledKnowledgeIds.has(item.id)).length,
                    };
                })
                .filter(group => group.items.length > 0 || group.id === 'source');
        }

        function filterKnowledgeGroups(groups) {
            const query = normalizeKnowledgeSearchQuery(onboardingKnowledgeSearchQuery);
            if (!query) return groups;

            const terms = query.split(/\s+/).filter(Boolean);
            return groups.filter(group => {
                const searchText = [
                    group.label,
                    group.summary,
                    ...(group.searchTerms || []),
                    ...group.items.flatMap(item => [
                        item.id,
                        item.name,
                        item.description,
                        item.category,
                        ...(Array.isArray(item.triggers) ? item.triggers : []),
                    ]),
                ]
                    .filter(Boolean)
                    .join(' ')
                    .toLowerCase();

                return terms.every(term => searchText.includes(term));
            });
        }

        function getKnowledgeCategoryLabel(categoryId) {
            return KNOWLEDGE_CATEGORY_DEFINITIONS.find(category => category.id === categoryId)?.label || 'Other';
        }

        function warnIfKnowledgeSpecialtiesOverlap(groups) {
            const ownership = new Map();
            const overlaps = [];

            groups.forEach(group => {
                group.items.forEach(item => {
                    if (!item?.id) return;
                    const previousOwner = ownership.get(item.id);
                    if (previousOwner && previousOwner !== group.id) {
                        overlaps.push(`${item.id}: ${previousOwner} + ${group.id}`);
                        return;
                    }
                    ownership.set(item.id, group.id);
                });
            });

            if (overlaps.length) {
                console.warn('[Onboarding] overlapping specialty knowledge modules detected:', overlaps);
            }
        }

        function countSelectedKnowledgeOptions(groups) {
            const selectedIds = new Set();
            groups.forEach(group => {
                group.items.forEach(item => {
                    if (onboardingEnabledKnowledgeIds.has(item.id)) {
                        selectedIds.add(item.id);
                    }
                });
            });
            return selectedIds.size;
        }

        function renderKnowledgeSearchSummary(allGroups, visibleGroups) {
            const searchInput = document.getElementById('knowledgeGroupSearch');
            if (searchInput && searchInput.value !== onboardingKnowledgeSearchQuery) {
                searchInput.value = onboardingKnowledgeSearchQuery;
            }

            const summaryEl = document.getElementById('knowledgeSearchSummary');
            if (!summaryEl) return;

            const query = normalizeKnowledgeSearchQuery(onboardingKnowledgeSearchQuery);
            const groupsForSummary = visibleGroups.length || !query ? visibleGroups : [];
            const selectedCount = countSelectedKnowledgeOptions(groupsForSummary.length ? groupsForSummary : allGroups);
            const selectedGroupCount = (groupsForSummary.length ? groupsForSummary : allGroups)
                .filter(group => group.enabledCount > 0)
                .length;

            if (query) {
                summaryEl.textContent = visibleGroups.length
                    ? `Search: “${query}” • ${selectedCount} selected option${selectedCount === 1 ? '' : 's'} across ${selectedGroupCount} set${selectedGroupCount === 1 ? '' : 's'}.`
                    : `Search: “${query}” • 0 matching specialty sets.`;
                return;
            }

            summaryEl.textContent = `${selectedCount} selected option${selectedCount === 1 ? '' : 's'} across ${selectedGroupCount} specialty set${selectedGroupCount === 1 ? '' : 's'}.`;
        }

        function toggleKnowledgeLinkForm(forceExpanded = null) {
            const form = document.getElementById('knowledgeLinkForm');
            const button = document.getElementById('toggleKnowledgeLinkFormBtn');
            const buttonRow = button?.closest('.knowledge-link-toggle-row');
            onboardingKnowledgeLinkFormExpanded = typeof forceExpanded === 'boolean'
                ? forceExpanded
                : !onboardingKnowledgeLinkFormExpanded;

            const shouldClearKnowledgeDetail = onboardingKnowledgeLinkFormExpanded && onboardingActiveKnowledgeGroupId;
            if (shouldClearKnowledgeDetail) {
                onboardingActiveKnowledgeGroupId = null;
            }

            if (form) form.style.display = onboardingKnowledgeLinkFormExpanded ? '' : 'none';
            if (buttonRow) buttonRow.style.display = onboardingKnowledgeLinkFormExpanded ? 'none' : '';

            if (shouldClearKnowledgeDetail) {
                renderDefaultKnowledgeList();
                return;
            }

            scheduleResizeToFit();
        }

        function renderKnowledgeDetailPanel(group) {
            const panel = document.getElementById('defaultKnowledgeDetail');
            if (!panel) return;

            if (!group) {
                panel.innerHTML = '';
                panel.style.display = 'none';
                scheduleResizeToFit();
                return;
            }

            panel.style.display = '';
            panel.className = 'knowledge-detail-panel';
            panel.innerHTML = '';

            const header = document.createElement('div');
            header.className = 'knowledge-detail-header';

            const headerInfo = document.createElement('div');
            const title = document.createElement('div');
            title.className = 'knowledge-detail-title';
            title.textContent = group.label;

            const subtitle = document.createElement('div');
            subtitle.className = 'knowledge-detail-subtitle';
            subtitle.textContent = `${group.enabledCount}/${group.items.length} enabled by default.`;

            headerInfo.appendChild(title);
            headerInfo.appendChild(subtitle);

            const closeBtn = document.createElement('button');
            closeBtn.type = 'button';
            closeBtn.className = 'btn btn-secondary knowledge-panel-action-btn';
            closeBtn.textContent = 'Hide details';
            closeBtn.addEventListener('click', () => {
                onboardingActiveKnowledgeGroupId = null;
                renderDefaultKnowledgeList();
            });

            header.appendChild(headerInfo);
            header.appendChild(closeBtn);
            panel.appendChild(header);

            const list = document.createElement('div');
            list.className = 'knowledge-detail-list';

            if (!group.items.length) {
                list.innerHTML = '<div class="selection-empty-state">No knowledge options are available in this set yet. Use the linked-source form below to add your own reference.</div>';
                panel.appendChild(list);
                scheduleResizeToFit();
                return;
            }

            [...group.items]
                .sort((a, b) => {
                    const aEnabled = onboardingEnabledKnowledgeIds.has(a.id) ? 0 : 1;
                    const bEnabled = onboardingEnabledKnowledgeIds.has(b.id) ? 0 : 1;
                    if (aEnabled !== bEnabled) return aEnabled - bEnabled;
                    return (a.name || a.id || '').localeCompare(b.name || b.id || '');
                })
                .forEach(item => {
                    const enabled = onboardingEnabledKnowledgeIds.has(item.id);
                    const origin = getKnowledgeOrigin(item);
                    const sourceLink = item?.metadata?.source_link || '';
                    const tooltip = [item.name || item.id, item.description || 'No description available.', sourceLink ? `Source: ${sourceLink}` : '']
                        .filter(Boolean)
                        .join(' — ');

                    const row = document.createElement('div');
                    row.className = `knowledge-detail-item${enabled ? '' : ' is-disabled'}`;
                    row.title = tooltip;

                    const info = document.createElement('div');
                    const name = document.createElement('div');
                    name.className = 'knowledge-detail-name';
                    name.textContent = item.name || item.id;

                    const meta = document.createElement('div');
                    meta.className = 'knowledge-detail-meta';
                    meta.textContent = [origin, sourceLink ? 'linked source' : (item.category || 'knowledge')]
                        .filter(Boolean)
                        .join(' • ');

                    info.appendChild(name);
                    info.appendChild(meta);

                    const toggleLabel = document.createElement('label');
                    toggleLabel.className = 'selection-toggle';
                    toggleLabel.title = enabled ? `Disable ${item.name || item.id} by default` : `Enable ${item.name || item.id} by default`;
                    toggleLabel.setAttribute('aria-label', `Toggle ${item.name || item.id} default knowledge`);
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.checked = enabled;
                    checkbox.addEventListener('change', () => {
                        void updateKnowledgeEnabled(item.id, checkbox.checked);
                    });
                    toggleLabel.appendChild(checkbox);

                    row.appendChild(info);
                    row.appendChild(toggleLabel);
                    list.appendChild(row);
                });

            panel.appendChild(list);
            scheduleResizeToFit();
        }

        function renderDefaultKnowledgeList() {
            const container = document.getElementById('defaultKnowledgeList');
            if (!container) return;
            container.innerHTML = '';

            const groups = getOrderedKnowledgeGroups();
            warnIfKnowledgeSpecialtiesOverlap(groups);
            const visibleGroups = filterKnowledgeGroups(groups);
            renderKnowledgeSearchSummary(groups, visibleGroups);

            if (!groups.length) {
                container.innerHTML = '<div class="selection-empty-state">No knowledge sources are available yet.</div>';
                renderKnowledgeDetailPanel(null);
                return;
            }

            if (!visibleGroups.length) {
                container.innerHTML = '<div class="selection-empty-state">No specialty groups match your search yet. Try a broader term or add a linked source.</div>';
                renderKnowledgeDetailPanel(null);
                scheduleResizeToFit();
                return;
            }

            [...visibleGroups]
                .sort((a, b) => {
                    const categoryOrder = KNOWLEDGE_CATEGORY_DEFINITIONS.findIndex(category => category.id === a.categoryId)
                        - KNOWLEDGE_CATEGORY_DEFINITIONS.findIndex(category => category.id === b.categoryId);
                    if (categoryOrder !== 0) return categoryOrder;
                    return a.label.localeCompare(b.label);
                })
                .forEach(group => {
                    const allEnabled = group.items.length > 0 && group.enabledCount === group.items.length;
                    const partial = group.enabledCount > 0 && group.enabledCount < group.items.length;
                    const categoryLabel = getKnowledgeCategoryLabel(group.categoryId);
                    const tooltip = `${categoryLabel} · ${group.label} — ${group.summary} ${group.enabledCount} of ${group.items.length} enabled by default. Click the name to refine this set.`;

                    const chip = document.createElement('div');
                    chip.className = `knowledge-chip${group.enabledCount ? ' is-enabled' : ' is-disabled'}${group.id === onboardingActiveKnowledgeGroupId ? ' is-active' : ''}`;
                    chip.title = tooltip;

                    const chipButton = document.createElement('button');
                    chipButton.type = 'button';
                    chipButton.className = 'knowledge-chip-button';
                    chipButton.title = tooltip;
                    chipButton.setAttribute('aria-label', tooltip);
                    chipButton.addEventListener('click', () => {
                        const nextActiveGroupId = group.id === onboardingActiveKnowledgeGroupId ? null : group.id;
                        if (nextActiveGroupId) {
                            toggleKnowledgeLinkForm(false);
                        }
                        onboardingActiveKnowledgeGroupId = nextActiveGroupId;
                        renderDefaultKnowledgeList();
                    });

                    const categoryBadge = document.createElement('span');
                    categoryBadge.className = 'knowledge-chip-category';
                    categoryBadge.textContent = categoryLabel;

                    const chipLabel = document.createElement('span');
                    chipLabel.className = 'knowledge-chip-label';
                    chipLabel.textContent = group.label;

                    const badge = document.createElement('span');
                    badge.className = 'selection-badge';
                    badge.textContent = `${group.enabledCount}/${group.items.length}`;

                    chipButton.appendChild(categoryBadge);
                    chipButton.appendChild(chipLabel);
                    chipButton.appendChild(badge);

                    const toggleLabel = document.createElement('label');
                    toggleLabel.className = 'knowledge-chip-toggle';
                    toggleLabel.title = allEnabled ? `Exclude ${group.label} from defaults` : `Include ${group.label} in defaults`;

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.checked = allEnabled;
                    checkbox.indeterminate = partial;
                    checkbox.disabled = group.items.length === 0;
                    checkbox.setAttribute('aria-label', `Enable ${group.label} by default`);
                    checkbox.addEventListener('change', () => {
                        void updateKnowledgeGroupEnabled(group.id, checkbox.checked);
                    });

                    toggleLabel.appendChild(checkbox);
                    chip.appendChild(chipButton);
                    chip.appendChild(toggleLabel);
                    container.appendChild(chip);
                });

            renderKnowledgeDetailPanel(visibleGroups.find(group => group.id === onboardingActiveKnowledgeGroupId) || null);
            scheduleResizeToFit();
        }

        async function updateKnowledgeEnabled(knowledgeId, enabled) {
            const previous = new Set(onboardingEnabledKnowledgeIds);
            onboardingKnowledgeMode = 'specialty';
            if (enabled) onboardingEnabledKnowledgeIds.add(knowledgeId);
            else onboardingEnabledKnowledgeIds.delete(knowledgeId);
            syncKnowledgeModeUi();
            renderDefaultKnowledgeList();

            try {
                const sessionId = await ensureDefaultKnowledgeSessionId();
                await invoke('set_knowledge_enabled', {
                    session_id: sessionId,
                    knowledge_id: knowledgeId,
                    enabled,
                });
            } catch (error) {
                console.error('Failed to update default knowledge selection:', error);
                onboardingEnabledKnowledgeIds = previous;
                onboardingKnowledgeMode = inferKnowledgeMode();
                syncKnowledgeModeUi();
                renderDefaultKnowledgeList();
            }
        }

        async function updateKnowledgeGroupEnabled(groupId, enabled) {
            const group = getOrderedKnowledgeGroups().find(entry => entry.id === groupId);
            if (!group || !group.items.length) return;

            const previous = new Set(onboardingEnabledKnowledgeIds);
            onboardingKnowledgeMode = 'specialty';
            group.items.forEach(item => {
                if (enabled) onboardingEnabledKnowledgeIds.add(item.id);
                else onboardingEnabledKnowledgeIds.delete(item.id);
            });
            syncKnowledgeModeUi();
            renderDefaultKnowledgeList();

            try {
                const sessionId = await ensureDefaultKnowledgeSessionId();
                await Promise.all(group.items.map(item => invoke('set_knowledge_enabled', {
                    session_id: sessionId,
                    knowledge_id: item.id,
                    enabled,
                })));
            } catch (error) {
                console.error('Failed to update default knowledge group selection:', error);
                onboardingEnabledKnowledgeIds = previous;
                onboardingKnowledgeMode = inferKnowledgeMode();
                syncKnowledgeModeUi();
                renderDefaultKnowledgeList();
            }
        }

        async function loadDefaultKnowledgeStep() {
            const sessionId = await ensureDefaultKnowledgeSessionId();
            const [items, enabledIds] = await Promise.all([
                invoke('list_knowledge_items'),
                invoke('get_enabled_knowledge', { session_id: sessionId }),
            ]);
            onboardingKnowledgeItems = Array.isArray(items) ? items : [];
            onboardingEnabledKnowledgeIds = new Set(enabledIds || []);
            const groups = getOrderedKnowledgeGroups();
            if (!groups.some(group => group.id === onboardingActiveKnowledgeGroupId)) {
                onboardingActiveKnowledgeGroupId = null;
            }
            onboardingKnowledgeMode = inferKnowledgeMode();
            syncKnowledgeModeUi();
            renderDefaultKnowledgeList();
        }

        async function addLinkedKnowledgeSource() {
            const nameInput = document.getElementById('knowledgeLinkName');
            const sourceInput = document.getElementById('knowledgeLinkSource');
            const notesInput = document.getElementById('knowledgeLinkNotes');
            const source = (sourceInput?.value || '').trim();
            const notes = (notesInput?.value || '').trim();
            const name = (nameInput?.value || '').trim() || deriveKnowledgeDisplayName(source);

            if (!source) {
                setKnowledgeLinkStatus('Enter a URL or local path to link a knowledge source.', 'error');
                return;
            }

            const sourceKind = /^https?:\/\//i.test(source) ? 'url' : 'path';
            const linkedItem = {
                id: generateClientId('knowledge_link'),
                name,
                description: notes || `Linked ${sourceKind} source available to every new session by default.`,
                triggers: buildKnowledgeTriggers(name, notes, source),
                category: 'source',
                core_content: [
                    `Default linked knowledge source: ${source}`,
                    sourceKind === 'url'
                        ? 'Use the web tool to fetch this source when it is relevant to the task.'
                        : 'Use the file tool to inspect this path when it is relevant to the task.',
                    notes ? `User notes: ${notes}` : '',
                ].filter(Boolean).join('\n\n'),
                references: [],
                metadata: {
                    origin: 'user',
                    linked_source: 'true',
                    source_link: source,
                    source_kind: sourceKind,
                },
                enabled: true,
                priority: 50,
            };

            try {
                await invoke('upsert_knowledge_item', { item: linkedItem });
                const sessionId = await ensureDefaultKnowledgeSessionId();
                await invoke('set_knowledge_enabled', {
                    session_id: sessionId,
                    knowledge_id: linkedItem.id,
                    enabled: true,
                });
                if (nameInput) nameInput.value = '';
                if (sourceInput) sourceInput.value = '';
                if (notesInput) notesInput.value = '';
                onboardingActiveKnowledgeGroupId = 'source';
                onboardingKnowledgeSearchQuery = '';
                onboardingKnowledgeMode = 'link-source';
                await loadDefaultKnowledgeStep();
                syncKnowledgeModeUi();
                setKnowledgeLinkStatus('Linked knowledge source added and enabled by default.', 'success');
            } catch (error) {
                console.error('Failed to add linked knowledge source:', error);
                setKnowledgeLinkStatus(`Failed to add linked source: ${error}`, 'error');
            }
        }

        async function updateLLMProvider(provider) {
            setResolvedOllamaModel('');
            setCloudSelectedModel('');
            syncLlmQuickSetupUi(provider);
            // Render config UI immediately so the form always reflects the
            // selected provider, even if the backend invoke fails.
            // NOTE: Skip auto-fetching Ollama models here; if the provider change
            // is persisted successfully we will re-hydrate (including the saved
            // Ollama endpoint) and fetch models from the correct URL.
            renderLLMConfig({ fetchOllamaModels: false });
            let providerPersisted = false;
            try {
                await invoke('update_llm_provider', { provider });
                providerPersisted = true;
            } catch (error) {
                console.error('Error updating LLM provider:', error);
            }

            // If we couldn't persist the provider change, still try to fetch Ollama
            // models for a decent UX when the user selects Ollama.
            if (!providerPersisted && provider === 'ollama') {
                try {
                    await fetchOllamaModels();
                } catch (_) {
                    // Non-fatal: fetchOllamaModels already renders a fallback input.
                }
            }

            // Re-hydrate from the latest config after changing providers so the
            // UI reflects persisted defaults (and we avoid saving hard-coded
            // fallbacks if the user doesn't touch the fields).
            if (providerPersisted) {
                try {
                    await loadLLMConfig();
                } catch (error) {
                    console.warn('[Onboarding] loadLLMConfig after provider change failed:', error);
                }
            }
        }

        function llmApiKeyLabel(provider) {
            if (provider === 'openai') return 'OpenAI API Key';
            if (provider === 'anthropic') return 'Anthropic API Key';
            if (provider === 'gemini') return 'Gemini (Google) API Key';
            if (provider === 'grok') return 'Grok (xAI) API Key';
            return 'API Key';
        }

        function llmApiKeyPlaceholder(provider) {
            if (provider === 'openai') return 'sk-...';
            if (provider === 'anthropic') return 'sk-ant-...';
            if (provider === 'gemini') return 'AIza...';
            if (provider === 'grok') return 'xai-...';
            return 'Enter your API key';
        }

        function llmApiKeyHelpText(provider) {
            if (provider === 'openai') return 'Get your API key from <a href="https://platform.openai.com/api-keys" target="_blank">OpenAI Platform</a>.';
            if (provider === 'anthropic') return 'Get your API key from <a href="https://console.anthropic.com/" target="_blank">Anthropic Console</a>.';
            if (provider === 'gemini') return 'Get your API key from <a href="https://aistudio.google.dev/apikey" target="_blank">Google AI Studio</a>.';
            if (provider === 'grok') return 'Get your API key from <a href="https://console.x.ai/" target="_blank">xAI Console</a>.';
            return '';
        }

        async function hydrateLlmApiKeyPlaceholder(provider) {
            try {
                // Only relevant for hosted providers.
                if (!(provider === 'openai' || provider === 'anthropic' || provider === 'gemini' || provider === 'grok')) return;

                // Avoid updating stale DOM if the user switched providers quickly.
                const currentProvider = document.getElementById('llmProvider')?.value;
                if (currentProvider !== provider) return;

                const input = document.getElementById('apiKey');
                if (!input) return;

                // Never populate actual API keys into the DOM.
                input.value = '';
                input.placeholder = llmApiKeyPlaceholder(provider);

                const deleteBtn = document.getElementById('deleteApiKeyBtn');

                const hasKey = await invoke('has_api_key', { provider });
                if (hasKey === true) {
                    input.placeholder = '••••••••••••••••';
                    // Show the delete button and wire it up (CSP-safe).
                    if (deleteBtn) {
                        deleteBtn.style.display = '';
                        deleteBtn.onclick = async () => {
                            try {
                                await invoke('delete_api_key', { provider });
                                input.value = '';
                                input.placeholder = llmApiKeyPlaceholder(provider);
                                deleteBtn.style.display = 'none';
                                await fetchCloudModels(provider);
                            } catch (err) {
                                console.error('Failed to delete API key:', err);
                            }
                        };
                    }
                } else if (deleteBtn) {
                    deleteBtn.style.display = 'none';
                    deleteBtn.onclick = null;
                }
            } catch (e) {
                // Non-fatal; keep base placeholder.
                console.warn('[Onboarding] has_api_key placeholder hydration failed:', e);
            }
        }

        /// Fetch models from the Ollama endpoint and automatically choose the best available one.
        async function fetchOllamaModels() {
            const endpoint = onboardingOllamaEndpoint || DEFAULT_OLLAMA_BASE_URL;
            const status = document.getElementById('ollamaStatus');
            const requestedModel = onboardingResolvedOllamaModel;
            setResolvedOllamaModel('');
            setOllamaQuickSetupInstructionsVisible(true);

            if (status) {
                setInlineStatusMessage('ollamaStatus', 'Checking Ollama and looking for a recommended local model…');
            }

            try {
                const models = await invoke('list_ollama_models', { endpoint });
                const modelNames = (Array.isArray(models) ? models : []).map(model => model?.name || '').filter(Boolean);
                if (!modelNames.length) {
                    setInlineStatusMessage(
                        'ollamaStatus',
                        'Ollama is running, but no models are installed yet. Pull at least one supported model before continuing.',
                        'warning'
                    );
                    return '';
                }

                const chosenModel = selectPreferredOllamaModelName(modelNames, requestedModel);
                setResolvedOllamaModel(chosenModel);
                if (isAgenticOllamaModelName(chosenModel)) {
                    setOllamaQuickSetupInstructionsVisible(false);
                    setInlineStatusMessage(
                        'ollamaStatus',
                        `✓ Ollama connected — Gestura will use ${chosenModel} automatically.`,
                        'success'
                    );
                } else {
                    setOllamaQuickSetupInstructionsVisible(true);
                    setInlineStatusMessage(
                        'ollamaStatus',
                        `Ollama is connected, but ${chosenModel} may not be strong enough for agentic work. Pull a recommended model like devstral or qwen3:14b to continue.`,
                        'warning'
                    );
                }
                return chosenModel;
            } catch (error) {
                console.error('Failed to fetch Ollama models:', error);
                setOllamaQuickSetupInstructionsVisible(true);
                setInlineStatusMessage(
                    'ollamaStatus',
                    'We could not reach Ollama. Install it, make sure the local service is running, and pull a supported model before continuing.',
                    'error'
                );
                return '';
            }
        }

        /// Fetch models for a cloud provider and choose one automatically.
        /// Uses the API key from the input field, or falls back to the keychain.
        async function fetchCloudModels(provider) {
            const statusElementId = 'cloudModelStatus';
            const listCmd = {
                openai: 'list_openai_models',
                anthropic: 'list_anthropic_models',
                grok: 'list_grok_models',
                gemini: 'list_gemini_models',
            }[provider];
            if (!listCmd) return '';

            const apiKeyInput = document.getElementById('apiKey');
            const apiKey = (apiKeyInput?.value || '').trim();

            let hasKeychainKey = false;
            try {
                hasKeychainKey = await invoke('has_api_key', { provider });
            } catch (_) { }

            if (!apiKey && !hasKeychainKey) {
                setCloudSelectedModel('');
                setInlineStatusMessage(statusElementId, `Add a ${llmApiKeyLabel(provider)} to verify the connection.`, 'warning');
                return '';
            }

            setInlineStatusMessage(statusElementId, 'Checking available models for this provider…');

            try {
                if (apiKey) {
                    try { await invoke('store_api_key', { provider, api_key: apiKey }); } catch (_) { }
                }

                const models = await invoke(listCmd, { api_key: apiKey });
                const selectedModel = selectPreferredCloudModelId(models, onboardingResolvedCloudModel);

                if (!selectedModel) {
                    setCloudSelectedModel('');
                    setInlineStatusMessage(statusElementId, 'No models were returned for this provider.', 'warning');
                    return '';
                }

                setCloudSelectedModel(selectedModel);
                setInlineStatusMessage(statusElementId, `✓ Verified — Gestura will use ${selectedModel} automatically.`, 'success');
                return selectedModel;
            } catch (error) {
                console.error(`Failed to fetch ${provider} models:`, error);
                setCloudSelectedModel('');
                const errorMessage = error?.message || String(error);
                setInlineStatusMessage(statusElementId, `We could not verify ${provider} models yet. ${errorMessage}`, 'error');
                return '';
            }
        }

                }
            }
        }

        // Load LLM config from saved settings and render
        async function loadLLMConfig() {
            try {
                const config = await invoke('get_config');
                const llmPrimary = config?.llm?.primary || 'ollama';
                const ollamaConfig = config?.llm?.ollama;
                const hasSavedCloudConfig = Boolean(
                    config?.llm?.openai ||
                    config?.llm?.anthropic ||
                    config?.llm?.gemini ||
                    config?.llm?.grok
                );
                const shouldPreferSimpleLocalOnboarding = llmPrimary === 'anthropic' && !hasSavedCloudConfig && !ollamaConfig;
                const effectivePrimary = shouldPreferSimpleLocalOnboarding ? 'ollama' : llmPrimary;
                onboardingLlmMode = inferLlmSetupMode(effectivePrimary);

                // Set the provider dropdown
                const providerSelect = document.getElementById('llmProvider');
                if (providerSelect) {
                    providerSelect.value = effectivePrimary;
                }
                syncLlmQuickSetupUi(effectivePrimary);

                const savedCloudModel = (config?.llm?.[effectivePrimary]?.model || '').trim();

                // Render config UI without auto-fetch so we can hydrate saved values first.
                renderLLMConfig({
                    fetchOllamaModels: false,
                    fetchCloudModels: false,
                    preferredCloudModel: savedCloudModel,
                });

                // Populate Ollama fields if applicable.
                if (effectivePrimary === 'ollama') {
                    onboardingOllamaEndpoint = (ollamaConfig?.base_url || '').trim() || DEFAULT_OLLAMA_BASE_URL;
                    setResolvedOllamaModel((ollamaConfig?.model || '').trim());
                    try {
                        await fetchOllamaModels();
                    } catch (_) { }
                }

                if (effectivePrimary === 'openai' || effectivePrimary === 'anthropic' || effectivePrimary === 'gemini' || effectivePrimary === 'grok') {
                    setCloudSelectedModel(savedCloudModel);
                    await fetchCloudModels(effectivePrimary);
                }
            } catch (error) {
                console.error('Error loading LLM config:', error);
                onboardingLlmMode = 'simple';
                setResolvedOllamaModel('');
                setCloudSelectedModel('');
                syncLlmQuickSetupUi('ollama');
                renderLLMConfig();
            }
        }

        async function updateAgentPermissionLevel(level) {
            // Remember the user's choice for this onboarding session so if they
            // navigate back to this step we don't reset to the template default.
            window.__onboardingAgentPermLevel = level;

            // Ensure the semantic radio state is correct, then sync our custom visuals.
            // (WKWebView + hidden native radios means our UI depends on this sync.)
            const radio = document.querySelector(`input[name="agentPermLevel"][value="${level}"]`);
            if (radio) radio.checked = true;
            syncOptionCardBordersForRadioGroup('agentPermLevel');
            try {
                await invoke('set_default_permission_level', { level });
                console.log('[Onboarding] Set default agent permission level:', level);
            } catch (error) {
                console.error('[Onboarding] Error setting agent permission level:', error);
                // Keep UI consistent with the selected radio even if persistence fails.
            } finally {
                syncOptionCardBordersForRadioGroup('agentPermLevel');
            }
        }

        async function loadAgentPermissionLevel() {
            // UX policy: always default onboarding to Sandbox (Recommended).
            // We ignore any previously persisted global default here.
            try {
                let level = (window.__onboardingAgentPermLevel || 'sandbox').toLowerCase();
                if (!['sandbox', 'restricted', 'full'].includes(level)) level = 'sandbox';

                const radio = document.querySelector(`input[name="agentPermLevel"][value="${level}"]`);
                if (radio) radio.checked = true;
                syncOptionCardBordersForRadioGroup('agentPermLevel');

                // Persist the default so continuing without interaction still uses Sandbox.
                // If the user changes it, updateAgentPermissionLevel() will persist their choice.
                if (!window.__onboardingAgentPermLevel && level === 'sandbox') {
                    try {
                        await invoke('set_default_permission_level', { level: 'sandbox' });
                    } catch (e) {
                        console.warn('[Onboarding] Failed to persist sandbox default permission level:', e);
                    }
                }
            } catch (error) {
                console.error('[Onboarding] Error loading agent permission level:', error);
                // Fallback: enforce Sandbox so a default is always visible.
                const fallback = document.querySelector('input[name="agentPermLevel"][value="sandbox"]');
                if (fallback) fallback.checked = true;
                syncOptionCardBordersForRadioGroup('agentPermLevel');
            }
        }

        async function scanForRings() {
            const btn = document.getElementById('scanBtn');
            const status = document.getElementById('ringStatus');
            btn.textContent = 'Scanning...';
            btn.disabled = true;
            try {
                const rings = await invoke('scan_for_rings');
                status.textContent = rings?.length > 0 ? `Found ${rings.length} device(s)` : 'No devices found. Make sure your device is in pairing mode.';
            } catch (error) {
                status.textContent = 'Bluetooth scan failed. Check permissions.';
            } finally {
                btn.textContent = 'Scan for Devices';
                btn.disabled = false;
            }
        }

        // Initialize when DOM is ready (handles cases where the script executes after DOMContentLoaded).
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                void initOnboarding();
            });
        } else {
            void initOnboarding();
        }

        // External link handler — open in system default browser via opener plugin
        document.addEventListener('click', (e) => {
            const anchor = e.target.closest('a[href]');
            if (!anchor) return;
            const href = anchor.getAttribute('href') || '';
            if (/^https?:\/\//i.test(href)) {
                e.preventDefault();
                if (window.__TAURI__?.opener?.openUrl) {
                    window.__TAURI__.opener.openUrl(href).catch((err) =>
                        console.error('[opener] Failed to open URL:', href, err)
                    );
                }
            }
        });
    </script>
</body>

</html>
