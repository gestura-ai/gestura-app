<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Gestura</title>
    <link rel="stylesheet" href="icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        :root {
            /* Gestura brand tokens (unified with gestura.app) */
            --accent-primary: rgb(37, 99, 235);
            --accent-primary-rgb: 37, 99, 235;
            --accent-secondary: rgb(147, 51, 234);
            --accent-secondary-rgb: 147, 51, 234;
            --gradient-primary: linear-gradient(to right, rgb(37, 99, 235), rgb(147, 51, 234));
            --gradient-secondary: linear-gradient(to right, rgb(96, 165, 250), rgb(192, 132, 252));
            --brand-gradient: var(--gradient-primary);
            --focus-ring: rgba(var(--accent-primary-rgb), 0.35);

            /* Motion tokens (snappy, non-sliding) */
            --motion-fast: 120ms;
            --motion-ease: cubic-bezier(0.2, 0.8, 0.2, 1);

            /* Semantic RGB triples for rgba(..., alpha) */
            --success-rgb: 52, 199, 89;
            --warning-rgb: 255, 149, 0;
            --danger-rgb: 255, 59, 48;

            /* Light theme variables */
            --background-color: #ffffff;
            --text-color: #1a1a1a;
            --text-secondary: #666666;
            --border-color: #e0e0e0;
            --surface-color: #f8f9fa;
            --success-color: rgb(var(--success-rgb));
            --warning-color: rgb(var(--warning-rgb));
            --error-color: rgb(var(--danger-rgb));
        }

        /* Auto mode: respect system preference */
        @media (prefers-color-scheme: dark) {
            :root {
                /* Dark theme variables */
                --background-color: #1e1e1e;
                --text-color: #ffffff;
                --text-secondary: #b0b0b0;
                --border-color: #404040;
                --surface-color: #2d2d2d;
                --accent-primary: rgb(96, 165, 250);
                --accent-primary-rgb: 96, 165, 250;
                --accent-secondary: rgb(192, 132, 252);
                --accent-secondary-rgb: 192, 132, 252;
                --brand-gradient: var(--gradient-secondary);
                --focus-ring: rgba(var(--accent-primary-rgb), 0.55);
            }
        }

        /* Force light mode (overrides system preference) */
        html[data-theme="light"] {
            --accent-primary: rgb(37, 99, 235);
            --accent-primary-rgb: 37, 99, 235;
            --accent-secondary: rgb(147, 51, 234);
            --accent-secondary-rgb: 147, 51, 234;
            --brand-gradient: var(--gradient-primary);
            --focus-ring: rgba(var(--accent-primary-rgb), 0.35);

            --background-color: #ffffff;
            --text-color: #1a1a1a;
            --text-secondary: #666666;
            --border-color: #e0e0e0;
            --surface-color: #f8f9fa;
        }

        /* Force dark mode (overrides system preference) */
        html[data-theme="dark"] {
            --accent-primary: rgb(96, 165, 250);
            --accent-primary-rgb: 96, 165, 250;
            --accent-secondary: rgb(192, 132, 252);
            --accent-secondary-rgb: 192, 132, 252;
            --brand-gradient: var(--gradient-secondary);
            --focus-ring: rgba(var(--accent-primary-rgb), 0.55);

            --background-color: #1e1e1e;
            --text-color: #ffffff;
            --text-secondary: #b0b0b0;
            --border-color: #404040;
            --surface-color: #2d2d2d;
        }

        .text-gradient {
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
        }

        @media (forced-colors: active) {
            .text-gradient {
                background: none;
                color: ButtonText;
                -webkit-text-fill-color: ButtonText;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
        }

        body {
            background: var(--background-color);
            color: var(--text-color);
        }

        .onboarding-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 720px;
            margin: 0 auto;
            padding: 1.25rem;
            width: 100%;
        }

        .header {
            position: relative;
            text-align: left;
            margin-bottom: 1rem;
            /* Shrink logo by another ~1/3 (147px -> ~98px). */
            --header-logo-size: 50px;
            overflow: visible;
        }

        .header h1 {
            position: relative;
            display: inline-block;
            font-size: 1.75rem;
            margin-bottom: 0.05rem;
            line-height: 1.15;
            left: 25px;
            top: auto;
            right: auto;
            bottom: auto;
            z-index: 0;
        }

        .header-logo {
            position: absolute;
            /*
	             * Align the SVG to the LEFT edge of the “Welcome to Gestura” title.
	             * Let it overflow only to the RIGHT + BOTTOM (never above the title),
	             * so the top of the logo won't get cropped by the viewport.
	             */
            left: -35px;
            top: -15px;
            right: auto;
            bottom: auto;
            width: var(--header-logo-size);
            height: var(--header-logo-size);
            opacity: 1;
            pointer-events: none;
            user-select: none;
            z-index: 0;
        }

        .header-title {
            position: relative;
            z-index: 1;
            display: inline-block;
        }

        .header p {
            z-index: 1;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .progress-container {
            margin-bottom: 0.75rem;
        }

        .progress-bar {
            height: 4px;
            background: var(--border-color);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--brand-gradient);
            transition: width var(--motion-fast) var(--motion-ease);
        }

        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .step-content {
            /*
	             * Default: content-driven height (no internal scrolling).
	             * If the window height is clamped (max height), JS will toggle
	             * `.is-scrollable` to keep header/footer fixed and scroll only the
	             * content area.
	             */
            flex: 0 0 auto;
            background: var(--surface-color);
            border-radius: 10px;
            padding: 1rem;
            border: 1px solid var(--border-color);
            overflow-y: hidden;
            opacity: 1;
            transition: opacity var(--motion-fast) var(--motion-ease), max-height var(--motion-fast) var(--motion-ease);
            will-change: opacity;
        }

        .step-content.is-scrollable {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
        }

        .step-content.is-hidden {
            opacity: 0;
        }

        .step-content.is-visible {
            opacity: 1;
        }

        @media (prefers-reduced-motion: reduce) {

            .progress-fill,
            .step-content {
                transition: none !important;
            }
        }

        .step-content h2 {
            margin-bottom: 0.75rem;
            font-size: 1.25rem;
        }

        .step-content p {
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            margin: 1rem 0;
        }

        .feature-card {
            background: var(--background-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.75rem;
        }

        .feature-card h3 {
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
        }

        .feature-card p {
            font-size: 0.8rem;
            margin-bottom: 0;
        }

        .btn {
            padding: 0.6rem 1.25rem;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--brand-gradient);
            color: white;
        }

        .btn-primary:hover {
            filter: brightness(0.97);
            transform: translateY(-1px);
        }

        .btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        .btn-secondary {
            background: var(--surface-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--border-color);
        }

        .btn-small {
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
        }

        .btn-success {
            background: var(--success-color);
            color: white;
        }

        .button-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            margin-top: 0.75rem;
            padding-top: 0.25rem;
        }

        .button-row .btn {
            min-width: 120px;
        }

        .permissions-list {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .permission-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: start;
            gap: 0.625rem;
            padding: 0.625rem 0.75rem;
            background: var(--background-color);
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .permission-info {
            flex: 1;
            min-width: 0;
        }

        .permission-info strong {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.2rem 0.45rem;
            font-size: 0.88rem;
            line-height: 1.2;
        }

        .permission-info p {
            margin: 0.18rem 0 0 0;
            font-size: 0.76rem;
            line-height: 1.28;
        }

        .permission-row .help-text {
            margin-top: 0.18rem;
            font-size: 0.73rem;
            line-height: 1.25;
        }

        .permission-action {
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .required-badge,
        .optional-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.12rem 0.42rem;
            border-radius: 999px;
            font-size: 0.67rem;
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        .required-badge {
            background: rgba(var(--accent-primary-rgb), 0.12);
            color: var(--accent-primary);
            border: 1px solid rgba(var(--accent-primary-rgb), 0.22);
        }

        .optional-badge {
            background: rgba(148, 163, 184, 0.12);
            color: var(--text-secondary);
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .btn-permission {
            padding: 0.34rem 0.75rem;
            font-size: 0.78rem;
        }

        .permission-status {
            margin-left: 0.5rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .status-granted {
            background: rgba(var(--success-rgb), 0.14);
            border: 1px solid rgba(var(--success-rgb), 0.28);
            color: rgb(var(--success-rgb));
        }

        .status-denied {
            background: rgba(var(--danger-rgb), 0.14);
            border: 1px solid rgba(var(--danger-rgb), 0.28);
            color: rgb(var(--danger-rgb));
        }

        .status-unknown {
            background: rgba(var(--warning-rgb), 0.14);
            border: 1px solid rgba(var(--warning-rgb), 0.28);
            color: rgb(var(--warning-rgb));
        }

        select {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--background-color);
            color: var(--text-color);
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }

        select:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        .config-section {
            margin-bottom: 1rem;
        }

        .config-section label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 500;
            font-size: 0.85rem;
        }

        /* Shared input styling for onboarding provider fields */
        input[type="text"].onb-input,
        input[type="number"].onb-input,
        input[type="password"].onb-input,
        select.onb-input {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--background-color);
            color: var(--text-color);
            font-size: 0.9rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"].onb-input:focus,
        input[type="number"].onb-input:focus,
        input[type="password"].onb-input:focus,
        select.onb-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        input[type="text"].onb-input::placeholder,
        input[type="password"].onb-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.7;
        }

        /* API key row layout */
        .api-key-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .api-key-row .onb-input {
            flex: 1;
        }

        .btn-delete-api-key {
            white-space: nowrap;
            padding: 0.4rem 0.75rem;
            border: 1px solid rgb(var(--danger-rgb, 220, 38, 38));
            color: rgb(var(--danger-rgb, 220, 38, 38));
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.15s, color 0.15s;
        }

        .btn-delete-api-key:hover {
            background: rgb(var(--danger-rgb, 220, 38, 38));
            color: #fff;
        }

        /* Help / hint text beneath form fields */
        .help-text {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.35rem;
            line-height: 1.4;
        }

        .help-text a {
            color: var(--accent-primary);
            text-decoration: none;
            border-bottom: 1px solid rgba(99, 102, 241, 0.3);
            transition: border-color 0.2s, opacity 0.2s;
        }

        .help-text a:hover {
            border-bottom-color: var(--accent-primary);
            opacity: 0.85;
        }

        /* Radio option cards – keep radio circle on the same line as the text */
        .option-card {
            position: relative;
        }

        .option-card label {
            display: flex;
            align-items: flex-start;
            cursor: pointer;
            gap: 0.75rem;
        }

        /*
         * Custom radio indicator.
         * Rationale: some WebView/Safari setups can render native radio states with
         * very low contrast (or ignore accent-color). We render our own circle/dot
         * driven by JS (data-checked="true") so the default selection is obvious.
         */
        .option-card label::before {
            content: '';
            display: inline-block;
            width: 18px;
            height: 18px;
            border-radius: 999px;
            border: 2px solid var(--border-color);
            box-sizing: border-box;
            margin-top: 0.2rem;
            background: transparent;
            flex-shrink: 0;
        }

        .option-card[data-checked="true"] label::before,
        .option-card:has(input[type="radio"]:checked) label::before {
            border-color: var(--accent-primary);
            background: radial-gradient(circle at center, var(--accent-primary) 0 45%, transparent 46%);
        }

        .option-card label input[type="radio"] {
            /* Keep semantic input in the DOM but hide native glyph (we draw our own above). */
            position: absolute;
            opacity: 0;
            width: 1px;
            height: 1px;
            pointer-events: none;
        }

        .option-card label:focus-within {
            outline: none;
            box-shadow: 0 0 0 4px var(--focus-ring);
            border-radius: 6px;
        }

        .option-card label>div {
            flex: 1;
            min-width: 0;
        }

        /* Consent rows – keep checkbox on the same line as the text.
	           Do not rely on style="..." attributes since the Tauri webview CSP
	           may ignore inline styles for dynamically injected step HTML. */
        label.consent-row {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            cursor: pointer;
        }

        label.consent-row input[type="checkbox"] {
            flex-shrink: 0;
            margin-top: 0.25rem;
        }

        label.consent-row>div {
            flex: 1;
            min-width: 0;
        }

        label.consent-row p {
            margin: 0.25rem 0 0;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .info-note {
            display: flex;
            gap: 0.75rem;
            align-items: flex-start;
            padding: 0.85rem 0.95rem;
            border-radius: 8px;
            background: rgba(var(--accent-primary-rgb), 0.08);
            border: 1px solid rgba(var(--accent-primary-rgb), 0.18);
            margin-top: 1rem;
        }

        .info-note strong {
            display: block;
            font-size: 0.86rem;
            margin-bottom: 0.2rem;
        }

        .info-note p {
            margin: 0;
            font-size: 0.82rem;
            color: var(--text-secondary);
        }

        .selection-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .selection-card {
            background: var(--background-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.85rem 0.95rem;
        }

        .selection-card.disabled {
            opacity: 0.72;
        }

        .selection-card-header {
            display: flex;
            gap: 0.75rem;
            justify-content: space-between;
            align-items: flex-start;
        }

        .selection-card-title {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.92rem;
            font-weight: 600;
            line-height: 1.25;
        }

        .selection-card-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            margin-top: 0.35rem;
        }

        .selection-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.14rem 0.42rem;
            border-radius: 999px;
            font-size: 0.68rem;
            font-weight: 600;
            background: var(--surface-color);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .selection-card-description {
            margin-top: 0.65rem;
            font-size: 0.82rem;
            color: var(--text-secondary);
            line-height: 1.45;
        }

        .selection-card-source {
            margin-top: 0.55rem;
            font-size: 0.78rem;
            color: var(--text-secondary);
            word-break: break-word;
        }

        .selection-toggle {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.82rem;
            color: var(--text-secondary);
        }

        .selection-toggle input[type="checkbox"] {
            margin: 0;
        }

        .selection-empty-state {
            padding: 1rem;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 0.84rem;
            background: var(--background-color);
            text-align: center;
        }

        .selection-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.75rem;
        }

        .quick-choice-grid {
            gap: 0.55rem;
            align-items: stretch;
        }

        .quick-choice-grid--stt,
        .quick-choice-grid--tools {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .quick-choice-grid--llm {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .quick-choice-grid--knowledge {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .quick-choice-card {
            padding: 0.65rem 0.75rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--background-color);
            transition: border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
            height: 100%;
        }

        .quick-choice-card label {
            display: flex;
            height: 100%;
        }

        .quick-choice-card label>div {
            display: flex;
            flex: 1;
            flex-direction: column;
            min-width: 0;
        }

        .quick-choice-card:hover,
        .quick-choice-card:focus-within {
            border-color: rgba(var(--accent-primary-rgb), 0.42);
            background: rgba(var(--accent-primary-rgb), 0.05);
        }

        .quick-choice-card[data-checked="true"] {
            background: rgba(var(--accent-primary-rgb), 0.08);
        }

        .quick-choice-eyebrow {
            display: inline-flex;
            margin-bottom: 0.18rem;
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            color: var(--accent-primary);
        }

        .quick-choice-card strong {
            display: block;
            font-size: 0.9rem;
            line-height: 1.15;
        }

        .quick-choice-card p {
            margin: 0.22rem 0 0;
            font-size: 0.76rem;
            line-height: 1.3;
            color: var(--text-secondary);
            flex: 1;
        }

        .quick-choice-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.28rem;
            margin-top: 0.38rem;
        }

        .quick-choice-card--span-2 {
            grid-column: span 2;
        }

        .advanced-toggle-row {
            display: flex;
            justify-content: flex-start;
            margin-top: 0.85rem;
        }

        .advanced-panel {
            margin-top: 0.75rem;
            padding: 0.9rem 0.95rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--surface-color);
        }

        .compact-inline-field {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            align-items: center;
            gap: 0.55rem;
            margin-bottom: 0.35rem;
        }

        .compact-inline-field label {
            margin-bottom: 0;
            white-space: nowrap;
            font-size: 0.8rem;
            line-height: 1;
        }

        select.onb-input.onb-input--compact {
            padding: 0.32rem 1.9rem 0.32rem 0.55rem;
            min-height: 2rem;
            font-size: 0.82rem;
        }

        .compact-inline-help {
            margin: 0;
            font-size: 0.72rem;
            line-height: 1.2;
        }

        .ollama-guidance {
            margin-top: 0.75rem;
        }

        .ollama-guidance-list {
            margin: 0.45rem 0 0 1rem;
            padding: 0;
            color: var(--text-secondary);
            font-size: 0.8rem;
            line-height: 1.45;
        }

        .ollama-guidance-list li+li {
            margin-top: 0.2rem;
        }

        .provider-validation-status {
            margin-top: 0.45rem;

<body>
    <div class="onboarding-container">
        <div class="header">
            <h1>
                <img class="header-logo" src="assets/gestura-app.svg" alt="" aria-hidden="true">
                <span class="header-title"><span class="text-gradient">Gestura</span></span>
            </h1>
        </div>

        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="step-indicator">
                <span id="stepNumber">Step 1 of 9</span>
                <span id="stepName">Configure</span>
            </div>
        </div>

        <div class="step-content" id="stepContent">
            <!-- Dynamic step content -->
        </div>

        <div class="button-row">
            <button class="btn btn-secondary" id="prevBtn" style="visibility: hidden;">Previous</button>
            <button class="btn btn-primary" id="nextBtn">Get Started</button>
        </div>
    </div>

    <script>
        function getTauriInvoke() {
            const w = window;
            // Tauri (public global) support
            if (w.__TAURI__ && w.__TAURI__.core && typeof w.__TAURI__.core.invoke === 'function') {
                return w.__TAURI__.core.invoke;
            }
            // Tauri (internal) support (useful for tests / alternate runtimes)
            if (w.__TAURI_INTERNALS__ && typeof w.__TAURI_INTERNALS__.invoke === 'function') {
                return w.__TAURI_INTERNALS__.invoke;
            }
            return null;
        }

        // =====================================================================
        // Theme Management
        // =====================================================================
        async function initTheme() {
            try {
                const tauriInvoke = getTauriInvoke();
                if (!tauriInvoke) {
                    applyTheme('system');
                    return;
                }
                const config = await tauriInvoke('get_config');
                const themeMode = config?.ui?.theme_mode || 'system';
                applyTheme(themeMode);

                if (themeMode === 'system') {
                    const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                    const handler = () => applyTheme('system');
                    // Safari 13 compatibility: MediaQueryList used addListener/removeListener.
                    if (typeof mediaQuery.addEventListener === 'function') {
                        mediaQuery.addEventListener('change', handler);
                    } else if (typeof mediaQuery.addListener === 'function') {
                        // eslint-disable-next-line deprecation/deprecation
                        mediaQuery.addListener(handler);
                    }
                }
            } catch (e) {
                console.error('[Theme] Failed to initialize theme:', e);
                applyTheme('system');
            }
        }

        function applyTheme(mode) {
            const html = document.documentElement;
            if (mode === 'light') {
                html.setAttribute('data-theme', 'light');
            } else if (mode === 'dark') {
                html.setAttribute('data-theme', 'dark');
            } else {
                html.removeAttribute('data-theme');
            }
        }

        void initTheme();

        // =====================================================================
        // Onboarding Logic
        // =====================================================================
        let invoke = getTauriInvoke();
        if (!invoke) {
            console.warn('[Onboarding] Tauri API not available — some actions may be unavailable (completion, downloads, permissions)');
            invoke = () => Promise.reject(new Error('Tauri API not available'));
        }

        let currentStep = 0;
        let lastSystemPermissionsResult = null;
        let isTransitioning = false;
        let prefersReducedMotion = false;

        function initReducedMotionListener() {
            if (!window.matchMedia) return;
            const media = window.matchMedia('(prefers-reduced-motion: reduce)');
            const update = () => {
                prefersReducedMotion = !!media.matches;
            };
            update();

            if ('addEventListener' in media) {
                media.addEventListener('change', update);
            } else {
                // Safari 13 compatibility
                // eslint-disable-next-line deprecation/deprecation
                media.addListener(update);
            }
        }

        function getMotionMs() {
            return prefersReducedMotion ? 0 : 120;
        }

        // =====================================================================
        // Dynamic window height (step-aware)
        // =====================================================================
        const ONBOARDING_MIN_HEIGHT_PX = 580;
        const ONBOARDING_MAX_HEIGHT_SCREEN_RATIO = 1.0;
        const ONBOARDING_MAX_HEIGHT_SCREEN_MARGIN_PX = 12;
        const ONBOARDING_WINDOW_FRAME_ALLOWANCE_PX = 42;
        const ONBOARDING_RESIZE_EASING = { x1: 0.2, y1: 0.8, x2: 0.2, y2: 1 };
        const ONBOARDING_HEIGHT_EPSILON_PX = 2;
        const ONBOARDING_SCROLL_MIN_CONTENT_PX = 160;

        let lastRequestedWindowHeightPx = null;
        let resizeAnimationToken = 0;
        let resizeDebounceTimer = null;

        function clamp(n, min, max) {
            return Math.max(min, Math.min(max, n));
        }

        function getMaxWindowHeightPx() {
            const screenAvail = (window.screen && Number.isFinite(window.screen.availHeight))
                ? window.screen.availHeight
                : 1000;
            const byRatio = Math.floor(screenAvail * ONBOARDING_MAX_HEIGHT_SCREEN_RATIO);
            const byMargin = Math.floor(screenAvail - ONBOARDING_MAX_HEIGHT_SCREEN_MARGIN_PX);
            return Math.max(ONBOARDING_MIN_HEIGHT_PX, Math.min(byRatio, byMargin));
        }

        function makeCubicBezier(x1, y1, x2, y2) {
            // Maps x in [0,1] -> y in [0,1] for the CSS cubic-bezier curve.
            // Uses Newton iterations with a binary-search fallback.
            const cx = 3 * x1;
            const bx = 3 * (x2 - x1) - cx;
            const ax = 1 - cx - bx;
            const cy = 3 * y1;
            const by = 3 * (y2 - y1) - cy;
            const ay = 1 - cy - by;

            const sampleX = (t) => ((ax * t + bx) * t + cx) * t;
            const sampleY = (t) => ((ay * t + by) * t + cy) * t;
            const sampleDerivX = (t) => (3 * ax * t + 2 * bx) * t + cx;

            const solveTForX = (x) => {
                let t = x;
                for (let i = 0; i < 8; i++) {
                    const xEst = sampleX(t) - x;
                    const d = sampleDerivX(t);
                    if (Math.abs(xEst) < 1e-4) return t;
                    if (Math.abs(d) < 1e-6) break;
                    t = t - xEst / d;
                }
                // Fallback binary search
                let lo = 0;
                let hi = 1;
                t = x;
                for (let i = 0; i < 12; i++) {
                    const xMid = sampleX(t);
                    if (Math.abs(xMid - x) < 1e-4) return t;
                    if (xMid < x) lo = t;
                    else hi = t;
                    t = (lo + hi) / 2;
                }
                return t;
            };

            return (x) => {
                if (x <= 0) return 0;
                if (x >= 1) return 1;
                return sampleY(solveTForX(x));
            };
        }

        const easeWindowHeight = makeCubicBezier(
            ONBOARDING_RESIZE_EASING.x1,
            ONBOARDING_RESIZE_EASING.y1,
            ONBOARDING_RESIZE_EASING.x2,
            ONBOARDING_RESIZE_EASING.y2,
        );

        function measureDesiredWindowHeightPx() {
            const container = document.querySelector('.onboarding-container');
            if (!container) return null;

            const containerWidth = Math.max(1, Math.floor(container.getBoundingClientRect().width || window.innerWidth || 720));

            // Clone the container off-screen and let it size to content.
            const clone = container.cloneNode(true);
            clone.style.position = 'absolute';
            clone.style.left = '-10000px';
            clone.style.top = '0';
            clone.style.width = `${containerWidth}px`;
            clone.style.maxWidth = `${containerWidth}px`;
            clone.style.height = 'auto';
            clone.style.maxHeight = 'none';
            clone.style.visibility = 'hidden';
            clone.style.pointerEvents = 'none';

            const cloneStepContent = clone.querySelector('#stepContent');
            if (cloneStepContent) {
                cloneStepContent.classList.remove('is-scrollable');
                cloneStepContent.style.maxHeight = 'none';
                cloneStepContent.style.overflowY = 'visible';
                cloneStepContent.style.flex = '0 0 auto';
            }

            document.body.appendChild(clone);
            const totalHeight = Math.ceil(clone.getBoundingClientRect().height);
            const stepContentHeight = cloneStepContent ? Math.ceil(cloneStepContent.getBoundingClientRect().height) : 0;
            document.body.removeChild(clone);

            return { totalHeight, stepContentHeight };
        }

        function applyStepContentScrollConstraint(enabled, maxHeightPx) {
            const stepContent = document.getElementById('stepContent');
            if (!stepContent) return;

            stepContent.classList.toggle('is-scrollable', enabled);
            if (!enabled) {
                stepContent.style.maxHeight = '';
                return;
            }

            const maxPx = Math.max(ONBOARDING_SCROLL_MIN_CONTENT_PX, Math.floor(maxHeightPx));
            stepContent.style.maxHeight = `${maxPx}px`;
        }

        async function safeSetWindowSize(widthPx, heightPx) {
            try {
                await invoke('set_window_size', { width: widthPx, height: heightPx });
                return true;
            } catch (e) {
                // Non-fatal: onboarding can still function without dynamic resizing.
                console.warn('[Onboarding] set_window_size failed:', e);
                return false;
            }
        }

        async function animateWindowHeightTo(targetHeightPx) {
            const motionMs = getMotionMs();
            const widthPx = Math.max(1, Math.round(window.innerWidth || 720));
            const fromHeightPx = Math.max(1, Math.round(lastRequestedWindowHeightPx ?? window.innerHeight ?? ONBOARDING_MIN_HEIGHT_PX));

            if (Math.abs(targetHeightPx - fromHeightPx) < ONBOARDING_HEIGHT_EPSILON_PX) {
                lastRequestedWindowHeightPx = targetHeightPx;
                void safeSetWindowSize(widthPx, targetHeightPx);
                return;
            }

            if (motionMs === 0) {
                lastRequestedWindowHeightPx = targetHeightPx;
                await safeSetWindowSize(widthPx, targetHeightPx);
                return;
            }

            const token = ++resizeAnimationToken;
            const start = performance.now();

            return new Promise((resolve) => {
                const tick = (now) => {
                    if (token !== resizeAnimationToken) return resolve();
                    const t = clamp((now - start) / motionMs, 0, 1);
                    const eased = easeWindowHeight(t);
                    const h = Math.round(fromHeightPx + (targetHeightPx - fromHeightPx) * eased);
                    void safeSetWindowSize(widthPx, h);
                    if (t >= 1) {
                        lastRequestedWindowHeightPx = targetHeightPx;
                        return resolve();
                    }
                    window.requestAnimationFrame(tick);
                };
                window.requestAnimationFrame(tick);
            });
        }

        async function resizeOnboardingWindowToFitContent() {
            const measured = measureDesiredWindowHeightPx();
            if (!measured) return;

            const maxHeight = getMaxWindowHeightPx();
            const desiredUnclamped = measured.totalHeight + ONBOARDING_WINDOW_FRAME_ALLOWANCE_PX;
            const targetHeight = clamp(desiredUnclamped, ONBOARDING_MIN_HEIGHT_PX, maxHeight);

            const fixedParts = Math.max(0, desiredUnclamped - (measured.stepContentHeight || 0));
            const shouldScroll = desiredUnclamped > maxHeight;
            const contentMax = shouldScroll ? (maxHeight - fixedParts) : null;

            if (shouldScroll && contentMax != null) {
                applyStepContentScrollConstraint(true, contentMax);
            } else {
                applyStepContentScrollConstraint(false, 0);
            }

            await animateWindowHeightTo(targetHeight);
        }

        function scheduleResizeToFit() {
            if (resizeDebounceTimer) window.clearTimeout(resizeDebounceTimer);
            resizeDebounceTimer = window.setTimeout(() => {
                resizeDebounceTimer = null;
                void resizeOnboardingWindowToFitContent();
            }, 0);
        }

        function initResizeObserver() {
            if (typeof ResizeObserver !== 'function') return;

                ro.observe(stepContent);
            } catch {
                // ignore
            }

            return new Promise((resolve) => window.setTimeout(resolve, ms));
        }

            return new Promise((resolve) => window.requestAnimationFrame(() => resolve()));

            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            if (prevBtn) prevBtn.disabled = disabled;
            if (nextBtn) {
                nextBtn.disabled = disabled;
                if (disabled) nextBtn.setAttribute('aria-busy', 'true');
                else nextBtn.removeAttribute('aria-busy');
            }
        }

            if (!stepContent) return;
            const motionMs = getMotionMs();

            stepContent.classList.add('is-visible');
            stepContent.classList.remove('is-hidden');

            if (motionMs === 0) {
                stepContent.innerHTML = html;
                await resizeOnboardingWindowToFitContent();
                return;
            }

            stepContent.classList.add('is-hidden');
            stepContent.classList.remove('is-visible');
            await sleep(motionMs);

            stepContent.innerHTML = html;

            // Resize while the new content is still hidden to avoid flicker.
            await resizeOnboardingWindowToFitContent();

            // Fade back in on next frame so hidden styles apply before transitioning.
            await nextFrame();
            stepContent.classList.add('is-visible');

        async function renderPermissions() {
            const container = document.getElementById('permissionsList');
            if (!container) return;

            try {
                const result = await invoke('check_system_permissions');
                lastSystemPermissionsResult = result;
                const permissions = (result && result.permissions) ? result.permissions : [];

                container.innerHTML = permissions.map(p => {
                    const id = p.id;
                    const status = p.status || 'unknown';
                    const isGranted = status === 'granted';
                    const requiredBadge = p.required ? '<span class="required-badge">Required</span>' : '<span class="optional-badge">Optional</span>';
                    const icon = permissionIconById[id] || '<span class="icon-lock"></span>';

                    const buttonLabel = status === 'denied' ? 'Open Settings' : 'Enable';

                    return `
                        <div class="permission-row">
                            <div class="permission-info">
                                <strong>${icon} ${p.name} ${requiredBadge}</strong>
                                <p>${p.description || ''}</p>
                                ${p.instructions ? `<p class="help-text">${p.instructions}</p>` : ''}
                            </div>
                            <div class="permission-action">
                                ${isGranted
                            ? `<span class="permission-status status-granted"><span class="icon-check"></span> Approved</span>`
                            : `<button class="btn btn-small btn-primary btn-permission" data-permission-id="${id}">${buttonLabel}</button>`
                        }
                            </div>
                        </div>
                `;
                }).join('');

                // Attach click listeners to permission buttons (CSP-safe).
                container.querySelectorAll('button[data-permission-id]').forEach(btn => {
                    btn.addEventListener('click', () => enablePermission(btn.dataset.permissionId));
                });
            } catch (error) {
                console.error('Error loading system permissions:', error);
                container.innerHTML = '<p class="help-text">Unable to load system permissions. Please try again.</p>';
            }
        }

        async function enablePermission(permissionId) {
            try {
                await invoke('request_permission', { permission: permissionId });
                // Wait a moment for the system dialog to appear/process
                setTimeout(async () => {
                    await renderPermissions();
                }, 1000);
            } catch (error) {
                console.error('Error requesting permission:', error);
                // Fallback to opening system preferences
                try {
                    const pane = systemPreferencesPaneByPermissionId[permissionId];
                    if (pane) await invoke('open_system_preferences', { pane });
                } catch (e) {
                    console.error('Error opening system preferences:', e);
                }
            }

        /// Attach programmatic event listeners to step elements.
        /// Tauri v2 injects CSP nonces into <script> tags which, per CSP3,
        /// disables 'unsafe-inline' for scripts — making inline event handlers
        /// (onchange, onclick, oninput) silently fail.  We use addEventListener
        /// instead so that all user interactions work regardless of CSP policy.
        function hydrateStepListeners(stepId) {
            if (stepId === 'stt') {
                document.querySelectorAll('input[name="sttSetupMode"]').forEach(el => {
                    el.addEventListener('change', () => {
                        if (el.checked) void setSttSetupMode(el.value);
                    });
                });
                document.getElementById('sttProvider')?.addEventListener('change', function () {
                    void updateSttProvider(this.value);
                });
            } else if (stepId === 'microphone') {
                document.getElementById('microphoneSelect')?.addEventListener('change', function () {
                    updateMicrophone(this.value);
                });
            } else if (stepId === 'llm') {
                document.querySelectorAll('input[name="llmSetupMode"]').forEach(el => {
                    el.addEventListener('change', () => {
                        if (el.checked) void setLlmSetupMode(el.value);
                    });
                });
                document.getElementById('llmProvider')?.addEventListener('change', function () {
                    updateLLMProvider(this.value);
                });
            } else if (stepId === 'default-tools') {
                document.querySelectorAll('input[name="defaultToolsMode"]').forEach(el => {
                    el.addEventListener('change', () => {
                        if (el.checked) void setDefaultToolsMode(el.value);
                    });
                });
            } else if (stepId === 'default-knowledge') {
                document.querySelectorAll('input[name="defaultKnowledgeMode"]').forEach(el => {
                    el.addEventListener('change', () => {
                        if (el.checked) void setKnowledgeMode(el.value);
                    });
                });
                document.getElementById('toggleKnowledgeLinkFormBtn')?.addEventListener('click', () => {
                    toggleKnowledgeLinkForm();
                });
                document.getElementById('hideKnowledgeLinkFormBtn')?.addEventListener('click', () => {
                    toggleKnowledgeLinkForm(false);
                });
                document.getElementById('addKnowledgeLinkBtn')?.addEventListener('click', () => {
                    void addLinkedKnowledgeSource();
                });
                document.getElementById('knowledgeGroupSearch')?.addEventListener('input', event => {
                    onboardingKnowledgeSearchQuery = event.target?.value || '';
                    renderDefaultKnowledgeList();
                });
            } else if (stepId === 'privacy') {
                document.getElementById('privacyRequireAuth')?.addEventListener('change', () => {
                    updatePrivacyAuthTimeoutState();
                });
                document.getElementById('privacyAuthRememberMode')?.addEventListener('change', () => {
                    updatePrivacyAuthTimeoutState();
                });
            } else if (stepId === 'ring') {
                document.getElementById('scanBtn')?.addEventListener('click', () => scanForRings());
            } else if (stepId === 'agent-permissions') {
                document.querySelectorAll('input[name="agentPermLevel"]').forEach(el => {
                    el.addEventListener('change', () => updateAgentPermissionLevel(el.value));
                });
            }
            // Note: 'permissions' step listeners are attached inside
            // renderPermissions() after the dynamic HTML is set.
        }

        async function updateUI() {
            const step = steps[currentStep];
            const progressFill = document.getElementById('progressFill');
            const stepNumber = document.getElementById('stepNumber');
            const stepName = document.getElementById('stepName');
            if (progressFill) progressFill.style.width = `${((currentStep + 1) / steps.length) * 100}%`;
            if (stepNumber) stepNumber.textContent = `Step ${currentStep + 1} of ${steps.length}`;
            if (stepName) stepName.textContent = step.title;
            await setStepContentHtml(step.content);

            // Attach programmatic event listeners to elements rendered by
            // the step template (CSP nonces override 'unsafe-inline').
            hydrateStepListeners(step.id);

            // Sync selection visuals immediately based on template defaults (checked attrs)
            // so the UI never flashes an “unselected” state while async config loads.
            ['agentPermLevel', 'sttSetupMode', 'llmSetupMode', 'defaultToolsMode', 'defaultKnowledgeMode'].forEach(syncOptionCardBordersForRadioGroup);

            // Step-specific initialization (async where needed)
            // Do not allow a failed Tauri call to break navigation/rendering.
            if (step.id === 'permissions') {
                try { await renderPermissions(); } catch (e) { console.error('[Onboarding] renderPermissions failed:', e); }
            }
            if (step.id === 'stt') {
                try { await loadSttConfig(); } catch (e) { console.error('[Onboarding] loadSttConfig failed:', e); }
            }
            if (step.id === 'microphone') {
                try { await loadMicrophoneDevices(); } catch (e) { console.error('[Onboarding] loadMicrophoneDevices failed:', e); }
            }
            if (step.id === 'llm') {
                try { await loadLLMConfig(); } catch (e) { console.error('[Onboarding] loadLLMConfig failed:', e); }
            }
            if (step.id === 'default-tools') {
                try { await loadDefaultToolsStep(); } catch (e) { console.error('[Onboarding] loadDefaultToolsStep failed:', e); }
            }
            if (step.id === 'default-knowledge') {
                try { await loadDefaultKnowledgeStep(); } catch (e) { console.error('[Onboarding] loadDefaultKnowledgeStep failed:', e); }
            }
            if (step.id === 'privacy') {
                try { await loadPrivacySettings(); } catch (e) { console.error('[Onboarding] loadPrivacySettings failed:', e); }
            }
            if (step.id === 'agent-permissions') {
                try { await loadAgentPermissionLevel(); } catch (e) { console.error('[Onboarding] loadAgentPermissionLevel failed:', e); }
            }

            // Step init functions may change layout after async work; re-fit once more.
            try {
                await resizeOnboardingWindowToFitContent();
            } catch (e) {
                console.warn('[Onboarding] resizeOnboardingWindowToFitContent failed:', e);
            }

            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            if (nextBtn) {
                nextBtn.dataset.overrideHandler = 'false';
                // Some steps may temporarily override behavior via onclick.
                // Clear it so the default handler works consistently.
                nextBtn.onclick = null;
                nextBtn.textContent = currentStep === steps.length - 1
                    ? 'Start Using Gestura'
                    : (currentStep === 0 ? 'Get Started' : 'Continue');
            }
            if (prevBtn) prevBtn.style.visibility = currentStep === 0 ? 'hidden' : 'visible';
        }

        function setupButtonListeners() {
            const nextBtn = document.getElementById('nextBtn');
            const prevBtn = document.getElementById('prevBtn');

            // Attach once (safe if init runs multiple times).
            if (nextBtn && nextBtn.dataset.listenersAttached !== 'true') {
                nextBtn.addEventListener('click', async function (e) {
                    e.preventDefault();
                    if (nextBtn.dataset.overrideHandler === 'true') return;
                    console.log('[Onboarding] Next button clicked, currentStep:', currentStep);
                    try {
                        await nextStep();
                    } catch (error) {
                        console.error('[Onboarding] Error in next button handler:', error);
                    }
                });
                nextBtn.dataset.listenersAttached = 'true';
                console.log('[Onboarding] Next button listener attached');
            }

            if (prevBtn && prevBtn.dataset.listenersAttached !== 'true') {
                prevBtn.addEventListener('click', async function (e) {
                    e.preventDefault();
                    console.log('[Onboarding] Previous button clicked, currentStep:', currentStep);

                        console.error('[Onboarding] Error in previous button handler:', error);

        async function nextStep() {
            if (isTransitioning) return;
            isTransitioning = true;
            setNavDisabled(true);
            try {
                const canContinue = await validateCurrentStepBeforeContinue();
                if (!canContinue) return;

                await saveSTTConfigIfNeeded();
                await saveMicrophoneIfNeeded();
                // Save LLM config when leaving the LLM step
                await saveLLMConfigIfNeeded();
                await savePrivacySettingsIfNeeded();

                if (currentStep === steps.length - 1) {
                    await completeOnboarding();
                } else {
                    currentStep++;
                    await updateUI();
                }
            } catch (error) {
                console.error('[Onboarding] Error in nextStep:', error);
            } finally {
                isTransitioning = false;
                setNavDisabled(false);
            }
        }

        async function previousStep() {
            if (isTransitioning) return;
            isTransitioning = true;
            setNavDisabled(true);
            try {
                await saveSTTConfigIfNeeded();
                await saveMicrophoneIfNeeded();
                // Save LLM config when leaving the LLM step
                await saveLLMConfigIfNeeded();
                await savePrivacySettingsIfNeeded();

                if (currentStep > 0) {
                    currentStep--;
                    await updateUI();
                }
            } catch (error) {
                console.error('[Onboarding] Error in previousStep:', error);
                if (currentStep > 0) {
                    currentStep--;
                    try { await updateUI(); } catch (e) { console.error('[Onboarding] Error updating UI:', e); }
                }
            } finally {
                isTransitioning = false;
                setNavDisabled(false);
            }
        }

        async function saveLLMConfigIfNeeded() {
            const currentStepId = steps[currentStep]?.id;
            if (currentStepId !== 'llm') return;

            const provider = document.getElementById('llmProvider')?.value || 'ollama';

            // Always persist the selected provider when leaving this step.
            try {
                await invoke('update_llm_provider', { provider });
            } catch (e) {
                console.error('Failed to save LLM provider:', e);
            }

            if (provider === 'ollama') {
                const url = onboardingOllamaEndpoint || DEFAULT_OLLAMA_BASE_URL;

                let model = onboardingResolvedOllamaModel;
                if (!model) {
                    try {
                        await fetchOllamaModels();
                        model = onboardingResolvedOllamaModel;
                    } catch (_) { }
                }

                if (!model) {
                    try {
                        const cfg = await invoke('get_config');
                        model = (cfg?.llm?.ollama?.model || '').trim();
                    } catch (_) { }
                }

                if (model) {
                    try {
                        await invoke('update_ollama_config', { base_url: url, model: model });
                        console.log('Saved Ollama config:', url, model);
                    } catch (e) {
                        console.error('Failed to save Ollama config:', e);
                    }
                } else {
                    console.warn('[Onboarding] Ollama model is empty; skipping update_ollama_config to avoid clobbering saved defaults.');
                }
            } else if (provider === 'openai' || provider === 'anthropic' || provider === 'gemini' || provider === 'grok') {
                // Keys never cross the normal config IPC boundary; store secrets in secure storage.
                const keyInput = document.getElementById('apiKey');
                const apiKey = keyInput?.value?.trim?.() || '';
                if (apiKey.length > 0) {
                    try {
                        await invoke('store_api_key', { provider, api_key: apiKey });
                        // Clear typed secrets from DOM as soon as we can.
                        keyInput.value = '';
                        keyInput.placeholder = '••••••••••••••••';
                        console.log(`Stored ${provider} API key in secure storage.`);
                    } catch (e) {
                        console.error('Failed to store API key:', e);
                    }
                }

                let selectedModel = onboardingResolvedCloudModel;
                if (!selectedModel) {
                    try {
                        await fetchCloudModels(provider);
                        selectedModel = onboardingResolvedCloudModel;
                    } catch (_) { }
                }
                if (selectedModel) {
                    try {
                        await invoke('update_provider_model', { provider, model: selectedModel });
                        console.log(`Saved ${provider} model: ${selectedModel}`);
                    } catch (e) {
                        console.error(`Failed to save ${provider} model:`, e);
                    }
                }
            }
        }

        async function validateSttStepBeforeContinue() {
            const provider = document.getElementById('sttProvider')?.value || 'local-whisper';
            setInlineStatusMessage('sttValidationStatus', '');

            if (provider === 'local-whisper') {
                return true;
            }

            const providerRequirements = {
                'openai-whisper': { inputId: 'sttApiKey', secureProvider: 'voice_openai', message: 'Enter or store an OpenAI API key to continue.' },
                'google-speech': { inputId: 'sttGoogleApiKey', secureProvider: 'voice_google', message: 'Enter or store a Google Speech API key to continue.' },
                'azure-speech': { inputId: 'sttAzureApiKey', secureProvider: 'voice_azure', message: 'Enter or store an Azure Speech API key to continue.' },
            };

            const requirement = providerRequirements[provider];
            if (!requirement) {
                setInlineStatusMessage('sttValidationStatus', 'Choose a speech provider before continuing.', 'error');
                scheduleResizeToFit();
                return false;
            }

            const typedKey = (document.getElementById(requirement.inputId)?.value || '').trim();
            let hasStoredKey = false;
            if (provider === 'openai-whisper') {
                try {
                    const [hasVoiceKey, hasGeneralKey] = await Promise.all([
                        invoke('has_api_key', { provider: 'voice_openai' }).catch(() => false),
                        invoke('has_api_key', { provider: 'openai' }).catch(() => false),
                    ]);
                    hasStoredKey = Boolean(hasVoiceKey || hasGeneralKey);
                } catch (_) { }
            } else {
                try {
                    hasStoredKey = await invoke('has_api_key', { provider: requirement.secureProvider });
                } catch (_) { }
            }

            if (typedKey || hasStoredKey) {
                return true;
            }

            setInlineStatusMessage('sttValidationStatus', requirement.message, 'error');
            scheduleResizeToFit();
            return false;
        }

        async function validateLlmStepBeforeContinue() {
            const provider = document.getElementById('llmProvider')?.value || 'ollama';
            setInlineStatusMessage('llmValidationStatus', '');

            if (provider === 'ollama') {
                await fetchOllamaModels();
                if (onboardingResolvedOllamaModel) {
                    return true;
                }

                setInlineStatusMessage(
                    'llmValidationStatus',
                    'Finish the local Ollama setup first. Install Ollama, start it, and pull at least one supported local model before continuing.',
                    'error'
                );
                scheduleResizeToFit();
                return false;
            }

            const typedKey = (document.getElementById('apiKey')?.value || '').trim();
            let hasStoredKey = false;
            try {
                hasStoredKey = await invoke('has_api_key', { provider });
            } catch (_) { }

            if (!typedKey && !hasStoredKey) {
                setInlineStatusMessage('llmValidationStatus', `Enter or store a ${llmApiKeyLabel(provider)} to continue.`, 'error');
                scheduleResizeToFit();
                return false;
            }

            await fetchCloudModels(provider);
            if (onboardingResolvedCloudModel) {
                return true;
            }

            setInlineStatusMessage(
                'llmValidationStatus',
                `We could not verify an available ${provider} model yet. Check your API key and network access before continuing.`,
                'error'
            );
            scheduleResizeToFit();
            return false;
        }

        async function validateCurrentStepBeforeContinue() {
            const stepId = steps[currentStep]?.id;
            if (stepId === 'stt') return await validateSttStepBeforeContinue();
            if (stepId === 'llm') return await validateLlmStepBeforeContinue();
            return true;
        }

        async function completeOnboarding() {
            try {
                // Get the selected voice provider and model
                const config = await invoke('get_config');
                const voiceProvider = config?.voice?.provider || 'local';

                // If using local voice processing, download the Whisper model
                if (voiceProvider === 'local') {
                    const modelPath = config?.voice?.local_model_path || '';
                    const modelFilename = modelPath ? modelPath.split('/').pop() : 'ggml-base.en.bin';

                    // Check if model already exists
                    const modelStatus = await invoke('is_whisper_model_downloaded', { model_filename: modelFilename });

                    if (!modelStatus.exists || !modelStatus.is_valid) {
                        // Show download progress UI
                        await showDownloadProgress(modelFilename);
                        return; // The download handler will complete onboarding
                    }
                }

                // Complete onboarding if no download needed
                await invoke('complete_onboarding');
                await invoke('close_onboarding_window');
            } catch (error) {
                console.error('Error completing onboarding:', error);
                // Do NOT close the window — keep the user on the final step so they
                // can retry. The window is intentionally uncloseable until configured.
                const nextBtn = document.getElementById('nextBtn');
                if (nextBtn) {
                    nextBtn.disabled = false;
                    nextBtn.textContent = 'Try Again';
                }
                await setStepContentHtml(`
                    <h2><span class="icon-x-circle" style="color: rgb(var(--danger-rgb));"></span> Setup Failed</h2>
                    <p style="color: rgb(var(--danger-rgb)); margin: 1rem 0;">${error}</p>
                    <p>Please check your API key and voice configuration, then click <strong>Try Again</strong>.</p>
                `);
            }
        }

        async function showDownloadProgress(modelFilename) {
            const nextBtn = document.getElementById('nextBtn');
            const prevBtn = document.getElementById('prevBtn');

            // Hide navigation buttons during download
            if (nextBtn) nextBtn.style.display = 'none';
            if (prevBtn) prevBtn.style.display = 'none';

            // Get model info for size display
            let modelInfo = null;
            try {
                const models = await invoke('get_whisper_models');
                modelInfo = models.find(m => m.filename === modelFilename);
            } catch (e) {
                console.error('Error getting model info:', e);
            }

            const sizeText = modelInfo ? ` (${modelInfo.size_mb} MB)` : '';

            await setStepContentHtml(`
                <h2><span class="icon-download"></span> Downloading Voice Model</h2>
                <p>Downloading the Whisper speech recognition model${sizeText}...</p>
                <div style="margin: 2rem 0;">
                    <div class="progress-bar" style="height: 12px; background: var(--surface-color); border-radius: 6px; overflow: hidden;">
	                        <div id="downloadProgressFill" class="progress-fill" style="width: 0%; height: 100%; background: var(--brand-gradient);"></div>
                    </div>
                    <p id="downloadStatus" style="text-align: center; margin-top: 1rem; color: var(--text-secondary);">Starting download...</p>
                </div>
                <p style="font-size: 0.85rem; color: var(--text-secondary);">This may take a few minutes depending on your connection speed. The model will be cached locally for future use.</p>
	            `);

            // Listen for download progress events
            if (!window.__TAURI__ || !window.__TAURI__.event || typeof window.__TAURI__.event.listen !== 'function') {
                console.error('[Onboarding] Cannot listen for download progress events (Tauri event API unavailable).');
                return;
            }
            const { listen } = window.__TAURI__.event;
            const unlisten = await listen('whisper-download-progress', (event) => {
                const data = event.payload;
                const progressFill = document.getElementById('downloadProgressFill');
                const statusText = document.getElementById('downloadStatus');

                if (progressFill && data.percent !== undefined) {
                    progressFill.style.width = `${data.percent}%`;
                }

                if (statusText) {
                    if (data.status === 'downloading') {
                        statusText.textContent = `Downloaded ${data.downloaded_mb?.toFixed(1) || 0} MB of ${data.total_mb || '?'} MB (${data.percent || 0}%)`;
                    } else if (data.status === 'complete') {
                        statusText.innerHTML = '<span class="icon-check"></span> Download complete!';
                    } else if (data.status === 'error') {
                        statusText.innerHTML = `<span class="icon-x-circle" style="color: rgb(var(--danger-rgb));"></span> Error: ${data.error || 'Download failed'}`;
                    }
                }

                // If download is complete, finish onboarding
                if (data.status === 'complete') {
                    unlisten();
                    setTimeout(async () => {
                        try {
                            await invoke('complete_onboarding');
                            await invoke('close_onboarding_window');
                        } catch (e) {
                            console.error('Error completing onboarding after download:', e);
                            // Do NOT close the window — show the error and let the user retry.
                            const statusEl = document.getElementById('downloadStatus');
                            if (statusEl) {
                                statusEl.innerHTML = `<span class="icon-x-circle" style="color: rgb(var(--danger-rgb));"></span> Setup failed: ${e}. Please restart the app and try again.`;
                            }
                        }
                    }, 1000);
                }
            });

            // Start the download
            try {
                await invoke('download_whisper_model', { model_filename: modelFilename });
            } catch (error) {
                console.error('Download failed:', error);
                const statusText = document.getElementById('downloadStatus');
                if (statusText) {
                    statusText.innerHTML = `<span class="icon-x-circle" style="color: rgb(var(--danger-rgb));"></span> Download failed: ${error}`;
                }
                // Show retry button
                nextBtn.textContent = 'Retry Download';
                nextBtn.style.display = 'block';
                nextBtn.dataset.overrideHandler = 'true';
                nextBtn.onclick = () => showDownloadProgress(modelFilename);
                unlisten();
            }
        }

        function normalizeOllamaModelName(name) {
            return String(name || '').trim().toLowerCase().replace(/:latest$/, '');
        }

        function resolveMatchingOllamaModelName(modelNames, requestedName) {
            const requested = normalizeOllamaModelName(requestedName);
            if (!requested) return '';

            return modelNames.find(name => {
                const normalized = normalizeOllamaModelName(name);
                return normalized === requested || normalized.split(':')[0] === requested;
            }) || '';
        }

        function selectPreferredOllamaModelName(modelNames, requestedName = '') {
            const names = (Array.isArray(modelNames) ? modelNames : [])
                .map(name => String(name || '').trim())
                .filter(name => name.length > 0);

            if (!names.length) return '';

            const requestedMatch = resolveMatchingOllamaModelName(names, requestedName);
            if (requestedMatch) return requestedMatch;

            for (const marker of OLLAMA_AGENTIC_MODEL_MARKERS) {
                const match = names.find(name => normalizeOllamaModelName(name).includes(marker));
                if (match) return match;
            }

            const heuristicMatch = names.find(name => {
                const normalized = normalizeOllamaModelName(name);
                return normalized.includes('agent') || normalized.includes('coder') || normalized.includes('code');
            });
            if (heuristicMatch) return heuristicMatch;

            return names[0];
        }

        function isAgenticOllamaModelName(name) {
            const normalized = normalizeOllamaModelName(name);
            if (!normalized) return false;

            if (OLLAMA_AGENTIC_MODEL_MARKERS.some(marker => normalized.includes(marker))) {
                return true;
            }

            return normalized.includes('agent') || normalized.includes('coder') || normalized.includes('code');
        }

        async function fetchOpenAiSttModels() {
            const section = document.getElementById('sttOpenAiModelSection');
            const select = document.getElementById('sttOpenAiModel');
            const status = document.getElementById('sttOpenAiModelStatus');
            if (!select) return;

            const apiKey = (document.getElementById('sttApiKey')?.value || '').trim();
            const [hasVoiceKey, hasGeneralKey] = await Promise.all([
                invoke('has_api_key', { provider: 'voice_openai' }).catch(() => false),
                invoke('has_api_key', { provider: 'openai' }).catch(() => false),
            ]);

            if (!apiKey && !hasVoiceKey && !hasGeneralKey) {
                if (section) section.style.display = '';
                select.innerHTML = '<option value="">Enter an OpenAI API key to load models</option>';
                select.disabled = true;
                if (status) {
                    status.style.color = 'var(--text-secondary)';
                    status.textContent = 'Add an API key or use your existing OpenAI keychain entry to fetch transcription models.';
                }
                return;
            }

            if (section) section.style.display = '';
            select.innerHTML = '<option value="">Loading models…</option>';
            select.disabled = true;
            if (status) {
                status.style.color = 'var(--text-secondary)';
                status.textContent = 'Fetching OpenAI transcription models…';
            }

            const currentVal = select.dataset.selectedModel || DEFAULT_OPENAI_STT_MODEL;

            try {
                if (apiKey) {
                    try {
                        await invoke('store_api_key', { provider: 'voice_openai', api_key: apiKey });
                    } catch (_) {
                        // Non-fatal: backend can still fall back to keychain/general OpenAI key.
                    }
                }

                const models = await invoke('list_openai_stt_models', { api_key: apiKey });
                select.innerHTML = '<option value="">Select a model…</option>';

                (models || []).forEach(model => {
                    const id = model.id || model.name || '';
                    if (!id) return;
                    const option = document.createElement('option');
                    option.value = id;
                    option.textContent = id;
                    select.appendChild(option);
                });

                const preferred = currentVal || DEFAULT_OPENAI_STT_MODEL;
                let matchingOption = [...select.options].find(option => option.value === preferred);
                if (!matchingOption && preferred) {
                    matchingOption = document.createElement('option');
                    matchingOption.value = preferred;
                    matchingOption.textContent = preferred;
                    select.insertBefore(matchingOption, select.options[1] ?? null);
                }

                select.value = preferred;
                select.disabled = false;
                setSttSelectedModel(select.value || preferred);

                if (status) {
                    status.style.color = 'var(--success-color, #22c55e)';
                    status.textContent = `✓ ${(models || []).length} model${(models || []).length !== 1 ? 's' : ''} available`;
                }
            } catch (error) {
                console.error('Failed to fetch OpenAI STT models:', error);
                select.innerHTML = `<option value="${currentVal}">${currentVal}</option>`;
                select.value = currentVal;
                select.disabled = false;
                if (status) {
                    status.style.color = 'var(--error-color, #ef4444)';
                    status.textContent = `Error: ${error}`;
                }
            }
        }

        function normalizePrivacyAuthTimeout(value, fallback = DEFAULT_PRIVACY_SETTINGS.auth_timeout) {
            const parsed = Number.parseInt(String(value ?? ''), 10);
