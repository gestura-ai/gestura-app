<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Gestura</title>
    <link rel="stylesheet" href="icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        :root {
            /* Gestura brand tokens (unified with gestura.app) */
            --accent-primary: rgb(37, 99, 235);
            --accent-primary-rgb: 37, 99, 235;
            --accent-secondary: rgb(147, 51, 234);
            --accent-secondary-rgb: 147, 51, 234;
            --gradient-primary: linear-gradient(to right, rgb(37, 99, 235), rgb(147, 51, 234));
            --gradient-secondary: linear-gradient(to right, rgb(96, 165, 250), rgb(192, 132, 252));
            --brand-gradient: var(--gradient-primary);
            --focus-ring: rgba(var(--accent-primary-rgb), 0.35);

            /* Motion tokens (snappy, non-sliding) */
            --motion-fast: 120ms;
            --motion-ease: cubic-bezier(0.2, 0.8, 0.2, 1);

            /* Semantic RGB triples for rgba(..., alpha) */
            --success-rgb: 52, 199, 89;
            --warning-rgb: 255, 149, 0;
            --danger-rgb: 255, 59, 48;

            /* Light theme variables */
            --background-color: #ffffff;
            --text-color: #1a1a1a;
            --text-secondary: #666666;
            --border-color: #e0e0e0;
            --surface-color: #f8f9fa;
            --success-color: rgb(var(--success-rgb));
            --warning-color: rgb(var(--warning-rgb));
            --error-color: rgb(var(--danger-rgb));
        }

        /* Auto mode: respect system preference */
        @media (prefers-color-scheme: dark) {
            :root {
                /* Dark theme variables */
                --background-color: #1e1e1e;
                --text-color: #ffffff;
                --text-secondary: #b0b0b0;
                --border-color: #404040;
                --surface-color: #2d2d2d;
                --accent-primary: rgb(96, 165, 250);
                --accent-primary-rgb: 96, 165, 250;
                --accent-secondary: rgb(192, 132, 252);
                --accent-secondary-rgb: 192, 132, 252;
                --brand-gradient: var(--gradient-secondary);
                --focus-ring: rgba(var(--accent-primary-rgb), 0.55);
            }
        }

        /* Force light mode (overrides system preference) */
        html[data-theme="light"] {
            --accent-primary: rgb(37, 99, 235);
            --accent-primary-rgb: 37, 99, 235;
            --accent-secondary: rgb(147, 51, 234);
            --accent-secondary-rgb: 147, 51, 234;
            --brand-gradient: var(--gradient-primary);
            --focus-ring: rgba(var(--accent-primary-rgb), 0.35);

            --background-color: #ffffff;
            --text-color: #1a1a1a;
            --text-secondary: #666666;
            --border-color: #e0e0e0;
            --surface-color: #f8f9fa;
        }

        /* Force dark mode (overrides system preference) */
        html[data-theme="dark"] {
            --accent-primary: rgb(96, 165, 250);
            --accent-primary-rgb: 96, 165, 250;
            --accent-secondary: rgb(192, 132, 252);
            --accent-secondary-rgb: 192, 132, 252;
            --brand-gradient: var(--gradient-secondary);
            --focus-ring: rgba(var(--accent-primary-rgb), 0.55);

            --background-color: #1e1e1e;
            --text-color: #ffffff;
            --text-secondary: #b0b0b0;
            --border-color: #404040;
            --surface-color: #2d2d2d;
        }

        .text-gradient {
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
        }

        @media (forced-colors: active) {
            .text-gradient {
                background: none;
                color: ButtonText;
                -webkit-text-fill-color: ButtonText;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
        }

        body {
            background: var(--background-color);
            color: var(--text-color);
        }

        .onboarding-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 720px;
            margin: 0 auto;
            padding: 1.5rem;
            width: 100%;
        }

        .header {
            position: relative;
            text-align: left;
            margin-bottom: 1.5rem;
            /* Shrink logo by another ~1/3 (147px -> ~98px). */
            --header-logo-size: 50px;
            overflow: visible;
        }

        .header h1 {
            position: relative;
            display: inline-block;
            font-size: 1.75rem;
            margin-bottom: 0.05rem;
            line-height: 1.15;
            left: 25px;
            top: auto;
            right: auto;
            bottom: auto;
            z-index: 0;
        }

        .header-logo {
            position: absolute;
            /*
	             * Align the SVG to the LEFT edge of the “Welcome to Gestura” title.
	             * Let it overflow only to the RIGHT + BOTTOM (never above the title),
	             * so the top of the logo won't get cropped by the viewport.
	             */
            left: -35px;
            top: -15px;
            right: auto;
            bottom: auto;
            width: var(--header-logo-size);
            height: var(--header-logo-size);
            opacity: 1;
            pointer-events: none;
            user-select: none;
            z-index: 0;
        }

        .header-title {
            position: relative;
            z-index: 1;
            display: inline-block;
        }

        .header p {
            z-index: 1;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .progress-container {
            margin-bottom: 1rem;
        }

        .progress-bar {
            height: 4px;
            background: var(--border-color);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--brand-gradient);
            transition: width var(--motion-fast) var(--motion-ease);
        }

        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .step-content {
            /*
	             * Default: content-driven height (no internal scrolling).
	             * If the window height is clamped (max height), JS will toggle
	             * `.is-scrollable` to keep header/footer fixed and scroll only the
	             * content area.
	             */
            flex: 0 0 auto;
            background: var(--surface-color);
            border-radius: 10px;
            padding: 1.25rem;
            border: 1px solid var(--border-color);
            overflow-y: hidden;
            opacity: 1;
            transition: opacity var(--motion-fast) var(--motion-ease), max-height var(--motion-fast) var(--motion-ease);
            will-change: opacity;
        }

        .step-content.is-scrollable {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
        }

        .step-content.is-hidden {
            opacity: 0;
        }

        .step-content.is-visible {
            opacity: 1;
        }

        @media (prefers-reduced-motion: reduce) {

            .progress-fill,
            .step-content {
                transition: none !important;
            }
        }

        .step-content h2 {
            margin-bottom: 0.75rem;
            font-size: 1.25rem;
        }

        .step-content p {
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            margin: 1rem 0;
        }

        .feature-card {
            background: var(--background-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.75rem;
        }

        .feature-card h3 {
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
        }

        .feature-card p {
            font-size: 0.8rem;
            margin-bottom: 0;
        }

        .btn {
            padding: 0.6rem 1.25rem;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--brand-gradient);
            color: white;
        }

        .btn-primary:hover {
            filter: brightness(0.97);
            transform: translateY(-1px);
        }

        .btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        .btn-secondary {
            background: var(--surface-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--border-color);
        }

        .btn-small {
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
        }

        .btn-success {
            background: var(--success-color);
            color: white;
        }

        .button-row {
            display: flex;
            justify-content: space-between;
            margin-top: 1rem;
            padding-top: 0.5rem;
        }

        .permission-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem;
            background: var(--background-color);
            border-radius: 6px;
            margin-bottom: 0.5rem;
            border: 1px solid var(--border-color);
        }

        .permission-info {
            flex: 1;
        }

        .permission-info strong {
            font-size: 0.9rem;
        }

        .permission-info p {
            margin: 0.25rem 0 0 0;
            font-size: 0.8rem;
        }

        .permission-status {
            margin-left: 0.5rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .status-granted {
            background: rgba(var(--success-rgb), 0.14);
            border: 1px solid rgba(var(--success-rgb), 0.28);
            color: rgb(var(--success-rgb));
        }

        .status-denied {
            background: rgba(var(--danger-rgb), 0.14);
            border: 1px solid rgba(var(--danger-rgb), 0.28);
            color: rgb(var(--danger-rgb));
        }

        .status-unknown {
            background: rgba(var(--warning-rgb), 0.14);
            border: 1px solid rgba(var(--warning-rgb), 0.28);
            color: rgb(var(--warning-rgb));
        }

        select {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--background-color);
            color: var(--text-color);
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }

        select:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        .config-section {
            margin-bottom: 1rem;
        }

        .config-section label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 500;
            font-size: 0.85rem;
        }

        /* Shared input styling for onboarding provider fields */
        input[type="text"].onb-input,
        input[type="password"].onb-input,
        select.onb-input {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--background-color);
            color: var(--text-color);
            font-size: 0.9rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"].onb-input:focus,
        input[type="password"].onb-input:focus,
        select.onb-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        input[type="text"].onb-input::placeholder,
        input[type="password"].onb-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.7;
        }

        /* API key row layout */
        .api-key-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .api-key-row .onb-input {
            flex: 1;
        }

        .btn-delete-api-key {
            white-space: nowrap;
            padding: 0.4rem 0.75rem;
            border: 1px solid rgb(var(--danger-rgb, 220, 38, 38));
            color: rgb(var(--danger-rgb, 220, 38, 38));
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.15s, color 0.15s;
        }

        .btn-delete-api-key:hover {
            background: rgb(var(--danger-rgb, 220, 38, 38));
            color: #fff;
        }

        /* Radio option cards – keep radio circle on the same line as the text */
        .option-card {
            position: relative;
        }

        .option-card label {
            display: flex;
            align-items: flex-start;
            cursor: pointer;
            gap: 0.75rem;
        }

        /*
         * Custom radio indicator.
         * Rationale: some WebView/Safari setups can render native radio states with
         * very low contrast (or ignore accent-color). We render our own circle/dot
         * driven by JS (data-checked="true") so the default selection is obvious.
         */
        .option-card label::before {
            content: '';
            display: inline-block;
            width: 18px;
            height: 18px;
            border-radius: 999px;
            border: 2px solid var(--border-color);
            box-sizing: border-box;
            margin-top: 0.2rem;
            background: transparent;
            flex-shrink: 0;
        }

        .option-card[data-checked="true"] label::before,
        .option-card:has(input[type="radio"]:checked) label::before {
            border-color: var(--accent-primary);
            background: radial-gradient(circle at center, var(--accent-primary) 0 45%, transparent 46%);
        }

        .option-card label input[type="radio"] {
            /* Keep semantic input in the DOM but hide native glyph (we draw our own above). */
            position: absolute;
            opacity: 0;
            width: 1px;
            height: 1px;
            pointer-events: none;
        }

        .option-card label:focus-within {
            outline: none;
            box-shadow: 0 0 0 4px var(--focus-ring);
            border-radius: 6px;
        }

        .option-card label>div {
            flex: 1;
            min-width: 0;
        }

        /* Consent rows – keep checkbox on the same line as the text.
	           Do not rely on style="..." attributes since the Tauri webview CSP
	           may ignore inline styles for dynamically injected step HTML. */
        label.consent-row {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            cursor: pointer;
        }

        label.consent-row input[type="checkbox"] {
            flex-shrink: 0;
            margin-top: 0.25rem;
        }

        label.consent-row>div {
            flex: 1;
            min-width: 0;
        }

        label.consent-row p {
            margin: 0.25rem 0 0;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
    </style>
</head>

<body>
    <div class="onboarding-container">
        <div class="header">
            <h1>
                <img class="header-logo" src="assets/gestura-app.svg" alt="" aria-hidden="true">
                <span class="header-title"><span class="text-gradient">Gestura</span></span>
            </h1>
        </div>

        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="step-indicator">
                <span id="stepNumber">Step 1 of 9</span>
                <span id="stepName">Configure</span>
            </div>
        </div>

        <div class="step-content" id="stepContent">
            <!-- Dynamic step content -->
        </div>

        <div class="button-row" style="display: flex; justify-content: space-between; margin-top: 1.5rem;">
            <button class="btn btn-secondary" id="prevBtn" style="visibility: hidden;">Previous</button>
            <button class="btn btn-primary" id="nextBtn">Get Started</button>
        </div>
    </div>

    <script>
        function getTauriInvoke() {
            const w = window;
            // Tauri (public global) support
            if (w.__TAURI__ && w.__TAURI__.core && typeof w.__TAURI__.core.invoke === 'function') {
                return w.__TAURI__.core.invoke;
            }
            // Tauri (internal) support (useful for tests / alternate runtimes)
            if (w.__TAURI_INTERNALS__ && typeof w.__TAURI_INTERNALS__.invoke === 'function') {
                return w.__TAURI_INTERNALS__.invoke;
            }
            return null;
        }

        // =====================================================================
        // Theme Management
        // =====================================================================
        async function initTheme() {
            try {
                const tauriInvoke = getTauriInvoke();
                if (!tauriInvoke) {
                    applyTheme('system');
                    return;
                }
                const config = await tauriInvoke('get_config');
                const themeMode = config?.ui?.theme_mode || 'system';
                applyTheme(themeMode);

                if (themeMode === 'system') {
                    const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                    const handler = () => applyTheme('system');
                    // Safari 13 compatibility: MediaQueryList used addListener/removeListener.
                    if (typeof mediaQuery.addEventListener === 'function') {
                        mediaQuery.addEventListener('change', handler);
                    } else if (typeof mediaQuery.addListener === 'function') {
                        // eslint-disable-next-line deprecation/deprecation
                        mediaQuery.addListener(handler);
                    }
                }
            } catch (e) {
                console.error('[Theme] Failed to initialize theme:', e);
                applyTheme('system');
            }
        }

        function applyTheme(mode) {
            const html = document.documentElement;
            if (mode === 'light') {
                html.setAttribute('data-theme', 'light');
            } else if (mode === 'dark') {
                html.setAttribute('data-theme', 'dark');
            } else {
                html.removeAttribute('data-theme');
            }
        }

        void initTheme();

        // =====================================================================
        // Onboarding Logic
        // =====================================================================
        let invoke = getTauriInvoke();
        if (!invoke) {
            console.warn('[Onboarding] Tauri API not available — some actions may be unavailable (completion, downloads, permissions)');
            invoke = () => Promise.reject(new Error('Tauri API not available'));
        }

        let currentStep = 0;
        let lastSystemPermissionsResult = null;
        let isTransitioning = false;
        let prefersReducedMotion = false;

        function initReducedMotionListener() {
            if (!window.matchMedia) return;
            const media = window.matchMedia('(prefers-reduced-motion: reduce)');
            const update = () => {
                prefersReducedMotion = !!media.matches;
            };
            update();

            if ('addEventListener' in media) {
                media.addEventListener('change', update);
            } else {
                // Safari 13 compatibility
                // eslint-disable-next-line deprecation/deprecation
                media.addListener(update);
            }
        }

        function getMotionMs() {
            return prefersReducedMotion ? 0 : 120;
        }

        // =====================================================================
        // Dynamic window height (step-aware)
        // =====================================================================
        const ONBOARDING_MIN_HEIGHT_PX = 580;
        const ONBOARDING_MAX_HEIGHT_PX_CAP = 900;
        const ONBOARDING_MAX_HEIGHT_SCREEN_RATIO = 0.9;
        const ONBOARDING_RESIZE_EASING = { x1: 0.2, y1: 0.8, x2: 0.2, y2: 1 };
        const ONBOARDING_HEIGHT_EPSILON_PX = 2;
        const ONBOARDING_SCROLL_MIN_CONTENT_PX = 160;

        let lastRequestedWindowHeightPx = null;
        let resizeAnimationToken = 0;
        let resizeDebounceTimer = null;

        function clamp(n, min, max) {
            return Math.max(min, Math.min(max, n));
        }

        function getMaxWindowHeightPx() {
            const screenAvail = (window.screen && Number.isFinite(window.screen.availHeight))
                ? window.screen.availHeight
                : 1000;
            const byScreen = Math.floor(screenAvail * ONBOARDING_MAX_HEIGHT_SCREEN_RATIO);
            return Math.max(ONBOARDING_MIN_HEIGHT_PX, Math.min(ONBOARDING_MAX_HEIGHT_PX_CAP, byScreen));
        }

        function makeCubicBezier(x1, y1, x2, y2) {
            // Maps x in [0,1] -> y in [0,1] for the CSS cubic-bezier curve.
            // Uses Newton iterations with a binary-search fallback.
            const cx = 3 * x1;
            const bx = 3 * (x2 - x1) - cx;
            const ax = 1 - cx - bx;
            const cy = 3 * y1;
            const by = 3 * (y2 - y1) - cy;
            const ay = 1 - cy - by;

            const sampleX = (t) => ((ax * t + bx) * t + cx) * t;
            const sampleY = (t) => ((ay * t + by) * t + cy) * t;
            const sampleDerivX = (t) => (3 * ax * t + 2 * bx) * t + cx;

            const solveTForX = (x) => {
                let t = x;
                for (let i = 0; i < 8; i++) {
                    const xEst = sampleX(t) - x;
                    const d = sampleDerivX(t);
                    if (Math.abs(xEst) < 1e-4) return t;
                    if (Math.abs(d) < 1e-6) break;
                    t = t - xEst / d;
                }
                // Fallback binary search
                let lo = 0;
                let hi = 1;
                t = x;
                for (let i = 0; i < 12; i++) {
                    const xMid = sampleX(t);
                    if (Math.abs(xMid - x) < 1e-4) return t;
                    if (xMid < x) lo = t;
                    else hi = t;
                    t = (lo + hi) / 2;
                }
                return t;
            };

            return (x) => {
                if (x <= 0) return 0;
                if (x >= 1) return 1;
                return sampleY(solveTForX(x));
            };
        }

        const easeWindowHeight = makeCubicBezier(
            ONBOARDING_RESIZE_EASING.x1,
            ONBOARDING_RESIZE_EASING.y1,
            ONBOARDING_RESIZE_EASING.x2,
            ONBOARDING_RESIZE_EASING.y2,
        );

        function measureDesiredWindowHeightPx() {
            const container = document.querySelector('.onboarding-container');
            if (!container) return null;

            const containerWidth = Math.max(1, Math.floor(container.getBoundingClientRect().width || window.innerWidth || 720));

            // Clone the container off-screen and let it size to content.
            const clone = container.cloneNode(true);
            clone.style.position = 'absolute';
            clone.style.left = '-10000px';
            clone.style.top = '0';
            clone.style.width = `${containerWidth}px`;
            clone.style.maxWidth = `${containerWidth}px`;
            clone.style.height = 'auto';
            clone.style.maxHeight = 'none';
            clone.style.visibility = 'hidden';
            clone.style.pointerEvents = 'none';

            const cloneStepContent = clone.querySelector('#stepContent');
            if (cloneStepContent) {
                cloneStepContent.classList.remove('is-scrollable');
                cloneStepContent.style.maxHeight = 'none';
                cloneStepContent.style.overflowY = 'visible';
                cloneStepContent.style.flex = '0 0 auto';
            }

            document.body.appendChild(clone);
            const totalHeight = Math.ceil(clone.getBoundingClientRect().height);
            const stepContentHeight = cloneStepContent ? Math.ceil(cloneStepContent.getBoundingClientRect().height) : 0;
            document.body.removeChild(clone);

            return { totalHeight, stepContentHeight };
        }

        function applyStepContentScrollConstraint(enabled, maxHeightPx) {
            const stepContent = document.getElementById('stepContent');
            if (!stepContent) return;

            stepContent.classList.toggle('is-scrollable', enabled);
            if (!enabled) {
                stepContent.style.maxHeight = '';
                return;
            }

            const maxPx = Math.max(ONBOARDING_SCROLL_MIN_CONTENT_PX, Math.floor(maxHeightPx));
            stepContent.style.maxHeight = `${maxPx}px`;
        }

        async function safeSetWindowSize(widthPx, heightPx) {
            try {
                await invoke('set_window_size', { width: widthPx, height: heightPx });
                return true;
            } catch (e) {
                // Non-fatal: onboarding can still function without dynamic resizing.
                console.warn('[Onboarding] set_window_size failed:', e);
                return false;
            }
        }

        async function animateWindowHeightTo(targetHeightPx) {
            const motionMs = getMotionMs();
            const widthPx = Math.max(1, Math.round(window.innerWidth || 720));
            const fromHeightPx = Math.max(1, Math.round(lastRequestedWindowHeightPx ?? window.innerHeight ?? ONBOARDING_MIN_HEIGHT_PX));

            if (Math.abs(targetHeightPx - fromHeightPx) < ONBOARDING_HEIGHT_EPSILON_PX) {
                lastRequestedWindowHeightPx = targetHeightPx;
                void safeSetWindowSize(widthPx, targetHeightPx);
                return;
            }

            if (motionMs === 0) {
                lastRequestedWindowHeightPx = targetHeightPx;
                await safeSetWindowSize(widthPx, targetHeightPx);
                return;
            }

            const token = ++resizeAnimationToken;
            const start = performance.now();

            return new Promise((resolve) => {
                const tick = (now) => {
                    if (token !== resizeAnimationToken) return resolve();
                    const t = clamp((now - start) / motionMs, 0, 1);
                    const eased = easeWindowHeight(t);
                    const h = Math.round(fromHeightPx + (targetHeightPx - fromHeightPx) * eased);
                    void safeSetWindowSize(widthPx, h);
                    if (t >= 1) {
                        lastRequestedWindowHeightPx = targetHeightPx;
                        return resolve();
                    }
                    window.requestAnimationFrame(tick);
                };
                window.requestAnimationFrame(tick);
            });
        }

            const measured = measureDesiredWindowHeightPx();
            if (!measured) return;

            const maxHeight = getMaxWindowHeightPx();
            const desiredUnclamped = measured.totalHeight;
            const targetHeight = clamp(desiredUnclamped, ONBOARDING_MIN_HEIGHT_PX, maxHeight);

            const fixedParts = Math.max(0, measured.totalHeight - (measured.stepContentHeight || 0));
            const shouldScroll = desiredUnclamped > maxHeight;
            const contentMax = shouldScroll ? (maxHeight - fixedParts) : null;

            if (shouldScroll && contentMax != null) {
                applyStepContentScrollConstraint(true, contentMax);
            } else {
                applyStepContentScrollConstraint(false, 0);
            }

            await animateWindowHeightTo(targetHeight);
        }

                        if (savedModel && modelEl && modelEl.tagName === 'SELECT') {
                            const prefix = savedModel.replace(/:latest$/, '');
                            const match = Array.from(modelEl.options || []).find(o =>
                                o.value === savedModel ||
                                o.value === prefix + ':latest' ||
                                (o.value || '').split(':')[0] === prefix
                            );
                            model = match ? match.value : savedModel;
                        } else {
                            model = savedModel;
                        }
                    } catch (_) {
                        // Non-fatal: if we can't resolve a model, we won't overwrite config.
                    }
                }

                if (!model && modelEl && modelEl.tagName === 'SELECT') {
                    const firstNonEmpty = Array.from(modelEl.options || []).find(o => (o?.value || '').trim().length > 0);
                    if (firstNonEmpty) model = (firstNonEmpty.value || '').trim();
                }

                if (model) {
                    try {
                        await invoke('update_ollama_config', { base_url: url, model: model });
                        console.log('Saved Ollama config:', url, model);
                    } catch (e) {
                        console.error('Failed to save Ollama config:', e);
                    }
                } else {
                    console.warn('[Onboarding] Ollama model is empty; skipping update_ollama_config to avoid clobbering saved defaults.');
                }
            } else if (provider === 'openai' || provider === 'anthropic' || provider === 'gemini' || provider === 'grok') {
                // Keys never cross the normal config IPC boundary; store secrets in secure storage.
                const keyInput = document.getElementById('apiKey');
                const apiKey = keyInput?.value?.trim?.() || '';
                if (apiKey.length > 0) {
                    try {
                        await invoke('store_api_key', { provider, api_key: apiKey });
                        // Clear typed secrets from DOM as soon as we can.
                        keyInput.value = '';
                        keyInput.placeholder = '••••••••••••••••';
                        console.log(`Stored ${provider} API key in secure storage.`);
                    } catch (e) {
                        console.error('Failed to store API key:', e);
                    }
                }

                // Persist the user-selected model to global config so it sticks across
                // config/agent windows.
                const modelSelect = document.getElementById('cloudModelSelect');
                const selectedModel = (modelSelect?.value || '').trim();
                if (selectedModel) {
                    try {
                        await invoke('update_provider_model', { provider, model: selectedModel });
                        console.log(`Saved ${provider} model: ${selectedModel}`);
                    } catch (e) {
                        console.error(`Failed to save ${provider} model:`, e);
                    }
                }
            }
        }

        async function completeOnboarding() {
            try {
                // Get the selected voice provider and model
                const config = await invoke('get_config');
                const voiceProvider = config?.voice?.provider || 'local';

                // If using local voice processing, download the Whisper model
                if (voiceProvider === 'local') {
                    const modelPath = config?.voice?.local_model_path || '';
                    const modelFilename = modelPath ? modelPath.split('/').pop() : 'ggml-base.en.bin';

                    // Check if model already exists
                    const modelStatus = await invoke('is_whisper_model_downloaded', { model_filename: modelFilename });

                    if (!modelStatus.exists || !modelStatus.is_valid) {
                        // Show download progress UI
                        await showDownloadProgress(modelFilename);
                        return; // The download handler will complete onboarding
                    }
                }

                // Complete onboarding if no download needed
                await invoke('complete_onboarding');
                await invoke('close_onboarding_window');
            } catch (error) {
                console.error('Error completing onboarding:', error);
                window.close();
            }
        }

        async function showDownloadProgress(modelFilename) {
            const nextBtn = document.getElementById('nextBtn');
            const prevBtn = document.getElementById('prevBtn');

            // Hide navigation buttons during download
            if (nextBtn) nextBtn.style.display = 'none';
            if (prevBtn) prevBtn.style.display = 'none';

            // Get model info for size display
            let modelInfo = null;
            try {
                const models = await invoke('get_whisper_models');
                modelInfo = models.find(m => m.filename === modelFilename);
            } catch (e) {
                console.error('Error getting model info:', e);
            }

            const sizeText = modelInfo ? ` (${modelInfo.size_mb} MB)` : '';

            await setStepContentHtml(`
                <h2><span class="icon-download"></span> Downloading Voice Model</h2>
                <p>Downloading the Whisper speech recognition model${sizeText}...</p>
                <div style="margin: 2rem 0;">
                    <div class="progress-bar" style="height: 12px; background: var(--surface-color); border-radius: 6px; overflow: hidden;">
	                        <div id="downloadProgressFill" class="progress-fill" style="width: 0%; height: 100%; background: var(--brand-gradient);"></div>
                    </div>
                    <p id="downloadStatus" style="text-align: center; margin-top: 1rem; color: var(--text-secondary);">Starting download...</p>
                </div>
                <p style="font-size: 0.85rem; color: var(--text-secondary);">This may take a few minutes depending on your connection speed. The model will be cached locally for future use.</p>
	            `);

            // Listen for download progress events
            if (!window.__TAURI__ || !window.__TAURI__.event || typeof window.__TAURI__.event.listen !== 'function') {
                console.error('[Onboarding] Cannot listen for download progress events (Tauri event API unavailable).');
                return;
            }
            const { listen } = window.__TAURI__.event;
            const unlisten = await listen('whisper-download-progress', (event) => {
                const data = event.payload;
                const progressFill = document.getElementById('downloadProgressFill');
                const statusText = document.getElementById('downloadStatus');

                if (progressFill && data.percent !== undefined) {
                    progressFill.style.width = `${data.percent}%`;
                }

                if (statusText) {
                    if (data.status === 'downloading') {
                        statusText.textContent = `Downloaded ${data.downloaded_mb?.toFixed(1) || 0} MB of ${data.total_mb || '?'} MB (${data.percent || 0}%)`;
                    } else if (data.status === 'complete') {
                        statusText.innerHTML = '<span class="icon-check"></span> Download complete!';
                    } else if (data.status === 'error') {
                        statusText.innerHTML = `<span class="icon-x-circle" style="color: rgb(var(--danger-rgb));"></span> Error: ${data.error || 'Download failed'}`;
                    }
                }

                // If download is complete, finish onboarding
                if (data.status === 'complete') {
                    unlisten();
                    setTimeout(async () => {
                        try {
                            await invoke('complete_onboarding');
                            await invoke('close_onboarding_window');
                        } catch (e) {
                            console.error('Error completing onboarding after download:', e);
                            window.close();
                        }
                    }, 1000);
                }
            });

            // Start the download
            try {
                await invoke('download_whisper_model', { model_filename: modelFilename });
            } catch (error) {
                console.error('Download failed:', error);
                const statusText = document.getElementById('downloadStatus');
                if (statusText) {
                    statusText.innerHTML = `<span class="icon-x-circle" style="color: rgb(var(--danger-rgb));"></span> Download failed: ${error}`;
                }
                // Show retry button
                nextBtn.textContent = 'Retry Download';
                nextBtn.style.display = 'block';
                nextBtn.dataset.overrideHandler = 'true';
                nextBtn.onclick = () => showDownloadProgress(modelFilename);
                unlisten();
            }
        }

        async function hydrateLlmApiKeyPlaceholder(provider) {
            try {
                // Only relevant for hosted providers.
                if (!(provider === 'openai' || provider === 'anthropic' || provider === 'gemini' || provider === 'grok')) return;

                // Avoid updating stale DOM if the user switched providers quickly.
                const currentProvider = document.getElementById('llmProvider')?.value;
                if (currentProvider !== provider) return;

                const input = document.getElementById('apiKey');
                if (!input) return;

                // Never populate actual API keys into the DOM.
                input.value = '';
                input.placeholder = llmApiKeyPlaceholder(provider);

                const deleteBtn = document.getElementById('deleteApiKeyBtn');

                const hasKey = await invoke('has_api_key', { provider });
                if (hasKey === true) {
                    input.placeholder = '••••••••••••••••';
                    // Show the delete button and wire it up (CSP-safe).
                    if (deleteBtn) {
                        deleteBtn.style.display = '';
                        deleteBtn.addEventListener('click', async () => {
                            try {
                                await invoke('delete_api_key', { provider });
                                input.value = '';
                                input.placeholder = llmApiKeyPlaceholder(provider);
                                deleteBtn.style.display = 'none';
                            } catch (err) {
                                console.error('Failed to delete API key:', err);
                            }
                        });
                    }
                } else if (deleteBtn) {
                    deleteBtn.style.display = 'none';
                }
            } catch (e) {
                // Non-fatal; keep base placeholder.
                console.warn('[Onboarding] has_api_key placeholder hydration failed:', e);
            }
        }

        // Debounce timer for URL input changes
        let _ollamaRefreshTimer = null;

        /// Debounced refresh: waits 500ms after the user stops typing in the URL field.
        function refreshOllamaModels() {
            clearTimeout(_ollamaRefreshTimer);
            _ollamaRefreshTimer = setTimeout(() => void fetchOllamaModels(), 500);
        }

        /// Fetch models from the Ollama endpoint and populate the model dropdown.
        /// Falls back to a manual text input if the server is unreachable.
        async function fetchOllamaModels() {
            const endpoint = (document.getElementById('ollamaUrl')?.value || '').trim() || 'http://localhost:11434';
            const container = document.getElementById('ollamaModelContainer');
            const status = document.getElementById('ollamaStatus');
            const section = document.getElementById('ollamaModelSection');
            if (!container) return;

            try {
                const models = await invoke('list_ollama_models', { endpoint });
                if (!models || models.length === 0) {
                    // No models available — keep model section hidden
                    if (section) section.style.display = 'none';
                    showOllamaFallbackInput(container, status, 'Ollama is running but no models found. Pull a model first.');
                    return;
                }
                // Build a <select> with the fetched models.
                // Keep selection stable across refreshes, using prefix matching
                // to handle tag suffixes (e.g. "llama3.2" matches "llama3.2:latest").
                const currentVal = (document.getElementById('ollamaModel')?.value || '').trim();
                const currentPrefix = currentVal.replace(/:latest$/, '');
                let matchedName = '';
                if (currentVal) {
                    // Try exact match first, then prefix match
                    const exact = models.find(m => m.name === currentVal);
                    if (exact) {
                        matchedName = exact.name;
                    } else {
                        const prefixMatch = models.find(m =>
                            m.name === currentPrefix ||
                            m.name === currentPrefix + ':latest' ||
                            (m.name || '').split(':')[0] === currentPrefix
                        );
                        if (prefixMatch) matchedName = prefixMatch.name;
                    }
                }
                let options = `<option value=""${matchedName ? '' : ' selected'}>Select a model...</option>` + models.map(m => {
                    const name = m.name || 'unknown';
                    const selected = name === matchedName ? ' selected' : '';
                    return `<option value="${name}"${selected}>${name}</option>`;
                }).join('');
                container.innerHTML = `<select id="ollamaModel" class="onb-input">${options}</select>`;
                if (status) {
                    status.style.color = 'var(--success-color, #22c55e)';
                    status.textContent = `✓ Ollama connected — ${models.length} model${models.length !== 1 ? 's' : ''} available`;
                }
                // Models loaded — show model section
                if (section) section.style.display = '';
            } catch (e) {
                // Connection failed — keep model section hidden
                if (section) section.style.display = 'none';
                showOllamaFallbackInput(container, status, 'Ollama is not reachable. Enter a model name manually.');
            }
        }

        /// Replace the model dropdown with a text input when Ollama is unreachable.
        function showOllamaFallbackInput(container, status, message) {
            const currentVal = (document.getElementById('ollamaModel')?.value || '').trim();
            container.innerHTML = `<input type="text" id="ollamaModel" class="onb-input" value="${currentVal}" placeholder="e.g., llama3.2, mistral, gemma2">`;
            if (status) {
                status.style.color = 'var(--warning-color, #f59e0b)';
                status.textContent = message;
            }
        }


        /// Fetch models for a cloud provider and populate the model dropdown.
        /// Uses the API key from the input field, or falls back to the keychain.
        async function fetchCloudModels(provider) {
            const section = document.getElementById('cloudModelSection');
            const select = document.getElementById('cloudModelSelect');
            const status = document.getElementById('cloudModelStatus');
            if (!select) return;

            // Determine the invoke command for this provider.
            const listCmd = {
                openai: 'list_openai_models',
                anthropic: 'list_anthropic_models',
                grok: 'list_grok_models',
                gemini: 'list_gemini_models',
            }[provider];
            if (!listCmd) return;

            // Get API key from the input (or empty to let the backend try keychain).
            const apiKeyInput = document.getElementById('apiKey');
            const apiKey = (apiKeyInput?.value || '').trim();

            // If the user has typed nothing and there's no key in the keychain, hide the section.
            let hasKeychainKey = false;
            try {
                hasKeychainKey = await invoke('has_api_key', { provider });
            } catch (_) { }
            if (!apiKey && !hasKeychainKey) {
                if (section) section.style.display = 'none';
                select.innerHTML = '<option value="">Enter API key to load models</option>';
                if (status) status.textContent = '';
                return;
            }

            // Show the section with a loading state.
            if (section) section.style.display = '';
            select.innerHTML = '<option value="">Loading models…</option>';
            select.disabled = true;
            if (status) { status.style.color = 'var(--text-secondary)'; status.textContent = 'Fetching available models…'; }

            // Preserve the currently-selected value so we can restore it after refresh.
            const currentVal = select.dataset.selectedModel || '';

            try {
                // Store the API key first if the user typed one, so the backend can use it.
                if (apiKey) {
                    try { await invoke('store_api_key', { provider, api_key: apiKey }); } catch (_) { }
                }

                const models = await invoke(listCmd, { api_key: apiKey });
                if (!models || models.length === 0) {
                    select.innerHTML = '<option value="">No models available</option>';
                    if (status) { status.style.color = 'var(--warning-color, #f59e0b)'; status.textContent = 'No models found for this API key.'; }
                    select.disabled = true;
                    return;
                }

                // Build options from the model list.
                select.innerHTML = '<option value="">Select a model…</option>';
                models.forEach(m => {
                    const id = m.id || m.name || '';
                    if (!id) return;
                    const opt = document.createElement('option');
                    opt.value = id;
                    opt.textContent = id;
                    select.appendChild(opt);
                });

                // Restore previous selection or saved config model.
                if (currentVal) {
                    const match = [...select.options].find(o => o.value === currentVal);
                    if (match) select.value = currentVal;
                }

                select.disabled = false;
                if (status) { status.style.color = 'var(--success-color, #22c55e)'; status.textContent = `✓ ${models.length} model${models.length !== 1 ? 's' : ''} available`; }
            } catch (e) {
                console.error(`Failed to fetch ${provider} models:`, e);
                select.innerHTML = '<option value="">Failed to load models</option>';
                select.disabled = true;
                if (status) { status.style.color = 'var(--error-color, #ef4444)'; status.textContent = `Error: ${e}`; }
            }
        }

        function renderLLMConfig({ fetchOllamaModels: shouldFetchOllamaModels = true } = {}) {
            const container = document.getElementById('llmConfig');
            if (!container) return;
            const provider = document.getElementById('llmProvider')?.value || 'ollama';
            let html = '';
            if (provider === 'ollama') {
                html = `

                        <label for="ollamaUrl">Ollama URL</label>
                        <input type="text" id="ollamaUrl" class="onb-input" value="http://localhost:11434">
                    </div>
                    <div id="ollamaModelSection" class="config-section" style="margin-top:0.75rem; display:none;">
                        <label for="ollamaModel">Model</label>
                        <div id="ollamaModelContainer">
                            <select id="ollamaModel" class="onb-input">
                                <option value="">Loading models…</option>
                            </select>
                        </div>
                        <div id="ollamaStatus" style="font-size:0.75rem;margin-top:0.25rem;color:var(--text-secondary);">Checking Ollama…</div>
                    </div>
                    <p style="font-size:0.8rem;color:var(--text-secondary);margin-top:0.5rem;">Make sure Ollama is running locally with your model pulled.</p>
                `;
                // Fetch models asynchronously after the DOM is updated.
                // Callers can disable this (e.g., when re-hydrating from config
                // so we fetch from the saved endpoint).
                if (shouldFetchOllamaModels) {
                    setTimeout(() => void fetchOllamaModels(), 0);
                }
            } else if (provider === 'openai' || provider === 'anthropic' || provider === 'gemini' || provider === 'grok') {
                html = `
                    <div class="config-section">
                        <label for="apiKey">${llmApiKeyLabel(provider)}</label>
                        <div class="api-key-row">
                            <input type="password" id="apiKey" class="onb-input" placeholder="${llmApiKeyPlaceholder(provider)}">
                            <button id="deleteApiKeyBtn" class="btn btn-small btn-delete-api-key" style="display:none;" title="Delete stored API key">Delete Key</button>
                        </div>
                        <p style="font-size:0.75rem;color:var(--text-secondary);margin-top:0.25rem;">Keys are stored securely in your OS keychain. Leave blank to keep your existing key.</p>
                    </div>
                    <div id="cloudModelSection" class="config-section" style="margin-top:0.75rem; display:none;">
                        <label for="cloudModelSelect">Model</label>
                        <select id="cloudModelSelect" class="onb-input">
                            <option value="">Enter API key to load models</option>
                        </select>
                        <div id="cloudModelStatus" style="font-size:0.75rem;margin-top:0.25rem;color:var(--text-secondary);"></div>
                    </div>
                `;
            } else {
                html = `<p style="font-size:0.85rem;color:var(--text-secondary);">No additional configuration UI is available for this provider.</p>`;
            }
            container.innerHTML = html;

            // Attach programmatic listeners for dynamic content (CSP-safe).
            if (provider === 'ollama') {
                document.getElementById('ollamaUrl')?.addEventListener('input', () => refreshOllamaModels());
            }

            // Async placeholder hydration (key existence) without blocking UI render.
            // Also trigger model fetch for cloud providers (uses keychain key if available).
            if (provider === 'openai' || provider === 'anthropic' || provider === 'gemini' || provider === 'grok') {
                void hydrateLlmApiKeyPlaceholder(provider);

                // Debounced model fetch when the user types an API key.
                const apiKeyInput = document.getElementById('apiKey');
                if (apiKeyInput) {
                    let _cloudModelTimer = null;
                    apiKeyInput.addEventListener('input', () => {
                        clearTimeout(_cloudModelTimer);
                        _cloudModelTimer = setTimeout(() => void fetchCloudModels(provider), 800);
                    });
                }

                // Kick off an initial model fetch (uses keychain key if already stored).
                setTimeout(() => void fetchCloudModels(provider), 0);
            }
        }

        // Load LLM config from saved settings and render
        async function loadLLMConfig() {
            try {
                const config = await invoke('get_config');
                const llmPrimary = config?.llm?.primary || 'ollama';
                const ollamaConfig = config?.llm?.ollama;

                // Set the provider dropdown
                const providerSelect = document.getElementById('llmProvider');
                if (providerSelect) {
                    providerSelect.value = llmPrimary;
                }

                // Render config UI (without auto-fetch for Ollama so we can set URL first).
                renderLLMConfig({ fetchOllamaModels: false });

                // Populate Ollama fields if applicable.
                if (llmPrimary === 'ollama' && ollamaConfig) {
                    // Set the URL first so the model fetch uses the saved endpoint.
                    const urlInput = document.getElementById('ollamaUrl');
                    if (urlInput && ollamaConfig.base_url) urlInput.value = ollamaConfig.base_url;

                    // Fetch models from the saved endpoint, then select the saved
                    // model.  The model element may be a <select> (if Ollama
                    // responded) or a text <input> (fallback).
                    try {
                        await fetchOllamaModels();
                    } catch (_) { /* fallback input already rendered */ }

                    const modelEl = document.getElementById('ollamaModel');
                    if (modelEl && ollamaConfig.model) {
                        // Try exact match first.
                        modelEl.value = ollamaConfig.model;
                        // If exact match failed (e.g. config has "llama3.2" but
                        // Ollama returns "llama3.2:latest"), try a prefix match.
                        if (!modelEl.value && modelEl.tagName === 'SELECT') {
                            const prefix = ollamaConfig.model.replace(/:latest$/, '');
                            const match = Array.from(modelEl.options || []).find(o =>
                                o.value === prefix ||
                                o.value === prefix + ':latest' ||
                                o.value.split(':')[0] === prefix
                            );
                            if (match) modelEl.value = match.value;
                        }
                        // If still nothing selected and there are real options,
                        // auto-select the first available model so the user
                        // doesn't accidentally leave with an empty value.
                        if (!modelEl.value && modelEl.tagName === 'SELECT') {
                            const firstReal = Array.from(modelEl.options || []).find(o => (o.value || '').trim().length > 0);
                            if (firstReal) modelEl.value = firstReal.value;
                        }
                    }
                }

                // Hydrate the cloud-provider model dropdown with the saved model.
                // renderLLMConfig() already kicked off fetchCloudModels() in the
                // background; we just need to tell it which value to restore once
                // the model list arrives.
                if (llmPrimary === 'openai' || llmPrimary === 'anthropic' || llmPrimary === 'gemini' || llmPrimary === 'grok') {
                    const savedModel = (config?.llm?.[llmPrimary]?.model || '').trim();
                    const cloudSelect = document.getElementById('cloudModelSelect');
                    if (cloudSelect && savedModel) {
                        // Stash the saved model on the element so fetchCloudModels()
                        // can restore it after the API call finishes.
                        cloudSelect.dataset.selectedModel = savedModel;
                    }
                }
            } catch (error) {
                console.error('Error loading LLM config:', error);
                renderLLMConfig();
            }
        }

        async function updateAgentPermissionLevel(level) {
            // Remember the user's choice for this onboarding session so if they
            // navigate back to this step we don't reset to the template default.
            window.__onboardingAgentPermLevel = level;

            // Ensure the semantic radio state is correct, then sync our custom visuals.
            // (WKWebView + hidden native radios means our UI depends on this sync.)
            const radio = document.querySelector(`input[name="agentPermLevel"][value="${level}"]`);
            if (radio) radio.checked = true;
            syncOptionCardBordersForRadioGroup('agentPermLevel');
            try {
                await invoke('set_default_permission_level', { level });
                console.log('[Onboarding] Set default agent permission level:', level);
            } catch (error) {
                console.error('[Onboarding] Error setting agent permission level:', error);
                // Keep UI consistent with the selected radio even if persistence fails.
            } finally {
                syncOptionCardBordersForRadioGroup('agentPermLevel');
            }
        }

        async function loadAgentPermissionLevel() {
            // UX policy: always default onboarding to Sandbox (Recommended).
            // We ignore any previously persisted global default here.
            try {
                let level = (window.__onboardingAgentPermLevel || 'sandbox').toLowerCase();
                if (!['sandbox', 'restricted', 'full'].includes(level)) level = 'sandbox';

                const radio = document.querySelector(`input[name="agentPermLevel"][value="${level}"]`);
                if (radio) radio.checked = true;
                syncOptionCardBordersForRadioGroup('agentPermLevel');

                // Persist the default so continuing without interaction still uses Sandbox.
                // If the user changes it, updateAgentPermissionLevel() will persist their choice.
                if (!window.__onboardingAgentPermLevel && level === 'sandbox') {
                    try {
                        await invoke('set_default_permission_level', { level: 'sandbox' });
                    } catch (e) {
                        console.warn('[Onboarding] Failed to persist sandbox default permission level:', e);
                    }
                }
            } catch (error) {
                console.error('[Onboarding] Error loading agent permission level:', error);
                // Fallback: enforce Sandbox so a default is always visible.
                const fallback = document.querySelector('input[name="agentPermLevel"][value="sandbox"]');
                if (fallback) fallback.checked = true;
                syncOptionCardBordersForRadioGroup('agentPermLevel');
            }
        }

        async function scanForRings() {
            const btn = document.getElementById('scanBtn');
            const status = document.getElementById('ringStatus');
            btn.textContent = 'Scanning...';
            btn.disabled = true;
            try {
                const rings = await invoke('scan_for_rings');
                status.textContent = rings?.length > 0 ? `Found ${rings.length} device(s)` : 'No devices found. Make sure your device is in pairing mode.';
            } catch (error) {
                status.textContent = 'Bluetooth scan failed. Check permissions.';
            } finally {
                btn.textContent = 'Scan for Devices';
                btn.disabled = false;
            }
        }

        // Initialize when DOM is ready (handles cases where the script executes after DOMContentLoaded).
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                void initOnboarding();
            });
        } else {
            void initOnboarding();
        }

        // External link handler — open in system default browser via opener plugin
        document.addEventListener('click', (e) => {
            const anchor = e.target.closest('a[href]');
            if (!anchor) return;
            const href = anchor.getAttribute('href') || '';
            if (/^https?:\/\//i.test(href)) {
                e.preventDefault();
                if (window.__TAURI__?.opener?.openUrl) {
                    window.__TAURI__.opener.openUrl(href).catch((err) =>
                        console.error('[opener] Failed to open URL:', href, err)
                    );
                }
            }
        });
    </script>
</body>
