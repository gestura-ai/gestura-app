[package]
name = "gestura-protocol"
version.workspace = true
edition = "2024"
license = "LicenseRef-Gestura-Prosperity-1.1"
description = "Haptica Harmony B1 Shared Semantic Protocol — pure codec/types, the canonical wire contract. No transport, no async: compiles to WASM untouched so the TypeScript SDK shares the exact Rust source of truth."

[lib]
# rlib for the workspace; cdylib for the wasm-bindgen artifact.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1.0", features = ["v4"] }

# WASM bindings (feature-gated so native workspace builds stay lean).
# On wasm32, uuid needs the `js` feature for a browser RNG.
wasm-bindgen = { version = "0.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.0", features = ["v4", "js"] }

# `std::time::SystemTime::now()` is unimplemented on wasm32-unknown-unknown
# (it traps with `unreachable`), so host timestamps come from `Date.now()`.
# (wasm32-wasi has a real clock and keeps the std path.)
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = "0.3"

[features]
default = []
wasm = ["dep:wasm-bindgen"]

# rustc's wasm32 baseline emits bulk-memory, non-trapping float→int,
# sign-extension and mutable-globals ops; wasm-pack invokes wasm-opt without
# feature flags, so pass them explicitly or `-O` fails validation on older
# binaryen releases (verified: binaryen 108 rejects sign-ext without it).
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
    "--enable-mutable-globals",
]
