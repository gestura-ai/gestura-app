[package]
name = "gestura-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Gestura command-line interface for voice-first AI assistant"

[[bin]]
name = "gestura"
path = "src/main.rs"

[features]
default = ["voice-local", "security"]
# Pass-through features to gestura-core
voice-local = ["gestura-core/voice-local"]
nats = ["gestura-core/nats"]
security = ["gestura-core/security"]
# Development features - enables dev-only code paths
dev = ["gestura-core/dev"]

[dependencies]
# Shared core library
gestura-core.workspace = true

# CLI framework
clap.workspace = true
clap_complete = "4"
clap_mangen = "0.2"

# Terminal UI
ratatui.workspace = true
crossterm.workspace = true
dialoguer.workspace = true
indicatif.workspace = true
console.workspace = true
colored.workspace = true

# Configuration
toml.workspace = true

# Core dependencies
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
uuid.workspace = true
dirs.workspace = true
futures.workspace = true
whoami = "2.0.2"
rustyline = "17.0.2"
textwrap = "0.16.2"
regex = "1.12.2"
reqwest = { workspace = true, features = ["json"] }
termsize = "0.1.9"
arboard = "3.6.1"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
assert_cmd = "2"
predicates = "3"

