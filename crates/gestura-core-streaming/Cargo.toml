[package]
name = "gestura-core-streaming"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Streaming LLM provider support for Gestura"

[features]
default = []

[dependencies]
gestura-core-foundation = { path = "../gestura-core-foundation" }
gestura-core-llm = { path = "../gestura-core-llm" }
gestura-core-tools = { path = "../gestura-core-tools" }
futures-util.workspace = true
reqwest.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }

