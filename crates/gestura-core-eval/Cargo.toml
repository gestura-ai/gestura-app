[package]
name = "gestura-core-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Standalone evaluation harness for Gestura — 8 standardised scenarios run against the gestura CLI"

# Standalone binary: drives the gestura CLI as a black-box subprocess.
# Intentionally separate from the thin gestura binary so eval logic never ships in the product.
[[bin]]
name = "gestura-eval"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
chrono.workspace = true
uuid.workspace = true
regex = "1"
toml.workspace = true
clap.workspace = true
colored.workspace = true
indicatif.workspace = true
console.workspace = true

