[package]
name = "gestura-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Shared core library for Gestura voice-first AI assistant"

[features]
default = ["voice-local"]
# Ring integration
ring-integration = ["dep:gestura-core-ring", "dep:gestura-core-haptics", "dep:gestura-core-gestures"]
# Local voice via whisper.cpp bindings
voice-local = ["dep:whisper-rs", "gestura-core-audio/voice-local"]
# NATS messaging integration
nats = ["gestura-core-nats/nats"]
# JSON-LD processing for MDH
json-ld = ["dep:json-ld"]
# Security features (encryption, keychain)
security = ["gestura-core-security/security", "dep:keyring"]
# macOS permissions (objc/cocoa bindings for TCC permission dialogs)
macos-permissions = ["dep:objc", "dep:cocoa"]
# Linux permissions (xdg-desktop-portal for Wayland, D-Bus for system checks)
linux-permissions = ["dep:ashpd", "dep:zbus"]
# Windows permissions (stub - Windows prompts on first access, no WinRT APIs needed)
windows-permissions = []


[dependencies]
# Core dependencies from workspace
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
uuid.workspace = true
dirs.workspace = true
reqwest.workspace = true
futures.workspace = true
futures-util.workspace = true
bytes.workspace = true

# Internal crates
gestura-core-foundation.workspace = true
gestura-core-tools.workspace = true
gestura-core-mcp.workspace = true
gestura-core-llm.workspace = true
gestura-core-pipeline.workspace = true
gestura-core-tasks.workspace = true
gestura-core-streaming.workspace = true
gestura-core-sessions.workspace = true
gestura-core-config.workspace = true
gestura-core-security.workspace = true
gestura-core-memory-bank.workspace = true
gestura-core-a2a.workspace = true
gestura-core-explorer.workspace = true
gestura-core-knowledge.workspace = true
gestura-core-nats.workspace = true
gestura-core-ipc.workspace = true
gestura-core-analytics.workspace = true
gestura-core-hooks.workspace = true
gestura-core-scripting.workspace = true
gestura-core-plugins.workspace = true
gestura-core-retry.workspace = true
gestura-core-agents.workspace = true
gestura-core-context.workspace = true
gestura-core-intent.workspace = true
gestura-core-ring = { path = "../gestura-core-ring", optional = true }
gestura-core-haptics = { path = "../gestura-core-haptics", optional = true }
gestura-core-gestures = { path = "../gestura-core-gestures", optional = true }

# Audio processing
cpal.workspace = true
hound.workspace = true
bytemuck.workspace = true

# Voice processing (optional)
whisper-rs = { version = "0.14", optional = true }

# JSON-LD processing (optional)
json-ld = { version = "0.16", optional = true }



# Security (optional — keyring direct usage in config bridge)
keyring = { workspace = true, optional = true }


# Utilities
lazy_static.workspace = true
tempfile.workspace = true
hex.workspace = true
base64.workspace = true
image.workspace = true
rand.workspace = true
toml.workspace = true
regex.workspace = true
urlencoding.workspace = true
notify.workspace = true
serde_yaml.workspace = true
gestura-core-audio.workspace = true
dashmap = "6.1.0"
blake3 = "1.8.3"
tracing-opentelemetry = "0.32.1"
opentelemetry = "0.31.0"
portable-pty = "0.9.0"

[target.'cfg(unix)'.dependencies]
# Unix signal handling (for screen recording on Unix platforms)
nix = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS specific (optional)
objc = { version = "0.2", optional = true }
cocoa = { version = "0.25", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux specific (optional) - xdg-desktop-portal integration
ashpd = { version = "0.10.3", optional = true }
zbus = { version = "5", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
