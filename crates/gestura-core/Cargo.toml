[package]
name = "gestura-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Shared core library for Gestura voice-first AI assistant"

[features]
default = ["voice-local"]
# Local voice via whisper.cpp bindings
voice-local = ["dep:whisper-rs"]
# Cloud voice via OpenAI Whisper HTTP
voice-openai = []
# NATS messaging integration
nats = ["dep:async-nats"]
# BLE integration for Haptic Harmony ring
ble = ["dep:btleplug"]
# JSON-LD processing for MDH
json-ld = ["dep:json-ld"]
# Security features (encryption, keychain)
security = ["dep:ring", "dep:keyring"]
# macOS permissions (objc/cocoa bindings for TCC permission dialogs)
macos-permissions = ["dep:objc", "dep:cocoa"]
# Linux permissions (xdg-desktop-portal for Wayland, D-Bus for system checks)
linux-permissions = ["dep:ashpd", "dep:zbus"]
# Windows permissions (stub - Windows prompts on first access, no WinRT APIs needed)
windows-permissions = []
# Development/testing features - enables dev-only code paths
# WARNING: Do NOT enable in production releases
dev = []

[dependencies]
# Core dependencies from workspace
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
uuid.workspace = true
dirs.workspace = true
reqwest.workspace = true
futures.workspace = true
futures-util.workspace = true
bytes.workspace = true

# Internal crates
gestura-core-foundation.workspace = true

# Audio processing
cpal.workspace = true
hound.workspace = true
bytemuck.workspace = true

# Voice processing (optional)
whisper-rs = { version = "0.14", optional = true }

# BLE integration (optional)
btleplug = { version = "0.11", optional = true }

# JSON-LD processing (optional)
json-ld = { version = "0.16", optional = true }

# Security (optional)
ring = { version = "0.17", optional = true }
keyring = { version = "2.3", optional = true }

# NATS messaging (optional)
async-nats = { version = "0.42", optional = true }

# macOS specific (optional)
objc = { version = "0.2", optional = true }
cocoa = { version = "0.25", optional = true }

# Linux specific (optional) - xdg-desktop-portal integration
ashpd = { version = "0.10.3", optional = true }
zbus = { version = "5", optional = true }

# Utilities
lazy_static.workspace = true
tempfile.workspace = true
hex.workspace = true
base64.workspace = true
	image.workspace = true
rand.workspace = true
toml.workspace = true
regex.workspace = true
urlencoding.workspace = true
scraper = "0.25.0"
url = "2.5.8"
notify = { version = "8.2.0", features = ["macos_fsevent"] }
serde_yaml = "0.9.34"
libc = "0.2.180"

[target.'cfg(unix)'.dependencies]
# Unix signal handling (for screen recording on Unix platforms)
nix = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
