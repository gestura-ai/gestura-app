<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gestura Theme Demo</title>
  <style>
    :root{
      --bg: #ffffff; --text: #0f172a; --muted: #475569; --accent: #2563eb; --accent-contrast: #fff;
    }
    :root[data-theme="dark"]{
      --bg: #0b1020; --text: #e2e8f0; --muted: #94a3b8; --accent: #60a5fa; --accent-contrast: #020617;
    }
    body{ background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, sans-serif; margin:0; padding:2rem; }
    .panel{ border:1px solid color-mix(in oklab, var(--text) 12%, transparent); border-radius:12px; padding:1rem; }
    .btn{ background: var(--accent); color: var(--accent-contrast); padding:.5rem 1rem; border-radius:8px; border:none; cursor:pointer; }
    .row{ display:flex; gap:1rem; align-items:center; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Gestura Theme</h1>
    <div class="row">
      <label>Theme:</label>
      <select id="mode">
        <option value="system">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
      <label>Accent:</label>
      <select id="accent">
        <option value="blue">Blue</option>
        <option value="emerald">Emerald</option>
        <option value="amber">Amber</option>
      </select>
      <button id="save" class="btn">Save</button>
    </div>
  </div>

  <script>
    const media = window.matchMedia('(prefers-color-scheme: dark)');
    function applyTheme(mode, accent){
      const dark = mode === 'system' ? media.matches : (mode === 'dark');
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      // Accent tokens
      const accents = { blue:['#2563eb','#fff'], emerald:['#10b981','#001510'], amber:['#f59e0b','#1f1300'] };
      const pair = accents[accent] || accents.blue;
      document.documentElement.style.setProperty('--accent', pair[0]);
      document.documentElement.style.setProperty('--accent-contrast', pair[1]);
    }
    media.addEventListener?.('change', () => {
      if(localStorage.getItem('ui.theme_mode') === 'system'){ applyTheme('system', localStorage.getItem('ui.accent') || 'blue'); }
    });
    // Load prefs (fallback to system)
    const mode = localStorage.getItem('ui.theme_mode') || 'system';
    const accent = localStorage.getItem('ui.accent') || 'blue';
    document.getElementById('mode').value = mode;
    document.getElementById('accent').value = accent;
    applyTheme(mode, accent);
    document.getElementById('save').onclick = async () => {
      const m = document.getElementById('mode').value;
      const a = document.getElementById('accent').value;
      localStorage.setItem('ui.theme_mode', m);
      localStorage.setItem('ui.accent', a);
      applyTheme(m, a);
      // Optional: sync to backend via Tauri invoke('set_ui_prefs', { ui: { theme_mode: m, accent: a } })
    }
  </script>
</body>
</html>
