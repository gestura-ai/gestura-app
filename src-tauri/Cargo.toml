[package]
name = "gestura"
version = "0.1.0"
edition = "2024"
description = "Gestura desktop app (Tauri v2)"
license = "MIT"

# Tauri expects to run from the src-tauri folder
default-run = "gestura"

[build-dependencies]
# Keep aligned with the tauri dependency below
tauri-build = { version = "2", features = [] }
base64 = "0.22"
image = { version = "0.25", features = ["png"] }

[features]
# Default features for production builds - voice-local is always enabled
default = ["voice-local"]
# Enable NATS MQ integration
nats = ["dep:async-nats"]
# Local voice via whisper.cpp bindings
voice-local = ["dep:whisper-rs"]
# Local voice via Faster-Whisper (CTranslate2) scaffolding
voice-faster-whisper = []
# Cloud voice via OpenAI Whisper HTTP
voice-openai = []
# BLE integration for Haptic Harmony ring
ble = ["dep:btleplug"]
# JSON-LD processing for MDH
json-ld = ["dep:json-ld"]
# macOS permissions
macos-permissions = ["dep:objc", "dep:cocoa"]
# Security features (encryption, keychain)
security = ["dep:ring", "dep:keyring"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Audio capture for microphone input
cpal = "0.15"
# Tauri v2 core (latest compatible 2.x)
# Enable tray feature so we can compile system tray functionality
# even without CLI auto-feature management.
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
dirs = "6"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "io-std"] }
async-trait = "0.1"
async-nats = { version = "0.42.0", optional = true }
reqwest = { version = "0.12.22", features = ["json", "multipart", "rustls-tls", "stream"] }
futures-util = "0.3.31"
bytes = "1.10.1"
hound = "3.5.1"
bytemuck = "1.23.2"
whisper-rs = { version = "0.14.4", optional = true }
# BLE integration
btleplug = { version = "0.11", optional = true }
# JSON-LD processing
json-ld = { version = "0.16", optional = true }
# Security and encryption
ring = { version = "0.17", optional = true }
keyring = { version = "2.3", optional = true }
# Logging and tracing
tracing = "0.1"
tracing-subscriber = "0.3"
# Time handling
chrono = { version = "0.4", features = ["serde"] }
# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }
# Static globals
lazy_static = "1.4"
# Testing utilities
tempfile = "3.8"
# Hex encoding/decoding
hex = "0.4"
# Base64 encoding (for mock encryption)
base64 = "0.21"
# Random number generation
rand = "0.8"
# Async utilities
futures = "0.3"
# Directories
# macOS permissions (optional)
objc = { version = "0.2", optional = true }
cocoa = { version = "0.25", optional = true }
image = { version = "0.25", features = ["png"] }
tauri-plugin-dialog = "2"

# Note: Stage 1 deliberately avoids pulling hardware/LLM crates to keep `cargo check` fast.
# We will add them in later stages.

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true







