name: Publish Rustdoc

on:
  # Deploy only after a successful Release workflow run.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  # Allow manual re-deploys (e.g. after a Pages outage).
  workflow_dispatch:

permissions:
  contents: read
  pages: write      # required to deploy to GitHub Pages
  id-token: write   # required by the OIDC token used by actions/deploy-pages

concurrency:
  group: rustdoc-deploy
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: stable

jobs:
  build:
    name: Build Rustdoc artifact
    runs-on: ubuntu-22.04
    # For workflow_run: only proceed when the Release workflow succeeded.
    # For workflow_dispatch: always run (manual re-deploy).
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          # Use the exact SHA that the release workflow built from.
          # Falls back to HEAD when triggered manually.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libclang-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            pkg-config
          sudo apt-get install -y libwebkit2gtk-4.1-dev 2>/dev/null || sudo apt-get install -y libwebkit2gtk-4.0-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rustdoc-pages-ubuntu-22.04
          cache-targets: true

      - name: Select Rustdoc packages
        run: |
          python3 <<'PYTHON'
          import json
          import shlex
          import subprocess

          metadata = json.loads(
              subprocess.check_output(
                  ["cargo", "metadata", "--no-deps", "--format-version", "1"],
                  text=True,
              )
          )
          packages = sorted(
              package["name"]
              for package in metadata["packages"]
              if package["name"] == "gestura-core" or package["name"].startswith("gestura-core-")
          )
          if not packages:
              raise SystemExit("No gestura-core packages were found for Rustdoc publishing.")

          args = " ".join(f"-p {shlex.quote(package)}" for package in packages)

          with open("rustdoc-packages.txt", "w", encoding="utf-8") as handle:
              for package in packages:
                  handle.write(f"{package}\n")

          import os
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"DOC_PACKAGES={args}\n")
          PYTHON

      - name: Build hosted Rustdoc
        run: cargo doc --no-deps --all-features $DOC_PACKAGES

      - name: Prepare Rustdoc artifact
        run: |
          touch target/doc/.nojekyll
          if [ -f target/doc/index.html ]; then
            mv target/doc/index.html target/doc/workspace-index.html
          fi
          cat > target/doc/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0; url=./gestura_core/index.html" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Gestura Rustdoc</title>
            </head>
            <body>
              <p>Redirecting to <a href="./gestura_core/index.html">gestura_core/index.html</a>…</p>
              <p>Need the full crate list? Open <a href="./workspace-index.html">workspace-index.html</a>.</p>
            </body>
          </html>
          HTML

      - name: Write build summary
        run: |
          {
            echo "## Rustdoc artifact output"
            echo
            echo "- Workflow artifact: rustdoc-site"
            echo "- Primary crate entry point in artifact: gestura_core/index.html"
            echo "- Workspace landing page in artifact: workspace-index.html"
            echo
            echo "### Published packages"
            sed "s/^/- /" rustdoc-packages.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
