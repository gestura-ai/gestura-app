name: Publish Rustdoc

on:
  # Deploy only after a successful Release workflow run that originated from
  # main or a version tag.  workflow_run environment-protection checks use the
  # head_branch of the *triggering* workflow, not the default branch, so
  # without this filter a Release dispatched manually from "dev" would cause
  # the deploy job to be rejected by the github-pages environment protection
  # rules with "Branch 'dev' is not allowed to deploy to github-pages".
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches:
      - main
      - 'v[0-9]*'
  # Allow manual re-deploys (e.g. after a Pages outage).
  workflow_dispatch:

permissions:
  contents: read
  pages: write      # required to deploy to GitHub Pages
  id-token: write   # required by the OIDC token used by actions/deploy-pages

concurrency:
  group: rustdoc-deploy
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: stable

jobs:
  build:
    name: Build Rustdoc artifact
    runs-on: ubuntu-22.04
    # For workflow_run: only proceed when the Release workflow succeeded.
    # For workflow_dispatch: always run (manual re-deploy).
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          # Use the exact SHA that the release workflow built from.
          # Falls back to HEAD when triggered manually.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libclang-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            pkg-config
          sudo apt-get install -y libwebkit2gtk-4.1-dev 2>/dev/null || sudo apt-get install -y libwebkit2gtk-4.0-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rustdoc-pages-ubuntu-22.04
          cache-targets: true

      - name: Select Rustdoc packages
        run: |
          python3 <<'PYTHON'
          import json
          import shlex
          import subprocess

          metadata = json.loads(
              subprocess.check_output(
                  ["cargo", "metadata", "--no-deps", "--format-version", "1"],
                  text=True,
              )
          )
          packages = sorted(
              package["name"]
              for package in metadata["packages"]
              if package["name"] == "gestura-core" or package["name"].startswith("gestura-core-")
          )
          if not packages:
              raise SystemExit("No gestura-core packages were found for Rustdoc publishing.")

          args = " ".join(f"-p {shlex.quote(package)}" for package in packages)

          with open("rustdoc-packages.txt", "w", encoding="utf-8") as handle:
              for package in packages:
                  handle.write(f"{package}\n")

          import os
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"DOC_PACKAGES={args}\n")
          PYTHON

      - name: Build hosted Rustdoc
        run: cargo doc --no-deps --all-features $DOC_PACKAGES

      - name: Prepare Rustdoc artifact
        run: |
          touch target/doc/.nojekyll
          python3 <<'PYTHON'
          from pathlib import Path

          doc_dir = Path("target/doc")
          packages_path = Path("rustdoc-packages.txt")
          packages = [
              line.strip()
              for line in packages_path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]

          crate_rows = []
          for package in packages:
              crate_name = package.replace("-", "_")
              crate_index = doc_dir / crate_name / "index.html"
              if crate_index.is_file():
                  crate_rows.append(
                      f'<li><a href="./{crate_name}/index.html">{crate_name}</a></li>'
                  )

          workspace_index_html = f"""<!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Gestura Rustdoc Workspace Index</title>
              <style>
                :root {{ color-scheme: light dark; }}
                body {{ font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 2rem auto; max-width: 52rem; line-height: 1.6; padding: 0 1rem; }}
                h1, h2 {{ line-height: 1.25; }}
                code {{ font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }}
              </style>
            </head>
            <body>
              <h1>Gestura Rustdoc Workspace Index</h1>
              <p>Published crate docs for the Gestura core workspace.</p>
              <p><a href="./index.html">Back to landing page</a></p>
              <h2>Published crates</h2>
              <ul>
                {''.join(crate_rows) or '<li>No crate docs were found in this artifact.</li>'}
              </ul>
            </body>
          </html>
          """

          landing_html = """<!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Gestura Rustdoc</title>
              <style>
                :root { color-scheme: light dark; }
                body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 2rem auto; max-width: 52rem; line-height: 1.6; padding: 0 1rem; }
                h1, h2 { line-height: 1.25; }
                code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
              </style>
            </head>
            <body>
              <h1>Gestura Rustdoc</h1>
              <p>The published API docs for Gestura’s core Rust workspace are available below.</p>
              <ul>
                <li><a href="./gestura_core/index.html">Open <code>gestura_core</code></a></li>
                <li><a href="./workspace-index.html">Open the full workspace crate index</a></li>
              </ul>
            </body>
          </html>
          """

          (doc_dir / "workspace-index.html").write_text(workspace_index_html, encoding="utf-8")
          (doc_dir / "index.html").write_text(landing_html, encoding="utf-8")
          PYTHON

      - name: Write build summary
        run: |
          {
            echo "## Rustdoc artifact output"
            echo
            echo "- Workflow artifact: rustdoc-site"
            echo "- Primary crate entry point in artifact: gestura_core/index.html"
            echo "- Workspace landing page in artifact: workspace-index.html"
            echo
            echo "### Published packages"
            sed "s/^/- /" rustdoc-packages.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
