name: Publish Rustdoc

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rustdoc-pages.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "README.md"
      - "crates/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rustdoc-pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: stable

jobs:
  build:
    name: Build Rustdoc site
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libclang-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            pkg-config
          sudo apt-get install -y libwebkit2gtk-4.1-dev 2>/dev/null || sudo apt-get install -y libwebkit2gtk-4.0-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rustdoc-pages-ubuntu-22.04
          cache-targets: true

      - name: Select Rustdoc packages
        run: |
          python3 <<'PYTHON'
          import json
          import shlex
          import subprocess

          metadata = json.loads(
              subprocess.check_output(
                  ["cargo", "metadata", "--no-deps", "--format-version", "1"],
                  text=True,
              )
          )
          packages = sorted(
              package["name"]
              for package in metadata["packages"]
              if package["name"] == "gestura-core" or package["name"].startswith("gestura-core-")
          )
          if not packages:
              raise SystemExit("No gestura-core packages were found for Rustdoc publishing.")

          args = " ".join(f"-p {shlex.quote(package)}" for package in packages)

          with open("rustdoc-packages.txt", "w", encoding="utf-8") as handle:
              for package in packages:
                  handle.write(f"{package}\n")

          import os
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"DOC_PACKAGES={args}\n")
          PYTHON

      - name: Build hosted Rustdoc
        run: cargo doc --no-deps --all-features $DOC_PACKAGES

      - name: Prepare Pages artifact
        run: |
          touch target/doc/.nojekyll
          if [ -f target/doc/index.html ]; then
            mv target/doc/index.html target/doc/workspace-index.html
          fi
          cat > target/doc/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0; url=./gestura_core/index.html" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Gestura Rustdoc</title>
            </head>
            <body>
              <p>Redirecting to <a href="./gestura_core/index.html">gestura_core/index.html</a>…</p>
              <p>Need the full crate list? Open <a href="./workspace-index.html">workspace-index.html</a>.</p>
            </body>
          </html>
          HTML

      - name: Write build summary
        run: |
          {
            echo "## Hosted Rustdoc publish target"
            echo
            echo "- URL: https://gestura-ai.github.io/gestura-app/"
            echo "- Primary crate entry point: https://gestura-ai.github.io/gestura-app/gestura_core/index.html"
            echo
            echo "### Published packages"
            sed "s/^/- /" rustdoc-packages.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    name: Deploy Rustdoc site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
