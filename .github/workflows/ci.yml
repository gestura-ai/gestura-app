name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy
    
    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        # Tauri requires GTK, GLib, and WebKit libraries for compilation
        # ALSA is required for audio functionality (alsa-sys crate)
        # libclang-dev is required for bindgen to generate FFI bindings for whisper-rs
        sudo apt-get install -y build-essential cmake pkg-config libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libclang-dev
        # Ubuntu 24.04+ uses webkit2gtk-4.1, older versions use 4.0
        sudo apt-get install -y libwebkit2gtk-4.1-dev 2>/dev/null || sudo apt-get install -y libwebkit2gtk-4.0-dev

    - name: Install system dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install cmake
    
    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo index
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo build
      uses: actions/cache@v3
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      run: cargo fmt --all -- --check

    # Use --no-default-features to avoid building whisper-rs (voice-local) which requires
    # complex native dependencies. We test voice-local separately where it's known to work.
    - name: Run clippy
      run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

    - name: Run tests (no default features)
      run: cargo test --workspace --no-default-features

    - name: Run tests (nats feature)
      run: cargo test --workspace --no-default-features --features nats

    # voice-local requires whisper.cpp build which needs cmake and native libs
    # Skip on Windows (cmake complexity) and macOS CI (Accelerate framework issues)
    - name: Run tests (voice-local feature)
      if: matrix.os == 'ubuntu-latest'
      run: cargo test --workspace --no-default-features --features voice-local

    # Test with multiple features enabled (excluding platform-specific features like macos-permissions)
    # We can't use --all-features because macos-permissions pulls in macOS-only dependencies
    - name: Run tests (combined features)
      if: matrix.os == 'ubuntu-latest'
      run: cargo test --workspace --no-default-features --features "voice-local,nats,security,json-ld"

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'crates/gestura-gui/frontend/package-lock.json'

    - name: Install dependencies
      working-directory: crates/gestura-gui/frontend
      run: npm ci

    - name: Type check
      working-directory: crates/gestura-gui/frontend
      run: npm run build

    - name: Lint
      working-directory: crates/gestura-gui/frontend
      run: npx eslint src --ext .ts,.tsx || true  # Allow to pass for now

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Security audit
      run: |
        cargo install cargo-audit
        cargo audit

  build:
    name: Build Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        # Tauri requires GTK, GLib, and WebKit libraries for compilation
        # ALSA is required for audio functionality (alsa-sys crate)
        # libclang-dev is required for bindgen to generate FFI bindings for whisper-rs
        sudo apt-get install -y build-essential cmake pkg-config libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libclang-dev
        # Ubuntu 24.04+ uses webkit2gtk-4.1, older versions use 4.0
        sudo apt-get install -y libwebkit2gtk-4.1-dev 2>/dev/null || sudo apt-get install -y libwebkit2gtk-4.0-dev

    - name: Install system dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install cmake

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'crates/gestura-gui/frontend/package-lock.json'

    - name: Install frontend dependencies
      working-directory: crates/gestura-gui/frontend
      run: npm ci

    - name: Build frontend
      working-directory: crates/gestura-gui/frontend
      run: npm run build

    # Use --no-default-features on macOS/Windows to avoid whisper-rs build issues
    # Ubuntu has the required native dependencies installed
    - name: Build CLI (Ubuntu with voice-local)
      if: matrix.os == 'ubuntu-latest'
      run: cargo build --release -p gestura-cli

    - name: Build CLI (macOS/Windows without voice-local)
      if: matrix.os != 'ubuntu-latest'
      run: cargo build --release -p gestura-cli --no-default-features

    # Use cargo check for gestura-gui to avoid Tauri's sidecar binary validation
    # The sidecar binaries (externalBin) only exist for macOS release builds
    # cargo check validates the code compiles without running the Tauri build script
    - name: Check GUI (Ubuntu with voice-local)
      if: matrix.os == 'ubuntu-latest'
      run: cargo check --release -p gestura-gui

    - name: Check GUI (macOS/Windows without voice-local)
      if: matrix.os != 'ubuntu-latest'
      run: cargo check --release -p gestura-gui --no-default-features
