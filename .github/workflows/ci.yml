name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: 'lts/*'
  # Pin Rust version for reproducible builds
  RUST_VERSION: stable

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Pin macOS to macos-14 (ARM/Sonoma) and Windows to windows-2022 for reproducibility.
          # Non-Linux runners exclude gestura-gui from Rust test targets because GUI compilation
          # is covered by the dedicated build matrix and release pipeline.
          - os: ubuntu-latest
            rust: stable
            test_flags: --workspace
          - os: windows-2022
            rust: stable
            test_flags: --workspace --exclude gestura-gui
          - os: macos-14
            rust: stable
            test_flags: --workspace --exclude gestura-gui

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy
        # Add cross-compilation targets for macOS universal binary validation
        targets: ${{ matrix.os == 'macos-14' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        # Tauri requires GTK, GLib, and WebKit libraries for compilation
        # ALSA is required for audio functionality (alsa-sys crate)
        # libclang-dev is required for bindgen to generate FFI bindings for whisper-rs
        # libssl-dev is required for openssl-sys via transitive native-tls/OpenSSL consumers
        sudo apt-get install -y build-essential cmake pkg-config libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libclang-dev libssl-dev
        # Ubuntu 24.04+ uses webkit2gtk-4.1, older versions use 4.0
        sudo apt-get install -y libwebkit2gtk-4.1-dev 2>/dev/null || sudo apt-get install -y libwebkit2gtk-4.0-dev

    - name: Install system dependencies (macOS)
      if: matrix.os == 'macos-14'
      run: |
        # cmake: Required for whisper-rs (whisper.cpp) compilation
        # pkg-config: Required for locating system libraries
        # Note: Accelerate framework is built-in to macOS (used by whisper-rs for BLAS)
        brew install cmake pkg-config

    - name: Install system dependencies (Windows)
      if: matrix.os == 'windows-2022'
      shell: pwsh
      run: |
        $cmakePath = "C:\Program Files\CMake\bin"
        $llvmPath = "C:\Program Files\LLVM\bin"
        if (-not (Get-Command cmake -ErrorAction SilentlyContinue) -and -not (Test-Path "$cmakePath\cmake.exe")) {
          choco install cmake -y
        }
        if (-not (Test-Path "$llvmPath\libclang.dll")) {
          choco install llvm -y
        }
        if (Test-Path $cmakePath) {
          "$cmakePath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        }
        if (Test-Path $llvmPath) {
          "$llvmPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LIBCLANG_PATH=$llvmPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        } else {
          Write-Error "LLVM libclang path not found after setup: $llvmPath"
          exit 1
        }
        cmake --version
        & "$llvmPath\clang.exe" --version | Select-Object -First 1

    # Use Swatinem/rust-cache for better caching with feature flag support
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        # Include OS, Rust version, target triple for accurate caching
        prefix-key: "v1-rust-${{ matrix.os }}-${{ matrix.rust }}-${{ matrix.os == 'macos-14' && 'universal-apple-darwin' || matrix.os == 'windows-2022' && 'x86_64-pc-windows-msvc' || 'x86_64-unknown-linux-gnu' }}"
        # Cache the target directory
        cache-targets: true
        # Also cache ~/.cargo/bin for installed tools
        cache-all-crates: true

    - name: Check formatting
      run: cargo fmt --all -- --check

    # Use --no-default-features to avoid building whisper-rs (voice-local) which requires
    # complex native dependencies. We test voice-local separately where it's known to work.
    - name: Run clippy
      run: cargo clippy ${{ matrix.test_flags }} --all-targets --no-default-features -- -D warnings

    - name: Run tests (no default features)
      run: cargo test ${{ matrix.test_flags }} --no-default-features

    - name: Run tests (nats feature)
      run: cargo test ${{ matrix.test_flags }} --no-default-features --features nats

    # voice-local requires whisper.cpp build which needs cmake and native libs
    # All platforms now have required dependencies installed (cmake, LLVM/clang)
    - name: Run tests (voice-local feature)
      run: cargo test ${{ matrix.test_flags }} --no-default-features --features voice-local

    # Test macos-permissions feature on macOS only (uses objc/cocoa bindings)
    # CRITICAL: This feature was previously untested - now validated on macOS CI
    - name: Run tests (macos-permissions feature)
      if: matrix.os == 'macos-14'
      run: cargo test ${{ matrix.test_flags }} --no-default-features --features macos-permissions

    # Test linux-permissions feature on Linux only (xdg-desktop-portal, D-Bus)
    - name: Run tests (linux-permissions feature)
      if: matrix.os == 'ubuntu-latest'
      run: cargo test ${{ matrix.test_flags }} --no-default-features --features linux-permissions

    # Test windows-permissions feature on Windows only (WinRT APIs)
    - name: Run tests (windows-permissions feature)
      if: matrix.os == 'windows-2022'
      run: cargo test ${{ matrix.test_flags }} --no-default-features --features windows-permissions

    # Test security feature (ring + keyring for encryption and keychain)
    - name: Run tests (security feature)
      run: cargo test ${{ matrix.test_flags }} --no-default-features --features security

    # Test json-ld feature (JSON-LD processing for MDH)
    - name: Run tests (json-ld feature)
      run: cargo test ${{ matrix.test_flags }} --no-default-features --features json-ld

    # Test with multiple features enabled (combined coverage)
    # Each platform includes its native permission feature for complete coverage
    - name: Run tests (combined features - Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: cargo test ${{ matrix.test_flags }} --no-default-features --features "voice-local,nats,security,json-ld,linux-permissions"

    - name: Run tests (combined features - macOS)
      if: matrix.os == 'macos-14'
      run: cargo test ${{ matrix.test_flags }} --no-default-features --features "voice-local,nats,security,json-ld,macos-permissions"

    # Windows combined features test (includes windows-permissions)
    - name: Run tests (combined features - Windows)
      if: matrix.os == 'windows-2022'
      run: cargo test ${{ matrix.test_flags }} --no-default-features --features "voice-local,nats,security,json-ld,windows-permissions"


  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: 'crates/gestura-gui/frontend/package-lock.json'

    - name: Install dependencies
      working-directory: crates/gestura-gui/frontend
      run: npm ci

    - name: Lint
      working-directory: crates/gestura-gui/frontend
      run: npm run lint

    - name: Build (typecheck + Vite)
      working-directory: crates/gestura-gui/frontend
      run: npm run build

    - name: Unit tests (Vitest)
      working-directory: crates/gestura-gui/frontend
      run: npm run test:unit

    - name: Install Playwright (Chromium)
      working-directory: crates/gestura-gui/frontend
      run: npx playwright install --with-deps chromium

    - name: E2E smoke (Playwright)
      working-directory: crates/gestura-gui/frontend
      run: npm run test:e2e:smoke

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Security audit
      run: |
        cargo install cargo-audit
        cargo audit

  build:
    name: Build Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Pin macOS to macos-14 (ARM/Sonoma) and Windows to windows-2022 for reproducibility
        os: [ubuntu-latest, windows-2022, macos-14]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        # Add cross-compilation targets for macOS universal binary validation
        targets: ${{ matrix.os == 'macos-14' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        # Tauri requires GTK, GLib, and WebKit libraries for compilation
        # ALSA is required for audio functionality (alsa-sys crate)
        # libclang-dev is required for bindgen to generate FFI bindings for whisper-rs
        # libssl-dev is required for openssl-sys via transitive native-tls/OpenSSL consumers
        sudo apt-get install -y build-essential cmake pkg-config libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libclang-dev libssl-dev
        # Ubuntu 24.04+ uses webkit2gtk-4.1, older versions use 4.0
        sudo apt-get install -y libwebkit2gtk-4.1-dev 2>/dev/null || sudo apt-get install -y libwebkit2gtk-4.0-dev

    - name: Install system dependencies (macOS)
      if: matrix.os == 'macos-14'
      run: |
        # cmake: Required for whisper-rs (whisper.cpp) compilation
        # pkg-config: Required for locating system libraries
        brew install cmake pkg-config

    - name: Install system dependencies (Windows)
      if: matrix.os == 'windows-2022'
      shell: pwsh
      run: |
        $cmakePath = "C:\Program Files\CMake\bin"
        $llvmPath = "C:\Program Files\LLVM\bin"
        if (-not (Get-Command cmake -ErrorAction SilentlyContinue) -and -not (Test-Path "$cmakePath\cmake.exe")) {
          choco install cmake -y
        }
        if (-not (Test-Path "$llvmPath\libclang.dll")) {
          choco install llvm -y
        }
        if (Test-Path $cmakePath) {
          "$cmakePath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        }
        if (Test-Path $llvmPath) {
          "$llvmPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LIBCLANG_PATH=$llvmPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        } else {
          Write-Error "LLVM libclang path not found after setup: $llvmPath"
          exit 1
        }
        cmake --version
        & "$llvmPath\clang.exe" --version | Select-Object -First 1

    # Use Swatinem/rust-cache for better caching
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: "v1-rust-build-${{ matrix.os }}-${{ matrix.os == 'windows-2022' && 'x86_64-pc-windows-msvc' || '' }}"
        cache-targets: true

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: 'crates/gestura-gui/frontend/package-lock.json'

    - name: Install frontend dependencies
      working-directory: crates/gestura-gui/frontend
      run: npm ci

    - name: Build frontend
      working-directory: crates/gestura-gui/frontend
      run: npm run build

    # Build CLI with voice-local on all platforms (all have required dependencies installed)
    - name: Build CLI (with voice-local)
      run: cargo build --release -p gestura-cli

    # Stage dummy sidecar binaries for CI to enable full GUI build validation
    # This catches linking errors that cargo check would miss
    - name: Stage dummy sidecar for CI (macOS)
      if: matrix.os == 'macos-14'
      run: |
        mkdir -p crates/gestura-gui/binaries
        # Create minimal executable stubs for Tauri sidecar validation
        echo '#!/bin/sh' > crates/gestura-gui/binaries/gestura-aarch64-apple-darwin
        echo '#!/bin/sh' > crates/gestura-gui/binaries/gestura-x86_64-apple-darwin
        chmod +x crates/gestura-gui/binaries/gestura-aarch64-apple-darwin
        chmod +x crates/gestura-gui/binaries/gestura-x86_64-apple-darwin

    - name: Stage dummy sidecar for CI (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        mkdir -p crates/gestura-gui/binaries
        echo '#!/bin/sh' > crates/gestura-gui/binaries/gestura-x86_64-unknown-linux-gnu
        chmod +x crates/gestura-gui/binaries/gestura-x86_64-unknown-linux-gnu

    - name: Stage dummy sidecar for CI (Windows)
      if: matrix.os == 'windows-2022'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path crates/gestura-gui/binaries | Out-Null
        # Create minimal executable for Windows
        Set-Content -Path crates/gestura-gui/binaries/gestura-x86_64-pc-windows-msvc.exe -Value ""

    # Build GUI (not just check) to catch linking errors
    # All platforms have voice-local dependencies installed
    - name: Build GUI (Ubuntu with voice-local)
      if: matrix.os == 'ubuntu-latest'
      run: cargo build --release -p gestura-gui

    # - name: Build GUI (macOS with voice-local)
    #   if: matrix.os == 'macos-14'
    #   run: cargo build --release -p gestura-gui

    # - name: Build GUI (Windows with voice-local)
    #   if: matrix.os == 'windows-2022'
    #   run: cargo build --release -p gestura-gui

