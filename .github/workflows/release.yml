name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag, or SHA). Defaults to main.'
        required: false
        default: 'main'
        type: string
      publish:
        description: 'Create or update the GitHub release after a successful build.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref_name || github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: 'lts/*'
  RUST_VERSION: stable

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.metadata.outputs.publish }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      release_sha: ${{ steps.metadata.outputs.release_sha }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      macos_features: ${{ steps.metadata.outputs.macos_features }}
      linux_features: ${{ steps.metadata.outputs.linux_features }}
      windows_features: ${{ steps.metadata.outputs.windows_features }}
      has_macos_signing: ${{ steps.signing.outputs.has_macos_signing }}
      has_windows_signing: ${{ steps.signing.outputs.has_windows_signing }}
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

      - name: Validate release definition and resolve release metadata
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUBLISH: ${{ github.event.inputs.publish }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 scripts/validate-release-definition.py metadata \
            --github-output "$GITHUB_OUTPUT"

      - name: Resolve signing availability
        id: signing
        env:
          # Credentials (secrets) — checked for presence
          _APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          _APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          _APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          _APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          _APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          _KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          _WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          _WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # Non-sensitive identifiers (repository variables) — checked for presence
          _APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          _APPLE_INSTALLER_IDENTITY: ${{ vars.APPLE_INSTALLER_IDENTITY }}
          _APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          _APPLE_ID: ${{ vars.APPLE_ID }}
        run: |
          macos_ok=true
          for v in \
            "$_APPLE_CERTIFICATE" \
            "$_APPLE_CERTIFICATE_PASSWORD" \
            "$_APPLE_INSTALLER_CERTIFICATE" \
            "$_APPLE_INSTALLER_CERTIFICATE_PASSWORD" \
            "$_APPLE_SIGNING_IDENTITY" \
            "$_APPLE_INSTALLER_IDENTITY" \
            "$_APPLE_TEAM_ID" \
            "$_APPLE_ID" \
            "$_APPLE_PASSWORD" \
            "$_KEYCHAIN_PASSWORD"; do
            [ -n "$v" ] || { macos_ok=false; break; }
          done
          echo "has_macos_signing=${macos_ok}" >> "$GITHUB_OUTPUT"

          windows_ok=true
          for v in "$_WINDOWS_CERTIFICATE" "$_WINDOWS_CERTIFICATE_PASSWORD"; do
            [ -n "$v" ] || { windows_ok=false; break; }
          done
          echo "has_windows_signing=${windows_ok}" >> "$GITHUB_OUTPUT"

      - name: Enforce release signing prerequisites
        if: steps.metadata.outputs.publish == 'true'
        run: |
          if [ "${{ steps.signing.outputs.has_macos_signing }}" != "true" ]; then
            echo "macOS signing secrets are incomplete; refusing to publish an unsigned release." >&2
            exit 1
          fi

          if [ "${{ steps.signing.outputs.has_windows_signing }}" != "true" ]; then
            echo "Windows signing secrets are not configured; the Windows release will be unsigned." >&2
          fi

  build-macos:
    name: Build macOS release artifacts
    needs: prepare
    runs-on: ${{ fromJSON(vars.RELEASE_MACOS_RUNNER != '' && vars.RELEASE_MACOS_RUNNER || '["macos-14"]') }}
    timeout-minutes: 120
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      PLATFORM_FEATURES: ${{ needs.prepare.outputs.macos_features }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
      APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ vars.APPLE_ID }}
      APPLE_INSTALLER_IDENTITY: ${{ vars.APPLE_INSTALLER_IDENTITY }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      MACOSX_DEPLOYMENT_TARGET: '10.15'
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-release-macos
          cache-targets: true

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: crates/gestura-gui/frontend/package-lock.json

      - name: Install macOS build dependencies
        run: brew install cmake pkg-config

      - name: Import Apple signing certificates
        if: needs.prepare.outputs.has_macos_signing == 'true'
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ['RUNNER_TEMP'], 'apple-signing-cert.p12').write_bytes(
              base64.b64decode(os.environ['APPLE_CERTIFICATE'])
          )
          Path(os.environ['RUNNER_TEMP'], 'apple-installer-cert.p12').write_bytes(
              base64.b64decode(os.environ['APPLE_INSTALLER_CERTIFICATE'])
          )
          PY

          security import "$RUNNER_TEMP/apple-signing-cert.p12" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"

          security import "$RUNNER_TEMP/apple-installer-cert.p12" \
            -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"

          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"

      - name: Build signed macOS release assets
        run: |
          ./scripts/package-mac.sh \
            --tag "$TAG" \
            --dist dist/release \
            --features "$PLATFORM_FEATURES"

      - name: Remove per-platform checksum manifest
        run: rm -f "dist/release/gestura-${TAG}-SHA256SUMS.txt"

      - name: Verify macOS signing and notarization
        if: needs.prepare.outputs.publish == 'true'
        run: |
          set -euo pipefail
          app_path="target/universal-apple-darwin/release/bundle/macos/Gestura.app"
          dmg_path="dist/release/Gestura-${TAG}-universal.dmg"
          pkg_path="dist/release/Gestura-${TAG}-universal.pkg"
          cli_path="target/universal-apple-darwin/release/gestura"
          cli_archive="dist/release/gestura-cli-${TAG}-macos-universal.tar.gz"

          if [ ! -d "$app_path" ]; then
            app_path="crates/gestura-gui/target/universal-apple-darwin/release/bundle/macos/Gestura.app"
          fi

          [ -d "$app_path" ]
          [ -f "$dmg_path" ]
          [ -f "$pkg_path" ]
          [ -f "$cli_path" ]
          [ -f "$cli_archive" ]

          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type exec --verbose=2 "$app_path"
          hdiutil verify "$dmg_path"
          xcrun stapler validate "$app_path"
          xcrun stapler validate "$dmg_path"
          pkgutil --check-signature "$pkg_path"
          codesign --verify --deep --strict --verbose=2 "$cli_path"
          tar -tzf "$cli_archive" | grep -Fx 'gestura'
          xcrun stapler validate "$pkg_path"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-macos
          path: dist/release/*
          if-no-files-found: error

  build-linux:
    name: Build Linux release artifacts
    needs: prepare
    runs-on: ${{ fromJSON(vars.RELEASE_LINUX_RUNNER != '' && vars.RELEASE_LINUX_RUNNER || '["ubuntu-22.04"]') }}
    timeout-minutes: 90
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      PLATFORM_FEATURES: ${{ needs.prepare.outputs.linux_features }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-release-linux
          cache-targets: true

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: crates/gestura-gui/frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libclang-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            pkg-config \
            rpm
          sudo apt-get install -y libwebkit2gtk-4.1-dev 2>/dev/null || sudo apt-get install -y libwebkit2gtk-4.0-dev

      - name: Build Linux release assets
        run: |
          ./scripts/package-linux.sh \
            --tag "$TAG" \
            --dist dist/release \
            --features "$PLATFORM_FEATURES"

      - name: Remove per-platform checksum manifest
        run: rm -f "dist/release/gestura-${TAG}-SHA256SUMS.txt"

      - name: Validate Linux package contents
        run: |
          set -euo pipefail
          deb_path="$(find dist/release -maxdepth 1 -name '*.deb' -print -quit)"
          rpm_path="$(find dist/release -maxdepth 1 -name '*.rpm' -print -quit)"
          cli_archive="$(find dist/release -maxdepth 1 -name 'gestura-cli-*-linux-*.tar.gz' -print -quit)"

          [ -n "$deb_path" ]
          [ -n "$rpm_path" ]
          [ -n "$cli_archive" ]

          dpkg-deb -c "$deb_path" | grep -E 'usr/bin/gestura$'
          rpm -qlp "$rpm_path" | grep -E '^/usr/bin/gestura$'
          tar -tzf "$cli_archive" | grep -Fx 'gestura'

      - name: Validate Linux package dependency metadata
        run: |
          set -euo pipefail
          deb_path="$(find dist/release -maxdepth 1 -name '*.deb' -print -quit)"
          rpm_path="$(find dist/release -maxdepth 1 -name '*.rpm' -print -quit)"

          python3 scripts/validate-release-definition.py linux-package-metadata \
            --deb-path "$deb_path" \
            --rpm-path "$rpm_path" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux
          path: dist/release/*
          if-no-files-found: error

  build-windows:
    name: Build Windows release artifacts
    needs: prepare
    runs-on: ${{ fromJSON(vars.RELEASE_WINDOWS_RUNNER != '' && vars.RELEASE_WINDOWS_RUNNER || '["windows-2022"]') }}
    timeout-minutes: 120
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      PLATFORM_FEATURES: ${{ needs.prepare.outputs.windows_features }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-release-windows
          cache-targets: true

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: crates/gestura-gui/frontend/package-lock.json

      - name: Install Windows build dependencies
        shell: pwsh
        run: |
          choco install cmake llvm -y
          "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Import Windows signing certificate
        id: import-cert
        if: needs.prepare.outputs.has_windows_signing == 'true'
        shell: pwsh
        run: |
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $certPath = Join-Path $env:RUNNER_TEMP 'gestura-release-signing.pfx'
          [IO.File]::WriteAllBytes($certPath, $certBytes)

          $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword | Out-Null

          $cert = Get-PfxCertificate -FilePath $certPath
          "thumbprint=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Remove-Item $certPath -Force

      - name: Build Windows release assets
        shell: bash
        env:
          WINDOWS_CERT_THUMBPRINT: ${{ steps.import-cert.outputs.thumbprint }}
        run: |
          ./scripts/package-windows.sh \
            --tag "$TAG" \
            --dist dist/release \
            --features "$PLATFORM_FEATURES"

      - name: Remove per-platform checksum manifest
        shell: pwsh
        run: |
          Remove-Item -Path ("dist/release/gestura-{0}-SHA256SUMS.txt" -f $env:TAG) -Force -ErrorAction SilentlyContinue

      - name: Verify Windows signatures
        shell: pwsh
        env:
          # Only enforce valid signatures when signing credentials were available.
          # When they are absent the build proceeds unsigned.
          REQUIRE_SIGNATURE: ${{ needs.prepare.outputs.has_windows_signing }}
        run: |
          $msi = Get-ChildItem -Path dist/release -Filter *.msi -ErrorAction Stop | Select-Object -First 1
          $cli = Get-Item 'target\x86_64-pc-windows-msvc\release\gestura.exe'

          $msiSig = Get-AuthenticodeSignature $msi.FullName
          $cliSig = Get-AuthenticodeSignature $cli.FullName

          Write-Host "MSI signature status: $($msiSig.Status)"
          Write-Host "CLI signature status: $($cliSig.Status)"

          if ($env:REQUIRE_SIGNATURE -eq 'true') {
            if ($msiSig.Status -ne 'Valid') {
              throw "MSI is not validly signed: $($msiSig.StatusMessage)"
            }
            if ($cliSig.Status -ne 'Valid') {
              throw "CLI executable is not validly signed: $($cliSig.StatusMessage)"
            }
          } else {
            Write-Host "Windows signing credentials were not configured; skipping signature enforcement."
          }

      - name: Validate Windows release archives
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path dist/release -Filter *.zip -ErrorAction Stop | Select-Object -First 1
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $entry = $archive.Entries | Where-Object { $_.FullName -eq 'gestura.exe' } | Select-Object -First 1
            if (-not $entry) {
              throw "CLI archive $($zip.Name) is missing gestura.exe"
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-windows
          path: dist/release/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    needs: [prepare, build-macos, build-linux, build-windows]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: dist/release
          merge-multiple: true

      - name: Generate unified SHA256SUMS manifest
        run: |
          set -euo pipefail
          source scripts/packaging/common.sh
          write_sha256sums dist/release "gestura-${TAG}-SHA256SUMS.txt"

      - name: Generate release manifest
        run: |
          python3 scripts/validate-release-definition.py manifest \
            --tag "$TAG" \
            --dist-dir dist/release \
            --output "dist/release/gestura-${TAG}-release-manifest.json"

      - name: Validate release artifacts against definition
        run: |
          python3 scripts/validate-release-definition.py artifacts \
            --tag "$TAG" \
            --dist-dir dist/release \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Create or update GitHub release
        run: |
          set -euo pipefail

          title="Gestura ${TAG}"
          prerelease_flag=()
          if [ "$PRERELEASE" = "true" ]; then
            prerelease_flag+=(--prerelease)
          fi

          while IFS= read -r skipped_dir; do
            echo "Skipping non-file release artifact: ${skipped_dir}"
          done < <(find dist/release -maxdepth 1 -mindepth 1 -type d -print | sort)

          release_files=()
          while IFS= read -r -d '' release_file; do
            release_files+=("$release_file")
          done < <(find dist/release -maxdepth 1 -type f -print0 | sort -z)
          [ ${#release_files[@]} -gt 0 ] || {
            echo "No release files found under dist/release" >&2
            exit 1
          }

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${release_files[@]}" --clobber
            gh release edit "$TAG" --title "$title" --draft=false "${prerelease_flag[@]}"
          else
            gh release create "$TAG" "${release_files[@]}" \
              --target "$RELEASE_SHA" \
              --title "$title" \
              --generate-notes \
              --draft \
              "${prerelease_flag[@]}"
            gh release edit "$TAG" --draft=false
          fi