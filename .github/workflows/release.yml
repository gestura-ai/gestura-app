name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}
      tag: ${{ steps.get_tag.outputs.TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ steps.get_tag.outputs.TAG }}',
              name: 'Gestura ${{ steps.get_tag.outputs.TAG }}',
              body: 'Release ${{ steps.get_tag.outputs.TAG }}',
              draft: true,
              prerelease: false
            });
            core.setOutput('release_id', data.id);
            

  build-release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin macOS to macos-14 (ARM/Sonoma) and Windows to windows-2022 for reproducibility
          # Each platform includes voice-local plus its native permission feature
          - platform: 'macos-14'
            tauri_args: '--target universal-apple-darwin'
            features: 'voice-local,macos-permissions'
          - platform: 'ubuntu-latest'
            tauri_args: ''
            features: 'voice-local,linux-permissions'
          - platform: 'windows-2022'
            tauri_args: ''
            features: 'voice-local,windows-permissions'

    runs-on: ${{ matrix.platform }}
    env:
      TAG: ${{ needs.create-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-14' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # Ubuntu 24.04+ uses webkit2gtk-4.1, older versions use 4.0
          # Try 4.1 first (Ubuntu 24.04+), fall back to 4.0 (Ubuntu 22.04)
          # CRITICAL: libasound2-dev (ALSA audio) and libclang-dev (bindgen for whisper-rs) are required
          sudo apt-get install -y build-essential cmake pkg-config libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libclang-dev
          sudo apt-get install -y libwebkit2gtk-4.1-dev 2>/dev/null || sudo apt-get install -y libwebkit2gtk-4.0-dev

      - name: Install system dependencies (macOS)
        if: matrix.platform == 'macos-14'
        run: |
          # cmake: Required for whisper-rs (whisper.cpp) compilation
          # pkg-config: Required for locating system libraries
          brew install cmake pkg-config

      - name: Install system dependencies (Windows)
        if: matrix.platform == 'windows-2022'
        shell: pwsh
        run: |
          # Install cmake and LLVM via Chocolatey (pre-installed on GitHub Windows runners)
          # cmake: Required for whisper-rs (whisper.cpp) compilation
          # llvm: Required for bindgen to generate FFI bindings for whisper-rs
          choco install cmake llvm -y
          # Add to PATH for subsequent steps
          $cmakePath = "C:\Program Files\CMake\bin"
          $llvmPath = "C:\Program Files\LLVM\bin"
          echo "$cmakePath" >> $env:GITHUB_PATH
          echo "$llvmPath" >> $env:GITHUB_PATH
          # Set LIBCLANG_PATH for bindgen
          echo "LIBCLANG_PATH=$llvmPath" >> $env:GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'crates/gestura-gui/frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: crates/gestura-gui/frontend
        run: npm ci

      - name: Build frontend
        working-directory: crates/gestura-gui/frontend
        run: npm run build

      - name: Build CLI binary (macOS universal)
        if: matrix.platform == 'macos-14'
        run: |
          cargo build --release -p gestura-cli --features voice-local --target aarch64-apple-darwin
          cargo build --release -p gestura-cli --features voice-local --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/aarch64-apple-darwin/release/gestura \
            target/x86_64-apple-darwin/release/gestura \
            -output target/universal-apple-darwin/release/gestura

      - name: Stage CLI for Tauri bundling (macOS)
        if: matrix.platform == 'macos-14'
        run: |
          mkdir -p crates/gestura-gui/binaries
          cp target/aarch64-apple-darwin/release/gestura crates/gestura-gui/binaries/gestura-aarch64-apple-darwin
          cp target/x86_64-apple-darwin/release/gestura crates/gestura-gui/binaries/gestura-x86_64-apple-darwin
          cp target/universal-apple-darwin/release/gestura crates/gestura-gui/binaries/gestura-universal-apple-darwin
          chmod +x \
            crates/gestura-gui/binaries/gestura-aarch64-apple-darwin \
            crates/gestura-gui/binaries/gestura-x86_64-apple-darwin \
            crates/gestura-gui/binaries/gestura-universal-apple-darwin

      - name: Build CLI binary (Linux/Windows)
        if: matrix.platform != 'macos-14'
        run: cargo build --release -p gestura-cli --features voice-local

      - name: Stage CLI for Tauri bundling (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          mkdir -p crates/gestura-gui/binaries
          cp target/release/gestura crates/gestura-gui/binaries/gestura-x86_64-unknown-linux-gnu
          chmod +x crates/gestura-gui/binaries/gestura-x86_64-unknown-linux-gnu

      - name: Stage CLI for Tauri bundling (Windows)
        if: matrix.platform == 'windows-2022'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path crates/gestura-gui/binaries | Out-Null
          Copy-Item -Force target/release/gestura.exe crates/gestura-gui/binaries/gestura-x86_64-pc-windows-msvc.exe

      - name: Import Apple certificates (macOS)
        if: matrix.platform == 'macos-14'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import Developer ID Application certificate
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
            security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          fi

          # Import Developer ID Installer certificate (for PKG signing)
          if [ -n "$APPLE_INSTALLER_CERTIFICATE" ]; then
            echo "$APPLE_INSTALLER_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/installer_certificate.p12
            security import $RUNNER_TEMP/installer_certificate.p12 -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          fi

          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: '10.15'
          # macOS signing environment variables
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
        with:
          projectPath: crates/gestura-gui
          # Each platform uses voice-local plus its native permission feature from the matrix
          args: '--features ${{ matrix.features }} ${{ matrix.tauri_args }}'

      - name: Sign CLI binary (macOS)
        if: matrix.platform == 'macos-14' && env.APPLE_SIGNING_IDENTITY != ''
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" \
            target/universal-apple-darwin/release/gestura
          codesign --verify --deep --strict target/universal-apple-darwin/release/gestura

      # Verify notarization and code signing of the built app bundle
      - name: Verify notarization (macOS)
        if: matrix.platform == 'macos-14'
        run: |
          # Find the app bundle
          APP_PATH="crates/gestura-gui/target/universal-apple-darwin/release/bundle/macos/Gestura.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="crates/gestura-gui/target/release/bundle/macos/Gestura.app"
          fi

          if [ -d "$APP_PATH" ]; then
            echo "Verifying app bundle: $APP_PATH"

            # Verify code signature
            echo "Checking code signature..."
            codesign --verify --deep --strict --verbose=2 "$APP_PATH" || echo "⚠️ Warning: Code signature verification failed"

            # Check Gatekeeper approval (notarization)
            echo "Checking Gatekeeper approval..."
            spctl --assess --type exec --verbose=2 "$APP_PATH" 2>&1 || echo "⚠️ Warning: Gatekeeper check failed (app may not be notarized)"

            # Check for stapled notarization ticket
            echo "Checking stapled ticket..."
            xcrun stapler validate "$APP_PATH" 2>&1 || echo "⚠️ Warning: No stapled ticket found"
          else
            echo "⚠️ App bundle not found at expected paths"
          fi

          # Also check DMG if it exists
          DMG_PATH=$(find crates/gestura-gui/target -name "*.dmg" 2>/dev/null | head -1)
          if [ -n "$DMG_PATH" ] && [ -f "$DMG_PATH" ]; then
            echo "Verifying DMG: $DMG_PATH"
            xcrun stapler validate "$DMG_PATH" 2>&1 || echo "⚠️ Warning: DMG not stapled"
          fi

      - name: Create Full installer (PKG) (macOS)
        if: matrix.platform == 'macos-14'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
        run: |
          VERSION_NUM="${TAG#v}"
          DIST_DIR="dist/release"
          PKGROOT_DIR="${DIST_DIR}/pkgroot"

          # Find the app bundle
          APP_PATH="crates/gestura-gui/target/universal-apple-darwin/release/bundle/macos/Gestura.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="crates/gestura-gui/target/release/bundle/macos/Gestura.app"
          fi

          # Create package root
          mkdir -p "${PKGROOT_DIR}/Applications"
          mkdir -p "${PKGROOT_DIR}/usr/local/bin"

          # Copy app and CLI
          cp -R "$APP_PATH" "${PKGROOT_DIR}/Applications/"
          cp target/universal-apple-darwin/release/gestura "${PKGROOT_DIR}/usr/local/bin/"

          # Create unsigned PKG
          pkgbuild \
            --root "${PKGROOT_DIR}" \
            --identifier "ai.gestura.desktop" \
            --version "${VERSION_NUM}" \
            --install-location "/" \
            "${DIST_DIR}/Gestura-${TAG}-unsigned.pkg"

          # Sign PKG if installer identity is available
          if [ -n "$APPLE_INSTALLER_IDENTITY" ]; then
            productsign --sign "$APPLE_INSTALLER_IDENTITY" \
              "${DIST_DIR}/Gestura-${TAG}-unsigned.pkg" \
              "${DIST_DIR}/Gestura-${TAG}-universal.pkg"
            rm -f "${DIST_DIR}/Gestura-${TAG}-unsigned.pkg"
          else
            mv "${DIST_DIR}/Gestura-${TAG}-unsigned.pkg" "${DIST_DIR}/Gestura-${TAG}-universal.pkg"
          fi

      - name: Package CLI-only archive (macOS)
        if: matrix.platform == 'macos-14'
        run: |
          mkdir -p dist/release
          tar -C target/universal-apple-darwin/release -czf "dist/release/gestura-cli-${TAG}-macos-universal.tar.gz" gestura

      - name: Package CLI-only archive (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          mkdir -p dist/release
          tar -C target/release -czf "dist/release/gestura-cli-${TAG}-linux-x86_64.tar.gz" gestura

      - name: Package CLI-only archive (Windows)
        if: matrix.platform == 'windows-2022'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/release | Out-Null
          Compress-Archive -Path target/release/gestura.exe -DestinationPath ("dist/release/gestura-cli-{0}-windows-x86_64.zip" -f $env:TAG) -Force

      - name: Collect Full installer artifacts (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          set -euo pipefail
          mkdir -p dist/release
          deb_src="$(ls -1 crates/gestura-gui/target/release/bundle/deb/*.deb 2>/dev/null | head -1 || true)"
          rpm_src="$(ls -1 crates/gestura-gui/target/release/bundle/rpm/*.rpm 2>/dev/null | head -1 || true)"
          if [ -z "$deb_src" ]; then
            deb_src="$(find crates/gestura-gui/target -type f -path '*/release/bundle/deb/*.deb' | head -1 || true)"
          fi
          if [ -z "$rpm_src" ]; then
            rpm_src="$(find crates/gestura-gui/target -type f -path '*/release/bundle/rpm/*.rpm' | head -1 || true)"
          fi
          [ -n "$deb_src" ] || (echo "deb not found" && exit 1)
          [ -n "$rpm_src" ] || (echo "rpm not found" && exit 1)
          cp "$deb_src" "dist/release/gestura-${TAG}-linux-x86_64.deb"
          cp "$rpm_src" "dist/release/gestura-${TAG}-linux-x86_64.rpm"

      # Import Windows code signing certificate
      - name: Import Windows code signing certificate
        if: matrix.platform == 'windows-2022' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          # Decode and import the certificate
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $certPath = "$env:RUNNER_TEMP\certificate.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)

          # Import to certificate store
          $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword

          # Get certificate thumbprint for Tauri signing
          $cert = Get-PfxCertificate -FilePath $certPath
          echo "WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

          # Clean up
          Remove-Item $certPath -Force

      - name: Collect Full installer artifacts (Windows)
        if: matrix.platform == 'windows-2022'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/release | Out-Null
          $msi = Get-ChildItem -Path crates/gestura-gui/target -Recurse -Filter *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msi) { throw "MSI not found" }
          Copy-Item -Force $msi.FullName ("dist/release/Gestura-{0}-windows-x86_64.msi" -f $env:TAG)

      # Verify Windows code signature
      - name: Verify Windows code signature
        if: matrix.platform == 'windows-2022'
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path dist/release -Filter *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            Write-Host "Verifying MSI signature: $($msi.FullName)"
            $sig = Get-AuthenticodeSignature $msi.FullName
            Write-Host "Signature Status: $($sig.Status)"
            Write-Host "Signer: $($sig.SignerCertificate.Subject)"
            if ($sig.Status -eq "Valid") {
              Write-Host "✅ MSI is properly signed"
            } elseif ($sig.Status -eq "NotSigned") {
              Write-Host "⚠️ MSI is not signed (WINDOWS_CERTIFICATE secret may not be configured)"
            } else {
              Write-Host "⚠️ MSI signature status: $($sig.StatusMessage)"
            }
          } else {
            Write-Host "⚠️ No MSI found to verify"
          }

          # Also check the CLI executable
          $exe = Get-ChildItem -Path target/release -Filter gestura.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) {
            Write-Host "Verifying CLI signature: $($exe.FullName)"
            $sig = Get-AuthenticodeSignature $exe.FullName
            Write-Host "CLI Signature Status: $($sig.Status)"
          }

      - name: Upload release artifacts (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error

  publish-release:
    needs: [create-release, build-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: dist/release
          merge-multiple: true

      - name: Generate unified SHA256SUMS manifest
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          source scripts/packaging/common.sh
          write_sha256sums dist/release "gestura-${TAG}-SHA256SUMS.txt"

      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/release/* --clobber

      - name: Publish release (undraft)
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            });

  deploy-docs:
    needs: publish-release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Check for package-lock.json
        id: check-npm
        run: |
          if [ -f "package-lock.json" ]; then
            echo "has_npm=true" >> $GITHUB_OUTPUT
          else
            echo "has_npm=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check-npm.outputs.has_npm == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        if: steps.check-npm.outputs.has_npm == 'true'
        run: npm ci

      - name: Build documentation
        run: |
          mkdir -p docs
          cp README.md docs/
          cp CHANGELOG.md docs/
          cp TODO.md docs/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
