name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag, or SHA). Defaults to main.'
        required: false
        default: 'main'
        type: string
      publish:
        description: 'Create or update the GitHub release after a successful build.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref_name || github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '20'
  RUST_VERSION: stable

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.metadata.outputs.publish }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      release_sha: ${{ steps.metadata.outputs.release_sha }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      has_macos_signing: ${{ steps.signing.outputs.has_macos_signing }}
      has_windows_signing: ${{ steps.signing.outputs.has_windows_signing }}
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

      - name: Resolve version and release metadata
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUBLISH: ${{ github.event.inputs.publish }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess
          import tomllib

          root = pathlib.Path('.')
          cargo = tomllib.loads((root / 'Cargo.toml').read_text(encoding='utf-8'))
          workspace_version = cargo['workspace']['package']['version']
          tauri_version = json.loads((root / 'crates/gestura-gui/tauri.conf.json').read_text(encoding='utf-8'))['version']
          frontend_version = json.loads((root / 'crates/gestura-gui/frontend/package.json').read_text(encoding='utf-8'))['version']

          versions = {
              'Cargo.toml': workspace_version,
              'crates/gestura-gui/tauri.conf.json': tauri_version,
              'crates/gestura-gui/frontend/package.json': frontend_version,
          }
          unique_versions = set(versions.values())
          if len(unique_versions) != 1:
              raise SystemExit(f'Version drift detected across release metadata: {versions}')

          semver = re.compile(r'^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$')
          if not semver.fullmatch(workspace_version):
              raise SystemExit(f'Workspace version is not valid semver: {workspace_version}')

          expected_tag = f'v{workspace_version}'
          event_name = os.environ['EVENT_NAME']
          publish = event_name == 'push' or os.environ.get('INPUT_PUBLISH', '').lower() == 'true'
          ref_name = os.environ.get('REF_NAME', '')

          if event_name == 'push' and ref_name != expected_tag:
              raise SystemExit(
                  f'Tag/version mismatch: workflow triggered for {ref_name}, '
                  f'but repository version resolves to {expected_tag}'
              )

          release_sha = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          prerelease = 'true' if '-' in workspace_version else 'false'

          output_path = pathlib.Path(os.environ['GITHUB_OUTPUT'])
          with output_path.open('a', encoding='utf-8') as fh:
              print(f'publish={str(publish).lower()}', file=fh)
              print(f'prerelease={prerelease}', file=fh)
              print(f'release_sha={release_sha}', file=fh)
              print(f'tag={expected_tag}', file=fh)
              print(f'version={workspace_version}', file=fh)
          PY

      - name: Resolve signing availability
        id: signing
        run: |
          echo "has_macos_signing=${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_INSTALLER_CERTIFICATE != '' && secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_INSTALLER_IDENTITY != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.KEYCHAIN_PASSWORD != '' }}" >> "$GITHUB_OUTPUT"
          echo "has_windows_signing=${{ secrets.WINDOWS_CERTIFICATE != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}" >> "$GITHUB_OUTPUT"

      - name: Enforce release signing prerequisites
        if: steps.metadata.outputs.publish == 'true'
        run: |
          if [ "${{ steps.signing.outputs.has_macos_signing }}" != "true" ]; then
            echo "macOS signing secrets are incomplete; refusing to publish an unsigned release." >&2
            exit 1
          fi

          if [ "${{ steps.signing.outputs.has_windows_signing }}" != "true" ]; then
            echo "Windows signing secrets are incomplete; refusing to publish an unsigned release." >&2
            exit 1
          fi

  build-macos:
    name: Build macOS release artifacts
    needs: prepare
    runs-on: ${{ fromJSON(vars.RELEASE_MACOS_RUNNER != '' && vars.RELEASE_MACOS_RUNNER || '["macos-14"]') }}
    timeout-minutes: 120
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
      APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
      APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      MACOSX_DEPLOYMENT_TARGET: '10.15'
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-release-macos
          cache-targets: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: crates/gestura-gui/frontend/package-lock.json

      - name: Install macOS build dependencies
        run: brew install cmake pkg-config

      - name: Import Apple signing certificates
        if: needs.prepare.outputs.has_macos_signing == 'true'
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ['RUNNER_TEMP'], 'apple-signing-cert.p12').write_bytes(
              base64.b64decode(os.environ['APPLE_CERTIFICATE'])
          )
          Path(os.environ['RUNNER_TEMP'], 'apple-installer-cert.p12').write_bytes(
              base64.b64decode(os.environ['APPLE_INSTALLER_CERTIFICATE'])
          )
          PY

          security import "$RUNNER_TEMP/apple-signing-cert.p12" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"

          security import "$RUNNER_TEMP/apple-installer-cert.p12" \
            -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"

          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"

      - name: Build signed macOS release assets
        run: |
          ./scripts/package-mac.sh \
            --tag "$TAG" \
            --dist dist/release \
            --features 'voice-local,macos-permissions'

      - name: Remove per-platform checksum manifest
        run: rm -f "dist/release/gestura-${TAG}-SHA256SUMS.txt"

      - name: Verify macOS signing and notarization
        if: needs.prepare.outputs.publish == 'true'
        run: |
          set -euo pipefail
          app_path="target/universal-apple-darwin/release/bundle/macos/Gestura.app"
          pkg_path="dist/release/Gestura-${TAG}-universal.pkg"
          cli_path="target/universal-apple-darwin/release/gestura"

          if [ ! -d "$app_path" ]; then
            app_path="crates/gestura-gui/target/universal-apple-darwin/release/bundle/macos/Gestura.app"
          fi

          [ -d "$app_path" ]
          [ -f "$pkg_path" ]
          [ -f "$cli_path" ]

          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type exec --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          codesign --verify --deep --strict --verbose=2 "$cli_path"
          xcrun stapler validate "$pkg_path"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-macos
          path: dist/release/*
          if-no-files-found: error

  build-linux:
    name: Build Linux release artifacts
    needs: prepare
    runs-on: ${{ fromJSON(vars.RELEASE_LINUX_RUNNER != '' && vars.RELEASE_LINUX_RUNNER || '["ubuntu-22.04"]') }}
    timeout-minutes: 90
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-release-linux
          cache-targets: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: crates/gestura-gui/frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libclang-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            pkg-config \
            rpm
          sudo apt-get install -y libwebkit2gtk-4.1-dev 2>/dev/null || sudo apt-get install -y libwebkit2gtk-4.0-dev

      - name: Build Linux release assets
        run: |
          ./scripts/package-linux.sh \
            --tag "$TAG" \
            --dist dist/release \
            --features 'voice-local,linux-permissions'

      - name: Remove per-platform checksum manifest
        run: rm -f "dist/release/gestura-${TAG}-SHA256SUMS.txt"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux
          path: dist/release/*
          if-no-files-found: error

  build-windows:
    name: Build Windows release artifacts
    needs: prepare
    runs-on: ${{ fromJSON(vars.RELEASE_WINDOWS_RUNNER != '' && vars.RELEASE_WINDOWS_RUNNER || '["windows-2022"]') }}
    timeout-minutes: 120
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-release-windows
          cache-targets: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: crates/gestura-gui/frontend/package-lock.json

      - name: Install Windows build dependencies
        shell: pwsh
        run: |
          choco install cmake llvm -y
          "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Import Windows signing certificate
        id: import-cert
        if: needs.prepare.outputs.has_windows_signing == 'true'
        shell: pwsh
        run: |
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $certPath = Join-Path $env:RUNNER_TEMP 'gestura-release-signing.pfx'
          [IO.File]::WriteAllBytes($certPath, $certBytes)

          $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword | Out-Null

          $cert = Get-PfxCertificate -FilePath $certPath
          "thumbprint=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Remove-Item $certPath -Force

      - name: Build Windows release assets
        shell: bash
        env:
          WINDOWS_CERT_THUMBPRINT: ${{ steps.import-cert.outputs.thumbprint }}
        run: |
          ./scripts/package-windows.sh \
            --tag "$TAG" \
            --dist dist/release \
            --features 'voice-local,windows-permissions'

      - name: Remove per-platform checksum manifest
        shell: pwsh
        run: |
          Remove-Item -Path ("dist/release/gestura-{0}-SHA256SUMS.txt" -f $env:TAG) -Force -ErrorAction SilentlyContinue

      - name: Verify Windows signatures
        shell: pwsh
        env:
          REQUIRE_SIGNATURE: ${{ needs.prepare.outputs.publish }}
        run: |
          $msi = Get-ChildItem -Path dist/release -Filter *.msi -ErrorAction Stop | Select-Object -First 1
          $cli = Get-Item 'target\x86_64-pc-windows-msvc\release\gestura.exe'

          $msiSig = Get-AuthenticodeSignature $msi.FullName
          $cliSig = Get-AuthenticodeSignature $cli.FullName

          Write-Host "MSI signature status: $($msiSig.Status)"
          Write-Host "CLI signature status: $($cliSig.Status)"

          if ($env:REQUIRE_SIGNATURE -eq 'true') {
            if ($msiSig.Status -ne 'Valid') {
              throw "MSI is not validly signed: $($msiSig.StatusMessage)"
            }
            if ($cliSig.Status -ne 'Valid') {
              throw "CLI executable is not validly signed: $($cliSig.StatusMessage)"
            }
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-windows
          path: dist/release/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    needs: [prepare, build-macos, build-linux, build-windows]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: dist/release
          merge-multiple: true

      - name: Generate unified SHA256SUMS manifest
        run: |
          set -euo pipefail
          source scripts/packaging/common.sh
          write_sha256sums dist/release "gestura-${TAG}-SHA256SUMS.txt"

      - name: Create or update GitHub release
        run: |
          set -euo pipefail

          title="Gestura ${TAG}"
          prerelease_flag=()
          if [ "$PRERELEASE" = "true" ]; then
            prerelease_flag+=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/release/* --clobber
            gh release edit "$TAG" --title "$title" --draft=false "${prerelease_flag[@]}"
          else
            gh release create "$TAG" dist/release/* \
              --target "$RELEASE_SHA" \
              --title "$title" \
              --generate-notes \
              --draft \
              "${prerelease_flag[@]}"
            gh release edit "$TAG" --draft=false
          fi