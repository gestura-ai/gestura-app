name: 🐛 Bug Report
description: Report a bug or issue with Gestura.app
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out this form as completely as possible.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Please check all applicable items before submitting
      options:
        - label: I have searched existing issues to ensure this bug hasn't been reported
          required: true
        - label: I have read the troubleshooting guide
          required: true
        - label: I have run the built-in diagnostic tool
          required: true
        - label: I am using the latest version of Gestura.app
          required: true

  - type: dropdown
    id: version
    attributes:
      label: Gestura Version
      description: What version of Gestura.app are you running?
      options:
        - 1.0.0 (latest)
        - 0.9.x (beta)
        - 0.8.x (alpha)
        - Other (please specify in description)
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: What operating system are you using?
      options:
        - macOS (Intel)
        - macOS (Apple Silicon)
        - Windows 10
        - Windows 11
        - Ubuntu 20.04+
        - Other Linux (please specify)
        - Other (please specify)
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component is affected?
      options:
        - Voice Recognition
        - Gesture Recognition
        - Haptic Harmony Ring
        - User Interface
        - Plugin System
        - Scripting Engine
        - Third-party Integrations
        - Installation/Setup
        - Performance
        - Security/Privacy
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: Describe what happened and what you expected to happen
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Perform gesture '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: Describe the expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: Describe what actually happened instead
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: Additional environment information
      placeholder: |
        - OS Version: 
        - Hardware: 
        - Microphone: 
        - Haptic Ring Model: 
        - Bluetooth Version: 
        - Other relevant details:
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Log Output
      description: Relevant log output (Settings → Advanced → Export Logs)
      placeholder: Paste relevant log entries here
      render: text
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots/Videos
      description: If applicable, add screenshots or videos to help explain the problem
      placeholder: Drag and drop images/videos here or paste URLs
    validations:
      required: false

  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      description: How often does this bug occur?
      options:
        - Always (100%)
        - Often (75-99%)
        - Sometimes (25-74%)
        - Rarely (1-24%)
        - Once
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - Critical (app crashes, data loss)
        - High (major feature broken)
        - Medium (minor feature broken)
        - Low (cosmetic issue)
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: Is there a workaround for this issue?
      placeholder: Describe any workaround you've found
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the problem
      placeholder: Add any other context, related issues, or additional information
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Privacy & Terms
      description: By submitting this issue, you agree to our privacy policy and terms
      options:
        - label: I agree to the privacy policy and terms of service
          required: true
        - label: I consent to sharing diagnostic information to help resolve this issue
          required: false
