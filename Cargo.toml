# Gestura Workspace - Voice-first AI Assistant
# 
# This workspace contains three crates:
# - gestura-core: Shared business logic (config, LLM providers, speech, MCP)
# - gestura-gui: Tauri desktop application (system tray, windows, UI)
# - gestura-cli: Command-line interface (clap, ratatui)

[workspace]
resolver = "2"
members = [
    "crates/gestura-core",
    "crates/gestura-core-tools",
    "crates/gestura-core-foundation",
    "crates/gestura-gui",
    "crates/gestura-cli",
    "crates/gestura-core-mcp",
    "crates/gestura-core-llm",
    "crates/gestura-core-pipeline",
    "crates/gestura-core-tasks",
    "crates/gestura-core-streaming",
    "crates/gestura-core-sessions",
    "crates/gestura-core-config",
    "crates/gestura-core-audio",
    "crates/gestura-core-security",
    "crates/gestura-core-memory-bank",
    "crates/gestura-core-a2a",
    "crates/gestura-core-explorer",
    "crates/gestura-core-knowledge",
    "crates/gestura-core-nats",
    "crates/gestura-core-ipc",
    "crates/gestura-core-analytics",
    "crates/gestura-core-hooks",
    "crates/gestura-core-scripting",
    "crates/gestura-core-plugins",
    "crates/gestura-core-retry",
    "crates/gestura-core-agents",
    "crates/gestura-core-context",
    "crates/gestura-core-intent",
]

# Default members for `cargo build` without specifying a package
default-members = [
    "crates/gestura-gui",
    "crates/gestura-cli",
]

[workspace.package]
version = "0.9.2"
edition = "2024"
license = "LicenseRef-Gestura-Prosperity-1.0"
authors = ["Gestura LLC <dev@gestura.ai>"]
repository = "https://github.com/gestura-ai/gestura-app"
homepage = "https://gestura.ai"
description = "Voice-first AI assistant with GUI and CLI interfaces"

[workspace.dependencies]
# Core dependencies shared across crates
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "io-std", "sync"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
dirs = "6"
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls", "stream"] }
futures = "0.3"
futures-util = "0.3"
bytes = "1"

# Audio processing
cpal = "0.15"
hound = "3.5"
bytemuck = "1"

# Voice processing
whisper-rs = "0.14"

# CLI-specific
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
ratatui = "0.29"
crossterm = "0.28"
dialoguer = "0.11"
indicatif = "0.17"
console = "0.15"
colored = "2"
toml = "0.8"

# Tauri (GUI-specific)
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "protocol-asset"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# JSON-LD processing
json-ld = "0.16"

# Security
ring = "0.17"
keyring = "2.3"

# Unix signal handling
nix = { version = "0.29", features = ["signal", "process"] }

# NATS messaging
async-nats = "0.42"

# Utilities
lazy_static = "1.4"
tempfile = "3.8"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
image = { version = "0.25", features = ["png", "jpeg"] }
regex = "1"
urlencoding = "2"
notify = { version = "8.2.0", features = ["macos_fsevent"] }

# macOS specific
objc = "0.2"
cocoa = "0.25"

# Windows specific - WinRT APIs (defined in target-specific section below)
# Note: windows crate is added directly in gestura-core/Cargo.toml with target cfg

# Internal crates
# default-features = false so that dependent crates can opt-in to voice-local
# This prevents whisper-rs from being built on platforms where it's problematic
gestura-core = { path = "crates/gestura-core", default-features = false }

# Domain crate: built-in tool implementations.
gestura-core-tools = { path = "crates/gestura-core-tools" }

# Foundation primitives shared across gestura-core domain crates.
gestura-core-foundation = { path = "crates/gestura-core-foundation" }

# Domain crate: MCP protocol implementation.
gestura-core-mcp = { path = "crates/gestura-core-mcp" }

# Domain crate: LLM provider implementations.
gestura-core-llm = { path = "crates/gestura-core-llm" }

# Domain crate: pipeline types and persona.
gestura-core-pipeline = { path = "crates/gestura-core-pipeline" }

# Domain crate: task management and workflow primitives.
gestura-core-tasks = { path = "crates/gestura-core-tasks" }

# Domain crate: streaming LLM provider support.
gestura-core-streaming = { path = "crates/gestura-core-streaming" }

# Domain crate: session management (agent sessions, auth, workspaces).
gestura-core-sessions = { path = "crates/gestura-core-sessions" }

# Domain crate: configuration types, loading, validation, and file watching.
gestura-core-config = { path = "crates/gestura-core-config" }

# Domain crate: audio capture, speech processing, and STT providers.
gestura-core-audio = { path = "crates/gestura-core-audio" }

# Domain crate: encryption, keychain, sandboxing, GDPR compliance.
gestura-core-security = { path = "crates/gestura-core-security" }

# Domain crate: persistent memory bank (conversation history).
gestura-core-memory-bank = { path = "crates/gestura-core-memory-bank" }

# Domain crate: A2A (Agent-to-Agent) protocol.
gestura-core-a2a = { path = "crates/gestura-core-a2a" }

# Domain crate: file system explorer utility.
gestura-core-explorer = { path = "crates/gestura-core-explorer" }

# Domain crate: knowledge base and built-in expertise.
gestura-core-knowledge = { path = "crates/gestura-core-knowledge" }

# Domain crate: NATS messaging queue.
gestura-core-nats = { path = "crates/gestura-core-nats" }

# Domain crate: IPC (hotkey inter-process communication).
gestura-core-ipc = { path = "crates/gestura-core-ipc" }

# Domain crate: usage analytics and recommendations.
gestura-core-analytics = { path = "crates/gestura-core-analytics" }

# Domain crate: hooks system (safe-by-default command templates tied to events).
gestura-core-hooks = { path = "crates/gestura-core-hooks" }

# Domain crate: scripting engine (Lua, Python, JavaScript sandboxed execution).
gestura-core-scripting = { path = "crates/gestura-core-scripting" }

# Domain crate: plugin system (discovery, lifecycle, sandboxed execution).
gestura-core-plugins = { path = "crates/gestura-core-plugins" }

# Domain crate: retry strategies (exponential backoff, jitter).
gestura-core-retry = { path = "crates/gestura-core-retry" }

# Domain crate: agent lifecycle management (spawning, task delegation, orchestration types).
gestura-core-agents = { path = "crates/gestura-core-agents" }

# Domain crate: smart context management (analysis, caching, resolution).
gestura-core-context = { path = "crates/gestura-core-context" }

# Domain crate: unified intent normalization layer.
gestura-core-intent = { path = "crates/gestura-core-intent" }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.release.package.gestura-gui]
# Tauri patches a `__TAURI_BUNDLE_TYPE` marker into the GUI binary during
# bundling. Full symbol stripping removes that marker and causes release-time
# warnings even though bundles still complete. Keep debug info stripped, but
# preserve symbols for the Tauri app package so bundle-type patching works.
strip = "debuginfo"

